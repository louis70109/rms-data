[package]
name = "rms-guide"
version = "1.0.0"
description = "RMS 攻略庫 桌面版（離線閱讀）"
authors = ["louis70109"]
edition = "2021"
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

# 縮小執行檔
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
