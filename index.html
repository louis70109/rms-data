span> <span class=\"hljs-type\">Peter<\/span>，解答為 <span class=\"hljs-number\">14525<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Shane<\/span>，解答為 <span class=\"hljs-number\">52424<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Weakend<\/span> – <span class=\"hljs-type\">Slower<\/span> <span class=\"hljs-type\">Movements<\/span>，解答為 <span class=\"hljs-number\">12435<\/span><\/code><\/pre>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "job-4th", "cat": "轉職", "title": "四轉流程", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413052705/https://mapleroyals.net/noobs-guides/job-advancement/4th-job-advancement", "html": "<p>要求條件：等級120，轉職時必須把120等以前的技能點數分配完畢。<br>\n【1】. 等級必須達到１２０等，到冰原雪域找該職業的三轉教官，然後接取任務。<\/p>\n<p>【2】. 到神木村的祭司之林找該職業的四轉教官。<\/p>\n<p>路徑『祭司之林位於神木村=&gt;神木村東邊森林=&gt;米納爾森林東邊邊境=&gt;天空之巢路口=&gt;天空之巢  Ｉ=&gt;天空之巢ＩＩ=&gt;山羊峽谷(到這裡之後，右上角有一個樹洞，到此樹洞按上)=&gt;祭司之林』<\/p>\n<p>【3】. 四轉教官會說給他英雄五角勳章和英雄星型墜飾 (這部分要打噴火龍跟格瑞分多取得)建議不理會直接去神木村找長老就好了( 需密咒換取英雄五角勳章和英雄星型                墜飾)。<\/p>\n<p>【4】.『秘咒要怎樣取得呢？首先準備好1000萬，然後到玩具城的愛奧斯塔４４樓找卷軸商人。』<\/p>\n<p>【5】. 給村長密咒，他會給你英雄五角勳章和英雄星型墜飾，找四轉教官轉職<\/p>\n<hr/>\n<p>轉職後，打開消耗欄，有本楓葉祝福，按二下就多出一個技能!!!<\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "skill-all", "cat": "技能書", "title": "全職業共通", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517181626/https://mapleroyals.net/game-tips/skillbook/all-class", "html": "<p><strong><img decoding=\"async\" class=\"aligncenter\" src=\"https://web.archive.org/web/20260517181626im_/http://i.imgur.com/vZN842t.png\" width=\"300\" height=\"432\"/><\/strong><\/p>\n<hr/>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181626im_/http://i.gyazo.com/66a7a7fe4ac6c1a151e2a86557ffdcfc.png\" alt=\"[IMG]\"/>   <strong>楓葉祝福               <\/strong><\/p>\n<p>楓葉祝福  10  –  四轉直接獲取技能<\/p>\n<p>楓葉祝福  20  –  暗黑龍王<\/p>\n<hr/>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181626im_/http://i.gyazo.com/9283f4e4a8e509dccc8e77967851e911.png\" alt=\"[IMG]\"/>   <strong> 楓葉淨化 <\/strong><\/p>\n<p>楓葉淨化 : <a href=\"https://web.archive.org/web/20260517181626/http://tw.meetgee.com/MiniSite/Topic/View.aspx?ID=2026916&amp;CategoryID=195061&amp;GameID=589\" target=\"_blank\">楓葉淨化 – 密技網傳送門<\/a><\/p>\n<hr/>\n<div id=\"wpdevar_comment_1\">\n <span><\/span>\n <\/div>"}, {"slug": "skill-warrior", "cat": "技能書", "title": "劍士", "ts": "2025-03-21", "wb": "https://web.archive.org/web/20250321103748/https://mapleroyals.net/game-tips/skillbook/warrior", "html": "<header class=\"entry-header\">\n <h1 class=\"entry-title\">\n 劍士系列 <\/h1>\n <\/header>\n <div class=\"entry-content clearfix\">\n <p><strong><img loading=\"lazy\" class=\"aligncenter\" src=\"https://web.archive.org/web/20250321103748im_/http://i.imgur.com/I2rlnG3.png\" width=\"300\" height=\"430\"/><\/strong><\/p>\n<hr/>\n<p><img class=\"bbCodeImage LbImage\" src=\"https://web.archive.org/web/20250321103748im_/http://i.gyazo.com/f0442249ac1bfd646b971e72bc75e540.png\" alt=\"[​IMG]\"/>   <strong>武神防禦<\/strong><\/p>\n<p>武神防禦 20 : 化石龍長老<\/p>\n<p>武神防禦 30 : 噴火龍 . 利里諾斯<\/p>\n<hr/>\n<p><img class=\"bbCodeImage LbImage\" src=\"https://web.archive.org/web/20250321103748im_/http://i.gyazo.com/5f133e2c84106eb8d32a88bd3bbe2ee8.png\" alt=\"[​IMG]\"/>   <strong>究極神盾<\/strong><\/p>\n<p>究極神盾 10 : 母書   <a href=\"https://web.archive.org/web/20250321103748/http://blog.xuite.net/mimimia/MS/12529886-%E2%98%86%E4%BB%BB%E5%8B%99%EF%BC%9A%E7%9B%BE%E7%89%8C%E7%9A%84%E5%8A%9B%E9%87%8F%E2%98%86+%E8%8B%B1%E9%9B%84%E3%80%81%E8%81%96%E9%A8%8E%E5%A3%AB%E6%8A%80%E8%83%BD%EF%BC%8D%E7%A9%B6%E6%A5%B5%E7%A5%9E%E7%9B%BE\" target=\"_blank\" rel=\"noopener noreferrer\">點我重送門<\/a><\/p>\n<p>究極神盾 20 : 噴火龍 . 化石龍<\/p>\n<hr/>\n<p><img class=\"bbCodeImage LbImage\" src=\"https://web.archive.org/web/20250321103748im_/http://i.gyazo.com/e533a7a2fa71c913ab6825462f14076e.png\" alt=\"[​IMG]\"/>   <strong>絕對引力<\/strong><\/p>\n<p>絕對引力 20 : 海怒斯 . 洞穴幼龍保護者 . 克雷賽爾<\/p>\n<p>絕對引力 30 : 海怒斯 <script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const ORDER=['規則','前置任務','轉職','技能書'];
const DESC={'規則':'遊戲規範與題庫','前置任務':'技能、區域與 PQ 的前置條件','轉職':'二～四轉流程','技能書':'各職業技能書掉落'};
const nav=document.getElementById('nav'),content=document.getElementById('content'),q=document.getElementById('q');
function groupsAll(){const g={};DATA.forEach(d=>{(g[d.cat]=g[d.cat]||[]).push(d);});return g;}
function groups(f=''){f=f.trim().toLowerCase();const g={};
 DATA.forEach(d=>{if(f&&!(d.title.toLowerCase().includes(f)||d.cat.toLowerCase().includes(f)))return;
 (g[d.cat]=g[d.cat]||[]).push(d);});return g;}
function cats(g){return ORDER.filter(c=>g[c]).concat(Object.keys(g).filter(c=>!ORDER.includes(c)));}
const GA=groupsAll(),flat=[];cats(GA).forEach(c=>GA[c].forEach(d=>flat.push(d)));
function renderNav(f=''){const g=groups(f);nav.innerHTML='';
 if(!cats(g).length){nav.innerHTML='<p class="grp">查無結果</p>';return;}
 cats(g).forEach(c=>{const h=document.createElement('div');h.className='grp';
  h.innerHTML='<span>'+c+'</span><span class="c">'+g[c].length+'</span>';nav.appendChild(h);
  g[c].forEach(d=>{const a=document.createElement('a');a.className='navlink';a.href='#'+d.slug;
   a.innerHTML='<span>'+d.title+'</span><span class="d">'+d.ts+'</span>';
   if(location.hash.slice(1)===d.slug)a.classList.add('active');nav.appendChild(a);});});}
function home(){const g=groups();let h='<div class="home-hero"><h1>MapleRoyals 攻略庫</h1>'+
 '<p>原站 mapleroyals.net 已關站，以下為自網際網路檔案館救回的公開攻略，共 '+DATA.length+' 篇。左側點選或搜尋。</p></div><div class="cards">';
 cats(g).forEach(c=>{h+='<div class="card"><h2><span>'+c+'</span><span class="c">'+g[c].length+' 篇</span></h2>'+
  '<p class="dsc">'+(DESC[c]||'')+'</p><ul>'+
  g[c].map(d=>'<li><a href="#'+d.slug+'">'+d.title+'</a></li>').join('')+'</ul></div>';});
 content.innerHTML=h+'</div>';document.title='RMS 攻略庫 · MapleRoyals';
 document.querySelector('#bar strong').textContent='RMS 攻略庫';}
function show(slug){const d=DATA.find(x=>x.slug===slug);if(!d){home();return;}
 const i=flat.indexOf(d),prev=flat[i-1],next=flat[i+1];
 let pg='<div class="pager">';
 pg+=prev?'<a href="#'+prev.slug+'"><span class="k">← 上一篇</span><span class="v">'+prev.title+'</span></a>':'<span style="flex:1"></span>';
 pg+=next?'<a class="next" href="#'+next.slug+'"><span class="k">下一篇 →</span><span class="v">'+next.title+'</span></a>':'<span style="flex:1"></span>';
 pg+='</div>';
 content.innerHTML='<p class="crumb"><a href="#">首頁</a> › '+d.cat+' › <b>'+d.title+'</b></p>'+
  '<h1 class="t">'+d.title+'</h1><p class="meta">存檔日期 '+d.ts+
  ' · <a href="'+d.wb+'" target="_blank" rel="noopener">原始 Wayback 存檔 ↗</a></p>'+d.html+pg;
 content.querySelectorAll('img').forEach(im=>{im.loading='lazy';im.onerror=()=>{im.style.display='none';};});
 document.title=d.title+' · RMS 攻略庫';document.querySelector('#bar strong').textContent=d.title;
 scrollTo(0,0);document.body.classList.remove('open');}
function route(){const s=location.hash.slice(1);s?show(s):home();renderNav(q.value);}
addEventListener('hashchange',route);q.addEventListener('input',()=>renderNav(q.value));
document.getElementById('menu').onclick=()=>document.body.classList.toggle('open');
document.getElementById('scrim').onclick=()=>document.body.classList.remove('open');
document.getElementById('brand').onclick=()=>{location.hash='';};
const topBtn=document.getElementById('top');
addEventListener('scroll',()=>topBtn.classList.toggle('show',scrollY>400));
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
const lb=document.getElementById('lb'),lbi=lb.querySelector('img');
content.addEventListener('click',e=>{if(e.target.tagName==='IMG'&&e.target.src){lbi.src=e.target.src;lb.classList.add('show');}});
lb.onclick=()=>lb.classList.remove('show');
addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('show');
 if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}});
renderNav();route();
</script>
</body></html>
