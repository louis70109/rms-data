3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867440640433717268/first-tower-ani.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867440640433717268/first-tower-ani.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210010/render/stand\"/><\/a>，完成後與 NPC 簡 (Jann) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2161003/icon/\"/>對話。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務4  (需求等級LV138)】到第一座塔找 NPC 簡 (Jenn)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2161003/icon/\"/> 報到，<\/div>\n<div role=\"document\">接著從雷印迪奧(Reindeer)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867440805190959124/reindeer.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867440805190959124/reindeer.png\"/><\/a> <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210001/render/stand\"/>或赤血雷印迪奧(Blood Reindeer) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210002/render/stand\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://global.hidden-street.net/sites/global.hidden-street.net/files/imagecache/monster/monsters/blood-reindeer.png\"/><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/877337960075378758/blood-reindeer.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/877337960075378758/blood-reindeer.png\"/> <\/a>身上獵取雷印迪奧的長槍(Reindeer&#8217;s Spear) <span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867438616997658634.png?v=1\" alt=\":ReindeersSpear:\" aria-label=\":ReindeersSpear:\"/><\/span> X25個，回報任務之後取得鑰匙。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務5  (需求等級LV138)】進入第二座塔內左上角的傳送點挑戰萊尼(Rani)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210011/render/stand\"/><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867441303658692608/second-tower-ani.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867441303658692608/second-tower-ani.png\"/><\/a>，完成後與 NPC 簡 (Jann) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2161003/icon/\"/>對話。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務6  (需求等級LV140)】到第一座塔找 NPC 簡 (Jenn) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2161003/icon/\"/>報到，<\/div>\n<div role=\"document\">接著從熊狼(Bearwolf) <a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867441709914259487/bearwolf.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867441709914259487/bearwolf.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210003/render/stand\"/><\/a>身上獵取熊狼的晨星鎚(Bearwolf&#8217;s Morning Star)<span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867438617047597086.png?v=1\" alt=\":BearwolfsMorningStar:\" aria-label=\":BearwolfsMorningStar:\"/><\/span> X 20 個，回報任務後取得鑰匙。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務7  (需求等級LV140)】進入第三座塔內左上角的傳送點挑戰菁英亞尼(Elder Ani)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867442072108924978/third-tower-ani.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867442072108924978/third-tower-ani.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210012/render/stand\"/><\/a>，完成後與 NPC 簡 (Jann) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2161003/icon/\"/>對話。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務8  (需求等級LV143)】到第一座塔找 NPC 簡 (Jenn)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2161003/icon/\"/> 報到，<\/div>\n<div role=\"document\">接著從要塞巨人(Castle Golem)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867442980180721755/Castle_Golem.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867442980180721755/Castle_Golem.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210005/render/stand\"/><\/a>身上獵取要塞巨人的石塊(Castle Golem Brick)<span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867442857047228436.png?v=1\" alt=\":CastleGolemBrick:\" aria-label=\":CastleGolemBrick:\"/><\/span> X 25 個，回報任務之後取得鑰匙。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務9  (需求等級LV143)】進入第四座塔內左上角的傳送點挑戰菁英教官鮑爾(Elite prison guard boar)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210006/render/stand\"/>X5以及菁英教官萊諾(Elite prison guard rhinoi)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210007/render/stand\"/>X5<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867446041049563146/My_Post-removebg-preview-removebg-preview.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867446041049563146/My_Post-removebg-preview-removebg-preview.png?width=400&amp;height=165\"/><\/a>，完成後與 NPC 簡 (Jann)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2161003/icon/\"/> 對話。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">\n<h6 role=\"document\"> <\/h6>\n<h6 role=\"document\"><strong>第二階段任務線說明：<\/strong><\/h6>\n<\/div>\n<div role=\"document\">【任務10  (需求等級LV148)】前往第五座塔的頂樓 (Roof of the Fifth Tour) 與 NPC 王妃依菲雅(Ifia)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867446562640625684/8c7020a347216a4eda97e292151c734d.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867446562640625684/8c7020a347216a4eda97e292151c734d.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/9300295/render/stand\"/><\/a>對話，王妃會將玩家傳送進入會客室後與 NPC 凡雷恩(Von Leon) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8840010/render/stand\"/>對話，最後再離開與 NPC 王妃依菲雅(Ifia) 對話。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">從格雷伯徹(Grey Vulture)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867453013856616448/grey-vulture.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867453013856616448/grey-vulture.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210004/render/stand\"/><\/a>身上取得玫瑰庭園鑰匙(Key to the Rose Grafen)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4032836/icon?resize=1.0\"/>後向王妃依菲雅(Ifia)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/9300295/render/stand\"/>回報，然後會進入會客室與 NPC 凡雷恩(Von Leon) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8840010/render/stand\"/>對話後，再次跟 NPC 王妃依菲雅(Ifia) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/9300295/render/stand\"/>對話。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務11  (需求等級LV149)】到第四座塔找 NPC 盧登 (Luden)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867452934068633650/luden.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867452934068633650/luden.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://royals-library.netlify.app/images/npcs/2161002.png\"/><\/a>對話。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務12  (需求等級LV150)】到第四座塔找 NPC 盧登 (Luden) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://royals-library.netlify.app/images/npcs/2161002.png\"/>對話，並且從獅子王城區域的怪物身上獵取任務道具聯盟徽章(Alliance Badge) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4032838/icon?resize=1.0\"/>10個，完成後向 NPC 盧登 (Luden) <a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867452934068633650/luden.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://royals-library.netlify.app/images/npcs/2161002.png\"/><\/a>回報任務。<\/div>\n<div role=\"document\">註：目前此任務建議狩獵格雷伯徹(Grey Vulture)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210004/render/stand\"/>取得任務道具<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務13  (需求等級LV150)】前往第五座塔的頂樓 (Roof of the Fifth Tour) 與 NPC 王妃依菲雅(Ifia) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/9300295/render/stand\"/>對話，<\/div>\n<div role=\"document\">接著會被傳送進特殊地圖 (內含三隻小怪)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8840001/render/stand\"/>，玩家需要護送女王至最左側的傳送點，待女王抵達左側的傳送點後，玩家方可自左側傳送點離開，接著進入會客室後與 NPC 凡雷恩(Von Leon) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8840010/render/stand\"/>對話，最後再與 NPC 王妃依菲雅(Ifia) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/9300295/render/stand\"/>對話。<\/div>\n<div role=\"document\">註：女王的血量約莫只能承受小怪 5 次攻擊。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務14  (需求等級LV175)】到第四座塔找 NPC 盧登 (Luden) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://royals-library.netlify.app/images/npcs/2161002.png\"/>對話<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">殺死100隻格雷伯徹(Grey Vulture)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867453013856616448/grey-vulture.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867453013856616448/grey-vulture.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210004/render/stand\"/><\/a>，完成後與 NPC 盧登 (Luden) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://royals-library.netlify.app/images/npcs/2161002.png\"/>對話。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務15  (需求等級LV175)】到第四座塔找 NPC 盧登 (Luden) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://royals-library.netlify.app/images/npcs/2161002.png\"/>對話<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">\n<div id=\"chat-messages-867453013983100948\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\">\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_1113\" aria-expanded=\"false\">從要塞巨人(Castle Golem)身上取得髒掉的騎士卷軸(Dirty Magic Scroll of the Knight)<span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867453570487287820.png?v=1\" alt=\":dirtymagicscrollknight:\" aria-label=\":dirtymagicscrollknight:\"/>，完成後找 NPC 盧登 (Luden)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://royals-library.netlify.app/images/npcs/2161002.png\"/>回報後獲得騎士卷軸 (The Knight&#8217;s Magic Scroll)<span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867454385290215454.png?v=1\" alt=\":knightsmagicscroll:\" aria-label=\":knightsmagicscroll:\"/><\/span><\/span><\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_1113\" aria-expanded=\"false\">註：每日只能回報一次<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_1113\" aria-expanded=\"false\"> <\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_1113\" aria-expanded=\"false\">使用騎士卷軸 <span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"> (The Knight&#8217;s Magic Scroll)便能傳送進獅子王會客室入口 (Audience Room Coridoor of the Lion King)，即凡雷恩 (Von Leon) 遠征的登記地點。<\/span><\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_1113\" aria-expanded=\"false\"> <\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_1113\" aria-expanded=\"false\">\n<div role=\"document\">\n<h6 role=\"document\"> <\/h6>\n<h6 role=\"document\"><strong>第三階段任務線說明：<\/strong><\/h6>\n<p>通過第二階段的任務12 [回報完聯盟徽章(Alliance Badge)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4032838/icon?resize=1.0\"/>】之後並且角色等級已達 LV170，可前往第五座塔的頂樓 (Roof of the Fifth Tour) 與王妃依菲雅 (Ifia)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/9300295/render/stand\"/> <a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867446562640625684/8c7020a347216a4eda97e292151c734d.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867446562640625684/8c7020a347216a4eda97e292151c734d.png\"/><\/a>對話接下任務。<\/p>\n<p>進入王妃右方的傳送點後跟 NPC 賽西莉亞(Cecilia)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2162000/icon/\"/>對話接下任務，<\/p>\n<p>接著便能進入賽西莉亞 (Cecilia) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2162000/icon/\"/>右側的傳送點挑戰玫瑰花園 (Rose Garden) 單人 (solo) 副本任務。<\/p>\n<\/div>\n<div role=\"document\"><strong>【玫瑰花園 (Rose Garden) 單人 (solo) 副本任務線】<\/strong><\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">註：(含獎勵時間)總共限時 40 分鐘，並且每天只能進場一次<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"><strong>【第一張圖】<\/strong><\/div>\n<div role=\"document\">接下任務後從怪物冰封玫瑰 (<strong>Frozen Rose<\/strong>)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8211005/render/stand\"/>身上取得任務道具 玫瑰種子(Rose Seed)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4030036/icon?resize=1.0\"/>，總共需要5顆<\/div>\n<div role=\"document\">在每一個有click指標的玫瑰樹使用滑鼠點擊兩下可生出玫瑰，<\/div>\n<div role=\"document\">之後用普通攻擊鍵取下五朵玫瑰之後與 NPC 賽西莉亞(Cecilia)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2162000/icon/\"/>對話便可進入第二張圖。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"><strong>【第二張圖】<\/strong><\/div>\n<div role=\"document\">接下任務後從怪物看守者魯索(<strong>Keymaster Rousseau<\/strong>)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8211001/render/attack1\"/>身上取得任務道具：魯索的鑰匙(Rousseau&#8217;s Keys)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4030032/icon?resize=1.0\"/>-總共需要5把，<\/div>\n<div role=\"document\">在任何一個幽靈npc旁以捕捉野豬距離之下與其對話，可取得被解放的靈魂結晶(Freed Soul Crystal)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4030033/icon?resize=1.0\"/><\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">得到五顆之後與任務 NPC 賽西莉亞(Cecilia)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2162000/icon/\"/>對話便可進入第三張圖。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"><strong>【第三張圖】<\/strong><\/div>\n<div role=\"document\">擊倒boss超級要塞巨人 (King Castle Golem)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8211004/render/stand\"/>後與 NPC 賽西莉亞(Cecilia)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2162000/icon/\"/>對話。接著玩家會被傳送回第一張圖 。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"><strong>【獎勵時間】<\/strong><\/div>\n<div role=\"document\">在這三張地圖中有任務中出現的三種怪物，擊倒怪物時會隨機觸發【地圖通知：發現黃金蜂 (<b>Golden Bee<\/b>)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8211003/render/stand\"/>】<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"><strong>注意：<\/strong><\/div>\n<ul>\n<li role=\"document\">若欲捕捉 黃金蜂 (Golden Bee) 必須於<span>進場前<\/span>先跟賽西莉亞 (Cecilia) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2162000/icon/\"/>旁的藥水商人 NPC 購買 <span>捕蟲網 (Bug Catching Net; 一個捕蟲網只能捕捉一隻黃金蜂)<\/span>，此道具可放在快捷鍵上，使用方式等同於野豬抓取。<\/li>\n<li role=\"document\">每使用一個捕蟲網抓到一隻黃金蜂會獲得若干個閃耀的花粉 (Shiny Flower Powder)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4009172/icon?resize=1.0\"/><span>。<\/span><\/li>\n<li role=\"document\">此道具目前可以用比值兌換一些用品<\/li>\n<li role=\"document\">5<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4009172/icon?resize=1.0\"/>=25<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplelegends.com/static/images/lib/item/04000630.png\"/><\/li>\n<li role=\"document\">25<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4009172/icon?resize=1.0\"/>+200<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://royals-library.netlify.app/images/items/04039053.png\"/>=1<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/2432206/icon?resize=1.0\"/>(Ifia&#8217;s Ring Box)可以抽<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/1113089/icon?resize=1.0\"/>Ifia&#8217;s Ring，最好是全屬性+7/捲1<\/li>\n<li role=\"document\">25<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4009172/icon?resize=1.0\"/>=<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://royals-library.netlify.app/images/items/02049115.png\"/>(Ifia&#8217;s Ring Chaos Scroll 60%)拿來CS<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/1113089/icon?resize=1.0\"/>的卷軸<\/li>\n<li role=\"document\">1<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4009172/icon?resize=1.0\"/>=1<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/http://mapleroyals.net/wp-content/uploads/2025/03/Vial-of-Potent-Health.png\"/>Vial of Potent Health【最大HP+1】<\/li>\n<li role=\"document\">1<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/4009172/icon?resize=1.0\"/>=1<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/http://mapleroyals.net/wp-content/uploads/2025/03/Vial-of-Potent-Mana.png\"/>Vial of Potent Mana【最大MP+1】<\/li>\n<li role=\"document\"><del><span>此道具可賣給商店 NPC，每個閃耀的花粉 (Shiny Flower Powder) 價值 5,000,000 楓幣。<\/span><\/del><\/li>\n<li>(2023/07/05 維修後) <span>每一場最多只能捕捉 20 隻黃金蜂<span>。<\/span><\/span><\/li>\n<\/ul>\n<div role=\"document\">如不需要捕捉黃金蜂 (Golden Bee)，可以直接由第一張圖左側傳送點離開，並回到第五座塔的頂樓 (Roof of the Fifth Tour) 找王妃伊菲雅（Ifya）<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/9300295/render/stand\"/>回報任務。<\/div>\n<div role=\"document\"> <\/div>\n<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">\n<div id=\"chat-messages-867450430015668304\" class=\"message-2qnXI6 cozyMessage-3V1Y8y groupStart-23k01U wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">\n<h6 role=\"document\"><strong>交換任務 (獅子王城轉蛋前置任務)：<\/strong><\/h6>\n<\/div>\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">【任務需求等級LV143】跟第二座塔的NPC穆特(Murt)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867450429800185896/murt.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867450429800185896/murt.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2160000/icon/\"/><\/a>對話<\/div>\n<div> <\/div>\n<div> <\/div>\n<div> <\/div>\n<div> <\/div>\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">將信件送回冰原雪城找亞凱斯特(Alcaster)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://royals-library.netlify.app/images/npcs/2020005.png\"/><\/div>\n<div> <\/div>\n<\/div>\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\">\n<div class=\"removeAttachmentButton-2qVPxg\" tabindex=\"0\" role=\"button\" aria-label=\"移除訊息附件\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV isHeader-2dII4U\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\">\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"加入反應\" aria-controls=\"popout_971\" aria-expanded=\"false\"> <\/div>\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_972\" aria-expanded=\"false\">接著從亞凱斯特身上接取任務：亞凱斯特的水晶(Alcaster&#8217;s Crystal)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/item/2430159/icon?resize=1.0\"/>，<del>如果遺失要<\/del><s><del>付<\/del>錢買一個跟時間神殿混沌之石長得一模一樣的東西<\/s><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"document\">\n<div id=\"chat-messages-867450996707819540\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\"><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867450996534804540/unknown.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867450996534804540/unknown.png?width=400&amp;height=154\"/><\/a>\n<div class=\"removeAttachmentButton-2qVPxg\" tabindex=\"0\" role=\"button\" aria-label=\"移除訊息附件\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\">\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"編輯\">此項道具在USE消耗欄位內，回去找NPC穆特(Murt)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2160000/icon/\"/>，然後使用它<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"chat-messages-867451187347324958\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\">\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_1032\" aria-expanded=\"false\"> <\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"chat-messages-867452019941965866\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">接著就可以將在獅子王城內所得到的淨化圖騰<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplelegends.com/static/images/lib/item/04000630.png\"/> (Purification Totem)跟NPC穆特(Murt)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2160000/icon/\"/>對話做隨機抽獎 一次要25個<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"document\">\n<div id=\"chat-messages-867452019941965866\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\"><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867452020104757278/unknown.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867452020104757278/unknown.png?width=400&amp;height=171\"/><\/a>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"chat-messages-867452185922240542\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">\n<div class=\"markup-2BOw-j messageContent-2qWWxC\"> <\/div>\n<\/div>\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\"><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/867452185716588554/unknown.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/867452185716588554/unknown.png?width=400&amp;height=187\"/><\/a><\/div>\n<\/div>\n<\/div>\n<div>主力為：CS, WS, BWG, Taru Totem<\/div>\n<div> <\/div>\n<\/div>\n<div role=\"document\">論壇分享獎勵池文章：<a href=\"https://web.archive.org/web/20260610125848/https://royals.ms/forum/lhc-exchange-rewards-cs-ws-bwg-taru-totem-rewards-found.193830/#post-1138891\">https://royals.ms/forum/lhc-exchange-rewards-cs-ws-bwg-taru-totem-rewards-found.193830/#post-1138891<\/a><\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">玩家分享獎勵機率：<a href=\"https://web.archive.org/web/20260610125848/https://royals.ms/forum/threads/results-from-2575-lhc-totems.195508/\">https://royals.ms/forum/threads/results-from-2575-lhc-totems.195508/<\/a>(其實不準..)<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">\n<div id=\"chat-messages-867454502490996756\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">\n<div class=\"markup-2BOw-j messageContent-2qWWxC\"> <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-bell", "cat": "前置任務", "title": "鐘王前置介紹", "ts": "2026-06-10", "wb": "https://web.archive.org/web/20260610115358/https://mapleroyals.net/62747/%E9%90%98%E7%8E%8B%E5%89%8D%E7%BD%AE%E4%BB%8B%E7%B4%B9", "html": "<div class=\"messagesWrapper__36d07 group-spacing-0\">\n<div class=\"scroller__36d07 customTheme_d125d2 auto_d125d2 scrollerBase_d125d2 disableScrollAnchor_d125d2 managedReactiveScroller_d125d2\" dir=\"ltr\" tabindex=\"-1\" role=\"group\">\n<div class=\"scrollerContent__36d07 content_d125d2\">\n<div class=\"message__5126c groupStart__5126c wrapper_c19a55 compact_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-454326420529872897 uid_1 message-content-454326420529872897 uid_2 message-timestamp-454326420529872897\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-454326420529872897\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code class=\"scrollbarGhostHairline__506b3 scrollbar__506b3 hljs dns\">前置任務PART <span class=\"hljs-number\">1<\/span><\/code><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c wrapper_c19a55 compact_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-454326420529872897 uid_1 message-content-454326469964070923 uid_2 message-timestamp-454326469964070923\">\n<div class=\"contents_c19a55\">\n<h3 class=\"header_c19a55\" aria-labelledby=\"message-username-454326420529872897 message-timestamp-454326469964070923\"> <\/h3>\n<div id=\"message-content-454326469964070923\" class=\"markup__75297 messageContent_c19a55\">任務名稱:死守玩具城(Protect Ludibrium)<\/div>\n<div> <\/div>\n<div class=\"markup__75297 messageContent_c19a55\">等級限制: LV.60 觸發地點:時間通道<\/div>\n<div> <\/div>\n<div class=\"markup__75297 messageContent_c19a55\">任務內容:<\/div>\n<div> <\/div>\n<div class=\"markup__75297 messageContent_c19a55\">【1】  向NPC皮耶魯(Mr. Bouffon)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/>接取任務，透過打倒玩具城深處地城的<strong>所有怪物<\/strong>-，並蒐集10個泰可因(Tachion)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/items/04031170.png\"/>。再向皮耶魯<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/>回報。<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">【2】  向NPC皮耶魯(Mr. Bouffon)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/>接取任務，透過打倒玩具城深處地城的<strong>所有怪物<\/strong>-，並蒐集300個泰可因(Tachion)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/items/04031170.png\"/>+怨靈發條熊隊長(<span>Master Death Teddy)<\/span><img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/monsters/7130300.png\"/>掉落的100個魔法粉末(Mysterious Powder)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/items/04031171.png\"/>，再向皮耶魯<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/>回報。 <\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"separator_f84418\"><hr/><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c wrapper_c19a55 compact_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-454326420529872897 uid_1 message-content-454326520828133393 uid_2 message-timestamp-454326520828133393\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-454326520828133393\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code class=\"scrollbarGhostHairline__506b3 scrollbar__506b3 hljs dns\">前置任務PART <span class=\"hljs-number\">2<\/span><\/code><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-expanded=\"false\">任務名稱: 時空裂縫的碎片 等級限制: LV.60並完成死守玩具城 觸發地點: 時間通道<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c wrapper_c19a55 compact_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-454326420529872897 uid_1 message-content-454326540050759680 uid_2 message-timestamp-454326540050759680\">\n<div class=\"contents_c19a55\">\n<div> <\/div>\n<div class=\"markup__75297 messageContent_c19a55\">任務內容:<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">【1】 向NPC皮耶魯(Mr. Bouffon)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/>接取任務，再向另一個NPC福樂(Flo)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://bc.hidden-street.net/sites/global.hidden-street.net/files/npcs/npc316.gif\" alt=\"Flo\"/>對話。<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">【2】 玩家必須透過打倒巨人維京(Gigantic Spirit Viking)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/monsters/8141100.png\"/>或是怨靈女巫(Grim Phantom Watch)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/monsters/8143000.png\"/><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">，蒐集三個時空裂縫碎片分別為(Piece of Cracked Dimension A)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/items/04031176.png\"/>、(Piece of Cracked Dimension B)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/items/04031177.png\"/>、(Piece of Cracked Dimension C)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/items/04031178.png\"/>。<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">【3】 蒐集完三個不同碎片後向福樂(Flo)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/>回報，可以取得時空裂縫碎片D<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://mapleroyals.net/wp-content/uploads/2025/03/Piece-of-Cracked-Dimension.png\"/>(Piece of Cracked Dimension)，最後將時空裂縫碎片D交給皮耶魯(Mr. Bouffon)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/>即完成任務。<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"轉發\"><hr/><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c wrapper_c19a55 compact_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-454326420529872897 uid_1 message-content-454326585923731476 uid_2 message-timestamp-454326585923731476\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-454326585923731476\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code class=\"scrollbarGhostHairline__506b3 scrollbar__506b3 hljs dns\">前置任務PART <span class=\"hljs-number\">3<\/span><\/code><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"轉發\"> <\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-expanded=\"false\"> <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-454326623840370688\" class=\"markup__75297 messageContent_c19a55\">任務名稱:遺失的次元碎片<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">等級限制: LV.60並完成任務：死守玩具城(Protect Ludibrium)<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">觸發地點:時間通道<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">任務內容:<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">【1】 . 與ＮＰＣ皮耶魯對話，可以得到時空裂縫的碎片Ｄ<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://mapleroyals.net/wp-content/uploads/2025/03/Piece-of-Cracked-Dimension.png\"/>(Piece of Cracked Dimension)，同時，玩家必須打倒通道守門人(Gatekeeper)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/monsters/8160000.png\"/>，或是達纳托斯(Thanatos)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/monsters/8170000.png\"/>，取得1個玩具城獎牌(Ludibrium Medal)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/items/04031172.png\"/>。<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">【2】 . 玩家必須同時攜帶獎牌<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/items/04031172.png\"/>+以及時空裂縫的碎片Ｄ<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://mapleroyals.net/wp-content/uploads/2025/03/Piece-of-Cracked-Dimension.png\"/>，再進入時間塔之根源。<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">【3】 . 將時空裂縫的碎片Ｄ<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://mapleroyals.net/wp-content/uploads/2025/03/Piece-of-Cracked-Dimension.png\"/>放置在地圖中間偏右，小平台附近的缺口前方，便可召喚神奇水晶。<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">【4】 . 打倒神奇水晶即可召喚拉圖斯之鐘(Papulatus Clock)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/monsters/8500001.png\"/>，打倒拉圖斯之鐘之後，再打倒隨後出現的拉圖斯(Papulatus)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610115358im_/https://royals-library.netlify.app/images/monsters/8500002.png\"/>。 <time datetime=\"2019-02-07T14:46:14.091Z\" aria-label=\"編輯時間 二月 07, 2019 下午 10:46\"><\/time><\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"separator_f84418\"> <\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-expanded=\"false\"> <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-454326966552756224\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><span><code class=\"scrollbarGhostHairline__506b3 scrollbar__506b3 hljs markdown\">回覆任務後 一樣可以一天領取一個碎片（伺服器時間00：00重置）<\/code><\/span><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"separator_f84418\"> <\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"加入反應\"> <\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<form class=\"form_f75fb0 formWithLoadedChatInput_f75fb0\">\n<div class=\"channelBottomBarArea_f75fb0\">\n<div class=\"channelTextArea_f75fb0 channelTextArea__74017\">\n<div class=\"scrollableContainer__74017 themedBackground__74017\">\n<div class=\"inner__74017 sansAttachButton__74017\">\n<div class=\"textArea__74017 textAreaSlate__74017 slateContainer_ec4baf\">\n<div>\n<div class=\"markup__75297 editor__1b31f slateTextArea_ec4baf fontSize16Padding__74017\" role=\"textbox\" contenteditable=\"true\" spellcheck=\"false\" aria-multiline=\"true\" aria-haspopup=\"listbox\" aria-invalid=\"false\" aria-autocomplete=\"list\" aria-label=\"傳訊息到 #鐘王前置介紹⏰\"> <\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/form>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-tree", "cat": "前置任務", "title": "樹王前置介紹", "ts": "2026-06-10", "wb": "https://web.archive.org/web/20260610123344/https://mapleroyals.net/62750/%E6%A8%B9%E7%8E%8B%E5%89%8D%E7%BD%AE%E4%BB%8B%E7%B4%B9", "html": "<div>\n<ul>\n<li>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-454324247322427392\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code>註：不須完成船長前置<\/code><\/div>\n<div class=\"codeContainer__75297\"><code>若身上已經有靈魂燈籠(Soul Lantern)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://maplelegends.com/static/images/lib/item/04000385.png\"/>，只要借一個就可以跳過船長全部步驟 <\/code><\/div>\n<div> <\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\">前置任務等級需求：70<\/div>\n<div role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/li>\n<\/ul>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-454325970460082186\" class=\"markup__75297 messageContent_c19a55\">\n<div id=\"message-content-454324805156470784\" class=\"markup__75297 messageContent_c19a55\"><hr/>去駁船碼頭城(Singapore: Boat Quay Town)找流浪者洛夫<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/npcs/9270030.png\"/>( Ralph the Wanderer)對話，接下接下前進烏魯城任務(Entering Ulu City)<\/div>\n<\/div>\n<div> <\/div>\n<ul>\n<li id=\"message-content-454325970460082186\" class=\"markup__75297 messageContent_c19a55\">【1】到烏魯城入口找突擊隊員吉姆(Commando Jim)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/npcs/9270044.png\"/>。\n<ul>\n<li class=\"markup__75297 messageContent_c19a55\">打倒維壯<a href=\"https://web.archive.org/web/20260610123344/https://royals-library.netlify.app/monster/id=9420515\"><img decoding=\"async\" id=\"image-9420515\" class=\"img-fluid\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/monsters/9420515.png\"/><\/a>(Veetron 50 隻<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">收集維壯的觸角<a href=\"https://web.archive.org/web/20260610123344/https://royals-library.netlify.app/etc/id=4000430\"><img decoding=\"async\" id=\"image-4000430\" class=\"img-fluid\" src=\"https://web.archive.org/web/20260610123344im_/https://maplelegends.com/static/images/lib/item/04000430.png\"/><\/a> ()Veetron Horn50 個<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">打倒狂暴者<img decoding=\"async\" id=\"image-9420514\" class=\"img-fluid\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/monsters/9420514.png\"/>(Berserkie ) 50 隻<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">收集汗珠<a href=\"https://web.archive.org/web/20260610123344/https://royals-library.netlify.app/etc/id=4000429\"><img decoding=\"async\" id=\"image-4000429\" class=\"img-fluid\" src=\"https://web.archive.org/web/20260610123344im_/https://maplelegends.com/static/images/lib/item/04000429.png\"/><\/a>(Sweat Bead) 50 個<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">打倒蒙特雷瑟<a href=\"https://web.archive.org/web/20260610123344/https://royals-library.netlify.app/monster/id=9420518\"><img decoding=\"async\" id=\"image-9420518\" class=\"img-fluid\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/monsters/9420518.png\"/><\/a>(Montrecer) 30 隻<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">收集油罐<a href=\"https://web.archive.org/web/20260610123344/https://royals-library.netlify.app/etc/id=4000433\"><img decoding=\"async\" id=\"image-4000433\" class=\"img-fluid\" src=\"https://web.archive.org/web/20260610123344im_/https://maplelegends.com/static/images/lib/item/04000433.png\"/><\/a>(Oil Canister) 30 個<\/li>\n<\/ul>\n<\/li>\n<li>【2】將蒐集品交給位於烏魯城入口的突擊隊員吉姆(Commando Jim)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/npcs/9270044.png\"/>，續接下一檔任務<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">【3】同樣跟突擊隊員吉姆(Commando Jim)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/npcs/9270044.png\"/>接下任務：\n<ul>\n<li>打倒石化戰士<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/monsters/9420517.png\"/>(Petrifighter)100 隻<\/li>\n<li>收集青苔石(Moss Rock) 100 個<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://maplelegends.com/static/images/lib/item/04000432.png\"/><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<ul>\n<li>\n<ul>\n<li class=\"markup__75297 messageContent_c19a55\">打倒史萊奇<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/monsters/9420516.png\"/>(Slygie) 100 隻<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">收集史萊奇的尾巴<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://maplelegends.com/static/images/lib/item/04000431.png\"/> (Slygie Tail)100 個。<\/li>\n<\/ul>\n<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">【4】再去烏魯城入口找突擊隊員吉姆(Commando Jim)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/npcs/9270044.png\"/>對話，續接下一檔任務\n<ul>\n<li class=\"markup__75297 messageContent_c19a55\">打倒杜庫<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/monsters/9420519.png\"/>(Duku) 100 隻<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">蒐集大王花<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://maplelegends.com/static/images/lib/item/04000434.png\"/>(Rafflesia)100 個。<\/li>\n<\/ul>\n<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">【5】最後與突擊隊員吉姆(Commando Jim)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://royals-library.netlify.app/images/npcs/9270044.png\"/>獲得板手(Mallet)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://maplelegends.com/static/images/lib/item/04031942.png\"/><\/li>\n<\/ul>\n<\/div>\n<div> <\/div>\n<div> <\/div>\n<div><del>英文叫槌子，中文翻譯叫他板手<\/del><\/div>\n<div> <\/div>\n<div class=\"contents_c19a55\">\n<div><img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://truth.bahamut.com.tw/s01/201202/8236b401e47b06f1596ef4526dd32814.JPG\"/><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">(靈魂燈籠<code><img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://maplelegends.com/static/images/lib/item/04000385.png\"/><\/code>(Soul Lantern)並不會被回收 真正入場道具僅是<span>板手(Mallet)<\/span><img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://maplelegends.com/static/images/lib/item/04031942.png\"/><\/p><p><\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\"><hr/><\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"轉發\"> <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-454702831333670952\" class=\"markup__75297 messageContent_c19a55\">– 打樹的時候 如果是BM/SAIR兩種職業，左眼是有安全區的<\/div>\n<\/div>\n<div id=\"message-accessories-454702870072262657\" class=\"container_b7e1cb\">\n<div class=\"visualMediaItemContainer_f4758a\">\n<div class=\"oneByOneGrid_f4758a oneByOneGridSingle_f4758a\">\n<div class=\"mosaicItem__6c706 mosaicItemNoJustify__6c706 mosaicItemMediaMosaic__6c706 hideOverflow__6c706\">\n<div class=\"imageContent__0f481 embedWrapper_b7e1cb itemContentContainer_f4758a mosaicItemContent__6c706\">\n<div class=\"imageContainer__0f481\">\n<div class=\"imageWrapper_af017a imageZoom_af017a clickable_af017a lazyImgContainer_f4758a\">\n<div class=\"clickableWrapper_af017a\" tabindex=\"0\" role=\"button\" aria-label=\"圖片\" aria-describedby=\"uid_4\">\n<div class=\"loadingOverlay_af017a\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610123344im_/https://mapleroyals.net/wp-content/uploads/2025/03/safezone.png\"/><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-captain", "cat": "前置任務", "title": "船長前置介紹", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517181244/https://mapleroyals.net/62752/%E8%88%B9%E9%95%B7%E5%89%8D%E7%BD%AE%E4%BB%8B%E7%B4%B9", "html": "<div id=\"message-content-454324805156470784\" class=\"markup__75297 messageContent_c19a55\">去駁船碼頭城(Singapore: Boat Quay Town)找流浪者洛夫<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://royals-library.netlify.app/images/npcs/9270030.png\"/>( Ralph the Wanderer)對話，接下此系列任務<\/div>\n<div><\/div>\n<ul>\n<li>【1】昔日的秘密(The Secret of Ghostship)\n<ul>\n<li class=\"markup__75297 messageContent_c19a55\">LV58 打倒幽靈漁夫<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://royals-library.netlify.app/images/monsters/9420509.png\"/>(Pac Pinky)100隻、幽靈清潔工<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://sea.hidden-street.net/sites/sea.hidden-street.net/files/imagecache/monster/monsters/monsters412.gif\" alt=\"Slimy\"/>(Slimy)100隻<\/li>\n<\/ul>\n<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">【2】重返大海之路 LV63(Making the Path to the Sea)\n<ul>\n<li class=\"markup__75297 messageContent_c19a55\">打倒幽靈清潔工<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://sea.hidden-street.net/sites/sea.hidden-street.net/files/imagecache/monster/monsters/monsters412.gif\" alt=\"Slimy\"/>(Slimy)120隻、幽靈船夫<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://sea.hidden-street.net/sites/sea.hidden-street.net/files/imagecache/monster/monsters/monsters413.gif\" alt=\"Selkie Jr.\"/>(Selkie Jr.)120隻。<\/li>\n<\/ul>\n<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">【3】揭露天大的秘密L V63(The Great Secret Reveals))\n<ul>\n<li class=\"markup__75297 messageContent_c19a55\">打倒幽靈船員<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://royals-library.netlify.app/images/monsters/9420512.png\"/>(Mr. Anchor)300隻+蒐集紅色精油<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://maplelegends.com/static/images/lib/item/04000383.png\"/>(Red Essence)300個<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">將結果與物品回報給流浪者洛夫<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://royals-library.netlify.app/images/npcs/9270030.png\"/>( Ralph the Wanderer)即可。 獲得白色精油<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://maplelegends.com/static/images/lib/item/04000381.png\"/>(White Essence)<\/li>\n<\/ul>\n<\/li>\n<li class=\"markup__75297 messageContent_c19a55\">【4】打倒拉塔尼卡船長(Capt. Latanica)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://royals-library.netlify.app/images/monsters/9420513.png\"/>1隻， 會掉落 靈魂燈籠<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://maplelegends.com/static/images/lib/item/04000385.png\"/>(Soul Lantern) (非100%掉落)\n<ul>\n<li class=\"markup__75297 messageContent_c19a55\">身上需帶有白色精油(White Essence)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181244im_/https://maplelegends.com/static/images/lib/item/04000381.png\"/>才可進入引擎室打船長，白色精油須丟在引擎室（The Engine Room）地圖內的房門口才可以召喚船長出來。<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-bear", "cat": "前置任務", "title": "熊獅前置介紹", "ts": "2026-06-10", "wb": "https://web.archive.org/web/20260610124741/https://mapleroyals.net/62758/%E7%86%8A%E7%8D%85%E5%89%8D%E7%BD%AE%E4%BB%8B%E7%B4%B9", "html": "<div>\n<p>懶人包：<\/p>\n<table>\n<tbody>\n<tr>\n<td colspan=\"2\">一人份材料<\/td>\n<td colspan=\"2\">組隊內擊倒怪物需求<\/td>\n<\/tr>\n<tr>\n<td>100<\/td>\n<td>Lucky Bus Ticket<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04000475.png\"/><\/td>\n<td colspan=\"2\"><\/td>\n<\/tr>\n<tr>\n<td>200<\/td>\n<td>Viking Helmet<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04000477.png\"/><\/td>\n<td>200<\/td>\n<td>Vikerola (維京熊)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/monsters/9420539.png\"/><\/td>\n<\/tr>\n<tr>\n<td>200<\/td>\n<td>Toy Plane<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04000476.png\"/><\/td>\n<td>200<\/td>\n<td>Booper Scarlion (飛行獅)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/monsters/9420538.png\"/><\/td>\n<\/tr>\n<tr>\n<td>200<\/td>\n<td>Wooden Pony Tail<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04000478.png\"/><\/td>\n<td>200<\/td>\n<td>Gallopera(騎士熊)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/monsters/9420540.png\"/><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Rodeo&#8217;s Master<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04000471.png\"/><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c groupStart__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-567183659707138048 uid_1 message-content-567183659707138048 uid_2 message-timestamp-567183659707138048\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-567183659707138048\" class=\"markup__75297 messageContent_c19a55\">前置等級：85等(熊獅頭盔要LV90等才能穿戴)<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">NPC：Lam<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/npcs/9270062.png\"/><\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0 isHeader__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\">\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"轉發\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-567183734709944331\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code>任務 #1 – Lam Wants To See The World<\/code><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\">與Lam<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/npcs/9270062.png\"/>對話，前往Fantasy Theme Park 2(夢幻樂園2)<\/div>\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\">打倒水靈巴士<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/monsters/9420537.png\"/> (Yabber Doo)以及收集100張幸運巴士票<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04000475.png\"/>(Lucky Bus Ticket )，收集完成後，返回鄉村鎮回報Lam <img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/npcs/9270062.png\"/><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-567184836553343008\" class=\"markup__75297 messageContent_c19a55\">註記：收集巴士票的同時也可以順便刷地圖上方的飛行獅<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/monsters/9420538.png\"/> (Booper Scarlion)收集200個玩具飛機<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04000476.png\"/>(Toy Plane )，後續的任務(Gift For Brother)會用到。<\/div>\n<div><\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\">\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-567185123510976522\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code>任務 #2 – Off to the City<\/code><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\">和Lam<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/npcs/9270062.png\"/>接取任務後，至Fantasy Theme Park 3(夢幻樂園3)<\/div>\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\">打倒200隻 維京熊<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/monsters/9420539.png\"/>(Vikerola )並收集200個維京頭盔<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04000477.png\"/> (Viking Helmet)後回報Lam<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/npcs/9270062.png\"/><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div>\n<hr/>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-567185673396944949\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code>任務 #3 – Gift For Brother<\/code><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"messag  Kampung<\/code><\/div>\n<div>和Lam<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/npcs/9270062.png\"/>接取任務後，前往Entrance to the Spooky World(夢幻樂園入口)<\/div>\n<div>打倒200隻騎士熊<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/monsters/9420540.png\"/> (Gallopera)並收集200個木製馬尾巴<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04000478.png\"/>(Wooden Pony Tail )後回報Lam<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/npcs/9270062.png\"/><\/div>\n<div>\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c groupStart__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-567187855282012160 uid_1 message-content-567187855282012160 uid_2 message-timestamp-567187855282012160\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-567187855282012160\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code>任務 #5 – Off to the Fantasy Theme Park<\/code><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-567187855282012160 uid_1 message-content-567188032629768215 uid_2 message-timestamp-567188032629768215\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-567188032629768215\" class=\"markup__75297 messageContent_c19a55\">與Lam<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/npcs/9270062.png\"/>對話，在Muddy Banks 3(泥濘草原2)或是Hibiscus Road 1(木槿路1)<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">從黑色獵犬<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/monsters/9420533.png\"/>(Rodeo )身上收集10個黑暗獵犬主人<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04000471.png\"/>(Rodeo&#8217;s Master )後，交給 Lam<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/npcs/9270062.png\"/><\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\"><time id=\"message-timestamp-567188636236513288\" datetime=\"2019-04-15T03:25:08.734Z\" aria-label=\"四月 15, 2019 上午 11:25\"><i class=\"separator_c19a55\" aria-hidden=\"true\"><\/i><\/time><\/p>\n<div id=\"message-content-567188636236513288\" class=\"markup__75297 messageContent_c19a55\">獲得兩個夢幻公園的意念<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04032246.png\"/>(Spirit of Fantasy Theme Park)<\/div>\n<div><\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\"><time id=\"message-timestamp-567189472660160522\" datetime=\"2019-04-15T03:28:28.153Z\" aria-label=\"四月 15, 2019 上午 11:28\"><i class=\"separator_c19a55\" aria-hidden=\"true\"><\/i><\/time><\/p>\n<div id=\"message-content-567189472660160522\" class=\"markup__75297 messageContent_c19a55\">帶著意念<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://maplelegends.com/static/images/lib/item/04032246.png\"/>，組成隊伍後和NPC Aldol <img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/npcs/9201134.png\"/>對話進入Spooky World<\/div>\n<div>\n<hr/>\n<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">即可挑戰娃娃獅王(Scarlion)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/monsters/9420547.png\"/>和泰勒熊(Targa)<img decoding=\"async\" src=\"https://web.archive.org/web/20260610124741im_/https://royals-library.netlify.app/images/monsters/9420542.png\"/><\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">(地圖內可戰鬥時間限時30分鐘)<\/div>\n<\/div>\n<\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-monk", "cat": "前置任務", "title": "妖僧前置介紹", " ps://royals-library.netlify.app/images/monsters/9600014.png\"/><\/p>\n<p>Burglar&#8217;s Wrist Guard<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://maplelegends.com/static/images/lib/item/04000396.png\"/>x20、<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/monsters/9600015.png\"/><\/p>\n<p>Burglar&#8217;s Leg Bindings<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://maplelegends.com/static/images/lib/item/04000397.png\"/>x10<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/monsters/9600016.png\"/><\/p>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div role=\"img\" aria-label=\"\">收集完回報，可以進入少林寺藏經閣地圖，另外有快速通道：<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"轉發\"> <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"message-accessories-465788674211315712\" class=\"container_b7e1cb\">\n<div class=\"visualMediaItemContainer_f4758a\">\n<div class=\"oneByOneGrid_f4758a oneByOneGridSingle_f4758a\">\n<div class=\"mosaicItem__6c706 mosaicItemNoJustify__6c706 mosaicItemMediaMosaic__6c706 hideOverflow__6c706\">\n<div class=\"imageContent__0f481 embedWrapper_b7e1cb itemContentContainer_f4758a mosaicItemContent__6c706\">\n<div class=\"imageContainer__0f481\">\n<div class=\"imageWrapper_af017a imageZoom_af017a clickable_af017a lazyImgContainer_f4758a\">\n<div class=\"clickableWrapper_af017a\" tabindex=\"0\" role=\"button\" aria-label=\"圖片\" aria-describedby=\"uid_4\">\n<div class=\"loadingOverlay_af017a\"><img decoding=\"async\" class=\"lazyImg_f4758a\" src=\"https://web.archive.org/web/20260610123933im_/https://media.discordapp.net/attachments/465788319893028865/465788673787428875/f66cc27949ebe4e932e0fe5efd4c488d.png?ex=67cd4a01&amp;is=67cbf881&amp;hm=1ca9002f9802f605020d1c52de539815e62a5d2abd15a5262a534971ba49b56e&amp;=&amp;format=webp&amp;quality=lossless&amp;width=550&amp;height=333\" alt=\"圖片\"/><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverButtonGroup__06ab4\">\n<div class=\"hoverButton__06ab4\" tabindex=\"0\" role=\"button\" aria-label=\"以應用程式編輯圖片\">\n<div class=\"lottieIcon__5eb9b\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"sizer__06ab4\"><hr/><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"> <\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\"><strong>進入藏經閣任務等級需求為LV120+<\/strong><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-465788739982196736\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code>藏經閣的秘密<span class=\"hljs-number\">1<\/span><\/code><\/div>\n<p>和Janitor monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.n
