<script id="data" type="application/json">[{"slug": "babywell", "cat": "規則", "title": "乖寶寶題庫（Safe Adventures 題庫）", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413054137/https://mapleroyals.net/61990/babywell", "html": "<p>原文來自於<\/p>\n<p><a href=\"https://web.archive.org/web/20260413054137/https://royals.ms/forum/threads/shanks-的安全冒險-safe-adventures.225588/\">https://royals.ms/forum/threads/shanks-的安全冒險-safe-adventures.225588/<\/a><\/p>\n<p>另外真的很怕玩家一出島就出事，可以的話順便看一下本站的其他文章<\/p>\n<p>像是<\/p>\n<ul>\n<li><a href=\"https://web.archive.org/web/20260413054137/https://mapleroyals.net/noobs-guides/game-terms-conditions\">遊戲條款及細則<\/a><\/li>\n<li><a href=\"https://web.archive.org/web/20260413054137/https://mapleroyals.net/%e8%ab%96%e5%a3%87%e8%b2%b7%e8%b3%a3%e6%96%87%e7%9a%84%e6%b3%a8%e6%84%8f%e4%ba%8b%e9%a0%85\">論壇買賣文的注意事項<\/a><\/li>\n<li><a href=\"https://web.archive.org/web/20260413054137/https://mapleroyals.net/%e5%b8%b8%e8%a6%8b%e7%9a%84%e9%81%95%e8%a6%8f%e8%a1%8c%e7%82%ba-%e9%bb%91%e5%90%8d%e5%96%ae%e8%a1%8c%e7%82%ba\">常見的違規行為/黑名單行為<\/a><\/li>\n<\/ul>\n<p><del>這個任務基本上就是為了讓玩家出事的時候無話可說<\/del><\/p>\n<p>Ctrl+F搜尋關鍵字就可以了，總共出七道題目<\/p>\n<hr/>\n<p>Q1（英文）: A friend or family member has said that you can use their account(s). Are you allowed to do so?<br>\n問1（中文）: 朋友或家人表示您可以使用他們的帳戶。 你可以這樣做嗎？<br>\nA1（英文）: No, using their account(s) gives me an unfair advantage, and I should never do it. I am only allowed to play on my own accounts.<br>\n答1（中文）: 不，使用他們的帳戶會讓我獲得不公平的優勢，我永遠不應該這樣做，我只能用自己的帳號玩遊戲。<\/p>\n<p>Q2（英文）: Are you allowed to search for a player&#8217;s personal information on the internet without their consent, and post the information either in game or on the forum?<br>\n問2（中文）: 是否可以在未經玩家同意的情況下在互聯網上搜索玩家的個人信息，並將這些信息發佈在遊戲中或論壇上？<br>\nA2（英文）: No, that would be considered doxing and is an invasion of their privacy.<br>\n答2（中文）: 不，這將被視為人肉搜索，並侵犯了他們的隱私。<\/p>\n<p>Q3（英文）: Are you allowed to launch multiple clients on your computer to access your accounts?<br>\n問3（中文）: 您是否可以在電腦上啟動多個用戶端來登入您的帳戶？<br>\nA3（英文）: Yes, I am allowed to launch multiple clients.<br>\n答3（中文）: 是的，我可以啟動多個客戶端。<\/p>\n<p>Q4（英文）: Are you allowed to make any remark that could be perceived as derogatory or otherwise prejudiced towards any group of people based on their race, sex, gender, life choices, or any other division?<br>\n問4（中文）: 您是否可以根據種族、性別、生活選擇或任何其他分歧發表任何可能被視為對任何群體的貶損或偏見的言論？<br>\nA4（英文）: No, that would be considered vulgar/hate speech<br>\n答4（中文）: 不，這會被視為粗俗/仇恨言論<\/p>\n<p>Q5（英文）: Can you watch a TV show or video while playing MapleRoyals?<br>\n問5（中文）: 您可以在玩 MapleRoyals 時觀看電視節目或影片嗎？<br>\nA5（英文）: Yes, as long as I am still attentive and reply to messages directed at me, or if I&#8217;m AFK-ing.<br>\n答5（中文）: 是的，只要我仍然留意並回覆針對我的訊息，或者我正在 AFK。<\/p>\n<p>Q6（英文）: Certain actions may get repetitive; such as when you are selling leech. Are you allowed to program a script, or download an existing one off the internet to automatically control your character?<br>\n問6（中文）: 遊戲中會有一些重複性的動作，例如當你在賣練等服務（leech）時。你是否可以編寫腳本或從網路上下載腳本來自動操控你的角色？<br>\nA6（英文）: No, that falls under Macrobotting. a more serious form of botting that is equivalent to hacking.<br>\n答6（中文）: 不，這屬於腳本機器人，是一種較為嚴重的機器人行為，相當於外掛（hacking）。<\/p>\n<p>Q7（英文）: Given a scenario where you are unfortunately permanently banned from MapleRoyals for a valid reason, and your ban appeal has been denied. Are you allowed to create a new account and continue playing?<br>\n問7（中文）: 假設您不幸因正當理由被 MapleRoyals 永久封號，並且您的禁制上訴（Ban Appeal）已被拒絕。 您可以建立一個新帳戶並繼續玩遊戲嗎？<br>\nA7（英文）: No, that falls under Ban Evasion and my account (s) would eventually be banned.<br>\n答7（中文）: 不，這屬於逃避封鎖，我的新帳戶遲早也會被封號。<\/p>\n<p>Q8（英文）: How often are you allowed to vote for NX each day on Gtop100.com?<br>\n問8（中文）: 您每天可以在 Gtop100.com 上為 NX 投票多少次？<br>\nA8（英文）: Only one time.<br>\n答8（中文）: 只有一次。<\/p>\n<p>Q9（英文）: If another player is harassing you with explicit, vulgar, or offensive language or content, what should you do?<br>\n問9（中文）: 如果其他玩家使用露骨、粗俗或冒犯性的語言或內容騷擾您，該怎麼做？<br>\nA9（英文）: I will capture a video, or screenshot, and report it on the Forum under &#8216;Report Abuse&#8217;.<br>\n答9（中文）: 我將錄製視頻或截圖，並在論壇上的 Report Abuse （報告濫用行為）下進行報告。<\/p>\n<p>Q10（英文）: If there&#8217;s more than one person in your household playing MapleRoyals, what must you all do in order to all vote each day?<br>\n問10（中文）: 如果您家裡有不只一個人玩 MapleRoyals，那麼您們必須做什麼才能每天一起投票？<br>\nA10（英文）: Apply for the whitelist on the forum and until it is approved, only one player will vote each day.<br>\n答10（中文）: 在論壇上申請白名單，在獲得批准之前，每天只有其中一名玩家可以投票。<\/p>\n<p>Q11（英文）: If you come across a bug, or a glitch that gives you an unfair advantage while playing MapleRoyals, what should you do?<br>\n問11（中文）: 如果你在玩 Mapleroyals 時遇到任何錯誤（bug/glitch），並得以從中獲得不公平的好處，你應該怎麼做？<br>\nA11（英文）: I will visit the &#8216;Bug Report&#8217; section on the forum, and report it there.<br>\n答11（中文）: 我會瀏覽論壇上的「錯誤回報」 Bug Report 版面，然後在那裡回報問題。<\/p>\n<p>Q12（英文）: MapleRoyals is constantly updating and the new patches can be downloaded from the website in order to enjoy non-disrupted gameplay. Are you allowed to play on outdated, modified, or any other game files than those provided on the Download Page directly by MapleRoyals?<br>\n問12（中文）: Mapleroyals 持續地進行更新，你可以從網站下載新補丁以維持正常的遊戲體驗。你是否可以使用未更新的、被修改過的或者在 Mapleroyals 下載頁面所提供的檔案以外的遊戲檔案來進行遊戲？<br>\nA12（英文）: No, as playing the game using improper files may cause disrupted gameplay for myself and other players.<br>\n答12（中文）: 不可以，使用不正確的檔案玩遊戲可能會導致我自己和其他玩家的遊戲出問題。<\/p>\n<p>Q13（英文）: Players collect fame for multiple reasons. Assume you encounter someone whom you dislike because of something they did. Is it appropriate for you to defame them?<br>\n問13（中文）: 玩家收集名聲（fame）的原因有很多。假設你因為某個人的所做所為而不喜歡他，降低他的名聲（defame）是恰當的行為嗎？<br>\nA13（英文）: Yes, so long as I do not mass defame and/or engage other players to mass defame the player on my behalf.<br>\n答13（中文）: 是的，只要我不大規模的降低名聲（mass defame）或唆使／引誘其他玩家代我大規模降低該玩家的名聲。<\/p>\n<p>Q14（英文）: When is it permitted to put a weight on your keyboard to perform actions while not at your computer?<br>\n問14（中文）: 在甚麼情況下，你可以在鍵盤上放上重物執行操作，然後離開你的電腦？<br>\nA14（英文）: It is never okay, I should always be playing my character myself.<br>\n答14（中文）: 任何情況都不行，我應該自己操縱角色。<\/p>\n<p>Q15（英文）: Whether you have encountered an item you wish to purchase, but do not have enough mesos for, or are quitting MapleRoyals and want to earn some money by selling your equipment. Are you allowed to buy and/or sell the item(s) using real money?<br>\n問15（中文）: 假設你遇到一件你想購買的物品，但沒有足夠的遊戲金幣（meso），或者你要退出 Mapleroyals 了，並打算出售你的裝備來賺一點錢。不論何種情況，你是否可以使用真實貨幣購買和/或出售物品？<br>\nA15（英文）: No, Real World Trading is unfair, detrimental to the market, and is not allowed.<br>\n答15（中文）: 不行，現實世界交易（RWT, Real World Trading）對遊戲市場有害，是不公平的，因此不被允許。<\/p>\n<p>Q16（英文）: You see a player acting suspiciously; such as looting items from afar or attacking out-of-reach monsters around the map, are you allowed to loot the items dropped by those monsters?<br>\n問16（中文）: 你看到一名玩家行為可疑，例如從遠處撿取物品或者攻擊地圖各處超出攻擊範圍的怪物，你是否可以撿取那些怪物掉落的物品？<br>\nA16（英文）: No, because reaping benefits from a hacker is not allowed.<br>\n答16（中文）: 不可以，因為從駭客身上獲取利益是不被允許的。<\/p>\n<p>Q17（英文）: Have you clearly read and understood the rules of MapleRoyals? Do you understand the punishments that would be imposed if you are caught breaking the rules?<br>\n問17（中文）: 您是否清楚地閱讀並理解了 MapleRoyals 的規則？ 你知道如果你違反規則被發現會受到怎樣的懲罰嗎？<br>\nA17（英文）: Yes<br>\n答17（中文）: 是的<\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "job-2nd", "cat": "轉職", "title": "二轉流程", "ts": "2026-06-10", "wb": "https://web.archive.org/web/20260610121938/https://mapleroyals.net/noobs-guides/job-advancement/2nd-job-advancement", "html": "<div class=\"jspContainer\">\n<div class=\"jspPane\">\n<div id=\"bulletin\">\n<p><strong>法師二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數需使用完畢 / 已轉職成為法師的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 魔法森林 / 魔法圖書館 / 找NPC漢斯   取得轉職任務，並到魔法森林北部找(地圖最頂端)NPC法師轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後，回魔法圖書館找漢斯即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。(建議紅、藍水帶多點)<\/p>\n<\/div>\n<\/div>\n<p align=\"LEFT\">【僧侶 – Cleric】【冰雷  – Icer/Lighting】【火毒 – Fire/Posion】<\/p>\n<\/div>\n<div class=\"jspContainer\">\n<hr/>\n<\/div>\n<div class=\"jspContainer\">\n<div class=\"jspPane\">\n<div id=\"bulletin\">\n<p align=\"LEFT\"><strong>劍士二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數需使用完畢 / 已轉職成為劍士的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 勇士之村 / 勇者聖殿 / 找NPC武術教練   取得轉職任務，並到西部岩山IV找NPC戰士轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後回勇者聖殿找武術教練即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<p align=\"LEFT\">【狂戰士 –  Fighter】【槍騎兵  –  Spearman】【見習騎士  – Page】<\/p>\n<hr/>\n<p align=\"LEFT\"><strong>盜賊二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前(含)獲得的技能點數需使用完畢 / 已轉職成為盜賊的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 墮落城市 / 盜賊基地(酒吧) / 找NPC達克魯<\/p>\n<p align=\"LEFT\">     取得轉職任務，並到墮落城市北方工地找NPC盜賊轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後，回盜賊基地找達克魯即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<\/div>\n<p align=\"LEFT\">【刺客 – Assassin】【俠盜 – Bandit】<\/p>\n<div id=\"bulletin\">\n<hr/>\n<p align=\"LEFT\"><strong>弓箭手二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數不需使用完畢 / 已轉職成為弓手的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 弓箭手村 / 弓箭手培訓中心 / 找NPC赫麗娜<\/p>\n<p align=\"LEFT\">     取得轉職任務，並到迷官通道找(地圖右上角)NPC弓手轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後，回弓箭手培訓中心找赫麗娜即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<\/div>\n<p align=\"LEFT\">【獵人 – Hunter】  【弩弓手 – CrossbowMan】<\/p>\n<div id=\"bulletin\">\n<hr/>\n<p align=\"LEFT\"><strong>海盜二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數不需使用完畢 / 已轉職成為海盜的角色<\/p>\n<p align=\"LEFT\">1 . 角色必需要先回到維多利亞島東南方海域的鯨魚號，當角色與二轉職教官卡依琳進行對話後，便會對近日來的自我鍛鍊表示鼓勵，並告知只要通過簡單的測試，即可進一步地提升自身能力。<\/p>\n<p align=\"LEFT\">2 . 若玩家同意接受測試，就會讓玩家傳送到試煉地圖裡面打倒怪物，並蒐集15個水晶後拿給他。<\/p>\n<p align=\"LEFT\">3 . 完成這項任務後，將收集好的水晶交給轉職教官，便可選擇轉職成為槍手或打手。<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p align=\"LEFT\">【打手 – Brawler】【槍手 – Gunslinger】<\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "job-3rd", "cat": "轉職", "title": "三轉流程", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413043357/https://mapleroyals.net/noobs-guides/job-advancement/3rd-job-advancement", "html": "<p><strong>劍士：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為狂戰士、見習騎士或槍騎兵的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島勇士之村的勇者聖殿，找武術教練 NPC 對話，接受任務得知必須打倒分身。<\/li>\n<li>其分身在螞蟻礦坑裡面的次元裂縫，點擊水晶道路  NPC 往前直進入異次元世界。發現武術教練分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回勇士村，給予<b>黑符<\/b>，可獲得<b>力量項鏈<\/b><b>。<\/b><\/li>\n<li>取得<strong>力量<\/strong><b>項鏈<\/b>，回冰原雪域找戰士長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給戰士長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>法師：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為火毒巫師、冰雷巫師或僧侶的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島魔法森林的圖書館，找漢斯 NPC 對話，接受任務得知必須打倒漢斯分身。<\/li>\n<li>其分身在巫婆森林 II 的次元裂縫，點擊水晶道路 NPC 往前直進入異次元世界。發現漢斯分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回魔法森林，給予漢斯<b>黑符<\/b>，可獲得<b>力量項鏈。<\/b><\/li>\n<li>取得<b>力量項鏈<\/b>，回冰原雪域找法師長老對話，他會要求你接受智慧的考驗<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答兩個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給法師長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>盜賊：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為刺客或俠客的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島墮落城市的盜賊基地（酒吧），找達克魯 NPC 對話，接受任務得知必須打倒達克魯分身。<\/li>\n<li>其分身在猴子沼澤地 II 的次元裂縫<strong>，<\/strong>點擊水晶道路  NPC 往前直進入異次元世界，發現達克魯分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回墮落城市，給予<b>黑符<\/b>，可獲得<strong>力量<\/strong><b>項鏈。<\/b><\/li>\n<li>取得<strong>力量<\/strong><b>項鏈<\/b>，回冰原雪域找盜賊長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給盜賊長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>弓箭手：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為獵人或弩弓手的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島弓箭手村的弓箭手培育中心，找赫麗娜 NPC 對話，接受任務得知必須打倒赫麗娜分身。<\/li>\n<li>其分身在：奇幻村的森林迷宮 V ，點擊水晶道路 NPC 往前直進入異次元世界，發現赫麗娜分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回弓箭手村，給予<b>黑符<\/b>，可獲得<b>力量項鏈。<\/b><\/li>\n<li>取得<b>力量項鏈<\/b>，回冰原雪域找弓箭手長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給弓箭手長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>海盜：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為打手或槍手的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島鯨魚號的航海室，找卡依琳 NPC 對話，接受任務得知必須打倒卡依琳分身。<\/li>\n<li>其分身在火獨眼獸洞穴 Ⅱ 的次元裂縫，點擊水晶道路 NPC 往前直進入異次元世界，發現卡依琳分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回鯨魚號，給予卡依琳<b>黑符<\/b>，可獲得<b>力量項鏈。<\/b><\/li>\n<li>取得<b>力量項鏈<\/b>，回冰原雪域找海盜長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給海盜長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p>解答：<\/p>\n<pre><code><span class=\"hljs-section\">[題庫總共有六題]<\/span><\/code><\/pre>\n<pre><code class=\"scrollbarGhostHairline-1mSOM1 scrollbar-3dvm_9 hljs css\"><span class=\"hljs-selector-attr\">[第一個答案會決定整個題庫解答的順序]\n例如：\n<img decoding=\"async\" src=\"https://web.archive.org/web/20260413043357im_/http://mapleroyals.net/wp-content/uploads/2020/07/image0.jpg\" alt=\"\"/><\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Fire<\/span> <span class=\"hljs-type\">Boar<\/span> – <span class=\"hljs-type\">Fire<\/span> <span class=\"hljs-type\">Boar<\/span> <span class=\"hljs-type\">Snout<\/span>，解答為 <span class=\"hljs-number\">42513<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Maya<\/span>，解答為 <span class=\"hljs-number\">23525<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Roger<\/span>，解答為 <span class=\"hljs-number\">52354<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Sergeant<\/span> <span class=\"hljs-type\">Peter<\/span>，解答為 <span class=\"hljs-number\">14525<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Shane<\/span>，解答為 <span class=\"hljs-number\">52424<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Weakend<\/span> – <span class=\"hljs-type\">Slower<\/span> <span class=\"hljs-type\">Movements<\/span>，解答為 <span class=\"hljs-number\">12435<\/span><\/code><\/pre>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "job-4th", "cat": "轉職", "title": "四轉流程", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413052705/https://mapleroyals.net/noobs-guides/job-advancement/4th-job-advancement", "html": "<p>要求條件：等級120，轉職時必須把120等以前的技能點數分配完畢。<br>\n【1】. 等級必須達到１２０等，到冰原雪域找該職業的三轉教官，然後接取任務。<\/p>\n<p>【2】. 到神木村的祭司之林找該職業的四轉教官。<\/p>\n<p>路徑『祭司之林位於神木村=&gt;神木村東邊森林=&gt;米納爾森林東邊邊境=&gt;天空之巢路口=&gt;天空之巢  Ｉ=&gt;天空之巢ＩＩ=&gt;山羊峽谷(到這裡之後，右上角有一個樹洞，到此樹洞按上)=&gt;祭司之林』<\/p>\n<p>【3】. 四轉教官會說給他英雄五角勳章和英雄星型墜飾 (這部分要打噴火龍跟格瑞分多取得)建議不理會直接去神木村找長老就好了( 需密咒換取英雄五角勳章和英雄星型                墜飾)。<\/p>\n<p>【4】.『秘咒要怎樣取得呢？首先準備好1000萬，然後到玩具城的愛奧斯塔４４樓找卷軸商人。』<\/p>\n<p>【5】. 給村長密咒，他會給你英雄五角勳章和英雄星型墜飾，找四轉教官轉職<\/p>\n<hr/>\n<p>轉職後，打開消耗欄，有本楓葉祝福，按二下就多出一個技能!!!<\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "skill-all", "cat": "技能書", "title": "全職業共通", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517181626/https://mapleroyals.net/game-tips/skillbook/all-class", "html": "<p><strong><img decoding=\"async\" class=\"aligncenter\" src=\"https://web.archive.org/web/20260517181626im_/http://i.imgur.com/vZN842t.png\" alt=\"\" width=\"300\" height=\"432\"/><\/strong><\/p>\n<hr/>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181626im_/http://i.gyazo.com/66a7a7fe4ac6c1a151e2a86557ffdcfc.png\" alt=\"[IMG]\"/>   <strong>楓葉祝福               <\/strong><\/p>\n<p>楓葉祝福  10  –  四轉直接獲取技能<\/p>\n<p>楓葉祝福  20  –  暗黑龍王<\/p>\n<hr/>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181626im_/http://i.gyazo.com/9283f4e4a8e509dccc8e77967851e911.png\" alt=\"[IMG]\"/>   <strong> 楓葉淨化 <\/strong><\/p>\n<p>楓葉淨化 : <a href=\"https://web.archive.org/web/20260517181626/http://tw.meetgee.com/MiniSite/Topic/View.aspx?ID=2026916&amp;CategoryID=195061&amp;GameID=589\" target=\"_blank\">楓葉淨化 – 密技網傳送門<\/a><\/p>\n<hr/>\n<div id=\"wpdevar_comment_1\">\n <span><\/span>\n <\/div>"}, {"slug": "skill-warrior", "cat": "技能書", "title": "劍士", "ts": "2025-03-21", "wb": "https://web.archive.org/web/20250321103748/https://mapleroyals.net/game-tips/skillbook/warrior", "html": "<html lang=\"zh-Hant\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>技能書－劍士 · RMS 資料備份<\/title>\n<link rel=\"stylesheet\" href=\"assets/style.css\">\n<\/head><body>\n<header class=\"topbar\"><a class=\"home\" href=\"index.html\ <script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const ORDER=['規則','轉職','技能書'];
const nav=document.getElementById('nav'),content=document.getElementById('content'),q=document.getElementById('q');
function groups(f=''){f=f.trim().toLowerCase();const g={};
 DATA.forEach(d=>{if(f&&!(d.title.toLowerCase().includes(f)||d.cat.toLowerCase().includes(f)))return;
 (g[d.cat]=g[d.cat]||[]).push(d);});return g;}
function renderNav(f=''){const g=groups(f);nav.innerHTML='';
 const cats=ORDER.filter(c=>g[c]).concat(Object.keys(g).filter(c=>!ORDER.includes(c)));
 if(!cats.length){nav.innerHTML='<p class="grp">查無結果</p>';return;}
 cats.forEach(c=>{const h=document.createElement('div');h.className='grp';h.textContent=c;nav.appendChild(h);
  g[c].forEach(d=>{const a=document.createElement('a');a.className='navlink';a.href='#'+d.slug;
   a.innerHTML='<span>'+d.title+'</span><span class="d">'+d.ts+'</span>';
   if(location.hash.slice(1)===d.slug)a.classList.add('active');nav.appendChild(a);});});}
function home(){const g=groups();let h='<div class="home-hero"><h1>MapleRoyals 攻略庫</h1>'+
 '<p>原站 mapleroyals.net 已關站，以下為自網際網路檔案館救回的公開攻略，共 '+DATA.length+' 篇。左側點選或搜尋。</p></div><div class="cards">';
 ORDER.filter(c=>g[c]).forEach(c=>{h+='<div class="card"><h2>'+c+'</h2><ul>'+
  g[c].map(d=>'<li><a href="#'+d.slug+'">'+d.title+'</a></li>').join('')+'</ul></div>';});
 content.innerHTML=h+'</div>';document.title='RMS 攻略庫 · MapleRoyals';}
function show(slug){const d=DATA.find(x=>x.slug===slug);if(!d){home();return;}
 content.innerHTML='<h1 class="t">'+d.title+'</h1><p class="meta">'+d.cat+' · 存檔日期 '+d.ts+
  ' · <a href="'+d.wb+'" target="_blank" rel="noopener">原始 Wayback 存檔 ↗</a></p>'+d.html;
 content.querySelectorAll('img').forEach(im=>{im.loading='lazy';im.onerror=()=>{im.style.display='none';};});
 document.title=d.title+' · RMS 攻略庫';window.scrollTo(0,0);document.body.classList.remove('open');}
function route(){const s=location.hash.slice(1);s?show(s):home();renderNav(q.value);}
addEventListener('hashchange',route);q.addEventListener('input',()=>renderNav(q.value));
document.getElementById('menu').onclick=()=>document.body.classList.toggle('open');
document.getElementById('scrim').onclick=()=>document.body.classList.remove('open');
renderNav();route();
</script>
</body></html>
