<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8632a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RMS 攻略庫">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<title>RMS 攻略庫 · MapleRoyals</title>
<style>
:root{--sw:280px;--bg:#f3f5fa;--panel:#fff;--ink:#242a35;--soft:#434a59;--muted:#808997;
 --brand:#e8632a;--brand2:#f4a62a;--line:#e6e9f0;--link:#c2541f;--mark:#ffe9d6;
 --side:#20242e;--sideink:#e8ebf2;--sidemut:#8a93a4;--sidehover:#2d323f;--card:#fbfcfe;
 --shadow:0 1px 3px rgba(20,25,40,.06),0 8px 24px rgba(20,25,40,.05);}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--panel:#161b23;--ink:#e9edf4;
 --soft:#c6cdd9;--muted:#8d97a6;--line:#262d3a;--link:#ffb27a;--mark:#3a2a18;
 --side:#141821;--sideink:#dfe4ee;--sidemut:#79808f;--sidehover:#242b38;--card:#1b212b;
 --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);display:flex;min-height:100vh;
 font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
 font-size:clamp(15.5px,1.1vw+13px,16.5px);line-height:1.9;-webkit-font-smoothing:antialiased;
 text-rendering:optimizeLegibility}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}

#side{width:var(--sw);flex:none;background:var(--side);color:var(--sideink);
 display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
 transition:margin-left .22s ease}
#brand{padding:22px 18px 16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;cursor:pointer;
 display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#brand h1{margin:0;font-size:20px;letter-spacing:.5px}
#collapse{display:none;background:rgba(255,255,255,.2);border:0;color:#fff;cursor:pointer;
 width:28px;height:28px;border-radius:8px;font-size:16px;line-height:1;flex:none}
#collapse:hover{background:rgba(255,255,255,.32)}
#reopen{display:none;position:fixed;left:14px;top:14px;z-index:16;width:40px;height:40px;border-radius:10px;
 background:var(--brand);color:#fff;border:0;font-size:19px;cursor:pointer;box-shadow:var(--shadow)}
#brand p{margin:5px 0 0;font-size:11px;opacity:.92}
#q{margin:12px;padding:10px 13px;border-radius:10px;border:1px solid transparent;
 background:var(--sidehover);color:var(--sideink);font-size:14px;outline:none}
#q:focus{border-color:var(--brand)}
#q::placeholder{color:var(--sidemut)}
#nav{padding:4px 8px 28px}
.grp{display:flex;justify-content:space-between;align-items:center;margin:14px 8px 5px;
 font-size:11px;letter-spacing:1.5px;color:var(--sidemut);text-transform:uppercase}
.grp .c{background:var(--sidehover);border-radius:20px;padding:1px 8px;font-size:10px}
button.grp{width:100%;background:none;border:0;border-radius:8px;color:var(--sidemut);font:inherit;cursor:pointer;
 text-align:left;display:flex;align-items:center;gap:6px;padding:6px 8px;margin:12px 0 2px;letter-spacing:1.5px;font-size:11px;text-transform:uppercase}
button.grp:hover{background:var(--sidehover);color:var(--sideink)}
button.grp:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.grp .gn{flex:1;min-width:0}
.grp .caret{display:inline-block;font-size:10px;transition:transform .18s ease;width:10px;text-align:center}
.grpbox.closed .caret{transform:rotate(-90deg)}
.grpbody{overflow:hidden;transition:max-height .22s ease;max-height:2000px}
.grpbox.closed .grpbody{max-height:0}
.navlink{display:flex;justify-content:space-between;gap:8px;align-items:baseline;
 padding:9px 12px;border-radius:9px;color:var(--sideink);cursor:pointer;font-size:14.5px}
.navlink:hover{background:var(--sidehover);text-decoration:none}
.navlink.active{background:var(--brand);color:#fff}
.navlink .d{font-size:11px;opacity:.55;flex:none}
.navlink.active .d{opacity:.85}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:none;align-items:center;gap:10px;padding:11px 14px;background:var(--panel);
 border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#menu{font-size:22px;background:none;border:0;color:var(--ink);cursor:pointer;line-height:1}
#content{max-width:800px;width:100%;margin:0 auto;padding:34px 30px 90px}

.crumb{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.crumb a{color:var(--muted)}
.crumb b{color:var(--brand);font-weight:600}
h1.t{font-size:clamp(23px,4vw,32px);line-height:1.32;margin:0 0 .35em;letter-spacing:.3px}
/* 標題進場：逐字彈跳（Letter Bounce）。一次只跳一個字：壓扁 → 彈起伸展 → 落地壓扁 → 回彈；用主題色 --brand / --brand2 */
.lw{display:inline-block;white-space:nowrap}
.lc{display:inline-block;transform-origin:50% 100%;will-change:transform;
 animation:lbounce var(--d,.2s) cubic-bezier(.3,.7,.4,1) calc(var(--i)*var(--d,.2s)) 1}
@keyframes lbounce{
 0%{transform:translateY(0) scale(1,1)}
 14%{transform:translateY(0) scale(1.2,.76);color:var(--brand)}
 42%{transform:translateY(-.5em) scale(.88,1.2);color:var(--brand)}
 70%{transform:translateY(0) scale(1.24,.72);color:var(--brand2)}
 86%{transform:translateY(-.08em) scale(.96,1.05)}
 100%{transform:translateY(0) scale(1,1)}}
@media(prefers-reduced-motion:reduce){.lc{animation:none}}
.meta{font-size:12.5px;color:var(--muted);margin:0 0 30px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.meta a{color:var(--muted);text-decoration:underline}

#content p{margin:1em 0;color:var(--soft)}
#content strong{color:var(--ink)}
#content a{word-break:break-all}
#content h2,#content h3,#content h4{color:var(--ink);line-height:1.4;margin:1.8em 0 .6em;
 padding-left:12px;border-left:4px solid var(--brand)}
#content h2{font-size:21px}#content h3{font-size:19px}#content h4{font-size:17px}
/* 全站統一：章節標題與 APQ / iTCG 共用同一套卡片式標題 */
#content h2{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);
 border-radius:12px;padding:10px 14px;margin:2em 0 .7em}
#content h3{border-left-width:3px;padding-left:10px}
#content ul,#content ol{margin:1em 0;padding-left:1.6em}
#content li{margin:.35em 0;color:var(--soft)}
#content ul.display-posts-listing{list-style:none;padding:0;display:grid;gap:8px;
 grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
#content ul.display-posts-listing li{margin:0}
#content ul.display-posts-listing a{display:block;padding:10px 14px;background:var(--card);
 border:1px solid var(--line);border-radius:10px;word-break:normal;color:var(--link)}
#content ul.display-posts-listing a:hover{border-color:var(--brand);text-decoration:none}
#content img{max-width:100%;height:auto;border-radius:10px;margin:12px 0;
 border:1px solid var(--line);vertical-align:middle;cursor:zoom-in}
#content :is(h2,h3,h4)+p{margin-top:.4em}
#content hr{border:0;border-top:1px solid var(--line);margin:2em 0}
#content table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:14.5px;display:block;overflow-x:auto}
#content th,#content td{border:1px solid var(--line);padding:9px 11px;text-align:left}
#content th{background:var(--line)}
#content del{color:var(--muted)}
#content ::selection{background:var(--mark)}

/* 問答卡片 */
.qa{border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.qa .q{background:var(--mark);padding:13px 17px;color:var(--ink);font-weight:600;line-height:1.75;border-left:4px solid var(--brand)}
.qa .a{padding:13px 17px;color:var(--soft);line-height:1.85}
.qa .a br,.qa .q br{content:"";display:block;margin-top:3px}

details.spoiler{margin:1em 0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
details.spoiler>summary{cursor:pointer;padding:11px 16px;font-weight:600;color:var(--brand);
 list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
details.spoiler>summary::-webkit-details-marker{display:none}
details.spoiler>summary::before{content:"\25B8";transition:transform .15s;font-size:12px}
details.spoiler[open]>summary::before{transform:rotate(90deg)}
details.spoiler[open]>summary{border-bottom:1px solid var(--line)}
details.spoiler>*:not(summary){padding-left:16px;padding-right:16px}
details.spoiler>summary+*{padding-top:10px}
details.spoiler>*:last-child{padding-bottom:12px}

.pager{display:flex;gap:12px;margin-top:48px;padding-top:22px;border-top:1px solid var(--line)}
.pager a{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);
 color:var(--soft);transition:border-color .15s}
.pager a:hover{border-color:var(--brand);text-decoration:none}
.pager .k{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.pager .v{color:var(--ink);font-weight:600;font-size:14.5px}
.pager .next{text-align:right}

.home-hero{margin-bottom:28px}
.home-hero h1{font-size:clamp(25px,5vw,36px);margin:0 0 .3em}
.home-hero p{color:var(--muted);margin:0;font-size:14.5px}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;color:var(--brand);font-size:16px;border:0;padding:0;display:flex;justify-content:space-between;align-items:baseline}
.card h2 .c{font-size:11px;color:var(--muted);font-weight:400;background:var(--line);border-radius:20px;padding:1px 9px}
.card .dsc{color:var(--muted);font-size:12px;margin:0 0 10px}
.card ul{margin:0;padding-left:16px}.card li{margin:4px 0}

/* PWA：安裝按鈕與離線提示 */
#install{margin:auto 12px 16px;padding:10px 12px;border-radius:10px;border:1px dashed var(--brand);background:none;
 color:var(--sideink);font:inherit;font-size:13.5px;cursor:pointer}
#install:hover{background:var(--sidehover)}
#install[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
 padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;
 max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* 捲動框：內容過長時限制高度，捲軸風格與側欄一致 */
.scrollbox{max-height:min(68vh,560px);overflow-y:auto;overscroll-behavior:contain;padding-right:6px;
 scrollbar-width:thin;scrollbar-color:var(--brand) var(--sidehover)}
.scrollbox::-webkit-scrollbar{width:8px}
.scrollbox::-webkit-scrollbar-track{background:var(--sidehover);border-radius:8px}
.scrollbox::-webkit-scrollbar-thumb{background:var(--brand);border-radius:8px}
.scrollbox::-webkit-scrollbar-thumb:hover{background:var(--brand2)}

/* iTCG 裝備製作版面 */
.itcg-lead{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.itcg-lead p{margin:.4em 0}
.itcg-src{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.itcg-src span{display:block;margin-bottom:3px;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.itcg-src a{word-break:break-all}
.itcg-toc{position:sticky;top:0;z-index:4;display:flex;flex-wrap:wrap;gap:8px;padding:12px 0;margin-bottom:10px;background:var(--bg)}
.itcg-toc .jump{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
 color:var(--soft);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.itcg-toc .jump:hover{border-color:var(--brand);color:var(--link)}
.itcg-toc .jump span{background:var(--line);border-radius:999px;padding:0 7px;font-size:11px;color:var(--muted)}
.npc{margin:26px 0 8px;scroll-margin-top:70px}
.npc-hd{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);
 border-left:4px solid var(--brand);border-radius:12px;margin-bottom:12px}
.npc-av{width:48px;height:48px;object-fit:contain;flex:none;image-rendering:auto}
.npc-tt{min-width:0;flex:1}
.npc-tt h3{margin:0;font-size:17px;border:0;padding:0;color:var(--ink)}
.npc-tt h3::before{content:none}
.npc-tt .loc{display:block;font-size:12.5px;color:var(--muted);line-height:1.5;word-break:break-word}
.npc-hd .cnt{flex:none;font-size:12px;color:var(--link);background:var(--mark);border-radius:999px;padding:2px 10px;font-weight:600}
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);
 transition:transform .15s,border-color .15s}
.rc:hover{transform:translateY(-2px);border-color:var(--brand)}
.rc-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rc-ic{width:40px;height:40px;object-fit:contain;flex:none;margin:0;border:0;border-radius:8px;background:var(--bg);cursor:zoom-in}
.rc-nm{margin:0;font-size:14.5px;line-height:1.45;color:var(--ink);font-weight:600;border:0;padding:0}
.rc-cost{list-style:none;margin:0;padding:6px 0 0;border-top:1px dashed var(--line)}
.rc-cost .c{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px;color:var(--soft);line-height:1.5;border-bottom:1px solid var(--line)}
.rc-cost .c:last-child{border-bottom:0}
.rc-cost .ci{width:22px;height:22px;object-fit:contain;flex:none;margin:0;border:0;border-radius:4px;cursor:zoom-in}
.rc-cost .qty{flex:none;min-width:38px;text-align:center;font-weight:700;font-size:12px;color:var(--link);background:var(--mark);border-radius:6px;padding:1px 6px}
.rc-cost .nm{min-width:0;word-break:break-word}
.rc-cost .meso .qty{background:var(--brand);color:#fff}
.rc-cost .meso .nm{color:var(--link);font-weight:600}
.npc .note{font-size:13px;color:var(--muted);margin:10px 2px}
.rc-cost.scrollbox{max-height:200px;padding-right:4px}

/* 轉職補充頁 */
.jsec{margin:8px 0 6px}
.jsec h3{margin:1.2em 0 .5em}
.jtbl{width:100%;border-collapse:collapse;font-size:14px}
.jtbl th,.jtbl td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.jtbl th{background:var(--line)}
.jsteps,.jlist{padding-left:1.4em}
.jsteps li,.jlist li{margin:.4em 0;color:var(--soft)}
.qsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:10px}
.qset{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.qset h4{margin:0 0 6px;font-size:14px;color:var(--brand);border:0;padding:0}
.qset h4::before{content:none}
.qset ol{margin:0;padding-left:1.3em}
.qset li{margin:6px 0;font-size:13.5px}
.qset .q{display:block;color:var(--soft)}
.qset .a{display:block;color:var(--link);font-weight:600;font-size:13px}
/* 區域 BOSS 卡片 */
.bo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:6px}
.bo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.bo:hover{transform:translateY(-2px);border-color:var(--brand)}
.bo-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bo-ic{width:44px;height:44px;object-fit:contain;flex:none;margin:0;border:0;border-radius:8px;background:var(--bg);cursor:zoom-in}
.bo-tt{min-width:0;flex:1}
.bo-tt h4{margin:0;font-size:15px;line-height:1.35;color:var(--ink);border:0;padding:0}
.bo-tt h4::before{content:none}
.lv{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:var(--link);background:var(--mark);border-radius:6px;padding:1px 7px}
.bo-dl{margin:0;border-top:1px dashed var(--line);padding-top:8px}
.bo-dl dt{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:6px}
.bo-dl dd{margin:2px 0 0}
.bo-loc{list-style:none;margin:0;padding:0;font-size:13px;color:var(--soft);line-height:1.5}
.bo-loc li{padding:1px 0;word-break:break-word}
.bo-resp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
.rs{font-weight:700;color:var(--link)}
.rs.old{text-decoration:line-through;color:var(--muted);font-weight:400}
.arr{color:var(--muted)}
.upd{font-size:11px;color:var(--link);background:var(--mark);border-radius:999px;padding:1px 8px;width:100%;margin-top:2px}
.bos .note{font-size:13px;color:var(--muted)}
/* APQ 論壇攻略：中英對照 */
.apq-note{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.apq .itcg-toc{margin-bottom:6px}
.apq-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2em 0 .6em;padding:12px 16px;
 background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;scroll-margin-top:70px}
.apq-h .apq-no{font-size:12px;font-weight:700;color:var(--link);background:var(--mark);border-radius:6px;padding:1px 7px}
.apq-hz{font-size:19px;font-weight:700;color:var(--ink)}
.apq-he{font-size:13px;color:var(--muted)}
.apq-sub{margin:1.6em 0 .4em;font-size:16.5px;color:var(--ink);border:0;padding:0}
.apq-sub .zh,.apq-sub .en{display:block}
.apq-sub .en{font-size:13px;font-weight:400;color:var(--muted)}
.apq-p{margin:.9em 0;padding-left:12px;border-left:2px solid var(--line)}
.apq-p p{margin:0}
.apq-p .zh{color:var(--soft)}
.apq-p .en{font-size:13.5px;color:var(--muted);margin-top:2px}
.apq-li{padding:4px 0 4px 16px;position:relative;margin:2px 0}
.apq-li::before{content:"";position:absolute;left:4px;top:.9em;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.apq-li .zh{display:block;color:var(--soft)}
.apq-li .en{display:block;font-size:13px;color:var(--muted)}
.apq-tip{margin:1.2em 0;padding:12px 16px;background:var(--mark);border-radius:12px;border-left:4px solid var(--brand2)}
.apq-tip .tag{display:inline-block;font-size:11px;letter-spacing:1px;color:var(--link);font-weight:700;margin-bottom:4px}
.apq-tip .zh{display:block;color:var(--ink);font-weight:600}
.apq-tip .en{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.apq-gal{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:14px 0}
.apq-gal .pic{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;margin:0}
.apq-gal .ico{width:28px;height:28px;object-fit:contain;margin:0;border:0}
.apq-gal.scrollbox{max-height:min(60vh,420px)}
.apq-gal.scrollbox .pic{max-width:none}
.apq-video{margin:14px 0 18px}
.apq-ratio{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}
.apq-ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.apq-video .cap{display:block;font-size:12px;color:var(--muted);margin-top:4px}
@media(max-width:820px){.apq-h{padding:10px 12px}.apq-hz{font-size:17px}}
@media(max-width:820px){.rc-grid{grid-template-columns:1fr}.itcg-toc{top:0}}

#top{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;
 background:var(--brand);color:#fff;border:0;font-size:20px;cursor:pointer;box-shadow:var(--shadow);
 opacity:0;pointer-events:none;transition:opacity .2s;z-index:15}
#top.show{opacity:1;pointer-events:auto}

#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;
 z-index:40;cursor:zoom-out;padding:24px}
#lb.show{display:flex}
#lb img{max-width:96vw;max-height:92vh;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}

/* 平板：側欄變窄 */
@media(max-width:1024px) and (min-width:821px){:root{--sw:240px}#content{padding:34px 26px 90px}}
/* 桌機：側欄可收合 */
@media(min-width:821px){
 #collapse{display:inline-flex;align-items:center;justify-content:center}
 body.collapsed #side{margin-left:calc(-1 * var(--sw))}
 body.collapsed #reopen{display:block}
}

/* 手機／窄螢幕：側欄收為抽屜 */
@media(max-width:820px){
 #side{position:fixed;left:-86vw;width:84vw;max-width:320px;z-index:30;transition:left .22s;box-shadow:0 0 30px rgba(0,0,0,.45)}
 body.open #side{left:0}
 #bar{display:flex}
 #bar strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #content{padding:22px 16px 80px}
 .crumb{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
 #content h2,#content h3,#content h4{margin:1.5em 0 .5em}
 .pager{flex-direction:column}
 #top{right:16px;bottom:16px}
 details.spoiler>summary{padding:12px 14px}
 .qa .q,.qa .a{padding:12px 14px}
 #scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
 body.open #scrim{display:block}
 /* 滑動：側欄內捲動不帶動背景；打開時鎖住背景捲動 */
 #side{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
 body.open{overflow:hidden;touch-action:none}
 body.open #side{touch-action:pan-y}
 #content{overscroll-behavior-y:contain}
 .scrollbox,#content table{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
 .apq-gal,.rc-grid{-webkit-overflow-scrolling:touch}
 #content img,#content .pic{-webkit-user-drag:none;user-select:none}
}
/* 小手機 */
@media(max-width:400px){
 #content{padding:18px 13px 70px}
 h1.t{font-size:22px}
 .cards{grid-template-columns:1fr}
}

const DESC={'規則':'遊戲規範與題庫','前置任務':'技能、區域與 PQ 的前置條件','轉職':'二～四轉流程','技能書':'各職業技能書掉落','道具':'道具與裝備製作','論壇攻略':'原 royals.ms 論壇精選攻略（英文原文）','工具':'實用小工具（本機執行，不上傳資料）','遊戲指令':'玩家可用的指令整理','經驗需求':'各等級的經驗與材料組數','青春之泉':'青春之泉任務攻略（+HP）','Reuel HP 任務':'Elixir of Life：Reuel HP 任務重點（120 等以上）','Olaf 任務線':'冒險者的任務（Olaf）十個階段','法師 TMA 一刀表':'法師各技能一刀解怪所需的 TMA'};
const nav=document.getElementById('nav'),content=document.getElementById('content'),q=document.getElementById('q');
function groupsAll(){const g={};DATA.forEach(d=>{(g[d.cat]=g[d.cat]||[]).push(d);});return g;}
function groups(f=''){f=f.trim().toLowerCase();const g={};
 DATA.forEach(d=>{if(f&&!(d.title.toLowerCase().includes(f)||d.cat.toLowerCase().includes(f)))return;
 (g[d.cat]=g[d.cat]||[]).push(d);});return g;}
function cats(g){return ORDER.filter(c=>g[c]).concat(Object.keys(g).filter(c=>!ORDER.includes(c)));}
const GA=groupsAll(),flat=[];cats(GA).forEach(c=>GA[c].forEach(d=>flat.push(d)));
function renderNav(f=''){const g=groups(f);nav.innerHTML='';
 if(!cats(g).length){nav.innerHTML='<p class="grp">查無結果</p>';return;}
 let sv={};try{sv=JSON.parse(localStorage.getItem('rms_grp')||'{}')}catch(e){}
 cats(g).forEach(c=>{
  const closed=!f&&!!sv[c];
  const box=document.createElement('section');box.className='grpbox'+(closed?' closed':'');
  const h=document.createElement('button');h.type='button';h.className='grp';h.setAttribute('aria-expanded',String(!closed));
  h.innerHTML='<span class="caret">▾</span><span class="gn">'+c+'</span><span class="c">'+g[c].length+'</span>';
  h.onclick=()=>{const nowClosed=box.classList.toggle('closed');h.setAttribute('aria-expanded',String(!nowClosed));
   let st={};try{st=JSON.parse(localStorage.getItem('rms_grp')||'{}')}catch(e){}st[c]=nowClosed;
   try{localStorage.setItem('rms_grp',JSON.stringify(st))}catch(e){}};
  box.appendChild(h);
  const body=document.createElement('div');body.className='grpbody';
  g[c].forEach(d=>{const a=document.createElement('a');a.className='navlink';a.href='#'+d.slug;
   a.innerHTML='<span>'+d.title+'</span><span class="d">'+d.ts+'</span>';
   if(location.hash.slice(1).split('~')[0]===d.slug)a.classList.add('active');body.appendChild(a);});
  box.appendChild(body);nav.appendChild(box);});}
/* 標題逐字彈跳：每個字包成 span；每字佔一個時段（總長約 2.2 秒，字多時每字不少於 .14 秒），只播一輪。省略動畫偏好時不處理。 */
function bounceTitle(el){
 if(!el||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const txt=el.textContent; if(!txt)return;
 const n=[...txt].filter(c=>!/\s/.test(c)).length; if(!n)return;
 el.style.setProperty('--d',Math.min(.45,Math.max(.14,2.2/n)).toFixed(3)+'s');
 el.setAttribute('aria-label',txt);
 const frag=document.createDocumentFragment(); let i=0;
 txt.split(/(\s+)/).forEach(w=>{
  if(!w)return;
  if(/^\s+$/.test(w)){frag.appendChild(document.createTextNode(' '));return;}
  const word=document.createElement('span'); word.className='lw'; word.setAttribute('aria-hidden','true');
  [...w].forEach(c=>{const s=document.createElement('span'); s.className='lc'; s.textContent=c; s.style.setProperty('--i',i++); word.appendChild(s);});
  frag.appendChild(word);
 });
 el.textContent=''; el.appendChild(frag);
}
function home(){const g=groups();let h='<div class="home-hero"><h1>MapleRoyals 攻略庫</h1>'+
 '<p>原站 mapleroyals.net 已關站，以下為自網際網路檔案館救回的公開攻略，共 '+DATA.length+' 篇。左側點選或搜尋。</p></div><div class="cards">';
 cats(g).forEach(c=>{h+='<div class="card"><h2><span>'+c+'</span><span class="c">'+g[c].length+' 篇</span></h2>'+
  '<p class="dsc">'+(DESC[c]||'')+'</p><ul>'+
  g[c].map(d=>'<li><a href="#'+d.slug+'">'+d.title+'</a></li>').join('')+'</ul></div>';});
 content.innerHTML=h+'</div>';document.title='RMS 攻略庫 · MapleRoyals';
 bounceTitle(content.querySelector('.home-hero h1'));
 document.querySelector('#bar strong').textContent='RMS 攻略庫';}
function show(slug){const d=DATA.find(x=>x.slug===slug);if(!d){home();return;}
 const i=flat.indexOf(d),prev=flat[i-1],next=flat[i+1];
 let pg='<div class="pager">';
 pg+=prev?'<a href="#'+prev.slug+'"><span class="k">← 上一篇</span><span class="v">'+prev.title+'</span></a>':'<span style="flex:1"></span>';
 pg+=next?'<a class="next" href="#'+next.slug+'"><span class="k">下一篇 →</span><span class="v">'+next.title+'</span></a>':'<span style="flex:1"></span>';
 pg+='</div>';
 content.innerHTML='<p class="crumb"><a href="#">首頁</a> › '+d.cat+' › <b>'+d.title+'</b></p>'+
  '<h1 class="t">'+d.title+'</h1><p class="meta">'+(d.ts?'存檔日期 '+d.ts:'')+
  (d.wb?' · <a href="https://wiki.royals.ms/items" target="_blank" rel="noopener">道具資料（wiki.royals.ms）↗</a>':'')+'</p>'+d.html+pg;
 content.querySelectorAll('img').forEach(im=>{im.loading='lazy';im.onerror=()=>{im.style.display='none';};});
 bounceTitle(content.querySelector('h1.t'));

 if(slug==='tool-price-ocr')initOcr(content);
 document.title=d.title+' · RMS 攻略庫';document.querySelector('#bar strong').textContent=d.title;
 scrollTo(0,0);document.body.classList.remove('open');}

let ocrPasteH=null,ocrLoad=null,ocrWorker=null;
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ng(new Error('載入失敗：'+src));document.head.appendChild(s);});}
function initOcr(root){
 const out=root.querySelector('#ocr-out'),file=root.querySelector('#ocr-file'),drop=root.querySelector('#ocr-drop');
 const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 const abs=p=>new URL(p,location.href).href.replace(/\/$/,'');
 async function run(blob){
  const url=URL.createObjectURL(blob),pic='<img class="pic" src="'+url+'" alt="貼上的截圖">';
  const st=m=>{out.innerHTML=pic+'<p>'+m+'</p>';};
  st('載入辨識程式…（第一次需下載，請稍候）');
  try{
   if(!ocrLoad)ocrLoad=(async()=>{await loadScript('assets/ocr/tesseract.min.js');await loadScript('assets/ocr/price-ocr.js');})();
   await ocrLoad;
   if(!ocrWorker)ocrWorker=await Tesseract.createWorker('eng',1,{workerPath:abs('assets/ocr/worker.min.js'),corePath:abs('assets/ocr/'),langPath:abs('assets/ocr'),gzip:true});
   st('辨識中…');
   const r=await PriceOCR.analyze(blob,{worker:ocrWorker});
   out.innerHTML=pic+'<div class="ocr-item">'+esc(r.item||'（找不到商品名稱）')+'</div>'+
    (r.best!=null?'<div>最低價　<span class="ocr-best">'+r.best.toLocaleString()+'</span></div>':'')+
    (r.warning?'<div class="ocr-warn">'+esc(r.warning)+'</div>':'')+
    (r.prices.length?'<table><tr><th>#</th><th>Price</th></tr>'+r.prices.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+p.toLocaleString()+'</td></tr>').join('')+'</table>':'')+
    r.notes.map(n=>'<p class="ocr-note">'+esc(n)+'</p>').join('');
  }catch(e){ocrLoad=null;ocrWorker=null;out.innerHTML=pic+'<p class="ocr-note">辨識失敗：'+esc(e.message||e)+'</p>';}
 }
 ocrPasteH=e=>{const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(i=>i.type.startsWith('image/'));if(!it)return;e.preventDefault();run(it.getAsFile());};
 document.addEventListener('paste',ocrPasteH);
 file.onchange=()=>file.files[0]&&run(file.files[0]);
 drop.ondragover=e=>e.preventDefault();
 drop.ondrop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)run(f);};
}
function route(){if(ocrPasteH){document.removeEventListener('paste',ocrPasteH);ocrPasteH=null;}const [sl,an]=location.hash.slice(1).split('~');sl?show(sl):home();if(an){const el=document.getElementById(an);if(el)el.scrollIntoView({block:'start'});}renderNav(q.value);}
addEventListener('hashchange',route);q.addEventListener('input',()=>renderNav(q.value));
document.getElementById('menu').onclick=()=>document.body.classList.toggle('open');
document.getElementById('scrim').onclick=()=>document.body.classList.remove('open');
/* 手機滑動開關側欄：左邊緣向右滑打開；側欄內向左滑關閉（水平距離夠大、且比垂直距離大才算） */
(function(){
 let sx=0,sy=0,t0=0,on=false;
 const narrow=()=>matchMedia('(max-width:820px)').matches;
 addEventListener('touchstart',e=>{
  if(!narrow()||e.touches.length!==1)return;
  sx=e.touches[0].clientX; sy=e.touches[0].clientY; t0=Date.now();
  on=!document.body.classList.contains('open') ? sx<28 : document.getElementById('side').contains(e.target);
 },{passive:true});
 addEventListener('touchend',e=>{
  if(!on||!narrow())return; on=false;
  const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
  if(Date.now()-t0>800||Math.abs(dy)>Math.abs(dx)*0.6||Math.abs(dx)<60)return;
  if(dx>0&&!document.body.classList.contains('open'))document.body.classList.add('open');
  else if(dx<0&&document.body.classList.contains('open'))document.body.classList.remove('open');
 },{passive:true});
})();
document.getElementById('brand').onclick=()=>{location.hash='';};
const cB=document.getElementById('collapse'),rB=document.getElementById('reopen');
function setCollapsed(v){document.body.classList.toggle('collapsed',v);try{localStorage.setItem('rms_collapsed',v?'1':'0');}catch(e){}}
cB.onclick=e=>{e.stopPropagation();setCollapsed(true);};
rB.onclick=()=>setCollapsed(false);
try{if(localStorage.getItem('rms_collapsed')==='1')document.body.classList.add('collapsed');}catch(e){}
const topBtn=document.getElementById('top');
addEventListener('scroll',()=>topBtn.classList.toggle('show',scrollY>400));
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
const lb=document.getElementById('lb'),lbi=lb.querySelector('img');
content.addEventListener('click',e=>{if(e.target.tagName==='IMG'&&e.target.src){lbi.src=e.target.src;lb.classList.add('show');}});
lb.onclick=()=>lb.classList.remove('show');
content.addEventListener('click',e=>{const j=e.target.closest('[data-jump]');
 if(j){const t=document.getElementById(j.dataset.jump);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});}});
addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('show');
 if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}});
renderNav();route();
/* 手機左右滑動切換上/下篇：窄螢幕、在文章頁才生效；從左邊緣開始的滑動留給側欄；表格等可橫向捲動的區域不觸發 */
(function(){
 let sx=0,sy=0,t0=0,on=false;
 const narrow=()=>matchMedia('(max-width:820px)').matches;
 const scrollsX=el=>{for(;el&&el!==document.body;el=el.parentElement){
  if(el.scrollWidth>el.clientWidth+1){const o=getComputedStyle(el).overflowX;if(o==='auto'||o==='scroll')return true;}}
  return false;};
 addEventListener('touchstart',e=>{
  const p=e.touches[0];
  on=narrow()&&e.touches.length===1&&p.clientX>=28&&!!location.hash.slice(1)
   &&!document.body.classList.contains('open')&&!scrollsX(e.target);
  if(on){sx=p.clientX;sy=p.clientY;t0=Date.now();}
 },{passive:true});
 addEventListener('touchend',e=>{
  if(!on)return; on=false;
  const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Date.now()-t0>600||Math.abs(dx)<80||Math.abs(dy)>Math.abs(dx)*0.5)return;
  const i=flat.findIndex(d=>d.slug===location.hash.slice(1).split('~')[0]);
  if(i<0)return;
  const target=dx<0?flat[i+1]:flat[i-1];
  if(target){location.hash=target.slug;scrollTo({top:0});}
 },{passive:true});
})();
/* ---- 桌面版（Tauri）：外部連結交給系統瀏覽器 ---- */
document.addEventListener('click',e=>{
 const t=window.__TAURI__; if(!t||!t.opener)return;
 const a=e.target.closest&&e.target.closest('a[href]'); if(!a)return;
 const h=a.getAttribute('href')||'';
 if(/^https?:\/\//i.test(h)){e.preventDefault();t.opener.openUrl(h);}
},true);
/* ---- PWA ---- */
const BUILD="bcf07f5c15c7";
function toast(t,ms){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),ms||2600);}
let deferredInstall=null;const instBtn=document.getElementById('install');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;instBtn.hidden=false;});
instBtn.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;instBtn.hidden=true;};
addEventListener('appinstalled',()=>{instBtn.hidden=true;toast('已安裝，可從桌面或主畫面開啟');});
if('serviceWorker' in navigator && location.protocol!=='file:' && !window.__TAURI__){
 addEventListener('load',async()=>{
  try{
   const reg=await navigator.serviceWorker.register('sw.js');
   navigator.serviceWorker.addEventListener('message',e=>{
    const m=e.data||{};
    if(m.type==='WARM_DONE'){try{localStorage.setItem('rms_warm',BUILD);}catch(_){}toast('已可離線閱讀（'+m.total+' 個檔案）',3200);}
   });
   await navigator.serviceWorker.ready;
   let warmed='';try{warmed=localStorage.getItem('rms_warm')||'';}catch(_){}
   const saver=navigator.connection&&navigator.connection.saveData;
   if(warmed!==BUILD&&!saver){
    const go=async()=>{try{const list=await (await fetch('assets-manifest.json')).json();
     const sw=reg.active||(await navigator.serviceWorker.ready).active;sw&&sw.postMessage({type:'WARM',urls:list});}catch(_){}};
    (window.requestIdleCallback||setTimeout)(go,4000);
   }
  }catch(err){}
 });
}
</script>
