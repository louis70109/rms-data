<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMS 攻略庫 · MapleRoyals</title>
<style>
:root{--bg:#f3f5fa;--panel:#fff;--ink:#242a35;--soft:#434a59;--muted:#808997;
 --brand:#e8632a;--brand2:#f4a62a;--line:#e6e9f0;--link:#c2541f;--mark:#ffe9d6;
 --side:#20242e;--sideink:#e8ebf2;--sidemut:#8a93a4;--sidehover:#2d323f;--card:#fbfcfe;
 --shadow:0 1px 3px rgba(20,25,40,.06),0 8px 24px rgba(20,25,40,.05);}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--panel:#161b23;--ink:#e9edf4;
 --soft:#c6cdd9;--muted:#8d97a6;--line:#262d3a;--link:#ffb27a;--mark:#3a2a18;
 --side:#141821;--sideink:#dfe4ee;--sidemut:#79808f;--sidehover:#242b38;--card:#1b212b;
 --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);display:flex;min-height:100vh;
 font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
 font-size:clamp(15.5px,1.1vw+13px,16.5px);line-height:1.9;-webkit-font-smoothing:antialiased;
 text-rendering:optimizeLegibility}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}

#side{width:280px;flex:none;background:var(--side);color:var(--sideink);
 display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
#brand{padding:22px 18px 16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;cursor:pointer}
#brand h1{margin:0;font-size:20px;letter-spacing:.5px}
#brand p{margin:5px 0 0;font-size:11px;opacity:.92}
#q{margin:12px;padding:10px 13px;border-radius:10px;border:1px solid transparent;
 background:var(--sidehover);color:var(--sideink);font-size:14px;outline:none}
#q:focus{border-color:var(--brand)}
#q::placeholder{color:var(--sidemut)}
#nav{padding:4px 8px 28px}
.grp{display:flex;justify-content:space-between;align-items:center;margin:14px 8px 5px;
 font-size:11px;letter-spacing:1.5px;color:var(--sidemut);text-transform:uppercase}
.grp .c{background:var(--sidehover);border-radius:20px;padding:1px 8px;font-size:10px}
.navlink{display:flex;justify-content:space-between;gap:8px;align-items:baseline;
 padding:9px 12px;border-radius:9px;color:var(--sideink);cursor:pointer;font-size:14.5px}
.navlink:hover{background:var(--sidehover);text-decoration:none}
.navlink.active{background:var(--brand);color:#fff}
.navlink .d{font-size:11px;opacity:.55;flex:none}
.navlink.active .d{opacity:.85}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:none;align-items:center;gap:10px;padding:11px 14px;background:var(--panel);
 border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#menu{font-size:22px;background:none;border:0;color:var(--ink);cursor:pointer;line-height:1}
#content{max-width:800px;width:100%;margin:0 auto;padding:34px 30px 90px}

.crumb{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.crumb a{color:var(--muted)}
.crumb b{color:var(--brand);font-weight:600}
h1.t{font-size:clamp(23px,4vw,32px);line-height:1.32;margin:0 0 .35em;letter-spacing:.3px}
.meta{font-size:12.5px;color:var(--muted);margin:0 0 30px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.meta a{color:var(--muted);text-decoration:underline}

#content p{margin:1em 0;color:var(--soft)}
#content strong{color:var(--ink)}
#content a{word-break:break-all}
#content h2,#content h3,#content h4{color:var(--ink);line-height:1.4;margin:1.8em 0 .6em;
 padding-left:12px;border-left:4px solid var(--brand)}
#content h2{font-size:21px}#content h3{font-size:19px}#content h4{font-size:17px}
#content ul,#content ol{margin:1em 0;padding-left:1.6em}
#content li{margin:.35em 0;color:var(--soft)}
#content ul.display-posts-listing{list-style:none;padding:0;display:grid;gap:8px;
 grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
#content ul.display-posts-listing li{margin:0}
#content ul.display-posts-listing a{display:block;padding:10px 14px;background:var(--card);
 border:1px solid var(--line);border-radius:10px;word-break:normal;color:var(--link)}
#content ul.display-posts-listing a:hover{border-color:var(--brand);text-decoration:none}
#content img{max-width:100%;height:auto;border-radius:10px;margin:12px 0;
 border:1px solid var(--line);vertical-align:middle;cursor:zoom-in}
#content :is(h2,h3,h4)+p{margin-top:.4em}
#content hr{border:0;border-top:1px solid var(--line);margin:2em 0}
#content table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:14.5px;display:block;overflow-x:auto}
#content th,#content td{border:1px solid var(--line);padding:9px 11px;text-align:left}
#content th{background:var(--line)}
#content del{color:var(--muted)}
#content ::selection{background:var(--mark)}

/* 問答卡片 */
.qa{border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.qa .q{background:var(--mark);padding:13px 17px;color:var(--ink);font-weight:600;line-height:1.75;border-left:4px solid var(--brand)}
.qa .a{padding:13px 17px;color:var(--soft);line-height:1.85}
.qa .a br,.qa .q br{content:"";display:block;margin-top:3px}

details.spoiler{margin:1em 0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
details.spoiler>summary{cursor:pointer;padding:11px 16px;font-weight:600;color:var(--brand);
 list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
details.spoiler>summary::-webkit-details-marker{display:none}
details.spoiler>summary::before{content:"\25B8";transition:transform .15s;font-size:12px}
details.spoiler[open]>summary::before{transform:rotate(90deg)}
details.spoiler[open]>summary{border-bottom:1px solid var(--line)}
details.spoiler>*:not(summary){padding-left:16px;padding-right:16px}
details.spoiler>summary+*{padding-top:10px}
details.spoiler>*:last-child{padding-bottom:12px}

.pager{display:flex;gap:12px;margin-top:48px;padding-top:22px;border-top:1px solid var(--line)}
.pager a{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);
 color:var(--soft);transition:border-color .15s}
.pager a:hover{border-color:var(--brand);text-decoration:none}
.pager .k{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.pager .v{color:var(--ink);font-weight:600;font-size:14.5px}
.pager .next{text-align:right}

.home-hero{margin-bottom:28px}
.home-hero h1{font-size:clamp(25px,5vw,36px);margin:0 0 .3em}
.home-hero p{color:var(--muted);margin:0;font-size:14.5px}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;color:var(--brand);font-size:16px;border:0;padding:0;display:flex;justify-content:space-between;align-items:baseline}
.card h2 .c{font-size:11px;color:var(--muted);font-weight:400;background:var(--line);border-radius:20px;padding:1px 9px}
.card .dsc{color:var(--muted);font-size:12px;margin:0 0 10px}
.card ul{margin:0;padding-left:16px}.card li{margin:4px 0}

#top{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;
 background:var(--brand);color:#fff;border:0;font-size:20px;cursor:pointer;box-shadow:var(--shadow);
 opacity:0;pointer-events:none;transition:opacity .2s;z-index:15}
#top.show{opacity:1;pointer-events:auto}

#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;
 z-index:40;cursor:zoom-out;padding:24px}
#lb.show{display:flex}
#lb img{max-width:96vw;max-height:92vh;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}

/* 平板：側欄變窄 */
@media(max-width:1024px) and (min-width:821px){#side{width:240px}#content{padding:34px 26px 90px}}

/* 手機／窄螢幕：側欄收為抽屜 */
@media(max-width:820px){
 #side{position:fixed;left:-86vw;width:84vw;max-width:320px;z-index:30;transition:left .22s;box-shadow:0 0 30px rgba(0,0,0,.45)}
 body.open #side{left:0}
 #bar{display:flex}
 #bar strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #content{padding:22px 16px 80px}
 .crumb{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
 #content h2,#content h3,#content h4{margin:1.5em 0 .5em}
 .pager{flex-direction:column}
 #top{right:16px;bottom:16px}
 details.spoiler>summary{padding:12px 14px}
 .qa .q,.qa .a{padding:12px 14px}
 #scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
 body.open #scrim{display:block}
}
/* 小手機 */
@media(max-width:400px){
 #content{padding:18px 13px 70px}
 h1.t{font-size:22px}
 .cards{grid-template-columns:1fr}
}
</style></head>

<script id="data" type="application/json">[{"slug": "babywell", "cat": "規則", "title": "乖寶寶題庫（Safe Adventures 題庫）", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413054137/https://mapleroyals.net/61990/babywell", "html": "<p>原文來自於<\/p>\n<p><a href=\"https://web.archive.org/web/20260413054137/https://royals.ms/forum/threads/shanks-的安全冒險-safe-adventures.225588/\">https://royals.ms/forum/threads/shanks-的安全冒險-safe-adventures.225588/<\/a><\/p>\n<p>另外真的很怕玩家一出島就出事，可以的話順便看一下本站的其他文章<\/p>\n<p>像是<\/p>\n<ul>\n<li><a href=\"https://web.archive.org/web/20260413054137/https://mapleroyals.net/noobs-guides/game-terms-conditions\">遊戲條款及細則<\/a><\/li>\n<li><a href=\"https://web.archive.org/web/20260413054137/https://mapleroyals.net/%e8%ab%96%e5%a3%87%e8%b2%b7%e8%b3%a3%e6%96%87%e7%9a%84%e6%b3%a8%e6%84%8f%e4%ba%8b%e9%a0%85\">論壇買賣文的注意事項<\/a><\/li>\n<li><a href=\"https://web.archive.org/web/20260413054137/https://mapleroyals.net/%e5%b8%b8%e8%a6%8b%e7%9a%84%e9%81%95%e8%a6%8f%e8%a1%8c%e7%82%ba-%e9%bb%91%e5%90%8d%e5%96%ae%e8%a1%8c%e7%82%ba\">常見的違規行為/黑名單行為<\/a><\/li>\n<\/ul>\n<p><del>這個任務基本上就是為了讓玩家出事的時候無話可說<\/del><\/p>\n<p>Ctrl+F搜尋關鍵字就可以了，總共出七道題目<\/p>\n<hr/>\n<div class=\"qa\"><div class=\"q\">Q1（英文）: A friend or family member has said that you can use their account(s). Are you allowed to do so?<br>問1（中文）: 朋友或家人表示您可以使用他們的帳戶。 你可以這樣做嗎？<\/div><div class=\"a\">A1（英文）: No, using their account(s) gives me an unfair advantage, and I should never do it. I am only allowed to play on my own accounts.<br>答1（中文）: 不，使用他們的帳戶會讓我獲得不公平的優勢，我永遠不應該這樣做，我只能用自己的帳號玩遊戲。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q2（英文）: Are you allowed to search for a player&#8217;s personal information on the internet without their consent, and post the information either in game or on the forum?<br>問2（中文）: 是否可以在未經玩家同意的情況下在互聯網上搜索玩家的個人信息，並將這些信息發佈在遊戲中或論壇上？<\/div><div class=\"a\">A2（英文）: No, that would be considered doxing and is an invasion of their privacy.<br>答2（中文）: 不，這將被視為人肉搜索，並侵犯了他們的隱私。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q3（英文）: Are you allowed to launch multiple clients on your computer to access your accounts?<br>問3（中文）: 您是否可以在電腦上啟動多個用戶端來登入您的帳戶？<\/div><div class=\"a\">A3（英文）: Yes, I am allowed to launch multiple clients.<br>答3（中文）: 是的，我可以啟動多個客戶端。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q4（英文）: Are you allowed to make any remark that could be perceived as derogatory or otherwise prejudiced towards any group of people based on their race, sex, gender, life choices, or any other division?<br>問4（中文）: 您是否可以根據種族、性別、生活選擇或任何其他分歧發表任何可能被視為對任何群體的貶損或偏見的言論？<\/div><div class=\"a\">A4（英文）: No, that would be considered vulgar/hate speech<br>答4（中文）: 不，這會被視為粗俗/仇恨言論<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q5（英文）: Can you watch a TV show or video while playing MapleRoyals?<br>問5（中文）: 您可以在玩 MapleRoyals 時觀看電視節目或影片嗎？<\/div><div class=\"a\">A5（英文）: Yes, as long as I am still attentive and reply to messages directed at me, or if I&#8217;m AFK-ing.<br>答5（中文）: 是的，只要我仍然留意並回覆針對我的訊息，或者我正在 AFK。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q6（英文）: Certain actions may get repetitive; such as when you are selling leech. Are you allowed to program a script, or download an existing one off the internet to automatically control your character?<br>問6（中文）: 遊戲中會有一些重複性的動作，例如當你在賣練等服務（leech）時。你是否可以編寫腳本或從網路上下載腳本來自動操控你的角色？<\/div><div class=\"a\">A6（英文）: No, that falls under Macrobotting. a more serious form of botting that is equivalent to hacking.<br>答6（中文）: 不，這屬於腳本機器人，是一種較為嚴重的機器人行為，相當於外掛（hacking）。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q7（英文）: Given a scenario where you are unfortunately permanently banned from MapleRoyals for a valid reason, and your ban appeal has been denied. Are you allowed to create a new account and continue playing?<br>問7（中文）: 假設您不幸因正當理由被 MapleRoyals 永久封號，並且您的禁制上訴（Ban Appeal）已被拒絕。 您可以建立一個新帳戶並繼續玩遊戲嗎？<\/div><div class=\"a\">A7（英文）: No, that falls under Ban Evasion and my account (s) would eventually be banned.<br>答7（中文）: 不，這屬於逃避封鎖，我的新帳戶遲早也會被封號。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q8（英文）: How often are you allowed to vote for NX each day on Gtop100.com?<br>問8（中文）: 您每天可以在 Gtop100.com 上為 NX 投票多少次？<\/div><div class=\"a\">A8（英文）: Only one time.<br>答8（中文）: 只有一次。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q9（英文）: If another player is harassing you with explicit, vulgar, or offensive language or content, what should you do?<br>問9（中文）: 如果其他玩家使用露骨、粗俗或冒犯性的語言或內容騷擾您，該怎麼做？<\/div><div class=\"a\">A9（英文）: I will capture a video, or screenshot, and report it on the Forum under &#8216;Report Abuse&#8217;.<br>答9（中文）: 我將錄製視頻或截圖，並在論壇上的 Report Abuse （報告濫用行為）下進行報告。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q10（英文）: If there&#8217;s more than one person in your household playing MapleRoyals, what must you all do in order to all vote each day?<br>問10（中文）: 如果您家裡有不只一個人玩 MapleRoyals，那麼您們必須做什麼才能每天一起投票？<\/div><div class=\"a\">A10（英文）: Apply for the whitelist on the forum and until it is approved, only one player will vote each day.<br>答10（中文）: 在論壇上申請白名單，在獲得批准之前，每天只有其中一名玩家可以投票。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q11（英文）: If you come across a bug, or a glitch that gives you an unfair advantage while playing MapleRoyals, what should you do?<br>問11（中文）: 如果你在玩 Mapleroyals 時遇到任何錯誤（bug/glitch），並得以從中獲得不公平的好處，你應該怎麼做？<\/div><div class=\"a\">A11（英文）: I will visit the &#8216;Bug Report&#8217; section on the forum, and report it there.<br>答11（中文）: 我會瀏覽論壇上的「錯誤回報」 Bug Report 版面，然後在那裡回報問題。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q12（英文）: MapleRoyals is constantly updating and the new patches can be downloaded from the website in order to enjoy non-disrupted gameplay. Are you allowed to play on outdated, modified, or any other game files than those provided on the Download Page directly by MapleRoyals?<br>問12（中文）: Mapleroyals 持續地進行更新，你可以從網站下載新補丁以維持正常的遊戲體驗。你是否可以使用未更新的、被修改過的或者在 Mapleroyals 下載頁面所提供的檔案以外的遊戲檔案來進行遊戲？<\/div><div class=\"a\">A12（英文）: No, as playing the game using improper files may cause disrupted gameplay for myself and other players.<br>答12（中文）: 不可以，使用不正確的檔案玩遊戲可能會導致我自己和其他玩家的遊戲出問題。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q13（英文）: Players collect fame for multiple reasons. Assume you encounter someone whom you dislike because of something they did. Is it appropriate for you to defame them?<br>問13（中文）: 玩家收集名聲（fame）的原因有很多。假設你因為某個人的所做所為而不喜歡他，降低他的名聲（defame）是恰當的行為嗎？<\/div><div class=\"a\">A13（英文）: Yes, so long as I do not mass defame and/or engage other players to mass defame the player on my behalf.<br>答13（中文）: 是的，只要我不大規模的降低名聲（mass defame）或唆使／引誘其他玩家代我大規模降低該玩家的名聲。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q14（英文）: When is it permitted to put a weight on your keyboard to perform actions while not at your computer?<br>問14（中文）: 在甚麼情況下，你可以在鍵盤上放上重物執行操作，然後離開你的電腦？<\/div><div class=\"a\">A14（英文）: It is never okay, I should always be playing my character myself.<br>答14（中文）: 任何情況都不行，我應該自己操縱角色。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q15（英文）: Whether you have encountered an item you wish to purchase, but do not have enough mesos for, or are quitting MapleRoyals and want to earn some money by selling your equipment. Are you allowed to buy and/or sell the item(s) using real money?<br>問15（中文）: 假設你遇到一件你想購買的物品，但沒有足夠的遊戲金幣（meso），或者你要退出 Mapleroyals 了，並打算出售你的裝備來賺一點錢。不論何種情況，你是否可以使用真實貨幣購買和/或出售物品？<\/div><div class=\"a\">A15（英文）: No, Real World Trading is unfair, detrimental to the market, and is not allowed.<br>答15（中文）: 不行，現實世界交易（RWT, Real World Trading）對遊戲市場有害，是不公平的，因此不被允許。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q16（英文）: You see a player acting suspiciously; such as looting items from afar or attacking out-of-reach monsters around the map, are you allowed to loot the items dropped by those monsters?<br>問16（中文）: 你看到一名玩家行為可疑，例如從遠處撿取物品或者攻擊地圖各處超出攻擊範圍的怪物，你是否可以撿取那些怪物掉落的物品？<\/div><div class=\"a\">A16（英文）: No, because reaping benefits from a hacker is not allowed.<br>答16（中文）: 不可以，因為從駭客身上獲取利益是不被允許的。<\/div><\/div>\n<div class=\"qa\"><div class=\"q\">Q17（英文）: Have you clearly read and understood the rules of MapleRoyals? Do you understand the punishments that would be imposed if you are caught breaking the rules?<br>問17（中文）: 您是否清楚地閱讀並理解了 MapleRoyals 的規則？ 你知道如果你違反規則被發現會受到怎樣的懲罰嗎？<\/div><div class=\"a\">A17（英文）: Yes<br>答17（中文）: 是的<\/div><\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-overview", "cat": "前置任務", "title": "前置任務（總覽）", "ts": "2026-04-12", "wb": "https://web.archive.org/web/20260412031742/https://mapleroyals.net/%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99", "html": "<ul class=\"display-posts-listing\"><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/144/zakum\">殘暴炎魔<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/146/ht-run\">闇黑龍王<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/1657/get-marry\">結婚手冊<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/50197/%e5%a4%a9%e7%9a%87%e8%9f%be%e8%9c%8d\">天皇蟾蜍<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62122/62122\">獅子王城<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62747/%e9%90%98%e7%8e%8b%e5%89%8d%e7%bd%ae%e4%bb%8b%e7%b4%b9\">鐘王前置介紹<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62750/%e6%a8%b9%e7%8e%8b%e5%89%8d%e7%bd%ae%e4%bb%8b%e7%b4%b9\">樹王前置介紹<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62752/%e8%88%b9%e9%95%b7%e5%89%8d%e7%bd%ae%e4%bb%8b%e7%b4%b9\">船長前置介紹<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62758/%e7%86%8a%e7%8d%85%e5%89%8d%e7%bd%ae%e4%bb%8b%e7%b4%b9\">熊獅前置介紹<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62765/%e6%9d%b1%e4%ba%ac%e5%89%8d%e7%bd%ae%e4%bb%8b%e7%b4%b9\">東京前置介紹<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62785/%e7%82%8e%e9%ad%94%e5%bf%8d%e8%80%90%e6%9b%bf%e4%bb%a3%e4%bb%bb%e5%8b%99\">炎魔忍耐替代任務<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62795/%e5%a6%96%e5%83%a7%e5%89%8d%e7%bd%ae%e4%bb%8b%e7%b4%b9\">妖僧前置介紹<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62812/cwkpq%e5%89%8d%e7%bd%ae%e4%bb%8b%e7%b4%b9\">Cwkpq前置介紹<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62850/%e5%89%8d%e7%bd%ae%e4%bb%bb%e5%8b%99-%e8%89%be%e9%9d%88%e6%a3%ae%e6%9e%97epq\">艾靈森林前置介紹<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/62869/%e6%99%82%e9%96%93%e7%a5%9e%e6%ae%bf%e5%89%8d%e7%bd%ae%e4%bb%8b%e7%b4%b9\">時間神殿前置介紹<\/a><\/li><li class=\"listing-item\"><a class=\"title\" href=\"https://web.archive.org/web/20260412031742/https://mapleroyals.net/65753/balrog-pq%e5%89%8d%e7%bd%ae%e4%bb%bb%e5%8b%99\">魔王巴洛谷前置任務(Balrog PQ/BPQ)<\/a><\/li><\/ul>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-warrior", "cat": "前置任務", "title": "技能前置任務－戰士", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413054046/https://mapleroyals.net/%E8%81%B7%E6%A5%AD%E9%81%B8%E6%93%87/warrior/%E6%8A%80%E8%83%BD%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E6%88%B0%E5%A3%AB", "html": "<p><span>英雄(Hero)：<\/span><span>進階鬥氣<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/02280007.png\"/>(Advanced Combo Attack)  <\/span><span>聖騎士(Paladin)：<\/span><span>屬性強化<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1220010.png\"/>(Advanced Charge Blow)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>打炎魔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8800000.png\"/>(Zakum)<\/span><span>會掉<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>英雄(Hero)：<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121006.png\"/>究級突刺(Rush)  黑騎(Dark Knighr)：<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121006.png\"/>究級突刺(Rush)  聖騎士(Paladin)：<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121006.png\"/>究級突刺(Rush)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>先在長槍牛魔王<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/7130101.png\"/><\/span><span>(Tauromacis)中取得 <\/span><span>無法閱讀的書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04001112.png\"/>[Storybook] Indecipherable Book。(去自由市場買一本也可以)<\/span><\/li>\n<li aria-level=\"1\"><span>到勇士之村(perion)左上角，與麥吉<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/1022002.png\"/><\/span><span>(Manji)對話。<\/span><\/li>\n<\/ol>\n<p><span>麥吉要求玩家與一位四轉的劍士組隊，一同擊敗長槍牛魔王<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/7130101.png\"/><\/span><span>(Tauromacis)200隻。<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>完成後，回去到勇士之村(perion)與麥吉<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/1022002.png\"/><\/span><span>(Manji)對話即可習得<\/span><span>究級突刺<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121006.png\"/>(Rush)<\/span><\/li>\n<\/ol>\n<p><span>註：組隊隊友打倒的怪物也有計算在內<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>英雄：<\/span><span>鬥氣爆發<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121010.png\"/> (Enrage)  <\/span><span>黑騎：<\/span><span>黑暗力量<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320006.png\"/>(Berserk)  <\/span><span>聖騎：<\/span><span>鬼神之擊<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1221011.png\"/>(Heaven&#8217;s Hammer)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>到赫爾奧斯塔圖書館，找懷茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2040052.png\"/><\/span><span>(Wiz the Librarian)對話接下任務：【The Great Warrior, Sayram】，會得到 賽伊蘭故事書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04161019.png\"/><\/span><span>(Sayram&#8217;s Journey )。<\/span><\/li>\n<li aria-level=\"1\"><span>到神木村找村長塔塔曼<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081000.png\"/><\/span><span>(Chief Tatamo)對話接任務【Griffey&#8217;s Necklace】要求玩家打倒格瑞芬多<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8180001.png\"/><\/span><span>(Griffey)取得 賽伊蘭的項鍊<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031467.png\"/><\/span><span>(Sayram&#8217;s Necklace)。<\/span><\/li>\n<\/ol>\n<p><span>然後拿著項鍊與回去找村長塔塔曼<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081000.png\"/><\/span><span>(Chief Tatamo)對話。<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>到奇幻村深處地圖：迷霧森林-另外的出口(Dungeon : Another Entrance)找無意義存在者<\/span><span>(Insignificant Being)對話接下任務【Sayram&#8217;s Skill】，他要求玩家尋找賽伊蘭的盾牌<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031471.png\"/><\/span><span>(Sayram&#8217;s Shield)。<\/span><\/li>\n<li aria-level=\"1\"><span>前往寺院通道Ⅳ(Sanctuary Entrance IV)，使用 被遺忘的聖殿鑰匙<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031475.png\"/>(Key to the Forgotten Shrine)<\/span><span>可進入遺忘的聖殿。<\/span>\n<ul>\n<li aria-level=\"2\"><span>【 被遺忘的聖殿鑰匙由巴洛谷<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8130100.png\"/><\/span><span>(Jr. Balrog)掉落】<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>在遺忘的聖殿裡，用普通攻擊打石像，隨機掉落賽伊蘭的盾牌<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031471.png\"/><\/span><span>(Sayram&#8217;s Shield)。<\/span><\/li>\n<li aria-level=\"1\"><span>將賽伊蘭的盾牌<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031471.png\"/><\/span><span>(Sayram&#8217;s Shield)交給懷茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2040052.png\"/><\/span><span>(Wiz the Librarian)即可學會技能<\/span><\/li>\n<\/ol>\n<\/details>\n<hr/>\n<p><span>英雄：<\/span><span>格檔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121002.png\"/>(Power Stance)<\/span><span>黑騎：<\/span><span>格檔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121002.png\"/>(Power Stance)<\/span><span>聖騎：<\/span><span>格檔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121002.png\"/>(Power Stance)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>打倒地獄巴洛古<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8150000.png\"/>(Crimson Balrog)，取得地獄巴洛古的計畫書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04001111.png\"/><\/span><span>([Storybook] Crimson Balrog&#8217;s Proposal)。(或是去自由市場買一本也可以)<\/span><\/li>\n<li aria-level=\"1\"><span>將地獄巴洛古的計畫書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04001111.png\"/><\/span><span>([Storybook] Crimson Balrog&#8217;s Proposal)交給劍士四轉教官漢摩尼亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081100.png\"/><\/span><span>(Harmonia)，接下任務【The Plot to Kidnap Tylus!】他會要求玩家去找<\/span><span>史菲魯納<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2032001.png\"/><\/span><span>(Spiruna)<\/span><span>。<\/span><\/li>\n<li aria-level=\"1\"><span>到雲彩公園Ⅳ(Cloud Park IV)，找史菲魯納<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2032001.png\"/><\/span><span>(Spiruna)對話接下任務【Spiruna&#8217;s advice】，<\/span>他會要求玩家打倒白狼人<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8140000.png\"/>(Lycanthrope)，取得 白狼人的企劃書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031477.png\"/>(Lycanthrope&#8217;s Plans)。<\/li>\n<li aria-level=\"1\"><span>把白狼人的 企劃書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031477.png\"/><\/span><span>(Lycanthrope&#8217;s Plans)拿給漢摩尼亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081100.png\"/><\/span><span>(Harmonia)，而他會要求玩家去保護<\/span><span>泰勒斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/9300093.png\"/><\/span><span>(Tylus)<\/span><span>。<\/span><\/li>\n<\/ol>\n<ul>\n<li aria-level=\"1\"><span>到冰原雪域的長老會館裡找泰勒斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/9300093.png\"/><\/span><span>(Tylus)接下任務【Protecting Tylus】，組隊之後進入任務地圖【建議組滿人】。<\/span><\/li>\n<li aria-level=\"1\"><span>★任務地圖裡有大量巴洛古和白狼人，只要在時間內保護泰勒斯即可<\/span>\n<ul>\n<li aria-level=\"2\"><span>保護到剩下3分鐘，出現藍字提示就可以出去了<\/span><\/li>\n<li aria-level=\"2\"><span>如果保護到0秒時間時間到不出去，任務會失敗<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>★在此任務中，可撿到職業技能書，請開對應的職業去撿<\/span>\n<ul>\n<li aria-level=\"2\"><span>法師系-魔力無限<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/2121004.png\"/><\/span><span>(Infinity)<\/span><\/li>\n<li aria-level=\"2\"><span>弓手系-龍魂箭<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/02280005.png\"/> <\/span><span>(Dragon&#8217;s Breath)<\/span><\/li>\n<li aria-level=\"2\"><span>盜賊系-挑釁<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/4121003.png\"/><\/span><span>(Taunt)<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>保護泰勒斯任務完成後，可得到 泰勒斯的信任<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031495.png\"/><\/span><span>(Tylus&#8217;s Trust)。<\/span><\/li>\n<li aria-level=\"1\"><span>將 泰勒斯的信任<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031495.png\"/><\/span><span>(Tylus&#8217;s Trust)交給泰勒斯<\/span><span>可習得技能格檔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121002.png\"/><\/span><span>(Power Stance)<\/span><\/li>\n<\/ul>\n<\/details>\n<hr/>\n<p><span>英雄：<\/span><span>究極神盾<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1120005.png\"/>(Guardian)  <\/span><span>聖騎：<\/span><span>究極神盾<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1120005.png\"/>(Guardian)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>到神木村森林岔道中，找穆斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081009.png\"/><\/span><span>(Moose)接下任務【A Shield&#8217;s True Power】，他會給你一個120等練習用盾牌。<\/span>\n<ul>\n<li aria-level=\"2\"><span>必須要裝備120等 練習用盾牌後繼續對話會進入任務地圖。<\/span><\/li>\n<li aria-level=\"2\"><span>若在進入任務前未裝備練習用盾牌，則進入任務地圖會立即死亡。<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>需要在20分鐘內打倒200隻暗黑半人馬<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8140101.png\"/><\/span><span>(Black Kentaurus)。<\/span><\/li>\n<li aria-level=\"1\"><span>在限時中完成任務後，找穆斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081009.png\"/><\/span><span>(Moose)對話即可取得究極神盾(Guardian)、 LV120榮耀之盾<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/characters/01092042.png\"/><\/span><span>(Gellerhead Shield)。<\/span><\/li>\n<\/ol>\n<\/details>\n<hr/>\n<p><span>聖騎士：聖靈之劍<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1221003.png\"/><\/span><span>(Holy Charge: Sword)、聖靈之棍<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1221004.png\"/><\/span><span>(Divine Charge: Blunt Weapon)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>在神木村祭司之林裡，找到漢摩尼亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081100.png\"/><\/span><span>(Harmonia)對話接下任務神聖的騎士之劍【The Holy Knight&#8217;s Sword】。<\/span><\/li>\n<li aria-level=\"1\"><span>到水世界與探險隊長坦克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2060101.png\"/><\/span><span>(Taeng the Explorer)對話後，去蒐集 鯊魚假牙<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000180.png\"/><\/span><span>(Shark Denture)10個。<\/span>\n<ul>\n<li aria-level=\"2\"><span>探險隊長坦克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2060101.png\"/><\/span><span>(Taeng the Explorer)出現地點：水世界-受難船的墓地(The Grave of Wrecked Ship)船的破洞裡面<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>蒐集完畢後，回去找探險隊長坦克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2060101.png\"/><\/span><span>(Taeng the Explorer)接下任務【Whereabouts of the Grail】，他會給你一個 聖盃<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031454.png\"/><\/span><span>(Holy Cup)。<\/span><\/li>\n<li aria-level=\"1\"><span>拿到聖盃後，玩家到闇黑龍王洞穴入口的生命之泉，可盛得 生命聖水<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031455.png\"/><\/span><span>(Holy Water of Life)。<\/span>\n<ul>\n<li aria-level=\"2\"><span>註：想進入闇黑龍王的洞穴入口，可參考<\/span><a href=\"https://web.archive.org/web/20260413054046/https://mapleroyals.net/quest/ht-run\"><span>任務LV80龍的戰爭<\/span><\/a><span>。<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>取得生命聖水<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031455.png\"/><\/span><span>(Holy Water of Life)後，再到天空之城塔第8層，與雕像<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2030005.png\"/><\/span><span>(Statue)<\/span><span>對話即可完成任務。<\/span><\/li>\n<\/ol>\n<\/details>\n<hr/>\n<p><span>黑騎士：黑暗守護<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320009.png\"/><\/span><span>(Hex of the Beholder)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<ol>\n<li aria-level=\"1\"><span>在神木村-祭司之林找漢摩尼亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081100.png\"/><\/span><span>(Harmonia)接任務，他會要求玩家到玩具城找福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/><\/span><span>(Flo)對話。<\/span><\/li>\n<li aria-level=\"1\"><span>找到<\/span><span>福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/><\/span><span>(Flo)<\/span><span>後，他會要求玩家蒐集 靈魂魔法陣<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031474.png\"/><\/span><span>(Soul Contract)1個。<\/span><\/li>\n<\/ol>\n<ul>\n<li>\n<ul>\n<li><span>通道守門人<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8160000.png\"/><\/span> <span>(Gatekeeper)掉落<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<ol>\n<li aria-level=\"1\"><span>取得 靈魂魔法陣<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031474.png\"/><\/span><span>(Soul Contract)後，找<\/span><span>(Flo)對話即可完成任務，習得技能 LV5黑暗守護<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320009.png\"/><\/span><span>(Hex of the Beholder) 。<\/span><\/li>\n<li aria-level=\"1\"><span>繼續與<\/span><span>福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/><\/span><span>(Flo)<\/span><span>對話，蒐集維京的帆布<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000134.png\"/><\/span><span>(Viking Sail)200個後回報任務可將黑暗守護<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320009.png\"/><\/span><span>(Hex of the Beholder)提升至15級。<\/span><\/li>\n<li aria-level=\"1\"><span>繼續與<\/span><span>福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/><\/span><span>(Flo)<\/span><span>對話，蒐集維京的帆布<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000134.png\"/><\/span><span>(Viking Sail)500個後回報任務可將黑暗守護<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320009.png\"/><\/span><span>(Hex of the Beholder)提升至25級。<\/span><\/li>\n<\/ol>\n<ul>\n<li>\n<ul>\n<li>\n<ul>\n<li aria-level=\"1\"><span>維京的帆布<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000134.png\"/><\/span><span>(Viking Sail)為<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8141000.png\"/>Spirit Viking掉落<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/details>\n<hr/>\n<p><span>黑騎士：闇靈治癒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320008.png\"/><\/span><span>(Aura of the Beholder)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<ol>\n<li aria-level=\"1\"><span>在神木村-祭司之林找漢摩尼亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081100.png\"/><\/span><span>(Harmonia)接任務【The Forgotten Healing Power】，他會要求玩家到玩具城找時間通道(Path of Time)的<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/><\/span><span>(Mr. Bouffon)對話。<\/span><\/li>\n<li aria-level=\"1\"><span>找到<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/><\/span><span>(Mr. Bouffon)後，他會要求玩家蒐集 靈魂的合約書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031453.png\"/><\/span><span>(Magical Array of the Spirit)1個<\/span>\n<ul>\n<li aria-level=\"2\"><span> <img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8170000.png\"/><\/span><span>(Thanatos)掉落<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>取得靈魂的合約書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031453.png\"/><\/span><span>(Magical Array of the Spirit)後，找<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/><\/span><span>(Mr. Bouffon)對話即可完成任務，並習得技能 LV5闇靈治癒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320008.png\"/><\/span><span>(Aura of the Beholder)。<\/span><\/li>\n<li aria-level=\"1\"><span>繼續與<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/><\/span><span>(Mr. Bouffon)對話，蒐集 <img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000148.png\"/><\/span><span>(Binding Bridle)200個後回報任務可將 闇靈治癒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320008.png\"/><\/span><span>(Aura of the Beholder)提升至15級。<\/span><\/li>\n<li aria-level=\"1\"><span>繼續與<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041021.png\"/><\/span><span>(Mr. Bouffon)對話，蒐集<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000148.png\"/> <\/span><span>(Binding Bridle)500個後回報任務可將 闇靈治癒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320008.png\"/><\/span><span>(Aura of the Beholder)提升至25級<\/span><\/li>\n<\/ol>\n<ul>\n<li>\n<ul>\n<li><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000148.png\"/>Binding Bridle掉落來自於<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/7130300.png\"/><\/span><span>(Master Death Teddy)<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/details>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-magician", "cat": "前置任務", "title": "技能前置任務－法師", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413051801/https://mapleroyals.net/%E8%81%B7%E6%A5%AD%E9%81%B8%E6%93%87/%E6%8A%80%E8%83%BD%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E6%B3%95%E5%B8%AB", "html": "<p><span>魔力無限<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121004.png\"/>(Infinity)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>前往冰原雪域的長老會館，帶一名隊長是四轉戰士，且可以與泰勒斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9300093.png\"/><\/span><span>(Tylus)接下任務【Protecting Tylus】，組隊之後進入。<\/span><\/li>\n<li aria-level=\"1\"><span>★任務地圖裡有大量巴洛古和白狼人，開始打怪等待技能書掉落，裡面有這三種書<\/span>\n<ul>\n<li aria-level=\"2\"><span>法師系-魔力無限<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121004.png\"/><\/span><span>(Infinity)<\/span><\/li>\n<li aria-level=\"2\"><span>弓手系-龍魂箭<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/02280005.png\"/> <\/span><span>(Dragon&#8217;s Breath)<\/span><\/li>\n<li aria-level=\"2\"><span>盜賊系-挑釁<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/4121003.png\"/><\/span><span>(Taunt)<\/span><\/li>\n<li aria-level=\"2\"><\/details><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<hr/>\n<p><span>天使之箭<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/02280009.png\"/>(Angel Ray)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<p><span>打炎魔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8800000.png\"/>(Zakum)<\/span><span>會掉<\/span><\/p>\n<p><span>(不可交易)<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>召喚神龍<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2321003.png\"/><\/span><span>(Bahamut)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>往神木村後半段找騎士拉烏爾<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2081007.png\"/><\/span><span>(Raul the Knight)<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>接下任務【The Dragon&#8217;s Guardian】，然後收集龍之心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031449.png\"/><\/span><span>(Dragon Heart)X20個<\/span><\/li>\n<li aria-level=\"1\"><span>續接任務【Bahamut&#8217;s Power 1】，然後收集龍之心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031449.png\"/><\/span><span>(Dragon Heart)X25個<\/span><\/li>\n<li aria-level=\"1\"><span>續接任務【Bahamut&#8217;s Power 2】，然後收集龍之心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031449.png\"/><\/span><span>(Dragon Heart)X30個<\/span><\/li>\n<li aria-level=\"1\"><span>續接任務【Bahamut&#8217;s Power 3】，然後收集龍之心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031449.png\"/><\/span><span>(Dragon Heart)X35個<\/span><\/li>\n<\/ul>\n<p><span>註：每一個任務的龍之心是不同的東西，收集滿就要立即回報<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>復甦之光<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2321006.png\"/>(Resurrection)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>需要帶著黑皮書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001107.png\"/><\/span><span>([Storybook]Black book)接任務<\/span><\/p>\n<p><span>以下怪物會掉落：<\/span><\/p>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/5130107.png\"/>Coolie Zombie<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8142000.png\"/><\/span><span>Phantom Watch<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8143000.png\"/><\/span><span>Grim Phantom Watch<\/span><\/p>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8170000.png\"/>Thanatos<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9420512.png\"/><\/span><span>Mr. Anchor<\/span><\/p>\n<p><span>或是CKWPQ箱子中得到或者是去自由市場買一本<\/span><\/p>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>找四轉教官<\/span><span>Gritto<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2081200.png\"/>接下任務【Black Book】<\/span><\/li>\n<li aria-level=\"1\"><span>帶著以下掉寶前往水世界找<\/span><span>Carta<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2060100.png\"/>接任務【Method of Contradiction】<\/span>\n<ul>\n<li aria-level=\"2\"><span> Ice Piece<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000150.png\"/> X100個 (來自於<\/span><span>Grim Phantom Watches)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8143000.png\"/><\/span><\/li>\n<li aria-level=\"2\"><span>Firebomb Flame<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000081.png\"/> X50個(來自於<\/span><span>Firebomb) <img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/5100002.png\"/><\/span><\/li>\n<li aria-level=\"2\"><span> Charm of the Undead<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000008.png\"/>X5個(來自於<\/span><span>Zombie Mushrooms)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/2230101.png\"/><\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>回報後獲得<\/span><span>Cold Flame<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001108.png\"/>，前往地圖Dangerous Sea Gorge II，進入隱藏洞穴，把書<\/span><span>跟石頭<\/span><span>兩個任務掉寶丟進鍋子裡，然後跟<\/span><span>Carta<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2060100.png\"/>回報任務<\/span><\/li>\n<li aria-level=\"1\"><span>前往奇幻村(Sleepywood)找記憶者<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/1061011.png\"/><\/span><span>(The Rememberer)接下任務【Resurrection】<\/span><\/li>\n<li aria-level=\"1\"><span>前往玩具城(】Ludibrium)中的遺忘通道(Forgotten Passage)地圖，進入隱藏門中挑戰忍耐關卡。<\/span><\/li>\n<\/ol>\n<ol>\n<li aria-level=\"1\"><span>忍耐跳完之後跟記憶者<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/1061011.png\"/><\/span><span>(The Rememberer)回報任務，取得技能。<\/span><\/li>\n<li aria-level=\"1\"><\/details><\/li>\n<\/ol>\n<hr/>\n<p><span>炎靈地獄<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121003.png\"/>(Fire Demon)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>需要帶著燃燒的火焰之書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04161015.png\"/><\/span><span>([Storybook] Burning Book of Fire)接任務，可從紅色半人馬<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8140102.png\"/><\/span><span>(Red Kentaurus)或是CWKPQ箱子中得到，或是在自由市場買一本<\/span><\/p>\n<p><span>任務流程：<\/span><\/p>\n<p><span>帶著燃燒的火焰之書<\/span><span>([Storybook] Burning Book of Fire)找四轉教官格里特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2081200.png\"/><\/span><span>(Gritto)接下任務【A Book of Fire】，<\/span><\/p>\n<p><span>前往魔法森林(Ellinia)與漢斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9001001.png\"/><\/span><span>(Grendel the Really Old)接下任務【A Mysterious Sentence】<\/span><\/p>\n<p><span>前往冰原雪城-長老官邸與三轉教官羅貝亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020009.png\"/>(Robeira)對話<\/span><\/p>\n<p><span>前往炎魔祭壇入口，與阿杜比斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030008.png\"/><\/span><span>(Adobis)對話，要求交付強化玻璃瓶<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001109.png\"/><\/span><span>(Hardened Glass Bottle)。<\/span><\/p>\n<p><span>接著來到冰原雪集找NPC柏堅<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020000.png\"/><\/span><span>(Vogen)接下任務【The Lava Mug】，製作強化玻璃瓶<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001109.png\"/><\/span><span>(Hardened Glass Bottle)，柏堅要求收集<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>鑽石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04021007.png\"/>(Diamond)X2<\/span><\/li>\n<li aria-level=\"1\"><span>火精靈的火石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000081.png\"/>(Firebomb Flame)X30<\/span><\/li>\n<li aria-level=\"1\"><span>星石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04021009.png\"/>(Star Rock)X1<\/span><\/li>\n<\/ul>\n<p><span>交付後獲得強化玻璃瓶<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001109.png\"/><\/span><span>(Hardened Glass Bottle)。<\/span><\/p>\n<p><span>前往炎魔祭壇入口，與阿杜比斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030008.png\"/><\/span><span>(Adobis)對話進入任務地圖，到達地圖最右方，把強化玻璃瓶<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001109.png\"/><\/span><span>(Hardened Glass Bottle)丟到火堆上方，就會出現熔炎瓶，使用後習得技能。<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>召喚冰魔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121005.png\"/>(Elquines)【註：需已習得炎靈地獄<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121003.png\"/>(Fire Demon)】<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>前往冰原市集與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\"/><\/span><span>(Alcaster)接受任務接下任務【The End of Attributes&#8230;?】，要求收集<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>鯊魚的魚翅<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000181.png\"/>(Frozen Shark&#8217;s Fin) x 30<\/span><\/li>\n<li aria-level=\"1\"><span>怨靈女巫的冰塊<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000150.png\"/>(Ice Piece) x 40<\/span><\/li>\n<li aria-level=\"1\"><span>冰龍的背骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000185.png\"/>(Ice Backbone) x 30，<\/span><\/li>\n<\/ul>\n<p><span>接著與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\"/><\/span><span>(Alcaster)對話續接任務【Inverse Attributes】<\/span><\/p>\n<p><span>前往天空之城塔10樓找豪克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030012.png\"/><\/span><span>(Huckle)製作靈魂袋任務【Huckle&#8217;s Spirit Pouch】，豪克並要求與秀茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2012017.png\"/><\/span><span>(Hughes the Fuse)對話製作召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031451.png\"/>(Summoning Frame)。<\/span><\/p>\n<p><span>製作材料：<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>發條熊的幽靈<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000144.png\"/>(Free Spirit) x 50<\/span><\/li>\n<li aria-level=\"1\"><span>召喚石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04006001.png\"/>(The Summoning Rock) x 30<\/span><\/li>\n<li aria-level=\"1\"><span>邪惡鐘心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000146.png\"/>(Evil Spirit) x 50<\/span><\/li>\n<li aria-level=\"1\"><span>束縛枷鎖<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000148.png\"/>(Binding Bridle) x 30<\/span><\/li>\n<\/ul>\n<p><span>收集完成後取得靈魂袋<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031468.png\"/><\/span><span>(Soul Pouch)。<\/span><\/p>\n<p><span>與秀茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2012017.png\"/><\/span><span>(Hughes the Fuse)對話接下任務【Theory on Inverse Attributes of Summoned Beings】，然後交出<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>靈魂袋<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031468.png\"/>(Soul Pouch)<\/span><\/li>\n<li aria-level=\"1\"><span>紫礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011005.png\"/>(Orihalcon Plate)X10<\/span><\/li>\n<li aria-level=\"1\"><span>朱礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011003.png\"/>(Adamantium Plate)X5<\/span><\/li>\n<li aria-level=\"1\"><span>鋰礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011002.png\"/>(Mithril Plate)X5，<\/span><\/li>\n<\/ul>\n<p><span>獲得召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031451.png\"/><\/span><span>(Summoning Frame)。<\/span><\/p>\n<p><span>與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\"/><\/span><span>(Alcaster)對話交付召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031451.png\"/><\/span><span>(Summoning Frame)後接下任務【Switching Attributes】，<\/span><\/p>\n<p><span>要求前往時間通道找NPC-福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/><\/span><span>(Flo)接下任務【Key to a Different World】，打敗通道守門人<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8160000.png\"/><\/span><span>(Gatekeeper)獲得異界鑰匙<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031473.png\"/><\/span><span>(Key to the Other World)交給福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/><\/span><span>(Flo)之後與魔導士組隊後進入任務地圖打敗怪物取得冰靈石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031470.png\"/><\/span><span>(Icy Soul Rock)，交給福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/>(Flo)。<\/span><\/p>\n<p><span>回到冰原雪集與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\"/><\/span><span>(Alcaster)對話習得技能。<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>寒冰地獄<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2221003.png\"/>(Ice Demon)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>需要帶著急凍寒冰之書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04161016.png\"/><\/span><span>([Storybook] Frozen Book of Ice)接任務，可從藍色半人馬<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8140103.png\"/><\/span><span>(Blue Kentaurus)或是CWKPQ箱子中得到，或是在自由市場買一本<\/span><\/p>\n<p><span>任務流程：<\/span><\/p>\n<p><span>帶著急凍寒冰之書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04161016.png\"/><\/span><span>([Storybook] Frozen Book of Ice)找四轉教官格里特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2081200.png\"/><\/span><span>(Gritto)接下任務【The Book of Ice】<\/span><\/p>\n<p><span>前往魔法森林(Ellinia)與漢斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9001001.png\"/><\/span><span>(Grendel the Really Old)接下任務【A Mysterious Sentence】<\/span><\/p>\n<p><span>前往冰原雪城-長老官邸與三轉教官羅貝亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020009.png\"/>(Robeira)<\/span><span>對話<\/span><\/p>\n<p><span>搭黑色計程車往上面爬，會找到傑夫<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030000.png\"/><\/span><span>(Jeff)對話<\/span><\/p>\n<p><span>接著來到冰原雪集找NPC柏堅<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020000.png\"/><\/span><span>(Vogen)接下任務【The Ultimate Icepick】製作破冰之鎚<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/02280011.png\"/><\/span><span>(Ancient Ice Powder)，柏堅要求收集：<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011005.png\"/>Orihalcon Plate x 2<\/span><\/li>\n<li aria-level=\"1\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000150.png\"/>Ice Piece x 30<\/span><\/li>\n<li aria-level=\"1\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011007.png\"/>Moon Rock x 1<\/span><\/li>\n<\/ul>\n<p><span>交付後獲得破冰之鎚<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/02280011.png\"/><\/span><span>(Ancient Ice Powder)&lt;&lt;&lt;(應該叫遠古冰粉，誰叫台服這樣稱呼)<\/span><\/p>\n<p><span>然後找傑夫<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030000.png\"/>(Jeff)對話<\/span><span>選擇第一張地圖進入，跟冰塊對話獲得道具，使用後習得技能。<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>召喚火炎神<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2221005.png\"/>(Ifrit) 【註：<\/span><span>需已習得<\/span><span>寒冰地獄<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2221003.png\"/>(Ice Demon)】<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>前往冰原市集與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\"/><\/span><span>(Alcaster)接下任務【End of Attributes】，要求收集：<\/span><\/p>\n<ul>\n<li><span>火精靈的火石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000081.png\"/>(Firebomb Flame) x 50<\/span><\/li>\n<li><span>火焰半人馬的火花<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04000232.png\"/>(Kentaurus&#8217;s Flame) x 10<\/span><\/li>\n<li><span>血腥哈維的火花羽毛<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04000240.png\"/>(Small Flaming Feather) x 10<\/span><\/li>\n<\/ul>\n<p><span>接著與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\"/><\/span><span>(Alcaster)對話後續接任務【Inverse Attributes】<\/span><\/p>\n<p><span>前往天空之城塔10樓找豪克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030012.png\"/><\/span><span>(Huckle)製作靈魂袋任務【Huckle&#8217;s Spirit Pouch】，豪克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030012.png\"/>(Huckle)並要求與秀茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2012017.png\"/><\/span><span>(Hughes the Fuse)對話製作召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031497.png\"/>(Summoning Frame)。<\/span><\/p>\n<p><span>製作材料：<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>發條熊的幽靈<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000144.png\"/>(Free Spirit) x 50<\/span><\/li>\n<li aria-level=\"1\"><span>召喚石(The Summoning Rock) <img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04006001.png\"/>x 30<\/span><\/li>\n<li aria-level=\"1\"><span>邪惡鐘心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000146.png\"/>(Evil Spirit) x 50<\/span><\/li>\n<li aria-level=\"1\"><span>束縛枷鎖(<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000148.png\"/>Binding Bridle) x 30<\/span><\/li>\n<\/ul>\n<p><span>收集完成後取得靈魂袋<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031468.png\"/><\/span><span>(Soul Pouch)。<\/span><\/p>\n<p><span>與秀茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2012017.png\"/><\/span><span>(Hughes the Fuse)對話接下任務【Theory on Inverse Attributes of Summoned Beings】，然後交出<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>靈魂袋<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031468.png\"/>(Soul Pouch)<\/span><\/li>\n<li aria-level=\"1\"><span>紫礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011005.png\"/>(Orihalcon Plate)X10<\/span><\/li>\n<li aria-level=\"1\"><span>朱礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011003.png\"/>(Adamantium Plate)X5<\/span><\/li>\n<li aria-level=\"1\"><span>鋰礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011002.png\"/>(Mithril Plate)X5，<\/span><\/li>\n<\/ul>\n<p><span>獲得召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031497.png\"/><\/span><span>(Summoning Frame)。<\/span><\/p>\n<p><span>與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\"/><\/span><span>(Alcaster)對話交付召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031497.png\"/><\/span><span>(Summoning Frame)後接下任務【Switching Attributes】，<\/span><\/p>\n<p><span>前往時間通道找NPC-福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/><\/span><span>(Flo)接下任務【Key to a Different World】，打敗通道守門人<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8160000.png\"/><\/span><span>(Gatekeeper)獲得異界鑰匙<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031473.png\"/><\/span><span>(Key to the Other World)交給福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/><\/span><span>(Flo)之後與魔導士組隊後進入任務地圖打敗怪物取得火靈石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031469.png\"/><\/span><span>(Fire Soul Rock)，交給福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\"/><\/span><span>(Flo)。<\/span><\/p>\n<p><span>回到冰原雪集與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\"/><\/span><span>(Alcaster)對話，習得技能。<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>天怒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2321008.png\"/>(Genesis)  <\/span><span>暴風雪<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2221007.png\"/>(Blizzard)  <\/span><span>火流星<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121007.png\"/>(Meteor Shower)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>皆需先解過前置任務：邪魔斯的過去<\/span><\/p>\n<p><span>先前往長老官邸與三轉教官羅貝亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020009.png\"/>(Robeira)<\/span><span>對話<\/span><\/p>\n<p><span>要求玩家探訪玩具城圖書館管理員<\/span><span>懷茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2040052.png\"/><\/span><span>(Wiz the Librarian)<\/span><span>對話<\/span><\/p>\n<p><span>再來與漢斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9001001.png\"/><\/span><span>(Grendel the Really Old)對話<\/span><\/p>\n<p><span>再來與邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\"/><\/span><span>(Shammos)對話<\/span><\/p>\n<p><span>再來與漢斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9001001.png\"/><\/span><span>(Grendel the Really Old)對話)<\/span><\/p>\n<p><span>再來與邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\"/><\/span><span>(Shammos)對話，然後跟羅貝亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020009.png\"/>(Robeira)<\/span><span>對話<\/span><\/p>\n<p><span>最後跟邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\"/><\/span><span>(Shammos)對話<\/span><\/p>\n<ul>\n<li><span>主教路線：前往神木村，在HTPQ龍王前置任務中最後一關打到生命之根<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031461.png\"/><\/span><span>(Life Root)，交給邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\"/><\/span><span>(Shammos)後習得技能-天怒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2321008.png\"/>(Genesis)<\/span><\/li>\n<li><span>火毒路線：準備一顆火焰之眼<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001017.png\"/><\/span><span>(Eye of Fire)交給<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\"/>邪魔斯<\/span><span>(Shammos)後習得技能：火流星<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121007.png\"/>(Meteor Shower)<\/span><\/li>\n<li><span>冰雷路線：前往狼人領土III/IV，收集白狼人之心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031460.png\"/><\/span><span>(Cold Heart of a Wolf)。交給邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\"/><\/span><span>(Shammos)後習得技能-暴風雪<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2221007.png\"/>(Blizzard)<\/span><\/li>\n<\/ul>\n<\/details>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-bowman", "cat": "前置任務", "title": "技能前置任務－弓箭手", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517175019/https://mapleroyals.net/%E8%81%B7%E6%A5%AD%E9%81%B8%E6%93%87/%E6%8A%80%E8%83%BD%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E5%BC%93%E7%AE%AD%E6%89%8B", "html": "<p><span>箭神(BowMaster)：龍魂箭 <img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/02280005.png\"/><\/span><span>(Dragon&#8217;s Breath)   <\/span><span>神射手(Marksman)：龍魂箭 <img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/02280005.png\"/><\/span><span>(Dragon&#8217;s Breath)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>前往冰原雪域的長老會館，帶一名隊長是四轉戰士，且可以與泰勒斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/9300093.png\"/><\/span><span>(Tylus)接下任務【Protecting Tylus】，組隊之後進入。<\/span><\/li>\n<li aria-level=\"1\"><span>★任務地圖裡有大量巴洛古和白狼人，開始打怪等待技能書掉落，裡面有這三種書<\/span>\n<ul>\n<li aria-level=\"2\"><span>法師系-魔力無限<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/2121004.png\"/><\/span><span>(Infinity)<\/span><\/li>\n<li aria-level=\"2\"><span>弓手系-龍魂箭<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/02280005.png\"/> <\/span><span>(Dragon&#8217;s Breath)<\/span><\/li>\n<li aria-level=\"2\"><span>盜賊系-挑釁<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/4121003.png\"/><\/span><span>(Taunt)<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/details>\n<hr/>\n<p><span>箭神(BowMaster)：<\/span><span>暴風神射<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121004.png\"/><\/span><span>(Hurricane)   <\/span><span>神射手(Marksman)：<\/span><span>光速神弩<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221001.png\"/><\/span><span>(Piercing Arrow)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>LV120四轉完成後與神木村-祭司之林的瑞吉爾<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2081300.png\"/><\/span><span>(Legor)對話接下任務【The Bowman&#8217;s Inner Eye】後，接著打三種顏色半人馬都會掉落的任務掉寶：赫莉娜的舊手套<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://maplelegends.com/static/images/lib/item/04031465.png\"/><\/span><span>(Helena&#8217;s Old Gloves)(任務接受後掉落)。<\/span><\/p>\n<p><span>把赫莉娜的舊手套<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://maplelegends.com/static/images/lib/item/04031465.png\"/><\/span><span>(Helena&#8217;s Old Gloves)交給赫麗娜<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1012100.png\"/><\/span><span>(Athena Pierce)，完成任務，<\/span><\/p>\n<p><span>箭神(BowMaster)學會<\/span><span>暴風神射<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121004.png\"/><\/span><span>(Hurricane)<\/span><\/p>\n<p><span>神射手(Marksman)學會<\/span><span>光速神弩<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221001.png\"/><\/span><span>(Piercing Arrow)<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>箭神(BowMaster)：<\/span><span>念力集中<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121008.png\"/><\/span><span>(Concentrate)   <\/span><span>神射手(Marksman)：<\/span><span>必殺狙擊<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221007.png\"/><\/span><span>(Snipe)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<p><span>首先身上要持有綠皮書<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04161018.png\"/><\/span><span>[Storybook] Ancient Book，這兩種怪物會掉<\/span><\/p>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/8150100.png\"/>(Shark )<img decoding=\"async\" src=\"htt
