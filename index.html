<script id="data" type="application/json">[{"slug": "babywell", "cat": "規則", "title": "乖寶寶題庫（Safe Adventures 題庫）", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413054137/https://mapleroyals.net/61990/babywell", "html": "<p>原文來自於<\/p>\n<p><a href=\"https://web.archive.org/web/20260413054137/https://royals.ms/forum/threads/shanks-的安全冒險-safe-adventures.225588/\">https://royals.ms/forum/threads/shanks-的安全冒險-safe-adventures.225588/<\/a><\/p>\n<p>另外真的很怕玩家一出島就出事，可以的話順便看一下本站的其他文章<\/p>\n<p>像是<\/p>\n<ul>\n<li><a href=\"https://web.archive.org/web/20260413054137/https://mapleroyals.net/noobs-guides/game-terms-conditions\">遊戲條款及細則<\/a><\/li>\n<li><a href=\"https://web.archive.org/web/20260413054137/https://mapleroyals.net/%e8%ab%96%e5%a3%87%e8%b2%b7%e8%b3%a3%e6%96%87%e7%9a%84%e6%b3%a8%e6%84%8f%e4%ba%8b%e9%a0%85\">論壇買賣文的注意事項<\/a><\/li>\n<li><a href=\"https://web.archive.org/web/20260413054137/https://mapleroyals.net/%e5%b8%b8%e8%a6%8b%e7%9a%84%e9%81%95%e8%a6%8f%e8%a1%8c%e7%82%ba-%e9%bb%91%e5%90%8d%e5%96%ae%e8%a1%8c%e7%82%ba\">常見的違規行為/黑名單行為<\/a><\/li>\n<\/ul>\n<p><del>這個任務基本上就是為了讓玩家出事的時候無話可說<\/del><\/p>\n<p>Ctrl+F搜尋關鍵字就可以了，總共出七道題目<\/p>\n<hr/>\n<p>Q1（英文）: A friend or family member has said that you can use their account(s). Are you allowed to do so?<br>\n問1（中文）: 朋友或家人表示您可以使用他們的帳戶。 你可以這樣做嗎？<br>\nA1（英文）: No, using their account(s) gives me an unfair advantage, and I should never do it. I am only allowed to play on my own accounts.<br>\n答1（中文）: 不，使用他們的帳戶會讓我獲得不公平的優勢，我永遠不應該這樣做，我只能用自己的帳號玩遊戲。<\/p>\n<p>Q2（英文）: Are you allowed to search for a player&#8217;s personal information on the internet without their consent, and post the information either in game or on the forum?<br>\n問2（中文）: 是否可以在未經玩家同意的情況下在互聯網上搜索玩家的個人信息，並將這些信息發佈在遊戲中或論壇上？<br>\nA2（英文）: No, that would be considered doxing and is an invasion of their privacy.<br>\n答2（中文）: 不，這將被視為人肉搜索，並侵犯了他們的隱私。<\/p>\n<p>Q3（英文）: Are you allowed to launch multiple clients on your computer to access your accounts?<br>\n問3（中文）: 您是否可以在電腦上啟動多個用戶端來登入您的帳戶？<br>\nA3（英文）: Yes, I am allowed to launch multiple clients.<br>\n答3（中文）: 是的，我可以啟動多個客戶端。<\/p>\n<p>Q4（英文）: Are you allowed to make any remark that could be perceived as derogatory or otherwise prejudiced towards any group of people based on their race, sex, gender, life choices, or any other division?<br>\n問4（中文）: 您是否可以根據種族、性別、生活選擇或任何其他分歧發表任何可能被視為對任何群體的貶損或偏見的言論？<br>\nA4（英文）: No, that would be considered vulgar/hate speech<br>\n答4（中文）: 不，這會被視為粗俗/仇恨言論<\/p>\n<p>Q5（英文）: Can you watch a TV show or video while playing MapleRoyals?<br>\n問5（中文）: 您可以在玩 MapleRoyals 時觀看電視節目或影片嗎？<br>\nA5（英文）: Yes, as long as I am still attentive and reply to messages directed at me, or if I&#8217;m AFK-ing.<br>\n答5（中文）: 是的，只要我仍然留意並回覆針對我的訊息，或者我正在 AFK。<\/p>\n<p>Q6（英文）: Certain actions may get repetitive; such as when you are selling leech. Are you allowed to program a script, or download an existing one off the internet to automatically control your character?<br>\n問6（中文）: 遊戲中會有一些重複性的動作，例如當你在賣練等服務（leech）時。你是否可以編寫腳本或從網路上下載腳本來自動操控你的角色？<br>\nA6（英文）: No, that falls under Macrobotting. a more serious form of botting that is equivalent to hacking.<br>\n答6（中文）: 不，這屬於腳本機器人，是一種較為嚴重的機器人行為，相當於外掛（hacking）。<\/p>\n<p>Q7（英文）: Given a scenario where you are unfortunately permanently banned from MapleRoyals for a valid reason, and your ban appeal has been denied. Are you allowed to create a new account and continue playing?<br>\n問7（中文）: 假設您不幸因正當理由被 MapleRoyals 永久封號，並且您的禁制上訴（Ban Appeal）已被拒絕。 您可以建立一個新帳戶並繼續玩遊戲嗎？<br>\nA7（英文）: No, that falls under Ban Evasion and my account (s) would eventually be banned.<br>\n答7（中文）: 不，這屬於逃避封鎖，我的新帳戶遲早也會被封號。<\/p>\n<p>Q8（英文）: How often are you allowed to vote for NX each day on Gtop100.com?<br>\n問8（中文）: 您每天可以在 Gtop100.com 上為 NX 投票多少次？<br>\nA8（英文）: Only one time.<br>\n答8（中文）: 只有一次。<\/p>\n<p>Q9（英文）: If another player is harassing you with explicit, vulgar, or offensive language or content, what should you do?<br>\n問9（中文）: 如果其他玩家使用露骨、粗俗或冒犯性的語言或內容騷擾您，該怎麼做？<br>\nA9（英文）: I will capture a video, or screenshot, and report it on the Forum under &#8216;Report Abuse&#8217;.<br>\n答9（中文）: 我將錄製視頻或截圖，並在論壇上的 Report Abuse （報告濫用行為）下進行報告。<\/p>\n<p>Q10（英文）: If there&#8217;s more than one person in your household playing MapleRoyals, what must you all do in order to all vote each day?<br>\n問10（中文）: 如果您家裡有不只一個人玩 MapleRoyals，那麼您們必須做什麼才能每天一起投票？<br>\nA10（英文）: Apply for the whitelist on the forum and until it is approved, only one player will vote each day.<br>\n答10（中文）: 在論壇上申請白名單，在獲得批准之前，每天只有其中一名玩家可以投票。<\/p>\n<p>Q11（英文）: If you come across a bug, or a glitch that gives you an unfair advantage while playing MapleRoyals, what should you do?<br>\n問11（中文）: 如果你在玩 Mapleroyals 時遇到任何錯誤（bug/glitch），並得以從中獲得不公平的好處，你應該怎麼做？<br>\nA11（英文）: I will visit the &#8216;Bug Report&#8217; section on the forum, and report it there.<br>\n答11（中文）: 我會瀏覽論壇上的「錯誤回報」 Bug Report 版面，然後在那裡回報問題。<\/p>\n<p>Q12（英文）: MapleRoyals is constantly updating and the new patches can be downloaded from the website in order to enjoy non-disrupted gameplay. Are you allowed to play on outdated, modified, or any other game files than those provided on the Download Page directly by MapleRoyals?<br>\n問12（中文）: Mapleroyals 持續地進行更新，你可以從網站下載新補丁以維持正常的遊戲體驗。你是否可以使用未更新的、被修改過的或者在 Mapleroyals 下載頁面所提供的檔案以外的遊戲檔案來進行遊戲？<br>\nA12（英文）: No, as playing the game using improper files may cause disrupted gameplay for myself and other players.<br>\n答12（中文）: 不可以，使用不正確的檔案玩遊戲可能會導致我自己和其他玩家的遊戲出問題。<\/p>\n<p>Q13（英文）: Players collect fame for multiple reasons. Assume you encounter someone whom you dislike because of something they did. Is it appropriate for you to defame them?<br>\n問13（中文）: 玩家收集名聲（fame）的原因有很多。假設你因為某個人的所做所為而不喜歡他，降低他的名聲（defame）是恰當的行為嗎？<br>\nA13（英文）: Yes, so long as I do not mass defame and/or engage other players to mass defame the player on my behalf.<br>\n答13（中文）: 是的，只要我不大規模的降低名聲（mass defame）或唆使／引誘其他玩家代我大規模降低該玩家的名聲。<\/p>\n<p>Q14（英文）: When is it permitted to put a weight on your keyboard to perform actions while not at your computer?<br>\n問14（中文）: 在甚麼情況下，你可以在鍵盤上放上重物執行操作，然後離開你的電腦？<br>\nA14（英文）: It is never okay, I should always be playing my character myself.<br>\n答14（中文）: 任何情況都不行，我應該自己操縱角色。<\/p>\n<p>Q15（英文）: Whether you have encountered an item you wish to purchase, but do not have enough mesos for, or are quitting MapleRoyals and want to earn some money by selling your equipment. Are you allowed to buy and/or sell the item(s) using real money?<br>\n問15（中文）: 假設你遇到一件你想購買的物品，但沒有足夠的遊戲金幣（meso），或者你要退出 Mapleroyals 了，並打算出售你的裝備來賺一點錢。不論何種情況，你是否可以使用真實貨幣購買和/或出售物品？<br>\nA15（英文）: No, Real World Trading is unfair, detrimental to the market, and is not allowed.<br>\n答15（中文）: 不行，現實世界交易（RWT, Real World Trading）對遊戲市場有害，是不公平的，因此不被允許。<\/p>\n<p>Q16（英文）: You see a player acting suspiciously; such as looting items from afar or attacking out-of-reach monsters around the map, are you allowed to loot the items dropped by those monsters?<br>\n問16（中文）: 你看到一名玩家行為可疑，例如從遠處撿取物品或者攻擊地圖各處超出攻擊範圍的怪物，你是否可以撿取那些怪物掉落的物品？<br>\nA16（英文）: No, because reaping benefits from a hacker is not allowed.<br>\n答16（中文）: 不可以，因為從駭客身上獲取利益是不被允許的。<\/p>\n<p>Q17（英文）: Have you clearly read and understood the rules of MapleRoyals? Do you understand the punishments that would be imposed if you are caught breaking the rules?<br>\n問17（中文）: 您是否清楚地閱讀並理解了 MapleRoyals 的規則？ 你知道如果你違反規則被發現會受到怎樣的懲罰嗎？<br>\nA17（英文）: Yes<br>\n答17（中文）: 是的<\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "job-2nd", "cat": "轉職", "title": "二轉流程", "ts": "2026-06-10", "wb": "https://web.archive.org/web/20260610121938/https://mapleroyals.net/noobs-guides/job-advancement/2nd-job-advancement", "html": "<div class=\"jspContainer\">\n<div class=\"jspPane\">\n<div id=\"bulletin\">\n<p><strong>法師二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數需使用完畢 / 已轉職成為法師的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 魔法森林 / 魔法圖書館 / 找NPC漢斯   取得轉職任務，並到魔法森林北部找(地圖最頂端)NPC法師轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後，回魔法圖書館找漢斯即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。(建議紅、藍水帶多點)<\/p>\n<\/div>\n<\/div>\n<p align=\"LEFT\">【僧侶 – Cleric】【冰雷  – Icer/Lighting】【火毒 – Fire/Posion】<\/p>\n<\/div>\n<div class=\"jspContainer\">\n<hr/>\n<\/div>\n<div class=\"jspContainer\">\n<div class=\"jspPane\">\n<div id=\"bulletin\">\n<p align=\"LEFT\"><strong>劍士二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數需使用完畢 / 已轉職成為劍士的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 勇士之村 / 勇者聖殿 / 找NPC武術教練   取得轉職任務，並到西部岩山IV找NPC戰士轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後回勇者聖殿找武術教練即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<p align=\"LEFT\">【狂戰士 –  Fighter】【槍騎兵  –  Spearman】【見習騎士  – Page】<\/p>\n<hr/>\n<p align=\"LEFT\"><strong>盜賊二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前(含)獲得的技能點數需使用完畢 / 已轉職成為盜賊的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 墮落城市 / 盜賊基地(酒吧) / 找NPC達克魯<\/p>\n<p align=\"LEFT\">     取得轉職任務，並到墮落城市北方工地找NPC盜賊轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後，回盜賊基地找達克魯即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<\/div>\n<p align=\"LEFT\">【刺客 – Assassin】【俠盜 – Bandit】<\/p>\n<div id=\"bulletin\">\n<hr/>\n<p align=\"LEFT\"><strong>弓箭手二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數不需使用完畢 / 已轉職成為弓手的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 弓箭手村 / 弓箭手培訓中心 / 找NPC赫麗娜<\/p>\n<p align=\"LEFT\">     取得轉職任務，並到迷官通道找(地圖右上角)NPC弓手轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後，回弓箭手培訓中心找赫麗娜即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<\/div>\n<p align=\"LEFT\">【獵人 – Hunter】  【弩弓手 – CrossbowMan】<\/p>\n<div id=\"bulletin\">\n<hr/>\n<p align=\"LEFT\"><strong>海盜二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數不需使用完畢 / 已轉職成為海盜的角色<\/p>\n<p align=\"LEFT\">1 . 角色必需要先回到維多利亞島東南方海域的鯨魚號，當角色與二轉職教官卡依琳進行對話後，便會對近日來的自我鍛鍊表示鼓勵，並告知只要通過簡單的測試，即可進一步地提升自身能力。<\/p>\n<p align=\"LEFT\">2 . 若玩家同意接受測試，就會讓玩家傳送到試煉地圖裡面打倒怪物，並蒐集15個水晶後拿給他。<\/p>\n<p align=\"LEFT\">3 . 完成這項任務後，將收集好的水晶交給轉職教官，便可選擇轉職成為槍手或打手。<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p align=\"LEFT\">【打手 – Brawler】【槍手 – Gunslinger】<\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "job-3rd", "cat": "轉職", "title": "三轉流程", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413043357/https://mapleroyals.net/noobs-guides/job-advancement/3rd-job-advancement", "html": "<p><strong>劍士：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為狂戰士、見習騎士或槍騎兵的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島勇士之村的勇者聖殿，找武術教練 NPC 對話，接受任務得知必須打倒分身。<\/li>\n<li>其分身在螞蟻礦坑裡面的次元裂縫，點擊水晶道路  NPC 往前直進入異次元世界。發現武術教練分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回勇士村，給予<b>黑符<\/b>，可獲得<b>力量項鏈<\/b><b>。<\/b><\/li>\n<li>取得<strong>力量<\/strong><b>項鏈<\/b>，回冰原雪域找戰士長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給戰士長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>法師：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為火毒巫師、冰雷巫師或僧侶的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島魔法森林的圖書館，找漢斯 NPC 對話，接受任務得知必須打倒漢斯分身。<\/li>\n<li>其分身在巫婆森林 II 的次元裂縫，點擊水晶道路 NPC 往前直進入異次元世界。發現漢斯分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回魔法森林，給予漢斯<b>黑符<\/b>，可獲得<b>力量項鏈。<\/b><\/li>\n<li>取得<b>力量項鏈<\/b>，回冰原雪域找法師長老對話，他會要求你接受智慧的考驗<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答兩個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給法師長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>盜賊：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為刺客或俠客的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島墮落城市的盜賊基地（酒吧），找達克魯 NPC 對話，接受任務得知必須打倒達克魯分身。<\/li>\n<li>其分身在猴子沼澤地 II 的次元裂縫<strong>，<\/strong>點擊水晶道路  NPC 往前直進入異次元世界，發現達克魯分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回墮落城市，給予<b>黑符<\/b>，可獲得<strong>力量<\/strong><b>項鏈。<\/b><\/li>\n<li>取得<strong>力量<\/strong><b>項鏈<\/b>，回冰原雪域找盜賊長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給盜賊長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>弓箭手：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為獵人或弩弓手的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島弓箭手村的弓箭手培育中心，找赫麗娜 NPC 對話，接受任務得知必須打倒赫麗娜分身。<\/li>\n<li>其分身在：奇幻村的森林迷宮 V ，點擊水晶道路 NPC 往前直進入異次元世界，發現赫麗娜分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回弓箭手村，給予<b>黑符<\/b>，可獲得<b>力量項鏈。<\/b><\/li>\n<li>取得<b>力量項鏈<\/b>，回冰原雪域找弓箭手長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給弓箭手長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>海盜：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為打手或槍手的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島鯨魚號的航海室，找卡依琳 NPC 對話，接受任務得知必須打倒卡依琳分身。<\/li>\n<li>其分身在火獨眼獸洞穴 Ⅱ 的次元裂縫，點擊水晶道路 NPC 往前直進入異次元世界，發現卡依琳分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回鯨魚號，給予卡依琳<b>黑符<\/b>，可獲得<b>力量項鏈。<\/b><\/li>\n<li>取得<b>力量項鏈<\/b>，回冰原雪域找海盜長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給海盜長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p>解答：<\/p>\n<pre><code><span class=\"hljs-section\">[題庫總共有六題]<\/span><\/code><\/pre>\n<pre><code class=\"scrollbarGhostHairline-1mSOM1 scrollbar-3dvm_9 hljs css\"><span class=\"hljs-selector-attr\">[第一個答案會決定整個題庫解答的順序]\n例如：\n<img decoding=\"async\" src=\"https://web.archive.org/web/20260413043357im_/http://mapleroyals.net/wp-content/uploads/2020/07/image0.jpg\" alt=\"\"/><\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Fire<\/span> <span class=\"hljs-type\">Boar<\/span> – <span class=\"hljs-type\">Fire<\/span> <span class=\"hljs-type\">Boar<\/span> <span class=\"hljs-type\">Snout<\/span>，解答為 <span class=\"hljs-number\">42513<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Maya<\/span>，解答為 <span class=\"hljs-number\">23525<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Roger<\/span>，解答為 <span class=\"hljs-number\">52354<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Sergeant<\/span> <span class=\"hljs-type\">Peter<\/span>，解答為 <span class=\"hljs-number\">14525<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Shane<\/span>，解答為 <span class=\"hljs-number\">52424<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Weakend<\/span> – <span class=\"hljs-type\">Slower<\/span> <span class=\"hljs-type\">Movements<\/span>，解答為 <span class=\"hljs-number\">12435<\/span><\/code><\/pre>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "job-4th", "cat": "轉職", "title": "四轉流程", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413052705/https://mapleroyals.net/noobs-guides/job-advancement/4th-job-advancement", "html": "<p>要求條件：等級120，轉職時必須把120等以前的技能點數分配完畢。<br>\n【1】. 等級必須達到１２０等，到冰原雪域找該職業的三轉教官，然後接取任務。<\/p>\n<p>【2】. 到神木村的祭司之林找該職業的四轉教官。<\/p>\n<p>路徑『祭司之林位於神木村=&gt;神木村東邊森林=&gt;米納爾森林東邊邊境=&gt;天空之巢路口=&gt;天空之巢  Ｉ=&gt;天空之巢ＩＩ=&gt;山羊峽谷(到這裡之後，右上角有一個樹洞，到此樹洞按上)=&gt;祭司之林』<\/p>\n<p>【3】. 四轉教官會說給他英雄五角勳章和英雄星型墜飾 (這部分要打噴火龍跟格瑞分多取得)建議不理會直接去神木村找長老就好了( 需密咒換取英雄五角勳章和英雄星型                墜飾)。<\/p>\n<p>【4】.『秘咒要怎樣取得呢？首先準備好1000萬，然後到玩具城的愛奧斯塔４４樓找卷軸商人。』<\/p>\n<p>【5】. 給村長密咒，他會給你英雄五角勳章和英雄星型墜飾，找四轉教官轉職<\/p>\n<hr/>\n<p>轉職後，打開消耗欄，有本楓葉祝福，按二下就多出一個技能!!!<\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "skill-all", "cat": "技能書", "title": "全職業共通", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517181626/https://mapleroyals.net/game-tips/skillbook/all-class", "html": "<p><strong><img decoding=\"async\" class=\"aligncenter\" src=\"https://web.archive.org/web/20260517181626im_/http://i.imgur.com/vZN842t.png\" alt=\"\" width=\"300\" height=\"432\"/><\/strong><\/p>\n<hr/>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181626im_/http://i.gyazo.com/66a7a7fe4ac6c1a151e2a86557ffdcfc.png\" alt=\"[IMG]\"/>   <strong>楓葉祝福               <\/strong><\/p>\n<p>楓葉祝福  10  –  四轉直接獲取技能<\/p>\n<p>楓葉祝福  20  –  暗黑龍王<\/p>\n<hr/>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181626im_/http://i.gyazo.com/9283f4e4a8e509dccc8e77967851e911.png\" alt=\"[IMG]\"/>   <strong> 楓葉淨化 <\/strong><\/p>\n<p>楓葉淨化 : <a href=\"https://web.archive.org/web/20260517181626/http://tw.meetgee.com/MiniSite/Topic/View.aspx?ID=2026916&amp;CategoryID=195061&amp;GameID=589\" target=\"_blank\">楓葉淨化 – 密技網傳送門<\/a><\/p>\n<hr/>\n<div id=\"wpdevar_comment_1\">\n <span><\/span>\n <\/div>"}, {"slug": "skill-warrior", "cat": "技能書", "title": "劍士", "ts": "2025-03-21", "wb": "https://web.archive.org/web/20250321103748/https://mapleroyals.net/game-tips/skillbook/warrior", "html": "<header class=\"entry-header\">\n <h1 class=\"entry-title\">\n 劍士系列 <\/h1>\n <\/header>\n <div class=\"entry-content clearfix\">\n <p><strong><img loading=\"lazy\" class=\"aligncenter\" src=\"https://web.archive.org/web/20250321103748im_/http://i.imgur.com/I2rlnG3.png\" alt=\"\" width=\"300\" 054046/https://mapleroyals.net/%E8%81%B7%E6%A5%AD%E9%81%B8%E6%93%87/warrior/%E6%8A%80%E8%83%BD%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E6%88%B0%E5%A3%AB", "html": "<p><span>英雄(Hero)：<\/span><span>進階鬥氣<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/02280007.png\" alt=\"Image not found\"/>(Advanced Combo Attack)  <\/span><span>聖騎士(Paladin)：<\/span><span>屬性強化<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1220010.png\" alt=\"Image not found\"/>(Advanced Charge Blow)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc81de408ca\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc81de408ca\" class=\"collapseomatic_content \">\n<p><span>打炎魔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8800000.png\" alt=\"Image not found\"/>(Zakum)<\/span><span>會掉<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>英雄(Hero)：<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121006.png\" alt=\"Image not found\"/>究級突刺(Rush)  黑騎(Dark Knighr)：<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121006.png\" alt=\"Image not found\"/>究級突刺(Rush)  聖騎士(Paladin)：<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121006.png\" alt=\"Image not found\"/>究級突刺(Rush)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc81de408ea\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc81de408ea\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>先在長槍牛魔王<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/7130101.png\" alt=\"Image not found\"/><\/span><span>(Tauromacis)中取得 <\/span><span>無法閱讀的書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04001112.png\" alt=\"Image not found\"/>[Storybook] Indecipherable Book。(去自由市場買一本也可以)<\/span><\/li>\n<li aria-level=\"1\"><span>到勇士之村(perion)左上角，與麥吉<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/1022002.png\" alt=\"Image not found\"/><\/span><span>(Manji)對話。<\/span><\/li>\n<\/ol>\n<p><span>麥吉要求玩家與一位四轉的劍士組隊，一同擊敗長槍牛魔王<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/7130101.png\" alt=\"Image not found\"/><\/span><span>(Tauromacis)200隻。<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>完成後，回去到勇士之村(perion)與麥吉<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/1022002.png\" alt=\"Image not found\"/><\/span><span>(Manji)對話即可習得<\/span><span>究級突刺<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121006.png\" alt=\"Image not found\"/>(Rush)<\/span><\/li>\n<\/ol>\n<p><span>註：組隊隊友打倒的怪物也有計算在內<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>英雄：<\/span><span>鬥氣爆發<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121010.png\" alt=\"Image not found\"/> (Enrage)  <\/span><span>黑騎：<\/span><span>黑暗力量<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320006.png\" alt=\"Image not found\"/>(Berserk)  <\/span><span>聖騎：<\/span><span>鬼神之擊<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1221011.png\" alt=\"Image not found\"/>(Heaven&#8217;s Hammer)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc81de4090a\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc81de4090a\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>到赫爾奧斯塔圖書館，找懷茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2040052.png\" alt=\"Image not found\"/><\/span><span>(Wiz the Librarian)對話接下任務：【The Great Warrior, Sayram】，會得到 賽伊蘭故事書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04161019.png\" alt=\"Image not found\"/><\/span><span>(Sayram&#8217;s Journey )。<\/span><\/li>\n<li aria-level=\"1\"><span>到神木村找村長塔塔曼<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081000.png\" alt=\"Image not found\"/><\/span><span>(Chief Tatamo)對話接任務【Griffey&#8217;s Necklace】要求玩家打倒格瑞芬多<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8180001.png\" alt=\"Image not found\"/><\/span><span>(Griffey)取得 賽伊蘭的項鍊<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031467.png\" alt=\"Image not found\"/><\/span><span>(Sayram&#8217;s Necklace)。<\/span><\/li>\n<\/ol>\n<p><span>然後拿著項鍊與回去找村長塔塔曼<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081000.png\" alt=\"Image not found\"/><\/span><span>(Chief Tatamo)對話。<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>到奇幻村深處地圖：迷霧森林-另外的出口(Dungeon : Another Entrance)找無意義存在者<\/span><span>(Insignificant Being)對話接下任務【Sayram&#8217;s Skill】，他要求玩家尋找賽伊蘭的盾牌<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031471.png\" alt=\"Image not found\"/><\/span><span>(Sayram&#8217;s Shield)。<\/span><\/li>\n<li aria-level=\"1\"><span>前往寺院通道Ⅳ(Sanctuary Entrance IV)，使用 被遺忘的聖殿鑰匙<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031475.png\" alt=\"Image not found\"/>(Key to the Forgotten Shrine)<\/span><span>可進入遺忘的聖殿。<\/span>\n<ul>\n<li aria-level=\"2\"><span>【 被遺忘的聖殿鑰匙由巴洛谷<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8130100.png\" alt=\"Image not found\"/><\/span><span>(Jr. Balrog)掉落】<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>在遺忘的聖殿裡，用普通攻擊打石像，隨機掉落賽伊蘭的盾牌<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031471.png\" alt=\"Image not found\"/><\/span><span>(Sayram&#8217;s Shield)。<\/span><\/li>\n<li aria-level=\"1\"><span>將賽伊蘭的盾牌<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031471.png\" alt=\"Image not found\"/><\/span><span>(Sayram&#8217;s Shield)交給懷茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2040052.png\" alt=\"Image not found\"/><\/span><span>(Wiz the Librarian)即可學會技能<\/span><\/li>\n<\/ol>\n<\/div>\n<hr/>\n<p><span>英雄：<\/span><span>格檔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121002.png\" alt=\"Image not found\"/>(Power Stance)<\/span><span>黑騎：<\/span><span>格檔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121002.png\" alt=\"Image not found\"/>(Power Stance)<\/span><span>聖騎：<\/span><span>格檔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121002.png\" alt=\"Image not found\"/>(Power Stance)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc81de40918\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc81de40918\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>打倒地獄巴洛古<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8150000.png\" alt=\"Image not found\"/>(Crimson Balrog)，取得地獄巴洛古的計畫書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04001111.png\" alt=\"Image not found\"/><\/span><span>([Storybook] Crimson Balrog&#8217;s Proposal)。(或是去自由市場買一本也可以)<\/span><\/li>\n<li aria-level=\"1\"><span>將地獄巴洛古的計畫書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04001111.png\" alt=\"Image not found\"/><\/span><span>([Storybook] Crimson Balrog&#8217;s Proposal)交給劍士四轉教官漢摩尼亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081100.png\" alt=\"Image not found\"/><\/span><span>(Harmonia)，接下任務【The Plot to Kidnap Tylus!】他會要求玩家去找<\/span><span>史菲魯納<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2032001.png\" alt=\"Image not found\"/><\/span><span>(Spiruna)<\/span><span>。<\/span><\/li>\n<li aria-level=\"1\"><span>到雲彩公園Ⅳ(Cloud Park IV)，找史菲魯納<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2032001.png\" alt=\"Image not found\"/><\/span><span>(Spiruna)對話接下任務【Spiruna&#8217;s advice】，<\/span>他會要求玩家打倒白狼人<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8140000.png\" alt=\"Image not found\"/>(Lycanthrope)，取得 白狼人的企劃書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031477.png\" alt=\"Image not found\"/>(Lycanthrope&#8217;s Plans)。<\/li>\n<li aria-level=\"1\"><span>把白狼人的 企劃書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031477.png\" alt=\"Image not found\"/><\/span><span>(Lycanthrope&#8217;s Plans)拿給漢摩尼亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081100.png\" alt=\"Image not found\"/><\/span><span>(Harmonia)，而他會要求玩家去保護<\/span><span>泰勒斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/9300093.png\" alt=\"Image not found\"/><\/span><span>(Tylus)<\/span><span>。<\/span><\/li>\n<\/ol>\n<ul>\n<li aria-level=\"1\"><span>到冰原雪域的長老會館裡找泰勒斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/9300093.png\" alt=\"Image not found\"/><\/span><span>(Tylus)接下任務【Protecting Tylus】，組隊之後進入任務地圖【建議組滿人】。<\/span><\/li>\n<li aria-level=\"1\"><span>★任務地圖裡有大量巴洛古和白狼人，只要在時間內保護泰勒斯即可<\/span>\n<ul>\n<li aria-level=\"2\"><span>保護到剩下3分鐘，出現藍字提示就可以出去了<\/span><\/li>\n<li aria-level=\"2\"><span>如果保護到0秒時間時間到不出去，任務會失敗<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>★在此任務中，可撿到職業技能書，請開對應的職業去撿<\/span>\n<ul>\n<li aria-level=\"2\"><span>法師系-魔力無限<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/2121004.png\" alt=\"Image not found\"/><\/span><span>(Infinity)<\/span><\/li>\n<li aria-level=\"2\"><span>弓手系-龍魂箭<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/02280005.png\" alt=\"Image not found\"/> <\/span><span>(Dragon&#8217;s Breath)<\/span><\/li>\n<li aria-level=\"2\"><span>盜賊系-挑釁<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/4121003.png\" alt=\"Image not found\"/><\/span><span>(Taunt)<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>保護泰勒斯任務完成後，可得到 泰勒斯的信任<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031495.png\" alt=\"Image not found\"/><\/span><span>(Tylus&#8217;s Trust)。<\/span><\/li>\n<li aria-level=\"1\"><span>將 泰勒斯的信任<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031495.png\" alt=\"Image not found\"/><\/span><span>(Tylus&#8217;s Trust)交給泰勒斯<\/span><span>可習得技能格檔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1121002.png\" alt=\"Image not found\"/><\/span><span>(Power Stance)<\/span><\/li>\n<\/ul>\n<\/div>\n<hr/>\n<p><span>英雄：<\/span><span>究極神盾<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1120005.png\" alt=\"Image not found\"/>(Guardian)  <\/span><span>聖騎：<\/span><span>究極神盾<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1120005.png\" alt=\"Image not found\"/>(Guardian)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc81de40939\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc81de40939\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>到神木村森林岔道中，找穆斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081009.png\" alt=\"Image not found\"/><\/span><span>(Moose)接下任務【A Shield&#8217;s True Power】，他會給你一個120等練習用盾牌。<\/span>\n<ul>\n<li aria-level=\"2\"><span>必須要裝備120等 練習用盾牌後繼續對話會進入任務地圖。<\/span><\/li>\n<li aria-level=\"2\"><span>若在進入任務前未裝備練習用盾牌，則進入任務地圖會立即死亡。<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>需要在20分鐘內打倒200隻暗黑半人馬<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8140101.png\" alt=\"Image not found\"/><\/span><span>(Black Kentaurus)。<\/span><\/li>\n<li aria-level=\"1\"><span>在限時中完成任務後，找穆斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081009.png\" alt=\"Image not found\"/><\/span><span>(Moose)對話即可取得究極神盾(Guardian)、 LV120榮耀之盾<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/characters/01092042.png\" alt=\"Image not found\"/><\/span><span>(Gellerhead Shield)。<\/span><\/li>\n<\/ol>\n<\/div>\n<hr/>\n<p><span>聖騎士：聖靈之劍<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1221003.png\" alt=\"Image not found\"/><\/span><span>(Holy Charge: Sword)、聖靈之棍<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1221004.png\" alt=\"Image not found\"/><\/span><span>(Divine Charge: Blunt Weapon)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc81de40947\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc81de40947\" class=\"collapseomatic_content \">\n<p><span>任務流程<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>在神木村祭司之林裡，找到漢摩尼亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081100.png\" alt=\"Image not found\"/><\/span><span>(Harmonia)對話接下任務神聖的騎士之劍【The Holy Knight&#8217;s Sword】。<\/span><\/li>\n<li aria-level=\"1\"><span>到水世界與探險隊長坦克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2060101.png\" alt=\"Image not found\"/><\/span><span>(Taeng the Explorer)對話後，去蒐集 鯊魚假牙<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000180.png\" alt=\"Image not found\"/><\/span><span>(Shark Denture)10個。<\/span>\n<ul>\n<li aria-level=\"2\"><span>探險隊長坦克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2060101.png\" alt=\"Image not found\"/><\/span><span>(Taeng the Explorer)出現地點：水世界-受難船的墓地(The Grave of Wrecked Ship)船的破洞裡面<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>蒐集完畢後，回去找探險隊長坦克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2060101.png\" alt=\"Image not found\"/><\/span><span>(Taeng the Explorer)接下任務【Whereabouts of the Grail】，他會給你一個 聖盃<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031454.png\" alt=\"Image not found\"/><\/span><span>(Holy Cup)。<\/span><\/li>\n<li aria-level=\"1\"><span>拿到聖盃後，玩家到闇黑龍王洞穴入口的生命之泉，可盛得 生命聖水<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031455.png\" alt=\"Image not found\"/><\/span><span>(Holy Water of Life)。<\/span>\n<ul>\n<li aria-level=\"2\"><span>註：想進入闇黑龍王的洞穴入口，可參考<\/span><a href=\"https://web.archive.org/web/20260413054046/https://mapleroyals.net/quest/ht-run\"><span>任務LV80龍的戰爭<\/span><\/a><span>。<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>取得生命聖水<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031455.png\" alt=\"Image not found\"/><\/span><span>(Holy Water of Life)後，再到天空之城塔第8層，與雕像<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2030005.png\" alt=\"Image not found\"/><\/span><span>(Statue)<\/span><span>對話即可完成任務。<\/span><\/li>\n<\/ol>\n<\/div>\n<hr/>\n<p><span>黑騎士：黑暗守護<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320009.png\" alt=\"Image not found\"/><\/span><span>(Hex of the Beholder)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc81de40952\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc81de40952\" class=\"collapseomatic_content \">\n<ol>\n<li aria-level=\"1\"><span>在神木村-祭司之林找漢摩尼亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081100.png\" alt=\"Image not found\"/><\/span><span>(Harmonia)接任務，他會要求玩家到玩具城找福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041023.png\" alt=\"Image not found\"/><\/span><span>(Flo)對話。<\/span><\/li>\n<li aria-level=\"1\"><span>找到<\/span><span>福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041023.png\" alt=\"Image not found\"/><\/span><span>(Flo)<\/span><span>後，他會要求玩家蒐集 靈魂魔法陣<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031474.png\" alt=\"Image not found\"/><\/span><span>(Soul Contract)1個。<\/span><\/li>\n<\/ol>\n<ul>\n<li>\n<ul>\n<li><span>通道守門人<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8160000.png\" alt=\"Image not found\"/><\/span> <span>(Gatekeeper)掉落<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<ol>\n<li aria-level=\"1\"><span>取得 靈魂魔法陣<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031474.png\" alt=\"Image not found\"/><\/span><span>(Soul Contract)後，找<\/span><span>(Flo)對話即可完成任務，習得技能 LV5黑暗守護<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320009.png\" alt=\"Image not found\"/><\/span><span>(Hex of the Beholder) 。<\/span><\/li>\n<li aria-level=\"1\"><span>繼續與<\/span><span>福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041023.png\" alt=\"Image not found\"/><\/span><span>(Flo)<\/span><span>對話，蒐集維京的帆布<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000134.png\" alt=\"Image not found\"/><\/span><span>(Viking Sail)200個後回報任務可將黑暗守護<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320009.png\" alt=\"Image not found\"/><\/span><span>(Hex of the Beholder)提升至15級。<\/span><\/li>\n<li aria-level=\"1\"><span>繼續與<\/span><span>福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041023.png\" alt=\"Image not found\"/><\/span><span>(Flo)<\/span><span>對話，蒐集維京的帆布<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000134.png\" alt=\"Image not found\"/><\/span><span>(Viking Sail)500個後回報任務可將黑暗守護<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320009.png\" alt=\"Image not found\"/><\/span><span>(Hex of the Beholder)提升至25級。<\/span><\/li>\n<\/ol>\n<ul>\n<li>\n<ul>\n<li>\n<ul>\n<li aria-level=\"1\"><span>維京的帆布<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000134.png\" alt=\"Image not found\"/><\/span><span>(Viking Sail)為<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8141000.png\" alt=\"Image not found\"/>Spirit Viking掉落<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/div>\n<hr/>\n<p><span>黑騎士：闇靈治癒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320008.png\" alt=\"Image not found\"/><\/span><span>(Aura of the Beholder)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc81de4095e\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc81de4095e\" class=\"collapseomatic_content \">\n<ol>\n<li aria-level=\"1\"><span>在神木村-祭司之林找漢摩尼亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2081100.png\" alt=\"Image not found\"/><\/span><span>(Harmonia)接任務【The Forgotten Healing Power】，他會要求玩家到玩具城找時間通道(Path of Time)的<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041021.png\" alt=\"Image not found\"/><\/span><span>(Mr. Bouffon)對話。<\/span><\/li>\n<li aria-level=\"1\"><span>找到<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041021.png\" alt=\"Image not found\"/><\/span><span>(Mr. Bouffon)後，他會要求玩家蒐集 靈魂的合約書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031453.png\" alt=\"Image not found\"/><\/span><span>(Magical Array of the Spirit)1個<\/span>\n<ul>\n<li aria-level=\"2\"><span> <img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/8170000.png\" alt=\"Image not found\"/><\/span><span>(Thanatos)掉落<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>取得靈魂的合約書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://maplelegends.com/static/images/lib/item/04031453.png\" alt=\"Image not found\"/><\/span><span>(Magical Array of the Spirit)後，找<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041021.png\" alt=\"Image not found\"/><\/span><span>(Mr. Bouffon)對話即可完成任務，並習得技能 LV5闇靈治癒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320008.png\" alt=\"Image not found\"/><\/span><span>(Aura of the Beholder)。<\/span><\/li>\n<li aria-level=\"1\"><span>繼續與<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041021.png\" alt=\"Image not found\"/><\/span><span>(Mr. Bouffon)對話，蒐集 <img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000148.png\" alt=\"Image not found\"/><\/span><span>(Binding Bridle)200個後回報任務可將 闇靈治癒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320008.png\" alt=\"Image not found\"/><\/span><span>(Aura of the Beholder)提升至15級。<\/span><\/li>\n<li aria-level=\"1\"><span>繼續與<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/npcs/2041021.png\" alt=\"Image not found\"/><\/span><span>(Mr. Bouffon)對話，蒐集<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000148.png\" alt=\"Image not found\"/> <\/span><span>(Binding Bridle)500個後回報任務可將 闇靈治癒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/skills/1320008.png\" alt=\"Image not found\"/><\/span><span>(Aura of the Beholder)提升至25級<\/span><\/li>\n<\/ol>\n<ul>\n<li>\n<ul>\n<li><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/items/04000148.png\" alt=\"Image not found\"/>Binding Bridle掉落來自於<img decoding=\"async\" src=\"https://web.archive.org/web/20260413054046im_/https://royals-library.netlify.app/images/monsters/7130300.png\" alt=\"Image not found\"/><\/span><span>(Master Death Teddy)<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-magician", "cat": "前置任務", "title": "技能前置任務－法師", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413051801/https://mapleroyals.net/%E8%81%B7%E6%A5%AD%E9%81%B8%E6%93%87/%E6%8A%80%E8%83%BD%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E6%B3%95%E5%B8%AB", "html": "<p><span>魔力無限<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121004.png\" alt=\"Image not found\"/>(Infinity)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7c897d79b\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7c897d79b\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>前往冰原雪域的長老會館，帶一名隊長是四轉戰士，且可以與泰勒斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9300093.png\" alt=\"Image not found\"/><\/span><span>(Tylus)接下任務【Protecting Tylus】，組隊之後進入。<\/span><\/li>\n<li aria-level=\"1\"><span>★任務地圖裡有大量巴洛古和白狼人，開始打怪等待技能書掉落，裡面有這三種書<\/span>\n<ul>\n<li aria-level=\"2\"><span>法師系-魔力無限<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121004.png\" alt=\"Image not found\"/><\/span><span>(Infinity)<\/span><\/li>\n<li aria-level=\"2\"><span>弓手系-龍魂箭<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/02280005.png\" alt=\"Image not found\"/> <\/span><span>(Dragon&#8217;s Breath)<\/span><\/li>\n<li aria-level=\"2\"><span>盜賊系-挑釁<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/4121003.png\" alt=\"Image not found\"/><\/span><span>(Taunt)<\/span><\/li>\n<li aria-level=\"2\"><\/div><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<hr/>\n<p><span>天使之箭<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/02280009.png\" alt=\"Image not found\"/>(Angel Ray)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7c897d7be\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7c897d7be\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<p><span>打炎魔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8800000.png\" alt=\"Image not found\"/>(Zakum)<\/span><span>會掉<\/span><\/p>\n<p><span>(不可交易)<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>召喚神龍<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2321003.png\" alt=\"Image not found\"/><\/span><span>(Bahamut)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7c897d7cc\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7c897d7cc\" class=\"collapseomatic_content \">\n<p><span>往神木村後半段找騎士拉烏爾<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2081007.png\" alt=\"Image not found\"/><\/span><span>(Raul the Knight)<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>接下任務【The Dragon&#8217;s Guardian】，然後收集龍之心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031449.png\" alt=\"Image not found\"/><\/span><span>(Dragon Heart)X20個<\/span><\/li>\n<li aria-level=\"1\"><span>續接任務【Bahamut&#8217;s Power 1】，然後收集龍之心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031449.png\" alt=\"Image not found\"/><\/span><span>(Dragon Heart)X25個<\/span><\/li>\n<li aria-level=\"1\"><span>續接任務【Bahamut&#8217;s Power 2】，然後收集龍之心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031449.png\" alt=\"Image not found\"/><\/span><span>(Dragon Heart)X30個<\/span><\/li>\n<li aria-level=\"1\"><span>續接任務【Bahamut&#8217;s Power 3】，然後收集龍之心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031449.png\" alt=\"Image not found\"/><\/span><span>(Dragon Heart)X35個<\/span><\/li>\n<\/ul>\n<p><span>註：每一個任務的龍之心是不同的東西，收集滿就要立即回報<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>復甦之光<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2321006.png\" alt=\"Image not found\"/>(Resurrection)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7c897d7d9\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7c897d7d9\" class=\"collapseomatic_content \">\n<p><span>需要帶著黑皮書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001107.png\" alt=\"Image not found\"/><\/span><span>([Storybook]Black book)接任務<\/span><\/p>\n<p><span>以下怪物會掉落：<\/span><\/p>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/5130107.png\" alt=\"Image not found\"/>Coolie Zombie<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8142000.png\" alt=\"Image not found\"/><\/span><span>Phantom Watch<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8143000.png\" alt=\"Image not found\"/><\/span><span>Grim Phantom Watch<\/span><\/p>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8170000.png\" alt=\"Image not found\"/>Thanatos<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9420512.png\" alt=\"Image not found\"/><\/span><span>Mr. Anchor<\/span><\/p>\n<p><span>或是CKWPQ箱子中得到或者是去自由市場買一本<\/span><\/p>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>找四轉教官<\/span><span>Gritto<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2081200.png\" alt=\"Image not found\"/>接下任務【Black Book】<\/span><\/li>\n<li aria-level=\"1\"><span>帶著以下掉寶前往水世界找<\/span><span>Carta<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2060100.png\" alt=\"Image not found\"/>接任務【Method of Contradiction】<\/span>\n<ul>\n<li aria-level=\"2\"><span> Ice Piece<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000150.png\" alt=\"Image not found\"/> X100個 (來自於<\/span><span>Grim Phantom Watches)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8143000.png\" alt=\"Image not found\"/><\/span><\/li>\n<li aria-level=\"2\"><span>Firebomb Flame<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000081.png\" alt=\"Image not found\"/> X50個(來自於<\/span><span>Firebomb) <img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/5100002.png\" alt=\"Image not found\"/><\/span><\/li>\n<li aria-level=\"2\"><span> Charm of the Undead<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000008.png\" alt=\"Image not found\"/>X5個(來自於<\/span><span>Zombie Mushrooms)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/2230101.png\" alt=\"Image not found\"/><\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>回報後獲得<\/span><span>Cold Flame<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001108.png\" alt=\"Image not found\"/>，前往地圖Dangerous Sea Gorge II，進入隱藏洞穴，把書<\/span><span>跟石頭<\/span><span>兩個任務掉寶丟進鍋子裡，然後跟<\/span><span>Carta<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2060100.png\" alt=\"Image not found\"/>回報任務<\/span><\/li>\n<li aria-level=\"1\"><span>前往奇幻村(Sleepywood)找記憶者<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/1061011.png\" alt=\"Image not found\"/><\/span><span>(The Rememberer)接下任務【Resurrection】<\/span><\/li>\n<li aria-level=\"1\"><span>前往玩具城(】Ludibrium)中的遺忘通道(Forgotten Passage)地圖，進入隱藏門中挑戰忍耐關卡。<\/span><\/li>\n<\/ol>\n<ol>\n<li aria-level=\"1\"><span>忍耐跳完之後跟記憶者<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/1061011.png\" alt=\"Image not found\"/><\/span><span>(The Rememberer)回報任務，取得技能。<\/span><\/li>\n<li aria-level=\"1\"><\/div><\/li>\n<\/ol>\n<hr/>\n<p><span>炎靈地獄<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121003.png\" alt=\"Image not found\"/>(Fire Demon)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7c897d7fd\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7c897d7fd\" class=\"collapseomatic_content \">\n<p><span>需要帶著燃燒的火焰之書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04161015.png\" alt=\"Image not found\"/><\/span><span>([Storybook] Burning Book of Fire)接任務，可從紅色半人馬<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8140102.png\" alt=\"Image not found\"/><\/span><span>(Red Kentaurus)或是CWKPQ箱子中得到，或是在自由市場買一本<\/span><\/p>\n<p><span>任務流程：<\/span><\/p>\n<p><span>帶著燃燒的火焰之書<\/span><span>([Storybook] Burning Book of Fire)找四轉教官格里特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2081200.png\" alt=\"Image not found\"/><\/span><span>(Gritto)接下任務【A Book of Fire】，<\/span><\/p>\n<p><span>前往魔法森林(Ellinia)與漢斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9001001.png\" alt=\"Image not found\"/><\/span><span>(Grendel the Really Old)接下任務【A Mysterious Sentence】<\/span><\/p>\n<p><span>前往冰原雪城-長老官邸與三轉教官羅貝亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020009.png\" alt=\"Image not found\"/>(Robeira)對話<\/span><\/p>\n<p><span>前往炎魔祭壇入口，與阿杜比斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030008.png\" alt=\"Image not found\"/><\/span><span>(Adobis)對話，要求交付強化玻璃瓶<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001109.png\" alt=\"Image not found\"/><\/span><span>(Hardened Glass Bottle)。<\/span><\/p>\n<p><span>接著來到冰原雪集找NPC柏堅<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020000.png\" alt=\"Image not found\"/><\/span><span>(Vogen)接下任務【The Lava Mug】，製作強化玻璃瓶<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001109.png\" alt=\"Image not found\"/><\/span><span>(Hardened Glass Bottle)，柏堅要求收集<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>鑽石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04021007.png\" alt=\"Image not found\"/>(Diamond)X2<\/span><\/li>\n<li aria-level=\"1\"><span>火精靈的火石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000081.png\" alt=\"Image not found\"/>(Firebomb Flame)X30<\/span><\/li>\n<li aria-level=\"1\"><span>星石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04021009.png\" alt=\"Image not found\"/>(Star Rock)X1<\/span><\/li>\n<\/ul>\n<p><span>交付後獲得強化玻璃瓶<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001109.png\" alt=\"Image not found\"/><\/span><span>(Hardened Glass Bottle)。<\/span><\/p>\n<p><span>前往炎魔祭壇入口，與阿杜比斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030008.png\" alt=\"Image not found\"/><\/span><span>(Adobis)對話進入任務地圖，到達地圖最右方，把強化玻璃瓶<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001109.png\" alt=\"Image not found\"/><\/span><span>(Hardened Glass Bottle)丟到火堆上方，就會出現熔炎瓶，使用後習得技能。<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>召喚冰魔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121005.png\" alt=\"Image not found\"/>(Elquines)【註：需已習得炎靈地獄<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121003.png\" alt=\"Image not found\"/>(Fire Demon)】<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7c897d82b\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7c897d82b\" class=\"collapseomatic_content \">\n<p><span>前往冰原市集與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\" alt=\"Image not found\"/><\/span><span>(Alcaster)接受任務接下任務【The End of Attributes&#8230;?】，要求收集<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>鯊魚的魚翅<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000181.png\" alt=\"Image not found\"/>(Frozen Shark&#8217;s Fin) x 30<\/span><\/li>\n<li aria-level=\"1\"><span>怨靈女巫的冰塊<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000150.png\" alt=\"Image not found\"/>(Ice Piece) x 40<\/span><\/li>\n<li aria-level=\"1\"><span>冰龍的背骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000185.png\" alt=\"Image not found\"/>(Ice Backbone) x 30，<\/span><\/li>\n<\/ul>\n<p><span>接著與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\" alt=\"Image not found\"/><\/span><span>(Alcaster)對話續接任務【Inverse Attributes】<\/span><\/p>\n<p><span>前往天空之城塔10樓找豪克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030012.png\" alt=\"Image not found\"/><\/span><span>(Huckle)製作靈魂袋任務【Huckle&#8217;s Spirit Pouch】，豪克並要求與秀茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2012017.png\" alt=\"Image not found\"/><\/span><span>(Hughes the Fuse)對話製作召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031451.png\" alt=\"Image not found\"/>(Summoning Frame)。<\/span><\/p>\n<p><span>製作材料：<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>發條熊的幽靈<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000144.png\" alt=\"Image not found\"/>(Free Spirit) x 50<\/span><\/li>\n<li aria-level=\"1\"><span>召喚石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04006001.png\" alt=\"Image not found\"/>(The Summoning Rock) x 30<\/span><\/li>\n<li aria-level=\"1\"><span>邪惡鐘心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000146.png\" alt=\"Image not found\"/>(Evil Spirit) x 50<\/span><\/li>\n<li aria-level=\"1\"><span>束縛枷鎖<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000148.png\" alt=\"Image not found\"/>(Binding Bridle) x 30<\/span><\/li>\n<\/ul>\n<p><span>收集完成後取得靈魂袋<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031468.png\" alt=\"Image not found\"/><\/span><span>(Soul Pouch)。<\/span><\/p>\n<p><span>與秀茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2012017.png\" alt=\"Image not found\"/><\/span><span>(Hughes the Fuse)對話接下任務【Theory on Inverse Attributes of Summoned Beings】，然後交出<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>靈魂袋<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031468.png\" alt=\"Image not found\"/>(Soul Pouch)<\/span><\/li>\n<li aria-level=\"1\"><span>紫礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011005.png\" alt=\"Image not found\"/>(Orihalcon Plate)X10<\/span><\/li>\n<li aria-level=\"1\"><span>朱礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011003.png\" alt=\"Image not found\"/>(Adamantium Plate)X5<\/span><\/li>\n<li aria-level=\"1\"><span>鋰礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011002.png\" alt=\"Image not found\"/>(Mithril Plate)X5，<\/span><\/li>\n<\/ul>\n<p><span>獲得召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031451.png\" alt=\"Image not found\"/><\/span><span>(Summoning Frame)。<\/span><\/p>\n<p><span>與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\" alt=\"Image not found\"/><\/span><span>(Alcaster)對話交付召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031451.png\" alt=\"Image not found\"/><\/span><span>(Summoning Frame)後接下任務【Switching Attributes】，<\/span><\/p>\n<p><span>要求前往時間通道找NPC-福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\" alt=\"Image not found\"/><\/span><span>(Flo)接下任務【Key to a Different World】，打敗通道守門人<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8160000.png\" alt=\"Image not found\"/><\/span><span>(Gatekeeper)獲得異界鑰匙<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031473.png\" alt=\"Image not found\"/><\/span><span>(Key to the Other World)交給福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\" alt=\"Image not found\"/><\/span><span>(Flo)之後與魔導士組隊後進入任務地圖打敗怪物取得冰靈石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031470.png\" alt=\"Image not found\"/><\/span><span>(Icy Soul Rock)，交給福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\" alt=\"Image not found\"/>(Flo)。<\/span><\/p>\n<p><span>回到冰原雪集與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\" alt=\"Image not found\"/><\/span><span>(Alcaster)對話習得技能。<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>寒冰地獄<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2221003.png\" alt=\"Image not found\"/>(Ice Demon)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7c897d838\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7c897d838\" class=\"collapseomatic_content \">\n<p><span>需要帶著急凍寒冰之書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04161016.png\" alt=\"Image not found\"/><\/span><span>([Storybook] Frozen Book of Ice)接任務，可從藍色半人馬<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8140103.png\" alt=\"Image not found\"/><\/span><span>(Blue Kentaurus)或是CWKPQ箱子中得到，或是在自由市場買一本<\/span><\/p>\n<p><span>任務流程：<\/span><\/p>\n<p><span>帶著急凍寒冰之書<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04161016.png\" alt=\"Image not found\"/><\/span><span>([Storybook] Frozen Book of Ice)找四轉教官格里特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2081200.png\" alt=\"Image not found\"/><\/span><span>(Gritto)接下任務【The Book of Ice】<\/span><\/p>\n<p><span>前往魔法森林(Ellinia)與漢斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9001001.png\" alt=\"Image not found\"/><\/span><span>(Grendel the Really Old)接下任務【A Mysterious Sentence】<\/span><\/p>\n<p><span>前往冰原雪城-長老官邸與三轉教官羅貝亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020009.png\" alt=\"Image not found\"/>(Robeira)<\/span><span>對話<\/span><\/p>\n<p><span>搭黑色計程車往上面爬，會找到傑夫<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030000.png\" alt=\"Image not found\"/><\/span><span>(Jeff)對話<\/span><\/p>\n<p><span>接著來到冰原雪集找NPC柏堅<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020000.png\" alt=\"Image not found\"/><\/span><span>(Vogen)接下任務【The Ultimate Icepick】製作破冰之鎚<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/02280011.png\" alt=\"Image not found\"/><\/span><span>(Ancient Ice Powder)，柏堅要求收集：<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011005.png\" alt=\"Image not found\"/>Orihalcon Plate x 2<\/span><\/li>\n<li aria-level=\"1\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000150.png\" alt=\"Image not found\"/>Ice Piece x 30<\/span><\/li>\n<li aria-level=\"1\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011007.png\" alt=\"Image not found\"/>Moon Rock x 1<\/span><\/li>\n<\/ul>\n<p><span>交付後獲得破冰之鎚<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/02280011.png\" alt=\"Image not found\"/><\/span><span>(Ancient Ice Powder)&lt;&lt;&lt;(應該叫遠古冰粉，誰叫台服這樣稱呼)<\/span><\/p>\n<p><span>然後找傑夫<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030000.png\" alt=\"Image not found\"/>(Jeff)對話<\/span><span>選擇第一張地圖進入，跟冰塊對話獲得道具，使用後習得技能。<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>召喚火炎神<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2221005.png\" alt=\"Image not found\"/>(Ifrit) 【註：<\/span><span>需已習得<\/span><span>寒冰地獄<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2221003.png\" alt=\"Image not found\"/>(Ice Demon)】<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7c897d85b\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7c897d85b\" class=\"collapseomatic_content \">\n<p><span>前往冰原市集與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\" alt=\"Image not found\"/><\/span><span>(Alcaster)接下任務【End of Attributes】，要求收集：<\/span><\/p>\n<ul>\n<li><span>火精靈的火石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000081.png\" alt=\"Image not found\"/>(Firebomb Flame) x 50<\/span><\/li>\n<li><span>火焰半人馬的火花<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04000232.png\" alt=\"Image not found\"/>(Kentaurus&#8217;s Flame) x 10<\/span><\/li>\n<li><span>血腥哈維的火花羽毛<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04000240.png\" alt=\"Image not found\"/>(Small Flaming Feather) x 10<\/span><\/li>\n<\/ul>\n<p><span>接著與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\" alt=\"Image not found\"/><\/span><span>(Alcaster)對話後續接任務【Inverse Attributes】<\/span><\/p>\n<p><span>前往天空之城塔10樓找豪克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030012.png\" alt=\"Image not found\"/><\/span><span>(Huckle)製作靈魂袋任務【Huckle&#8217;s Spirit Pouch】，豪克<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2030012.png\" alt=\"Image not found\"/>(Huckle)並要求與秀茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2012017.png\" alt=\"Image not found\"/><\/span><span>(Hughes the Fuse)對話製作召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031497.png\" alt=\"Image not found\"/>(Summoning Frame)。<\/span><\/p>\n<p><span>製作材料：<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>發條熊的幽靈<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000144.png\" alt=\"Image not found\"/>(Free Spirit) x 50<\/span><\/li>\n<li aria-level=\"1\"><span>召喚石(The Summoning Rock) <img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04006001.png\" alt=\"Image not found\"/>x 30<\/span><\/li>\n<li aria-level=\"1\"><span>邪惡鐘心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000146.png\" alt=\"Image not found\"/>(Evil Spirit) x 50<\/span><\/li>\n<li aria-level=\"1\"><span>束縛枷鎖(<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04000148.png\" alt=\"Image not found\"/>Binding Bridle) x 30<\/span><\/li>\n<\/ul>\n<p><span>收集完成後取得靈魂袋<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031468.png\" alt=\"Image not found\"/><\/span><span>(Soul Pouch)。<\/span><\/p>\n<p><span>與秀茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2012017.png\" alt=\"Image not found\"/><\/span><span>(Hughes the Fuse)對話接下任務【Theory on Inverse Attributes of Summoned Beings】，然後交出<\/span><\/p>\n<ul>\n<li aria-level=\"1\"><span>靈魂袋<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031468.png\" alt=\"Image not found\"/>(Soul Pouch)<\/span><\/li>\n<li aria-level=\"1\"><span>紫礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011005.png\" alt=\"Image not found\"/>(Orihalcon Plate)X10<\/span><\/li>\n<li aria-level=\"1\"><span>朱礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011003.png\" alt=\"Image not found\"/>(Adamantium Plate)X5<\/span><\/li>\n<li aria-level=\"1\"><span>鋰礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04011002.png\" alt=\"Image not found\"/>(Mithril Plate)X5，<\/span><\/li>\n<\/ul>\n<p><span>獲得召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031497.png\" alt=\"Image not found\"/><\/span><span>(Summoning Frame)。<\/span><\/p>\n<p><span>與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\" alt=\"Image not found\"/><\/span><span>(Alcaster)對話交付召喚獸的肋骨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031497.png\" alt=\"Image not found\"/><\/span><span>(Summoning Frame)後接下任務【Switching Attributes】，<\/span><\/p>\n<p><span>前往時間通道找NPC-福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\" alt=\"Image not found\"/><\/span><span>(Flo)接下任務【Key to a Different World】，打敗通道守門人<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/8160000.png\" alt=\"Image not found\"/><\/span><span>(Gatekeeper)獲得異界鑰匙<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031473.png\" alt=\"Image not found\"/><\/span><span>(Key to the Other World)交給福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\" alt=\"Image not found\"/><\/span><span>(Flo)之後與魔導士組隊後進入任務地圖打敗怪物取得火靈石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031469.png\" alt=\"Image not found\"/><\/span><span>(Fire Soul Rock)，交給福樂<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2041023.png\" alt=\"Image not found\"/><\/span><span>(Flo)。<\/span><\/p>\n<p><span>回到冰原雪集與亞凱斯特<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020005.png\" alt=\"Image not found\"/><\/span><span>(Alcaster)對話，習得技能。<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>天怒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2321008.png\" alt=\"Image not found\"/>(Genesis)  <\/span><span>暴風雪<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2221007.png\" alt=\"Image not found\"/>(Blizzard)  <\/span><span>火流星<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121007.png\" alt=\"Image not found\"/>(Meteor Shower)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7c897d867\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7c897d867\" class=\"collapseomatic_content \">\n<p><span>皆需先解過前置任務：邪魔斯的過去<\/span><\/p>\n<p><span>先前往長老官邸與三轉教官羅貝亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020009.png\" alt=\"Image not found\"/>(Robeira)<\/span><span>對話<\/span><\/p>\n<p><span>要求玩家探訪玩具城圖書館管理員<\/span><span>懷茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2040052.png\" alt=\"Image not found\"/><\/span><span>(Wiz the Librarian)<\/span><span>對話<\/span><\/p>\n<p><span>再來與漢斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9001001.png\" alt=\"Image not found\"/><\/span><span>(Grendel the Really Old)對話<\/span><\/p>\n<p><span>再來與邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\" alt=\"Image not found\"/><\/span><span>(Shammos)對話<\/span><\/p>\n<p><span>再來與漢斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/monsters/9001001.png\" alt=\"Image not found\"/><\/span><span>(Grendel the Really Old)對話)<\/span><\/p>\n<p><span>再來與邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\" alt=\"Image not found\"/><\/span><span>(Shammos)對話，然後跟羅貝亞<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2020009.png\" alt=\"Image not found\"/>(Robeira)<\/span><span>對話<\/span><\/p>\n<p><span>最後跟邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\" alt=\"Image not found\"/><\/span><span>(Shammos)對話<\/span><\/p>\n<ul>\n<li><span>主教路線：前往神木村，在HTPQ龍王前置任務中最後一關打到生命之根<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031461.png\" alt=\"Image not found\"/><\/span><span>(Life Root)，交給邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\" alt=\"Image not found\"/><\/span><span>(Shammos)後習得技能-天怒<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2321008.png\" alt=\"Image not found\"/>(Genesis)<\/span><\/li>\n<li><span>火毒路線：準備一顆火焰之眼<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/items/04001017.png\" alt=\"Image not found\"/><\/span><span>(Eye of Fire)交給<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\" alt=\"Image not found\"/>邪魔斯<\/span><span>(Shammos)後習得技能：火流星<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2121007.png\" alt=\"Image not found\"/>(Meteor Shower)<\/span><\/li>\n<li><span>冰雷路線：前往狼人領土III/IV，收集白狼人之心<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://maplelegends.com/static/images/lib/item/04031460.png\" alt=\"Image not found\"/><\/span><span>(Cold Heart of a Wolf)。交給邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/npcs/2022003.png\" alt=\"Image not found\"/><\/span><span>(Shammos)後習得技能-暴風雪<img decoding=\"async\" src=\"https://web.archive.org/web/20260413051801im_/https://royals-library.netlify.app/images/skills/2221007.png\" alt=\"Image not found\"/>(Blizzard)<\/span><\/li>\n<\/ul>\n<\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-bowman", "cat": "前置任務", "title": "技能前置任務－弓箭手", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517175019/https://mapleroyals.net/%E8%81%B7%E6%A5%AD%E9%81%B8%E6%93%87/%E6%8A%80%E8%83%BD%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E5%BC%93%E7%AE%AD%E6%89%8B", "html": "<p><span>箭神(BowMaster)：龍魂箭 <img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/02280005.png\" alt=\"Image not found\"/><\/span><span>(Dragon&#8217;s Breath)   <\/span><span>神射手(Marksman)：龍魂箭 <img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/02280005.png\" alt=\"Image not found\"/><\/span><span>(Dragon&#8217;s Breath)<\/span><\/p>\n<span class=\"collapseomatic \" i
