etlify.app/images/npcs/9310048.png\"/>對話，打倒100隻Small Bronze Monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/monsters/9600020.png\"/>，蒐集50個Bronze Heart<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://maplelegends.com/static/images/lib/item/04000407.png\"/>。<\/p>\n<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">蒐集完後交回給Janitor monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/npcs/9310048.png\"/>\n<div> <\/div>\n<div> <\/div>\n<div class=\"codeContainer__75297\"><code>藏經閣的秘密<span class=\"hljs-number\">2<\/span><\/code><\/div>\n<p>和Janitor monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/npcs/9310048.png\"/>對話，打倒80隻Silver Monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/monsters/9600024.png\"/>，蒐集50個Silver Heart<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://maplelegends.com/static/images/lib/item/04000402.png\"/><\/p>\n<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">蒐集完後交回給在藏經閣三、四層的Chengguan<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/npcs/9310046.png\"/>。<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">\n<div> <\/div>\n<div class=\"codeContainer__75297\"><code>藏經閣的秘密<span class=\"hljs-number\">3<\/span><\/code><\/div>\n<p>和曾冠對話，打倒50隻金人Small Gold Monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/monsters/9600019.png\"/>，蒐集50個金人心臟Golden Heart<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://maplelegends.com/static/images/lib/item/04000406.png\"/>。<\/p>\n<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">蒐集完後交回給在藏經閣五、六層的Chengxin<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/npcs/9310047.png\"/>。<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">\n<div> <\/div>\n<div class=\"codeContainer__75297\"><code>藏經閣的秘密<span class=\"hljs-number\">4<\/span><\/code><\/div>\n<div> <\/div>\n<p>和曾心對話，蒐集Bronze Heart<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://maplelegends.com/static/images/lib/item/04000407.png\"/>、Silver Heart<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://maplelegends.com/static/images/lib/item/04000402.png\"/>、Golden Heart<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://maplelegends.com/static/images/lib/item/04000406.png\"/>各30個。<\/p>\n<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">蒐集完後交回給一層的Janitor monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/npcs/9310048.png\"/><\/div>\n<\/div>\n<div><hr/>在頂樓的Dharma Scroll<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/npcs/9310039.png\"/>對話後可以挑戰Wulin Yaoseng<img decoding=\"async\" src=\"https://web.archive.org/web/20260610123933im_/https://royals-library.netlify.app/images/monsters/9600025.png\"/>(LV150)<\/div>\n<\/div>\n<div> <\/div>\n經驗值很高，是練等的好夥伴<\/li>\n<\/ol>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-cwkpq", "cat": "前置任務", "title": "CWKPQ 前置介紹", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413053356/https://mapleroyals.net/62812/cwkpq%E5%89%8D%E7%BD%AE%E4%BB%8B%E7%B4%B9", "html": "<div class=\"message__5126c cozyMessage__5126c groupStart__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-461045746444009492 uid_1 message-content-461045746444009492 uid_2 message-timestamp-461045746444009492\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-461045746444009492\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><strong><code>註：須先完成新葉城(NLC)前置任務 <\/code><\/strong><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0 isHeader__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\">\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"編輯\"><strong>新葉城(NLC)前置任務區<\/strong><\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"編輯\"><\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-461045806863089674\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\">1.<code>迷失了(Lost) 任務等級:<span class=\"hljs-number\">40<\/span><\/code><\/div>\n<p>NPC:艾爾潘 葛拉博(Elpam Gorlab)<\/p>\n<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">接取任務後 從葛雷族人(Barnard Gray ) 身上取得 30個 艾爾潘磁石<span class=\"emojiContainer__75abc emojiContainerClickable__75abc\" tabindex=\"0\" role=\"button\" aria-expanded=\"false\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260413053356im_/https://cdn.discordapp.com/emojis/461043192293490689.webp?size=44\" alt=\":ElpamMagnet:\" aria-label=\":ElpamMagnet:\"/><\/span> (Elpam Magnet)，接著回報任務【註：此道具不可交易】<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code><span class=\"hljs-number\">2<\/span>.重回異世界(ReVetsal) 任務等級:<span class=\"hljs-number\">40<\/span><\/code><\/div>\n<div><\/div>\n<p>NPC:艾爾潘 葛拉博(Elpam Gorlab)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/npcs/9201055.png\"/><\/p>\n<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">任務流程:從鼬鼠鬧鐘( Tick-Tock)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/monsters/4230113.png\"/> 身上取得 60個 時光手錶<span class=\"emojiContainer__75abc emojiContainerClickable__75abc\" tabindex=\"0\" role=\"button\" aria-expanded=\"false\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260413053356im_/https://cdn.discordapp.com/emojis/461043192494555136.webp?size=44\" alt=\":TemporalFragment:\" aria-label=\":TemporalFragment:\"/><\/span> (Temporal Fragment)，接著回報任務【註：此道具不可交易】<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code><span class=\"hljs-number\">3<\/span>.蘇白尼的遺物 - 發現(Subani's Legacy - Discovery ) 任務等級:<span class=\"hljs-number\">36<\/span><\/code><\/div>\n<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">任務NPC: John Barricade<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/npcs/9201051.png\"/><\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">接完任務後打倒50隻殺人虎頭蜂(Killa Bee)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/monsters/9400540.png\"/>、40隻火焰象( Fire Tusk)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/monsters/9400542.png\"/>、30隻巨靈食人花( Mighty Maple Eater)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/monsters/9400548.png\"/>，接著回報任務<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code><span class=\"hljs-number\">4<\/span>.蘇白尼的遺物 - 侵入(Subani's Legacy - Transgression) 任務等級:<span class=\"hljs-number\">36<\/span><\/code><\/div>\n<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">任務NPC:John Barricade<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/npcs/9201051.png\"/><\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">接完任務 從電擊象(Electrophant)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/monsters/9400543.png\"/>身上取得50個翻譯水晶<span class=\"emojiContainer__75abc emojiContainerClickable__75abc\" tabindex=\"0\" role=\"button\" aria-expanded=\"false\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260413053356im_/https://cdn.discordapp.com/emojis/461043192515657749.webp?size=44\" alt=\":HyperGlyph:\" aria-label=\":HyperGlyph:\"/><\/span> (Hyper Glyph) ，接著回報任務【註：此道具不可交易】<\/div>\n<div class=\"markup__75297 messageContent_c19a55\">\n<div><\/div>\n<div class=\"codeContainer__75297\"><code><span class=\"hljs-number\">5<\/span>.蘇白尼的遺物 - 釋出(Subani's Legacy - Deliverance) 任務等級:<span class=\"hljs-number\">44<\/span><\/code><\/div>\n<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">任務NPC:John Barricade <img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/npcs/9201051.png\"/> 任務前置:完成蘇白尼的遺物 &#8211; 侵入<\/div>\n<div><\/div>\n<div class=\"markup__75297 messageContent_c19a55\">接完任務 從電子機器人( I.AM.ROBOT)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/monsters/9400546.png\"/>打50個地圖片<span class=\"emojiContainer__75abc emojiContainerClickable__75abc\" tabindex=\"0\" role=\"button\" aria-expanded=\"false\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260413053356im_/https://cdn.discordapp.com/emojis/461043192448679936.webp?size=44\" alt=\":MesoGearMapPiece:\" aria-label=\":MesoGearMapPiece:\"/><\/span> (MesoGear Map Piece) 接著回報任務【註：此道具不可交易】<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\">\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"separator_f84418\"><\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"編輯\"><strong>CWK任務區<\/strong><\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"轉發\"><\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-expanded=\"false\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\"><time id=\"message-timestamp-461045917085204491\" datetime=\"2018-06-26T05:51:52.452Z\" aria-label=\"六月 26, 2018 下午 01:51\"><i class=\"separator_c19a55\" aria-hidden=\"true\"><\/i><\/time><\/p>\n<div id=\"message-content-461045917085204491\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\"><code>尋找傑克 ( Finding Jack) 需求等級：LV50<\/code><\/div>\n<p>與John Barricade<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/npcs/9201051.png\"/>對話後，與Npc Jack<img decoding=\"async\" src=\"https://web.archive.org/web/20260413053356im_/https://royals-library.netlify.app/images/npcs/9201096.png\"/>對話<\/p>\n<p>註：Jack的位置可參考 <a class=\"anchor_edefb8 anchorUnderlineOnHover_edefb8\" tabindex=\"0\" title=\"https://www.youtube.com/watch?v=tbIVOMXrCQA\" role=\"button\" href=\"https://web.archive.org/web/20260413053356/https://www.youtube.com/watch?v=tbIVOMXrCQA\" target=\"_blank\" rel=\"noreferrer noopener\">https://www.youtube.com/watch?v=tbIVOMXrCQA<\/a><\/p>\n<\/div>\n<\/div>\n<div id=\"message-accessories-461045917085204491\" class=\"container_b7e1cb\">\n<article class=\"embedWrapper_b7e1cb embedFlexGrow_b7e1cb embedFull__623de embed__623de markup__75297 justifyAuto__623de\" aria-hidden=\"false\">\n<div class=\"gridContainer__623de\">\n<div class=\"grid__623de\">\n<div class=\"embedSuppressButton__623de\" tabindex=\"0\" role=\"button\" aria-label=\"移除所有嵌入內容\"><\/div>\n<div class=\"embedTitle__623de embedMargin__623de\"><a class=\"anchor_edefb8 anchorUnderlineOnHover_edefb8 embedTitleLink__623de embedLink__623de embedTitle__623de\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260413053356/https://www.youtube.com/watch?v=tbIVOMXrCQA\" target=\"_blank\" rel=\"noreferrer noopener\">How to find Jack Barricade in MapleStory<\/a><\/div>\n<div class=\"embedVideo__623de embedMedia__623de\">\n<div class=\"imageContent__0f481 embedVideoImageComponent__623de\">\n<div class=\"imageContainer__0f481\">\n<div class=\"imageWrapper_af017a imageZoom_af017a clickable_af017a\">\n<div class=\"clickableWrapper_af017a\" tabindex=\"0\" role=\"button\" aria-label=\"圖片\" aria-describedby=\"uid_4\">\n<div class=\"loadingOverlay_af017a\"><img decoding=\"async\" class=\"embedVideoImageComponentInner__623de\" src=\"https://web.archive.org/web/20260413053356im_/https://images-ext-1.discordapp.net/external/LGdu4M_eQzVllG_zvZbZGcmQ2FO5WxqNrcICY7MIIwg/https/i.ytimg.com/vi/tbIVOMXrCQA/hqdefault.jpg?format=webp\" alt=\"圖片\"/><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"embedVideoActions__623de\">\n<div class=\"centerContent__623de\">\n<div class=\"wrapper__926d7\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div><\/div>"}, {"slug": "pre-epq", "cat": "前置任務", "title": "艾靈森林前置（EPQ）", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413050749/https://mapleroyals.net/62850/%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E8%89%BE%E9%9D%88%E6%A3%AE%E6%9E%97epq", "html": "<p>前置任務等級需求LV100<\/p>\n<p>註：需先解過<a href=\"https://web.archive.org/web/20260413050749/https://mapleroyals.net/62747/%e9%90%98%e7%8e%8b%e5%89%8d%e7%bd%ae%e4%bb%8b%e7%b4%b9\">拉圖斯前置<\/a><\/p>\n<hr/>\n<p>解完pap prequest(拉圖斯前置)後頭上會出現燈泡，接完頭上燈泡後去玩具城右邊塔最上面進到森林<\/p>\n<p>跟Yuris<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131002.png\"/>講話他會叫你去找Loha<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131003.png\"/><\/p>\n<p>往左邊走就能找到Loha<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131003.png\"/>，他會請你去找Tess<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131007.png\"/><\/p>\n<p>找到Tess<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131007.png\"/>後需要蒐集200個蝸牛殼(Moss Snail Shell)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplelegends.com/static/images/lib/item/04000436.png\"/><\/p>\n<p>拿蝸牛殼(Moss Snail Shell)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplelegends.com/static/images/lib/item/04000436.png\"/>給Loha<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131003.png\"/>完成任務，再去樹屋內找Athena Pierce<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131000.png\"/><\/p>\n<p>跟Athena Pierce<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131000.png\"/>講完話後跟隔壁Perzen<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131001.png\"/>講話<\/p>\n<p>Perzen<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131001.png\"/>會要你蒐集100個Forest Stone<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplelegends.com/static/images/lib/item/04033109.png\"/>(有接任務才看的到，打樹跟蝸牛都有)，解完這邊的任務就告一個段落<\/p>\n<p>出去外面找Yuris<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131002.png\"/>，然後從右邊的傳點過2張圖找Ellin<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2133000.png\"/><\/p>\n<p>用50個蝸牛殼(Moss Snail Shell)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplelegends.com/static/images/lib/item/04000436.png\"/>跟Ellin換柳橙再回去找Yuris<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131002.png\"/><\/p>\n<p>Yuris<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131002.png\"/>會請你去找樹屋內的Athena Pierce<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131000.png\"/><\/p>\n<p>Athena Pierce<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131000.png\"/>會請你去地圖：【Western Region of Mossy Tree Forest 2】找Shadrion<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2132003.png\"/><\/p>\n<p>Shadrion<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2132003.png\"/>會要你打999隻Tree Rod<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/monsters/4250001.png\"/>，這時候妳可以先去跟Tess<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131007.png\"/>接任務，他有個任務需要200個掉落物，可以一起解<\/p>\n<p>打完999隻後找Athena Pierce<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131000.png\"/>回報任務，他會請你去找Lohd<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2132001.png\"/>，Lohd<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2132001.png\"/>的位置在Mushroom Hill<\/p>\n<p>Lohd<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2132001.png\"/>會請玩家擊殺999隻Mossy Mushroom<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/monsters/5250000.png\"/>，這時候可以先去找Loha<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131003.png\"/>講話蒐集200個Black Mushroom Spore<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplelegends.com/static/images/lib/item/04000437.png\"/>可以一起解，任務流程如下:<\/p>\n<p>與Loha<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131003.png\"/>對話完會請你去最左邊帳篷找Sion<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131005.png\"/>，對話完再回去找Loha<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131003.png\"/>講話<\/p>\n<p>Loha<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131003.png\"/>會請你去跟Perzen<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131001.png\"/>講話，他會請玩家蒐集200個Black Mushroom Spore<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplelegends.com/static/images/lib/item/04000437.png\"/><\/p>\n<p>與Perzen<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131001.png\"/>講完話後去找Sion<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131005.png\"/>，他會請你去找Rius<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2132002.png\"/>，位置在Mossy Tree Forest Trail，並蒐集200個Rubble<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplelegends.com/static/images/lib/item/04000439.png\"/>後回報<\/p>\n<p>(石蟲-Stone Bug<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/monsters/5250001.png\"/>掉落物)<\/p>\n<p>回到露營地找Loha<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131003.png\"/>，並前往Boulder Mountait Entrance與Kanderune<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2132000.png\"/>對話，他會請玩家打999隻山豬(Primitive Boar)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/monsters/5250002.png\"/><\/p>\n<p>打完999隻Primitive Boar<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/monsters/5250002.png\"/>後與Kanderune<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2132000.png\"/>對話，他會請玩家蒐集200個Tough Leather<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplelegends.com/static/images/lib/item/04000440.png\"/>(Primitive Boar<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/monsters/5250002.png\"/>掉落)並前往Deep Inside the Cave打倒碴烏(Chao)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplestory.io/api/SEA/198/mob/5250004/render/stand\"/>取得Chao’s Tusk<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/items/04000674.png\"/><\/p>\n<p>註:需組隊進場，單人組隊也可以，一天只能進場2次<\/p>\n<hr/>\n<p>與Kanderune<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2132000.png\"/>回報任務後回去露營地找Loha<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131003.png\"/>完成任務<\/p>\n<p>與Yuris<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131002.png\"/>對話後去最右邊找Ellin<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2133000.png\"/>，再去找Athena Pierce<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131000.png\"/>對話後與Perzen<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131001.png\"/>對話<\/p>\n<p>Perzen<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131001.png\"/>會要求玩家擊殺遠古妖精(Ancient Fairy)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplestory.io/api/SEA/198/mob/5250005/render/stand\"/>與光明妖精/Shining Fairy)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplestory.io/api/SEA/198/mob/5250006/render/stand\"/>各999隻<\/p>\n<p>各打完999之後回報任務，Perzen<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://royals-library.netlify.app/images/npcs/2131001.png\"/>會要求玩家前往Fairy Forest 3 的隱藏傳點擊敗艾畢奈亞(Ephenia)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplestory.io/api/SEA/198/npc/2133007/icon/\"/><\/p>\n<p>註:需組隊進場，單人組隊也可以，一天只能進場2次<\/p>\n<hr/>\n<p>回報完任務後艾靈森林前置就全部完成了，並贈送這個勳章(Ellin Forest Guardian)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050749im_/https://maplestory.io/api/SEA/198/item/1142363/icon?resize=1.0\"/>作為獎勵<\/p>\n<p>EPQ組隊任務請參考-<a href=\"https://web.archive.org/web/20260413050749/https://royals.ms/forum//threads/ellin-forest-party-quest-guide-epq.185329/#post-1081715\">https://royals.ms/forum//threads/ellin-forest-party-quest-guide-epq.185329/#post-1081715<\/a><\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-tot", "cat": "前置任務", "title": "時間神殿前置介紹", "ts": "2026-08-23", "wb": "https://web.archive.org/web/20260823170221/https://mapleroyals.net/62869/%E6%99%82%E9%96%93%E7%A5%9E%E6%AE%BF%E5%89%8D%E7%BD%AE%E4%BB%8B%E7%B4%B9", "html": "<p>通稱999任務<\/p>\n<hr/>\n<p>從神木村機場往上爬，可以變成龍飛到時間神殿<\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://mapleroyals.net/wp-content/uploads/2025/03/TOT_MAP.png\"/><\/p>\n<p>每一張圖最下層的中柱都有一個傳點可以往上方中柱互通 以及第二個捷徑位置<\/p>\n<hr/>\n<p><strong>回憶之路任務區<\/strong><\/p>\n<p>與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>對話，接下個階段任務<\/p>\n<p>打倒999隻Memory Monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200001.png\"/>(任務等級LV91+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒999隻Memory Monk Trainee<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200002.png\"/>(任務等級LV94+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒999隻Memory Guardian<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200003.png\"/>(任務等級LV98+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒999隻Chief Memory Guardian<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200004.png\"/>(任務等級LV101+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒1隻Dodo<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8220004.png\"/>(任務等級LV103+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>與<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>接下任務後找Memory Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140001.png\"/>對話，然後找自己職業的一轉教官對話<\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplestory.io/api/SEA/198/npc/10202/icon/\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplestory.io/api/SEA/198/npc/10201/icon/\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/1012100.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/1052001.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\"/><\/p>\n<hr/>\n<p><strong>悔恨之路任務區<\/strong><\/p>\n<p>與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>對話，接下個階段任務<\/p>\n<p>打倒999隻Qualm Monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200005.png\"/>(任務等級LV106+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒999隻Qualm Monk Trainee<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200006.png\"/>(任務等級LV109+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒999隻Qualm Guardian<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200007.png\"/>(任務等級LV113+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒999隻Chief Qualm Guardian<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200008.png\"/>(任務等級LV116+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒1隻Lilynouch<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8220005.png\"/>(任務等級LV120+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>與<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>接下任務後找Sorcerer<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140002.png\"/>，花1M買一瓶毒藥，喝了會立即死亡然後通過任務<\/p>\n<hr/>\n<p><strong>忘卻之路任務區<\/strong><\/p>\n<p>與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>對話，接下個階段任務<\/p>\n<p>打倒999隻Oblivion Monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200009.png\"/>(任務等級LV121+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒999隻Oblivion Monk Trainee<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200010.png\"/>(任務等級LV124+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒999隻Oblivion Guardian<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200011.png\"/>(任務等級LV128+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒999隻Chief Oblivion Guardian<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200012.png\"/>(任務等級LV131+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>打倒1隻Lyka<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8220006.png\"/>(任務等級LV135+)，然後與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>回報<\/p>\n<p>與<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\"/>接下任務後找Record Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140003.png\"/>，收集以下道具<\/p>\n<p>Smiley Mask<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplelegends.com/static/images/lib/item/04000446.png\"/>x10<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200001.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200002.png\"/><\/p>\n<p>Neutral Mask<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplelegends.com/static/images/lib/item/04000451.png\"/>x10<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200005.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200006.png\"/><\/p>\n<p>Frowny Mask<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplelegends.com/static/images/lib/item/04000456.png\"/>x10<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200009.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8200010.png\"/><\/p>\n<p>Whale&#8217;s Helmet<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplelegends.com/static/images/lib/item/04000460.png\"/>x1<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8220004.png\"/><\/p>\n<p>Knight&#8217;s Mask<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplelegends.com/static/images/lib/item/04000461.png\"/>x1<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8220005.png\"/><\/p>\n<p>Guardian&#8217;s Horn<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplelegends.com/static/images/lib/item/04000462.png\"/>x1<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8220006.png\"/><\/p>\n<p>收集完畢回報可獲得Marble of Chaos<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplestory.io/api/SEA/198/item/4032002/icon?resize=1.0\"/>，至此任務全結束<\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-tokyo", "cat": "前置任務", "title": "東京前置介紹", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517182956/https://mapleroyals.net/62765/%E6%9D%B1%E4%BA%AC%E5%89%8D%E7%BD%AE%E4%BB%8B%E7%B4%B9", "html": "<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-642034424170545183 uid_1 message-content-642034424170545183 uid_2 message-timestamp-642034424170545183\">\n<div>\n<div id=\"message-content-642034424170545183\">\n<div>\n<h2 role=\"img\"><strong>前置任務區：任務等級需求135+<\/strong><\/h2>\n<\/div>\n<div>LV135+ 與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\"/>對話，可提前持有以下道具，解完後可前往東京台場(通稱東1)<\/div>\n<div>忍者頭目的卷軸(Ninto Scroll)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04000340.png\"/>×300<\/div>\n<div>鎧甲武士的頭盔(Samurai Knight Armor Piece)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04000342.png\"/>×1<\/div>\n<div>蟾蜍的油(Toad Oil)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04000343.png\"/>×1<\/p>\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div role=\"group\" aria-label=\"訊息操作\">\n<h2 role=\"img\"><strong>東一任務區：任務等級需求135+<\/strong><\/h2>\n<div role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div>\n<div id=\"message-content-642035000237359153\">\n<div>LV135+ 與Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\"/>對話收集Overlord Lens<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032156.png\"/>×100 後與Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\"/>對話回報任務續接任務從Afterroad<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://image.royals.wiki/monster/9400253.png\" alt=\"image\"/>收集Operational Unit<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032151.png\"/>X1(接任務後才會掉落)後與Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\"/>對話回報任務續接任務從Afterroad<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://image.royals.wiki/monster/9400253.png\" alt=\"image\"/>收集Conductive Polymer Gain<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032153.png\"/> x 1+Calculating Domino<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032154.png\"/> x 1(接任務後才會掉落)從Overlord<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400254.png\"/>收集Macromolecule Actualater<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032152.png\"/> x 1(接任務後才會掉落)與Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\"/>對話回報任務續接任務<\/p>\n<\/div>\n<div><\/div>\n<div> 遠征隊型態：三人以上隊伍擊倒Vergamot<img decoding=\"async\" class=\"\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400263.png\" width=\"210\" height=\"213\"/><\/div>\n<div><\/div>\n<div>與Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\"/>對話回報任務結束此區任務，與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\"/>對話，可前往東京公園地圖(通稱東2)<\/div>\n<\/div>\n<div>\n<hr/>\n<\/div>\n<div id=\"message-content-642035000237359153\">\n<h2><strong>東二任務區：任務等級需求135+<\/strong><\/h2>\n<p>與Dida(幼年型)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400261.png\"/>對話，從Protoroad<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://image.royals.wiki/monster/9400255.png\" alt=\"image\"/>收集Twisted Radar<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032158.png\"/> x 1(接任務後才會掉落)後與Dida(幼年型)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400261.png\"/>對話回報任務<\/p>\n<\/div>\n<p>開啟組隊狀態，與Dida(幼年型)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400261.png\"/>接下保護任務，10分鐘內從保護地圖內的<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400259.png\"/>由隊長收集Energy Transmitter<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032192.png\"/> x 10後回報任務即可通關<\/p>\n<p>註：裡面的怪物可以暈眩/蝸牛/凍結/砸鬼神之擊，<\/p>\n<p>解完任務後與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\"/>對話，可前往東京秋葉原地圖(通稱東3)<\/p>\n<hr/>\n<h2><strong>東三任務區-<\/strong><strong>任務等級需求138+<\/strong><\/h2>\n<p>註：論壇<a href=\"https://web.archive.org/web/20260517182956/https://royals.ms/forum/threads/guide-to-neo-tokyo.146864/\">原文<\/a>表示進場135等，打王138等，但是2026年的現在有玩家反饋進場打道具就要LV138了<\/p>\n<p>ㄌ依據與NPC-Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\"/>+ Commander Garuda<img decoding=\"async\" class=\"alignnone size-full wp-image-66866\" src=\"https://web.archive.org/web/20260517182956im_/http://mapleroyals.net/wp-content/uploads/2025/03/commander-garuda.png\" width=\"62\" height=\"98\"/>+Captain Maricias<img loading=\"lazy\" decoding=\"async\" class=\"alignnone size-full wp-image-66867\" src=\"https://web.archive.org/web/20260517182956im_/http://mapleroyals.net/wp-content/uploads/2025/03/captain-maricias.png\" width=\"74\" height=\"89\"/>接下任務<\/p>\n<p>從<span>Eruwater<\/span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400260.png\"/>收集Eruwater Laser Gun<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032161.png\"/> x300+Eruwater Transmitter<img loading=\"lazy\" decoding=\"async\" class=\"alignnone size-full wp-image-66869\" src=\"https://web.archive.org/web/20260517182956im_/http://mapleroyals.net/wp-content/uploads/2025/03/eruwater-transmitter.png\" width=\"30\" height=\"31\"/> x 1(接任務後才會掉落)<\/p>\n<\/div>\n<div>\n<div role=\"group\" aria-label=\"訊息操作\">\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div role=\"img\" aria-label=\"\">與Commander Garuda<img decoding=\"async\" class=\"alignnone size-full wp-image-66866\" src=\"https://web.archive.org/web/20260517182956im_/http://mapleroyals.net/wp-content/uploads/2025/03/commander-garuda.png\" width=\"62\" height=\"98\"/>回報任務，可進入遠征隊特殊地圖，開啟隊伍-保持隊伍3人以上，打敗Dunas<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400270.png\"/>後回報任務<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-642037194172661810 uid_1 message-content-642037504761135105 uid_2 message-timestamp-642037504761135105\">\n<div>\n<p>然後與與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\"/>對話，續接任務後找Commander Garuda<img decoding=\"async\" class=\"alignnone size-full wp-image-66866\" src=\"https://web.archive.org/web/20260517182956im_/http://mapleroyals.net/wp-content/uploads/2025/03/commander-garuda.png\" width=\"62\" height=\"98\"/>，可前往2102年東京上空(通稱東4)<\/p>\n<hr/>\n<div id=\"message-content-642037504761135105\">\n<h2><strong>東四任務區-<\/strong><strong>任務等級需求138+<\/strong><\/h2>\n<div>\n<p>與<span>Old Fox Flagship AI<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120035.png\"/>對話<\/span>接下任務，打倒Maverick A<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400256.png\"/><span>取得Maverick Type S Laser Gun<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplestory.io/api/SEA/198/item/4000555/icon?resize=1.0\"/>(接任務後才會掉落)<\/span><\/p>\n<p><span>接著與Old Fox Flagship AI<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120035.png\"/>對話，可進入遠征隊特殊地圖，<\/span><\/p>\n<p><span>開啟隊伍-保持隊伍3人以上，打敗Nibergen<img loading=\"lazy\" decoding=\"async\" class=\"\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400271.png\" width=\"313\" height=\"134\"/>後回報任務<\/span><\/p>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div role=\"group\" aria-label=\"訊息操作\">\n<div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div>\n<div role=\"img\" aria-label=\"\">\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div>\n<h2 role=\"img\"><strong>無名魔獸任務區-<\/strong><strong>任務等級需求143+<\/strong><\/h2>\n<\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-642037194172661810 uid_1 message-content-642037725771464704 uid_2 message-timestamp-642037725771464704\"><time id=\"message-timestamp-642037725771464704\" datetime=\"2019-11-07T16:28:42.308Z\" aria-label=\"十一月 08, 2019 上午 12:28\"><\/time><span>與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\"/>對話，可進入遠征隊地圖。<\/span><\/p>\n<div>\n<div id=\"message-content-642037504761135105\">\n<div>\n<p><span>開啟隊伍-保持隊伍3人以上，打敗Nameless Magic Monster<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400266.png\"/>後回報任務<\/span><\/p>\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div role=\"group\" aria-label=\"訊息操作\">\n<div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div>\n<h2 role=\"img\"><strong>杜那斯V2任務區-<\/strong><strong>任務等級需求143+<\/strong><\/h2>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-720248585161015349 uid_1 message-content-720248585161015349 uid_2 message-timestamp-720248585161015349\">\n<div>\n<div id=\"message-content-720248585161015349\">\n<div>\n<p><span>與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\"/>對話，<\/span>然後回神木村找四轉教官, 2.再回卡姆那找<span>Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\"/><\/span>,任務就完成<\/p>\n<p>接著與<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120047.png\"/>接任務，<span>可進入遠征隊地圖<\/span><\/p>\n<p><span>開啟隊伍-保持隊伍3人以上，<\/span>打敗Dunas Unit<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400293.png\"/>+Dunas<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400295.png\"/><span>後回報任務<\/span><\/p>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div role=\"group\" aria-label=\"訊息操作\">\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div>\n<div role=\"img\" aria-label=\"\">\n<hr/>\n<h2><strong>Core Blaze任務區-<strong>任務等級需求146+以及LV150+<\/strong><\/strong><\/h2>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div role=\"img\" aria-label=\"\">與<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120047.png\"/>接任務，可以進入2102六本木地圖<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<div role=\"img\" aria-label=\"\"><span>開啟隊伍-保持隊伍3人以上，<\/span>打敗Core Blaze<img loading=\"lazy\" decoding=\"async\" class=\"\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400296.png\" width=\"374\" height=\"176\"/>後，LV150的狀況下可以續接任務<\/div>\n<div role=\"img\" aria-label=\"\">打敗Auf Haven<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400289.png\"/>後會被傳送到任務地圖，與裡面的NPC對話完畢後找<span>Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\"/>對話<\/span><\/div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<div role=\"img\" aria-label=\"\">會獲得50000000 exp，任務全結束<\/div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-724820880986734665 uid_1 message-content-724820880986734665 uid_2 message-timestamp-724820880986734665\">\n<div role=\"group\" aria-label=\"訊息操作\">\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"wpdevar_comment_1\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-lhc", "cat": "前置任務", "title": "LHC 圖騰交換前置任務", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517181146/https://mapleroyals.net/lhc-%E5%9C%96%E9%A8%B0%E4%BA%A4%E6%8F%9B%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99", "html": "<div role=\"document\">\n<div id=\"chat-messages-867450430015668304\" class=\"message-2qnXI6 cozyMessage-3V1Y8y groupStart-23k01U wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">\n<h6 role=\"document\"><strong>交換任務 (獅子王城轉蛋前置任務)：<\/strong><\/h6>\n<\/div>\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">【任務需求等級LV143】跟第二座塔的NPC穆特(Murt)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260517181146/https://cdn.discordapp.com/attachments/867432352493207572/867450429800185896/murt.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://media.discordapp.net/attachments/867432352493207572/867450429800185896/murt.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://maplestory.io/api/SEA/198/npc/2160000/icon/\"/><\/a>對話<\/div>\n<div><\/div>\n<div><\/div>\n<div><\/div>\n<div><\/div>\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">將信件送回冰原雪城找亞凱斯特(Alcaster)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://royals-library.netlify.app/images/npcs/2020005.png\"/><\/div>\n<div><\/div>\n<\/div>\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\">\n<div class=\"removeAttachmentButton-2qVPxg\" tabindex=\"0\" role=\"button\" aria-label=\"移除訊息附件\"><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV isHeader-2dII4U\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\">\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"加入反應\" aria-controls=\"popout_971\" aria-expanded=\"false\"><\/div>\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_972\" aria-expanded=\"false\">接著從亞凱斯特身上接取任務：亞凱斯特的水晶(Alcaster’s Crystal)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://maplestory.io/api/SEA/198/item/2430159/icon?resize=1.0\"/>，<del>如果遺失要<\/del><s><del>付<\/del>錢買一個跟時間神殿混沌之石長得一模一樣的東西<\/s><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"document\">\n<div id=\"chat-messages-867450996707819540\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\"><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260517181146/https://cdn.discordapp.com/attachments/867432352493207572/867450996534804540/unknown.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://media.discordapp.net/attachments/867432352493207572/867450996534804540/unknown.png?width=400&amp;height=154\"/><\/a> <\/p>\n<div class=\"removeAttachmentButton-2qVPxg\" tabindex=\"0\" role=\"button\" aria-label=\"移除訊息附件\"><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\">\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"編輯\">此項道具在USE消耗欄位內，回去找NPC穆特(Murt)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://maplestory.io/api/SEA/198/npc/2160000/icon/\"/>，然後使用它<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"chat-messages-867451187347324958\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\">\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_1032\" aria-expanded=\"false\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"chat-messages-867452019941965866\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">接著就可以將在獅子王城內所得到的淨化圖騰<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://maplelegends.com/static/images/lib/item/04000630.png\"/> (Purification Totem)跟NPC穆特(Murt)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://maplestory.io/api/SEA/198/npc/2160000/icon/\"/>對話做隨機抽獎 一次要25個<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"document\">\n<div id=\"chat-messages-867452019941965866\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\"><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260517181146/https://cdn.discordapp.com/attachments/867432352493207572/867452020104757278/unknown.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://media.discordapp.net/attachments/867432352493207572/867452020104757278/unknown.png?width=400&amp;height=171\"/><\/a> <\/p>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"chat-messages-867452185922240542\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">\n<div class=\"markup-2BOw-j messageContent-2qWWxC\"><\/div>\n<\/div>\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\"><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260517181146/https://cdn.discordapp.com/attachments/867432352493207572/867452185716588554/unknown.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://media.discordapp.net/attachments/867432352493207572/867452185716588554/unknown.png?width=400&amp;height=187\"/><\/a><\/div>\n<\/div>\n<\/div>\n<div>主力為：CS, WS, BWG, Taru Totem<\/div>\n<div><\/div>\n<\/div>\n<div role=\"document\">論壇分享獎勵池文章：<a href=\"https://web.archive.org/web/20260517181146/https://royals.ms/forum/lhc-exchange-rewards-cs-ws-bwg-taru-totem-rewards-found.193830/#post-1138891\">https://royals.ms/forum/lhc-exchange-rewards-cs-ws-bwg-taru-totem-rewards-found.193830/#post-1138891<\/a><\/div>\n<div role=\"document\"><\/div>\n<div role=\"document\">玩家分享獎勵機率：<a href=\"https://web.archive.org/web/20260517181146/https://royals.ms/forum/threads/results-from-2575-lhc-totems.195508/\">https://royals.ms/forum/threads/results-from-2575-lhc-totems.195508/<\/a>(其實不準..)<\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-bpq", "cat": "前置任務", "title": "魔王巴洛谷前置任務（BPQ）", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517175129/https://mapleroyals.net/65753/balrog-pq%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99", "html": "<p><span>1）首先到勇士之村找麥吉(Manji )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://royals-library.netlify.app/images/npcs/1022002.png\"/>接任務【<\/span>Manji&#8217;s Request<span>】，接好後他會把你傳送到神廟底層<\/span><\/p>\n<p><img decoding=\"async\" class=\"alignnone size-full wp-image-66357\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ1.png\" width=\"540\" height=\"297\" srcset=\"https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/BPQ1.png 540w, https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/BPQ1-300x165.png 300w\" sizes=\"(max-width: 540px) 100vw, 540px\"/><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ2.png\"/><\/p>\n<p><span>（2）跟Mu Young<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061018/icon/\"/>對話，接任務【<\/span>Stay Away From Strangers<span>】<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ3.png\" alt=\"http://mapleroyals.net/wp-content/uploads/2025/04/BPQ2.png\" width=\"538\" height=\"205\"/><\/p>\n<p><span>（3）從階梯往上爬跟Suspicious man<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061016/icon/\"/>對話後，與Mu Young<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061018/icon/\"/>回報，此時續接任務【<\/span>A Letter to the Master<span>】<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ4.png\"/><\/p>\n<p><span>（4）往上爬離開神廟底層(此時最好紀錄一下傳送點：【Another Entrance】，因為筆記本就在前一張地圖而已，不然去撿筆記的時候要走很久)<\/span><\/p>\n<p><span>回到勇士之村找麥吉(Manji )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://royals-library.netlify.app/images/npcs/1022002.png\"/> 接任務【<\/span>A Request to His Apprentice<span>】<\/span><\/p>\n<p><span>他會要你幫他找掉落在The tunnel that lost light的筆記<\/span><\/p>\n<p><span>（5）筆記在The tunnel that lost light 2 的左下方<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ5.png\"/><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ6.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ7.png\"/><\/p>\n<p><span>（6）撿到筆記後去找Mu Young<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061018/icon/\"/>解讀<\/span><\/p>\n<p><span>（7）接下來Mu Young<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061018/icon/\"/>會把你傳送到一個小房間 你要打倒一隻巴洛古<\/span><\/p>\n<p><span>（8） 打倒後跟出現的NPC 崔斯坦的靈魂(Tristan&#8217;s Spirit )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061017/icon/\"/>對話<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ8.png\"/><\/p>\n<p><span>（9）對話後離開房間跟Mu Young<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061018/icon/\"/>對話接下任務【Restraining Balrog】 接下來就可以挑戰魔王巴洛古了<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ9.png\"/><\/p>\n<p><span>遠征隊組成需求需3-6人 等級75-99之間，每天可以打兩場<\/span><\/p>\n<hr/>\n<p><span>備註1：跟崔斯坦的靈魂(Tristan&#8217;s Spirit )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061017/icon/\"/>說完話後會出現“因為不確定的錯導致任務中斷” 不用理他 直接離開房間就好 <\/span><\/p>\n<p><span>備註2:神廟底層在這張地圖的最下方 大門進去<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ10.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ11.png\"/><\/p>\n<p>備註3：前置解完後，以後可以跟<span>麥吉(Manji )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://royals-library.netlify.app/images/npcs/1022002.png\"/> 用500000傳送到神廟<\/span><\/p>\n<p><img loading=\"lazy\" decoding=\"async\" class=\"alignnone size-full wp-image-66531\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/image-2.png\" width=\"522\" height=\"205\" srcset=\"https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/image-2.png 522w, https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/image-2-300x118.png 300w\" sizes=\"(max-width: 522px) 100vw, 522px\"/><\/p>\n<hr/>\n<p>頭部HP25M，怕雷<\/p>\n<p>右手HP12.5M，怕冰<\/p>\n<p>左手HP12.5M，怕火<\/p>\n<p><img loading=\"lazy\" decoding=\"async\" class=\"alignnone size-full wp-image-66486\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ.jpg\" width=\"883\" height=\"567\" srcset=\"https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/BPQ.jpg 883w, https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/BPQ-300x193.jpg 300w, https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/BPQ-768x493.jpg 768w\" sizes=\"(max-width: 883px) 100vw, 883px\"/><\/p>\n<div id=\"wpdevar_comment_1\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-marry", "cat": "前置任務", "title": "結婚手冊", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517180232/https://mapleroyals.net/1657/get-marry", "html": "<p><span><span><span>必須先訂婚，再結婚<\/span><\/span><\/span><\/p>\n<hr/>\n<p>目前版本可接受同性/異性結婚，角色需求等級 10<\/p>\n<p>分為大禮堂登記以及禮拜堂登記兩種<\/p>\n<p>(活動期間時，以50%NX可購入卷)<\/p>\n<hr/>\n<p>情人節時為半價<\/p>\n<p>大禮堂14500 / 12500<\/p>\n<p>禮拜堂12000 / 10000  只需要一份就可以了（由男方支付）<\/p>\n<p>非情人節時恢復成原價<\/p>\n<p>大禮堂29000 / 25000<\/p>\n<p>禮拜堂24000 / 20000 只需要一份就可以了（由男方支付）<\/p>\n<hr/>\n<h6><span>訂婚流程<\/span><\/h6>\n<p>首先先從自由商場(情人節活動時限定)<\/p>\n<p>或是弓箭手村(Henesys)找 Thomas Swift<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201022.png\"/>前往結婚小鎮(Amoria)<\/p>\n<p>接著找Moony <img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201000.png\"/><\/p>\n<p>他會要求四個證明【注意，取得四種證明的角色將會認定為新郎(Groom)身分】<\/p>\n<p>可在墮落城市 / 弓箭手村 / 魔法森林 / 勇士之村 / 天空之城 / 玩具城<\/p>\n<p>找妖精 NANA （K / H / E / P / O / L ）← 英文表示各自所屬村莊<\/p>\n<ul>\n<li><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201023.png\"/>墮落城市(Kerning City) &#8211; 40 個莿菇菇的傘<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/items/04000015.png\"/>((Horny Mushroom Cap)<\/li>\n<li><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201001.png\"/>弓箭手村(Henesys)- 40 個菇菇寶貝傘<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/items/04000001.png\"/>(Orange Mushroom Cap)<\/li>\n<li><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201024.png\"/>魔法森林(Ellinia) &#8211; 20 個柔軟的羽毛<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/items/04003005.png\"/>(Soft Feather)<\/li>\n<li><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201027.png\"/>勇士之村(Perion)  &#8211; 40 個木柴<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/items/04000018.png\"/>(Firewood )<\/li>\n<li><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201025.png\"/>天空之城(Orbis) &#8211; 20 個小石球的碎片<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/items/04000063.png\"/>(Sentinel Shellpiece)<\/li>\n<li><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201026.png\"/>玩具城(Ludibrium) &#8211; 30 個泰迪熊的棉花<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/items/04000106.png\"/>(Teddy&#8217;s Cotton)<\/li>\n<\/ul>\n<p>六種選四種換取就好(通常會捨棄天空之城跟玩具城，太遠了)<\/p>\n<p>回去找<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201000.png\"/> Moony，他會問你想做哪一種戒指<\/p>\n<p>中間的寶石可以選擇月石、星石、金礦、銀礦其中一種<\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://i.gyazo.com/a11b8e1af016db99b5c05bb71fd8668e.png\" alt=\"[​IMG]\"/><\/p>\n<p>完整一套的樣子<\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://i.postimg.cc/Kj4BJGRd/Ring-Effects.jpg\" alt=\"[​IMG]\"/><\/p>\n<p>以上就做好戒指了，男方輸入 IGN（in-game name），女方同意後，對方會獲得一枚戒指<\/p>\n<p>接著要從<span>大禮堂<\/span>或是<span>禮拜堂<\/span>選一個作登記結婚<\/p>\n<hr/>\n<p><span>選擇大禮堂的玩家<\/span><\/p>\n<p>買好 12500 NX 的結婚卷之後，找修女 Assistant Nicole <img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201005.png\"/>講話<\/p>\n<p>輸入對方姓名，另一半同意後<\/p>\n<p>找修女 Victoria <img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201013.png\"/>確認賓客數量，雙方會出現邀請名單<\/p>\n<p>也可以保持空白，不邀請，若有邀請好友要請他們重登會有邀請函的通知<\/p>\n<p>都輸入完畢後會出現視窗，登記成功<\/p>\n<p>確認人數後 找 High Priest John<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201002.png\"/>，他會請你取得父母的祝福<\/p>\n<p>接著找爸媽，爸媽會要女方再取得兩份 NANA 的證明<\/p>\n<p>【註：從六個村莊再選兩個NANA就好，前面有解過的可以再解一次】<\/p>\n<p>取得證明後回報會給你父母的祝福 <img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/http://i.imgur.com/R476bQe.png\" alt=\"[​IMG]\"/><\/p>\n<div class=\"body\">\n<div class=\"message-text\">\n<div class=\"markup\">重新找High Priest John<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201002.png\"/>對話，會給你證明<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/http://i.imgur.com/5onh4Zf.png\" alt=\"[​IMG]\"/><\/div>\n<\/div>\n<\/div>\n<div><\/div>\n<div class=\"message first\">\n<div class=\"body\">\n<div class=\"message-text\">\n<div class=\"markup\">最後找 Assistant Nicole <img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201005.png\"/> 選第一個選項就直接進場結婚完成（記得雙方要組隊進場）<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message\">\n<div class=\"body\">\n<div>&#8212;<\/div>\n<\/div>\n<\/div>\n<div><\/div>\n<div>\n<hr/>\n<\/div>\n<p><span>選擇禮拜堂的玩家<\/span><\/p>\n<div class=\"message first\">\n<div class=\"body\">\n<div class=\"message-text\">\n<div class=\"markup\">禮拜堂 NPC 找 Wayne<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201012.png\"/><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message\">\n<div class=\"body\">\n<div class=\"message-text\">\n<div class=\"btn-option\"><\/div>\n<div class=\"btn-reaction\"><\/div>\n<div class=\"markup\">輸入 IGN 並且同意後，對方會獲得一枚戒指<\/div>\n<\/div>\n<\/div>\n<div class=\"accessory\"><\/div>\n<\/div>\n<div class=\"message\">\n<div class=\"body\">\n<div class=\"message-text\">\n<div class=\"btn-reaction\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message\">\n<div class=\"body\">\n<div class=\"message-text\">\n<div class=\"btn-reaction\"><\/div>\n<div class=\"markup\">再次輸入結婚對象的 IGN 會出現視窗<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message\">\n<div class=\"body\">\n<div class=\"message-text\">\n<div class=\"btn-option\"><\/div>\n<div class=\"btn-reaction\"><\/div>\n<div class=\"markup\">雙方都會出現邀請名單，可以空白，兩邊都輸入完畢後會出現視窗表示登記成功<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message\"><\/div>\n<div class=\"message\">\n<div class=\"accessory\"><\/div>\n<\/div>\n<div class=\"message\">\n<div class=\"body\">\n<div class=\"message-text\">\n<div class=\"btn-option\"><\/div>\n<div class=\"markup\">接著找 Assistant Bonnie <img decoding=\"async\" src=\"https://web.archive.org/web/20260517180232im_/https://royals-library.netlify.app/images/npcs/9201008.png\"/><\/div>\n<\/div>\n<\/div>\n<\/div>\n<p>就完成登記進場了<\/p>\n<p>等待時間到，出現已婚訊息<\/p>\n<p>恭喜完成結婚!<\/p>\n<hr/>\n<p>若有賓客想要一起進場的話<\/p>\n<p>填寫完之後 背包其他欄會收到要寄給賓客的邀請函(新人雙方各有15張)<\/p>\n<p>&#8212; 此時先不要進場結婚 新人先寄出邀請函<\/p>\n<p>(要參加典禮的賓客需持有邀請函才能進場)<\/p>\n<p>確定好要來的賓客的時間之後  新人和賓客全部都一起到結婚禮堂進場NPC旁邊 此時新人再進場<\/p>\n<p>&#8212; 新人進場後先不要點NPC開始典禮 先等賓客全部進場再開始 (典禮過程需在進場後10分鐘之內完成)<\/p>\n<p>&#8212; 賓客在新人進場後，典禮開始前 帶著邀請函找進場NPC進入禮堂 賓客會先到送禮室 此時會顯示男女雙方當初所填寫的賀禮清單 這時就要放入背包裡準備好的禮物 然後才能真正進到結婚禮堂<\/p>\n<p>婚禮全部完成後 要找結婚小鎮右上角的NPC領取賓客送的禮物<\/p>\n<hr/>\n<p>註：有能力值的戒指是情人節活動送的，結婚取得的戒指沒有能力值。<\/p>\n<p><img decoding=\"async\" class=\"aligncenter\" src=\"https://web.archive.org/web/20260517180232im_/http://puu.sh/lEWLS/f3f99777fa.png\" width=\"228\" height=\"298\"/><\/p>\n<div id=\"wpdevar_comment_1\">\n <span><\/span>\n <\/div>"}, {"slug": "job-2nd", "cat": "轉職", "title": "二轉流程", "ts": "2026-06-10", "wb": "https://web.archive.org/web/20260610121938/https://mapleroyals.net/noobs-guides/job-advancement/2nd-job-advancement", "html": "<div class=\"jspContainer\">\n<div class=\"jspPane\">\n<div id=\"bulletin\">\n<p><strong>法師二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數需使用完畢 / 已轉職成為法師的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 魔法森林 / 魔法圖書館 / 找NPC漢斯   取得轉職任務，並到魔法森林北部找(地圖最頂端)NPC法師轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後，回魔法圖書館找漢斯即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。(建議紅、藍水帶多點)<\/p>\n<\/div>\n<\/div>\n<p align=\"LEFT\">【僧侶 – Cleric】【冰雷  – Icer/Lighting】【火毒 – Fire/Posion】<\/p>\n<\/div>\n<div class=\"jspContainer\">\n<hr/>\n<\/div>\n<div class=\"jspContainer\">\n<div class=\"jspPane\">\n<div id=\"bulletin\">\n<p align=\"LEFT\"><strong>劍士二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數需使用完畢 / 已轉職成為劍士的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 勇士之村 / 勇者聖殿 / 找NPC武術教練   取得轉職任務，並到西部岩山IV找NPC戰士轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後回勇者聖殿找武術教練即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<p align=\"LEFT\">【狂戰士 –  Fighter】【槍騎兵  –  Spearman】【見習騎士  – Page】<\/p>\n<hr/>\n<p align=\"LEFT\"><strong>盜賊二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前(含)獲得的技能點數需使用完畢 / 已轉職成為盜賊的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 墮落城市 / 盜賊基地(酒吧) / 找NPC達克魯<\/p>\n<p align=\"LEFT\">     取得轉職任務，並到墮落城市北方工地找NPC盜賊轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後，回盜賊基地找達克魯即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<\/div>\n<p align=\"LEFT\">【刺客 – Assassin】【俠盜 – Bandit】<\/p>\n<div id=\"bulletin\">\n<hr/>\n<p align=\"LEFT\"><strong>弓箭手二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數不需使用完畢 / 已轉職成為弓手的角色<\/p>\n<p align=\"LEFT\">1 . 維多利亞島 / 弓箭手村 / 弓箭手培訓中心 / 找NPC赫麗娜<\/p>\n<p align=\"LEFT\">     取得轉職任務，並到迷官通道找(地圖右上角)NPC弓手轉職教官<\/p>\n<p align=\"LEFT\">2 . 打倒怪物後取得隨機掉落的黑珠30個給教官，換得「英雄証書」後，回弓箭手培訓中心找赫麗娜即可轉職<\/p>\n<p align=\"LEFT\">3 . 完成轉職後獲得一點技能點數，其後每次升級各三點技能點數<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<\/div>\n<p align=\"LEFT\">【獵人 – Hunter】  【弩弓手 – CrossbowMan】<\/p>\n<div id=\"bulletin\">\n<hr/>\n<p align=\"LEFT\"><strong>海盜二轉<\/strong><\/p>\n<p align=\"LEFT\">Lv30以上 / 30級前獲得的技能點數不需使用完畢 / 已轉職成為海盜的角色<\/p>\n<p align=\"LEFT\">1 . 角色必需要先回到維多利亞島東南方海域的鯨魚號，當角色與二轉職教官卡依琳進行對話後，便會對近日來的自我鍛鍊表示鼓勵，並告知只要通過簡單的測試，即可進一步地提升自身能力。<\/p>\n<p align=\"LEFT\">2 . 若玩家同意接受測試，就會讓玩家傳送到試煉地圖裡面打倒怪物，並蒐集15個水晶後拿給他。<\/p>\n<p align=\"LEFT\">3 . 完成這項任務後，將收集好的水晶交給轉職教官，便可選擇轉職成為槍手或打手。<\/p>\n<p align=\"LEFT\">■試煉場內沒有商店，進入前請先做好萬全準備。<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p align=\"LEFT\">【打手 – Brawler】【槍手 – Gunslinger】<\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "job-3rd", "cat": "轉職", "title": "三轉流程", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413043357/https://mapleroyals.net/noobs-guides/job-advancement/3rd-job-advancement", "html": "<p><strong>劍士：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為狂戰士、見習騎士或槍騎兵的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島勇士之村的勇者聖殿，找武術教練 NPC 對話，接受任務得知必須打倒分身。<\/li>\n<li>其分身在螞蟻礦坑裡面的次元裂縫，點擊水晶道路  NPC 往前直進入異次元世界。發現武術教練分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回勇士村，給予<b>黑符<\/b>，可獲得<b>力量項鏈<\/b><b>。<\/b><\/li>\n<li>取得<strong>力量<\/strong><b>項鏈<\/b>，回冰原雪域找戰士長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給戰士長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>法師：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為火毒巫師、冰雷巫師或僧侶的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島魔法森林的圖書館，找漢斯 NPC 對話，接受任務得知必須打倒漢斯分身。<\/li>\n<li>其分身在巫婆森林 II 的次元裂縫，點擊水晶道路 NPC 往前直進入異次元世界。發現漢斯分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回魔法森林，給予漢斯<b>黑符<\/b>，可獲得<b>力量項鏈。<\/b><\/li>\n<li>取得<b>力量項鏈<\/b>，回冰原雪域找法師長老對話，他會要求你接受智慧的考驗<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答兩個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給法師長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>盜賊：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為刺客或俠客的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島墮落城市的盜賊基地（酒吧），找達克魯 NPC 對話，接受任務得知必須打倒達克魯分身。<\/li>\n<li>其分身在猴子沼澤地 II 的次元裂縫<strong>，<\/strong>點擊水晶道路  NPC 往前直進入異次元世界，發現達克魯分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回墮落城市，給予<b>黑符<\/b>，可獲得<strong>力量<\/strong><b>項鏈。<\/b><\/li>\n<li>取得<strong>力量<\/strong><b>項鏈<\/b>，回冰原雪域找盜賊長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給盜賊長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>弓箭手：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為獵人或弩弓手的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島弓箭手村的弓箭手培育中心，找赫麗娜 NPC 對話，接受任務得知必須打倒赫麗娜分身。<\/li>\n<li>其分身在：奇幻村的森林迷宮 V ，點擊水晶道路 NPC 往前直進入異次元世界，發現赫麗娜分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回弓箭手村，給予<b>黑符<\/b>，可獲得<b>力量項鏈。<\/b><\/li>\n<li>取得<b>力量項鏈<\/b>，回冰原雪域找弓箭手長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給弓箭手長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p><strong>海盜：<\/strong><\/p>\n<ol>\n<li>70 等以上，70 等以前獲得的技能點數需使用完畢，且已轉職成為打手或槍手的角色。<\/li>\n<li>到艾納斯島冰原雪域的長老公館，找三轉教官 NPC 對話。<\/li>\n<li>返回維多利亞島鯨魚號的航海室，找卡依琳 NPC 對話，接受任務得知必須打倒卡依琳分身。<\/li>\n<li>其分身在火獨眼獸洞穴 Ⅱ 的次元裂縫，點擊水晶道路 NPC 往前直進入異次元世界，發現卡依琳分身，限時 20 分鐘內打倒取得<b>黑符<\/b>，點選光明水晶回鯨魚號，給予卡依琳<b>黑符<\/b>，可獲得<b>力量項鏈。<\/b><\/li>\n<li>取得<b>力量項鏈<\/b>，回冰原雪域找海盜長老對話，他會要求你接受智慧的考驗。<\/li>\n<li>帶著黑暗水晶成品（玩家自備）到尖銳的絕壁 II 右上方，雪原聖地最下方，找神聖之石 NPC。<\/li>\n<li>點選神聖之石，回答五個問題，全答對可得到<b>智慧項鍊<\/b>，並交回給海盜長老即可轉職。<\/li>\n<li>現今的問題已與正服相符，可至此 <a href=\"https://web.archive.org/web/20260413043357/http://bbb.hidden-street.net/3rd-job-questions\" target=\"_blank\" rel=\"noopener noreferrer\">網站<\/a> 查詢 (由於問法可能有出入，請善用 Ctrl + F 查詢答案選項)。<\/li>\n<\/ol>\n<hr/>\n<p>解答：<\/p>\n<pre><code><span class=\"hljs-section\">[題庫總共有六題]<\/span><\/code><\/pre>\n<pre><code class=\"scrollbarGhostHairline-1mSOM1 scrollbar-3dvm_9 hljs css\"><span class=\"hljs-selector-attr\">[第一個答案會決定整個題庫解答的順序]\n例如：\n<img decoding=\"async\" src=\"https://web.archive.org/web/20260413043357im_/http://mapleroyals.net/wp-content/uploads/2020/07/image0.jpg\"/><\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Fire<\/span> <span class=\"hljs-type\">Boar<\/span> – <span class=\"hljs-type\">Fire<\/span> <span class=\"hljs-type\">Boar<\/span> <span class=\"hljs-type\">Snout<\/span>，解答為 <span class=\"hljs-number\">42513<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Maya<\/span>，解答為 <span class=\"hljs-number\">23525<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Roger<\/span>，解答為 <span class=\"hljs-number\">52354<\/span><\/code><\/pre>\n<pre><code><span class=\"hljs-type\">Sergeant<\/
