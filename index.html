d=\"id6a09ffdb03487\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a09ffdb03487\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>前往冰原雪域的長老會館，帶一名隊長是四轉戰士，且可以與泰勒斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/9300093.png\" alt=\"Image not found\"/><\/span><span>(Tylus)接下任務【Protecting Tylus】，組隊之後進入。<\/span><\/li>\n<li aria-level=\"1\"><span>★任務地圖裡有大量巴洛古和白狼人，開始打怪等待技能書掉落，裡面有這三種書<\/span>\n<ul>\n<li aria-level=\"2\"><span>法師系-魔力無限<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/2121004.png\" alt=\"Image not found\"/><\/span><span>(Infinity)<\/span><\/li>\n<li aria-level=\"2\"><span>弓手系-龍魂箭<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/02280005.png\" alt=\"Image not found\"/> <\/span><span>(Dragon&#8217;s Breath)<\/span><\/li>\n<li aria-level=\"2\"><span>盜賊系-挑釁<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/4121003.png\" alt=\"Image not found\"/><\/span><span>(Taunt)<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/div>\n<hr/>\n<p><span>箭神(BowMaster)：<\/span><span>暴風神射<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121004.png\" alt=\"Image not found\"/><\/span><span>(Hurricane)   <\/span><span>神射手(Marksman)：<\/span><span>光速神弩<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221001.png\" alt=\"Image not found\"/><\/span><span>(Piercing Arrow)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a09ffdb034a7\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a09ffdb034a7\" class=\"collapseomatic_content \">\n<p><span>LV120四轉完成後與神木村-祭司之林的瑞吉爾<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2081300.png\" alt=\"Image not found\"/><\/span><span>(Legor)對話接下任務【The Bowman&#8217;s Inner Eye】後，接著打三種顏色半人馬都會掉落的任務掉寶：赫莉娜的舊手套<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://maplelegends.com/static/images/lib/item/04031465.png\" alt=\"Image not found\"/><\/span><span>(Helena&#8217;s Old Gloves)(任務接受後掉落)。<\/span><\/p>\n<p><span>把赫莉娜的舊手套<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://maplelegends.com/static/images/lib/item/04031465.png\" alt=\"Image not found\"/><\/span><span>(Helena&#8217;s Old Gloves)交給赫麗娜<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1012100.png\" alt=\"Image not found\"/><\/span><span>(Athena Pierce)，完成任務，<\/span><\/p>\n<p><span>箭神(BowMaster)學會<\/span><span>暴風神射<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121004.png\" alt=\"Image not found\"/><\/span><span>(Hurricane)<\/span><\/p>\n<p><span>神射手(Marksman)學會<\/span><span>光速神弩<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221001.png\" alt=\"Image not found\"/><\/span><span>(Piercing Arrow)<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>箭神(BowMaster)：<\/span><span>念力集中<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121008.png\" alt=\"Image not found\"/><\/span><span>(Concentrate)   <\/span><span>神射手(Marksman)：<\/span><span>必殺狙擊<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221007.png\" alt=\"Image not found\"/><\/span><span>(Snipe)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a09ffdb034b7\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a09ffdb034b7\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<p><span>首先身上要持有綠皮書<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04161018.png\" alt=\"Image not found\"/><\/span><span>[Storybook] Ancient Book，這兩種怪物會掉<\/span><\/p>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/8150100.png\" alt=\"Image not found\"/>(Shark )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/8150101.png\" alt=\"Image not found\"/><\/span><span>(Cold Shark)<\/span><\/p>\n<p><span>或是去自由市場買一本<\/span><\/p>\n<p><span>之後才能觸發任務【The Book of Invisible Ink】<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>到赫麗奧斯塔圖書館與<\/span><span>懷茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2040052.png\" alt=\"Image not found\"/><\/span><span>(Wiz the Librarian)<\/span><span>對話接下任務【The Book of Invisible Ink】收集以下掉寶：(可事先準備)<\/span>\n<ul>\n<li aria-level=\"2\"><span>墨汁瓶<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04000183.png\" alt=\"Image not found\"/>(Ink Bottle)X50<\/span><\/li>\n<li aria-level=\"2\"><span>礦泉水<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/02022000.png\" alt=\"Image not found\"/>(Pure Water)X10<\/span><\/li>\n<li aria-level=\"2\"><span>魔法石<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04006000.png\" alt=\"Image not found\"/>(The Magic Rock)X30<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04161018.png\" alt=\"Image not found\"/>[Storybook] Ancient Book X1<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>與<\/span><span>懷茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2040052.png\" alt=\"Image not found\"/><\/span><span>(Wiz the Librarian)<\/span><span>續接任務【The Ancient Book】，獲得破舊的綠皮之書<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04161024.png\" alt=\"Image not found\"/>(Bowman&#8217;s Way)<\/span><\/li>\n<li aria-level=\"1\"><span>接著前往弓箭手村( Henesys)與赫麗娜<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1012100.png\" alt=\"Image not found\"/><\/span><span>(Athena Pierce)對話續接任務【The Bowman&#8217;s Ultimate Skill】<\/span><b>e<\/b><\/li>\n<li aria-level=\"1\"><span>赫麗娜<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1012100.png\" alt=\"Image not found\"/><\/span><span>(Athena Pierce)要求與蕾妮<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2020010.png\" alt=\"Image not found\"/><\/span><span>(Rene)對話，<\/span><span>蕾妮<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2020010.png\" alt=\"Image not found\"/><\/span><span>(Rene)<\/span><span>又要求與邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2022003.png\" alt=\"Image not found\"/><\/span><span>(Shammos)對話，接著是與蕾妮<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2020010.png\" alt=\"Image not found\"/><\/span><span>(Rene)以及邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2022003.png\" alt=\"Image not found\"/><\/span><span>(Shammos)交替對話。<\/span><\/li>\n<li aria-level=\"1\"><span>接著前往奇幻村(Sleepywood)，與記憶者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1061011.png\" alt=\"Image not found\"/><\/span><span>(The Rememberer)對話後，之後與<\/span><span>無意義存在者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1061012.png\" alt=\"Image not found\"/><\/span><span>(Insignificant Being)<\/span><span>對話接下任務【Spiritual Stone of Darkness】，收集黑暗靈魂石<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://maplelegends.com/static/images/lib/item/04031466.png\" alt=\"Image not found\"/><\/span><span>(Dark Soul Rock)50個<\/span>\n<ul>\n<li aria-level=\"2\"><span>由打敗長槍牛魔王<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/7130101.png\" alt=\"Image not found\"/><\/span><span>(Taurospear)以及<\/span><span>月牙牛魔王<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/7130100.png\" alt=\"Image not found\"/>(Tauromacis)掉落。<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><span>接著必須找尋同樣是進行此任務的箭神/神射手組隊，接著再與<\/span><span>無意義存在者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1061012.png\" alt=\"Image not found\"/><\/span><span>(Insignificant Being)<\/span><span>對話交付黑暗靈魂石<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://maplelegends.com/static/images/lib/item/04031466.png\" alt=\"Image not found\"/><\/span><span>(Dark Soul Rock)，，進入任務地圖，20分鐘之內打敗300隻巴洛古<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/8130100.png\" alt=\"Image not found\"/><\/span><span>(Jr. Balrog)<\/span><\/p>\n<p><span>任務完成之後退出任務地圖與無意義存在者<\/span><span>(Insignificant Being)<\/span><span>對話<\/span><\/p>\n<ul>\n<li>\n<ul>\n<li aria-level=\"2\"><span>箭神(BowMaster)習得<\/span><span>念力集中<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121008.png\" alt=\"Image not found\"/><\/span><span>(Concentrate)<\/span><\/li>\n<li aria-level=\"2\"><span>神射手(Marksman)<\/span><span>習得光速神弩<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221007.png\" alt=\"Image not found\"/><\/span><span>(Piercing Arrow)<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/div>\n<hr/>\n<p><span>箭神(BowMaster)：<\/span><span>召喚鳳凰<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121006.png\" alt=\"Image not found\"/><\/span><span>(Phoenix)，需要前置技能-銀鷹召喚LV15<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a09ffdb034d5\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a09ffdb034d5\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>與神木村NPC-庫摩<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2081001.png\" alt=\"Image not found\"/><\/span><span>(Kumo)對話接下任務【Flame Bird】，他要求前往試煉洞窟III(Cave of Trials III)的隱藏地圖-火鳳凰的巢穴，使用普通攻擊敲擊火鳳凰的蛋<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04001113.png\" alt=\"Image not found\"/><\/span><span>(Phoenix&#8217;s Egg)，之後撿取。<\/span><\/li>\n<li aria-level=\"1\"><span>回到神木村與庫摩<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2081001.png\" alt=\"Image not found\"/><\/span><span>(Kumo)對話，前往天空之巢I的隱藏地圖：天空之巢頂端，把蛋放在最上方的平台，計時20分鐘打敗火鳳凰<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/9300089.png\" alt=\"Image not found\"/><\/span><span>(Phoenix)。<\/span><\/li>\n<li aria-level=\"1\"><span>打敗後與庫摩對話即可學會召喚鳳凰<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121006.png\" alt=\"Image not found\"/><\/span><span>(Phoenix)<\/span><\/li>\n<\/ol>\n<\/div>\n<hr/>\n<p><span>神射手(Marksman)：<\/span><span>召喚銀隼<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221005.png\" alt=\"Image not found\"/><\/span><span>(Frostprey)，需要前置技能-金鷹召喚LV15<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a09ffdb034e0\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a09ffdb034e0\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>與神木村亞可之家與NPC-亞可<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2081003.png\" alt=\"Image not found\"/><\/span><span>(Yaku)接下任務【Frostprey】，他要求前往危險的絕壁(Dangerous Cliff)隱藏地圖-冰鳳凰巢穴，使用普通攻擊敲擊冰鳳凰的蛋<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04001114.png\" alt=\"Image not found\"/><\/span><span>(Freezer&#8217;s Egg)，之後撿取。<\/span><\/li>\n<li aria-level=\"1\"><span>回到神木村與亞可<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2081003.png\" alt=\"Image not found\"/><\/span><span>(Yaku)對話，前往天空之巢I的隱藏地圖：天空之巢頂端，把蛋放在最上方的平台，計時20分鐘打敗冰鳳凰<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/9300090.png\" alt=\"Image not found\"/><\/span><span>(Freezer)。<\/span><\/li>\n<li aria-level=\"1\"><span>打敗後與亞可<\/span><span>(Yaku)對話即可學會召喚銀隼<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221005.png\" alt=\"Image not found\"/><\/span><span>(Frostprey)<\/span><\/li>\n<\/ol>\n<\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-thief", "cat": "前置任務", "title": "技能前置任務－盜賊", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413052218/https://mapleroyals.net/%E8%81%B7%E6%A5%AD%E9%81%B8%E6%93%87/%E6%8A%80%E8%83%BD%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E7%9B%9C%E8%B3%8A", "html": "<p><span>三飛閃<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121007.png\" alt=\"Image not found\"/><\/span><span>(Triple Throw)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7d8a0983d\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7d8a0983d\" class=\"collapseomatic_content \">\n<p><span>打炎魔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/8800000.png\" alt=\"Image not found\"/>(Zakum)<\/span><span>會掉<\/span><\/p>\n<p><span>(不可交易)<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>忍術風影<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121008.png\" alt=\"Image not found\"/><\/span><span>(Ninja Storm)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7d8a09860\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7d8a09860\" class=\"collapseomatic_content \">\n<p><span>需先持有來歷不明的信<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04001110.png\" alt=\"Image not found\"/><\/span><span>([Storybook] Unknown Letter) 才能觸發此任務<\/span><\/p>\n<p><span>可從<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/7140000.png\" alt=\"Image not found\"/><\/span><span>(Ghost Pirate)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/7160000.png\" alt=\"Image not found\"/><\/span><span>(Dual Ghost Pirate)獲取，<\/span><\/p>\n<p><span>或是從自由市場買。<\/span><\/p>\n<p><span>任務流程：<\/span><\/p>\n<p><span>從玩具城進露臺中庭(玩具熊地圖)然後一直往左走會到達雲彩陽台(Cloud Balcony)，<\/span><\/p>\n<p><span>此時看不到NPC的，往前走(沒錯，就是一直往左走)進入到一張隐藏地图(Hidden Balcony)<\/span><\/p>\n<p><span>,看到了NPC-盜賊轉職教官。對話後尋找楓葉珠(Maple Leaf Marble)<\/span><\/p>\n<p><span><span><strong>楓葉珠在天空之城公會(建家族的地方)的屋頂上,點房頂上的楓葉標誌,得到楓葉珠<\/strong><\/span><\/span><\/p>\n<p><span>回玩具城進去地圖與<\/span><span>NPC-盜賊轉職教官回報任務後續接任務<\/span><\/p>\n<p><span>接著會被<\/span><span>要求收集：<\/span><\/p>\n<ul>\n<li><span>魔精靈的旋風<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplelegends.com/static/images/lib/item/04031459.png\" alt=\"Image not found\"/><\/span><span>(Boogie’s Cursed Whirlwind) <img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/6130104.png\" alt=\"Image not found\"/>(Boogies from Zakum)<\/span><\/li>\n<li><span>達那托斯的黑色旋風<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplelegends.com/static/images/lib/item/04031458.png\" alt=\"Image not found\"/><\/span><span>(Thanatos&#8217;s Black Tornado) <img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/9300100.png\" alt=\"Image not found\"/>(Thanatos)<\/span><\/li>\n<li><span>格瑞芬多的天鷹的翅膀<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplelegends.com/static/images/lib/item/04031457.png\" alt=\"Image not found\"/><\/span><span>(Griffey Wind)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/8180001.png\" alt=\"Image not found\"/> (Griffey)<\/span><\/li>\n<\/ul>\n<p><span>收集結束之後與四轉盜賊教官海倫<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/2081400.png\" alt=\"Image not found\"/><\/span><span>(Hellin)對話<\/span><\/p>\n<p><span>習得忍術風影<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121008.png\" alt=\"Image not found\"/>(Ninja Storm)<\/span><span>。<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>挑釁<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121003.png\" alt=\"Image not found\"/><\/span><span>(Taunt)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7d8a09885\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7d8a09885\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>前往冰原雪域的長老會館，帶一名隊長是四轉戰士，且可以與泰勒斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/9300093.png\" alt=\"Image not found\"/><\/span><span>(Tylus)接下任務【Protecting Tylus】，組隊之後進入。<\/span><\/li>\n<li aria-level=\"1\"><span>★任務地圖裡有大量巴洛古和白狼人，開始打怪等待技能書掉落，裡面有這三種書<\/span>\n<ul>\n<li aria-level=\"2\"><span>法師系-魔力無限<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/2121004.png\" alt=\"Image not found\"/><\/span><span>(Infinity)<\/span><\/li>\n<li aria-level=\"2\"><span>弓手系-龍魂箭<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/02280005.png\" alt=\"Image not found\"/> <\/span><span>(Dragon&#8217;s Breath)<\/span><\/li>\n<li aria-level=\"2\"><span>盜賊系-挑釁<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121003.png\" alt=\"Image not found\"/><\/span><span>(Taunt)<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/div>\n<hr/>\n<p><span>忍影瞬殺<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121004.png\" alt=\"Image not found\"/><\/span><span>(Ninja Ambush)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7d8a09891\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7d8a09891\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<p><span>四轉完成後與四轉教官海倫<\/span><span>(<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/2081400.png\" alt=\"Image not found\"/>Hellin)對話接下任務【Return of the Dark Lord】，然後去找一轉教官達克魯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/1052001.png\" alt=\"Image not found\"/><\/span><span>(Dark Lord)。<\/span><\/p>\n<p><span>與達克魯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/1052001.png\" alt=\"Image not found\"/><\/span><span>(Dark Lord)對話，接著繼續對話選擇【The One Hidden in the Shadow】，對話結束後，選擇”我想知道關於盜賊”進入修煉場。<\/span><\/p>\n<p><span>時間限制二十分鐘內擊敗六個三轉教官弟子<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\" alt=\"Image not found\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\" alt=\"Image not found\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\" alt=\"Image not found\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\" alt=\"Image not found\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\" alt=\"Image not found\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\" alt=\"Image not found\"/><\/span><span>(Dark Lord&#8217;s Disciple)，都消滅後任務完成，任務失敗可以不斷重複挑戰直到成功為止，弟子經驗受經驗加倍影響。<\/span><\/p>\n<hr/>\n<p><span>與達克魯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/1052001.png\" alt=\"Image not found\"/><\/span><span>(Dark Lord)對話就能學會技能。<\/span><\/p>\n<\/div>\n<hr/>\n<p><span>煙霧彈<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4221006.png\" alt=\"Image not found\"/>(Smokescreen)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id69dc7d8a098a2\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id69dc7d8a098a2\" class=\"collapseomatic_content \">\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>從<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/7130000.png\" alt=\"Image not found\"/>Lucida<\/span><span>打到<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04161021.png\" alt=\"Image not found\"/><\/span><span>[Storybook] Formula for Black Cloud<\/span>\n<ol>\n<li aria-level=\"2\"><span>或從FM購買，持有書本才可以開始任務<\/span><\/li>\n<\/ol>\n<\/li>\n<li aria-level=\"1\"><span>與Orbis Tower &lt;Hughe’s Laboratory&gt;中的<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/2012017.png\" alt=\"Image not found\"/>Hughes the Fuse<\/span><span>交談,人在天空之塔B2,他會要求:<\/span>\n<ol>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04000133.png\" alt=\"Image not found\"/>Dual Pirate&#8217;s Propeller x 10<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04003000.png\" alt=\"Image not found\"/>Screw x 50<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04000183.png\" alt=\"Image not found\"/>Ink Bottle x 100<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04011001.png\" alt=\"Image not found\"/>Steel Plate x 20<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplelegends.com/static/images/lib/item/04031462.png\" alt=\"Image not found\"/>Ventilating Fan x 1【去地球防衛總部找Kay<\/span><span>製作】<\/span>\n<ul>\n<li aria-level=\"3\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04000103.png\" alt=\"Image not found\"/>PropellerX100<\/span><\/li>\n<li aria-level=\"3\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04011001.png\" alt=\"Image not found\"/>Steel PlateX1<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04000115.png\" alt=\"Image not found\"/>Cog x 50<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplelegends.com/static/images/lib/item/04031478.png\" alt=\"Image not found\"/>Long-lasting Battery x 1【去地球防衛總部找Porter<\/span><span>製作製作】<\/span>\n<ul>\n<li aria-level=\"3\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04001084.png\" alt=\"Image not found\"/>Papulatus Certificate<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/li>\n<li aria-level=\"1\"><span>回去找<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/2012017.png\" alt=\"Image not found\"/>Hughes the Fuse<\/span><span>,他會給你電腦<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/02280001.png\" alt=\"Image not found\"/><\/span><span>Black Cloud Machine<\/span><\/li>\n<li aria-level=\"1\"><span>把電腦使用掉就學會煙霧彈<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4221006.png\" alt=\"Image not found\"/>(Smokescreen)了<\/span><\/li>\n<\/ol>\n<\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-pirate", "cat": "前置任務", "title": "技能前置任務－海盜", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517184358/https://mapleroyals.net/%E8%81%B7%E6%A5%AD%E9%81%B8%E6%93%87/%E6%8A%80%E8%83%BD%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E6%B5%B7%E7%9B%9C", "html": "<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5121003.png\" alt=\"Image not found\"/>鬥神降世(Super Transformation)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a0a0c6e5dbc3\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a0a0c6e5dbc3\" class=\"collapseomatic_content \">\n<p><span>任務找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\" alt=\"Image not found\"/><\/span><span>(Kyrin)接任務【How to Improve Your Strength】<\/span><\/p>\n<p><span>進入任務地圖，被<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/9300159.png\" alt=\"Image not found\"/><\/span><span>打兩分鐘不死從右邊傳點離開就能學會<\/span><\/p>\n<\/div>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5121005.png\" alt=\"Image not found\"/>閃索命(Snatch)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a0a0c6e5dbe6\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a0a0c6e5dbe6\" class=\"collapseomatic_content \">\n<p><span>任務找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\" alt=\"Image not found\"/><\/span><span>(Kyrin)接任務【Presence of Mind】<\/span><\/p>\n<ul>\n<li><span>打50顆石之心臟<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplelegends.com/static/images/lib/item/04031872.png\" alt=\"Image not found\"/><\/span><span>(Heart of Stone)<\/span><\/li>\n<li><span>殺死150隻暗黑三角龍<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/8140701.png\" alt=\"Image not found\"/><\/span><span>(Red Dragon Turtle)後回報任務<\/span><\/li>\n<\/ul>\n<\/div>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5121004.png\" alt=\"Image not found\"/>閃爆破<\/span><span>(Demolition)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a0a0c6e5dbf3\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a0a0c6e5dbf3\" class=\"collapseomatic_content \">\n<p><span>找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\" alt=\"Image not found\"/><\/span><span>(Kyrin)接任務【Body of Steel】<\/span><\/p>\n<ul>\n<li><span>收集50張<\/span><span>堅實皮革<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplelegends.com/static/images/lib/item/04031871.png\" alt=\"Image not found\"/>(Sturdy Leather)<\/span><\/li>\n<li><span>殺死150隻雙角藍色龍<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/8140700.png\" alt=\"Image not found\"/><\/span><span>(Blue Dragon Turtle)<\/span><\/li>\n<\/ul>\n<p><span>打完以後回去找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\" alt=\"Image not found\"/>(Kyrin)回報即可學會<\/span><\/p>\n<\/div>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5121010.png\" alt=\"Image not found\"/>時間置換(Time Leap)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a0a0c6e5dbfe\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a0a0c6e5dbfe\" class=\"collapseomatic_content \">\n<p><span>找老學者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092012.png\" alt=\"Image not found\"/><\/span><span>(Rolonay)接任務【Papulatus&#8217; Key】<\/span><\/p>\n<p><span>打倒拉圖斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/8500001.png\" alt=\"Image not found\"/><\/span><span>(Papulatus)後撿取<\/span><span>銀色鑰匙<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplelegends.com/static/images/lib/item/04031869.png\" alt=\"Image not found\"/>(Papulatus&#8217; Key)<\/span><\/p>\n<p><span>然後找老學者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092012.png\" alt=\"Image not found\"/><\/span><span>(Rolonay)回報任務再進去一次找拉圖斯對話(注意身上不要帶D片)<\/span><\/p>\n<p><span>完成所有對話以後就會被傳送出去到鯨魚島內，直接找老學者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092012.png\" alt=\"Image not found\"/><\/span><span>(Rolonay)對話便能學會技能<\/span><\/p>\n<\/div>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5221006.png\" alt=\"Image not found\"/>海盜船(Battleship)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a0a0c6e5dc07\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a0a0c6e5dc07\" class=\"collapseomatic_content \">\n<p><span>找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\" alt=\"Image not found\"/><\/span><span>(Kyrin)接任務【How to Improve Your Strength】<\/span><\/p>\n<p><span>進入任務地圖，被<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/9300158.png\" alt=\"Image not found\"/><\/span><span>打兩分鐘不死就能學會<\/span><\/p>\n<\/div>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5221007.png\" alt=\"Image not found\"/>海盜加農砲(Battleship Cannon)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a0a0c6e5dc10\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a0a0c6e5dc10\" class=\"collapseomatic_content \">\n<p><span>找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\" alt=\"Image not found\"/><\/span><span>(Kyrin)接任務【Observe the Spirit Vikings】<\/span><\/p>\n<ul>\n<li><span>收集<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplelegends.com/static/images/lib/item/04031873.png\" alt=\"Image not found\"/><\/span><span>Spirit Viking Flags<\/span> <span>X50<\/span><\/li>\n<li><span>殺死<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/8141000.png\" alt=\"Image not found\"/>Spirit Viking <\/span><span>X150隻<\/span><\/li>\n<\/ul>\n<p><span>回報任務即可學會<\/span><\/p>\n<\/div>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5221008.png\" alt=\"Image not found\"/>海盜魚雷(Battleship Torpedo)【要先解過<\/span><span>海盜加農砲<img decoding=\"async\" src=\ 7184358im_/https://royals-library.netlify.app/images/npcs/1094000.png\" alt=\"Image not found\"/>中找到比較像真人的敲下去(可以開著任務欄做比對)<\/span><\/p>\n<p>第三題前往GPQ雕像區，記住雕像發光的順序依序敲下去，第一次四個、第二次五個、第三次六個，通通都敲對了就過關<\/p>\n<p>出去後再與<span>Lord Jonathan<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092019.png\" alt=\"Image not found\"/>對話即可習得技能<\/span><\/p>\n<\/div>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5221009.png\" alt=\"Image not found\"/>心靈控制(Hypnotize)<\/span><\/p>\n<span class=\"collapseomatic \" id=\"id6a0a0c6e5dc29\" tabindex=\"0\" title=\"展開\">展開<\/span><div id=\"target-id6a0a0c6e5dc29\" class=\"collapseomatic_content \">\n<p><span>找Shulynch<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092008.png\" alt=\"Image not found\"/><\/span><span>接受任務【Mission Free the Monsters】，人在訓練室(Nautilus: Training Room)<\/span><\/p>\n<p><span>跳完忍耐後+保護之後就可以學會<\/span><\/p>\n<\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-tot", "cat": "前置任務", "title": "時間神殿前置介紹", "ts": "2026-08-23", "wb": "https://web.archive.org/web/20260823170221/https://mapleroyals.net/62869/%E6%99%82%E9%96%93%E7%A5%9E%E6%AE%BF%E5%89%8D%E7%BD%AE%E4%BB%8B%E7%B4%B9", "html": "<p>通稱999任務<\/p>\n<hr/>\n<p>從神木村機場往上爬，可以變成龍飛到時間神殿<\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://mapleroyals.net/wp-content/uploads/2025/03/TOT_MAP.png\"/><\/p>\n<p>每一張圖最下層的中柱都有一個傳點可以往上方中柱互通 以及第二個捷徑位置<\/p>\n<hr/>\n<p><strong>回憶之路任務區<\/strong><\/p>\n<p>與Temple Keeper<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/npcs/2140000.png\" alt=\"Image not found\"/>對話，接下個階段任務<\/p>\n<p>打倒999隻Memory Monk<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_ g\" alt=\"Image not found\"/><\/p>\n<p>Knight&#8217;s Mask<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplelegends.com/static/images/lib/item/04000461.png\" alt=\"Image not found\"/>x1<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8220005.png\" alt=\"Image not found\"/><\/p>\n<p>Guardian&#8217;s Horn<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplelegends.com/static/images/lib/item/04000462.png\" alt=\"Image not found\"/>x1<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://royals-library.netlify.app/images/monsters/8220006.png\" alt=\"Image not found\"/><\/p>\n<p>收集完畢回報可獲得Marble of Chaos<img decoding=\"async\" src=\"https://web.archive.org/web/20260823170221im_/https://maplestory.io/api/SEA/198/item/4032002/icon?resize=1.0\" alt=\"Image not found\"/>，至此任務全結束<\/p>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-tokyo", "cat": "前置任務", "title": "東京前置介紹", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517182956/https://mapleroyals.net/62765/%E6%9D%B1%E4%BA%AC%E5%89%8D%E7%BD%AE%E4%BB%8B%E7%B4%B9", "html": "<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-642034424170545183 uid_1 message-content-642034424170545183 uid_2 message-timestamp-642034424170545183\">\n<div>\n<div id=\"message-content-642034424170545183\">\n<div>\n<h2 role=\"img\"><strong>前置任務區：任務等級需求135+<\/strong><\/h2>\n<\/div>\n<div>LV135+ 與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\" alt=\"Image not found\"/>對話，可提前持有以下道具，解完後可前往東京台場(通稱東1)<\/div>\n<div>忍者頭目的卷軸(Ninto Scroll)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04000340.png\" alt=\"Image not found\"/>×300<\/div>\n<div>鎧甲武士的頭盔(Samurai Knight Armor Piece)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04000342.png\" alt=\"Image not found\"/>×1<\/div>\n<div>蟾蜍的油(Toad Oil)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04000343.png\" alt=\"Image not found\"/>×1<\/p>\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div role=\"group\" aria-label=\"訊息操作\">\n<h2 role=\"img\"><strong>東一任務區：任務等級需求135+<\/strong><\/h2>\n<div role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div>\n<div id=\"message-content-642035000237359153\">\n<div>LV135+ 與Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\" alt=\"Image not found\"/>對話收集Overlord Lens<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032156.png\" alt=\"Image not found\"/>×100 後與Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\" alt=\"Image not found\"/>對話回報任務續接任務從Afterroad<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://image.royals.wiki/monster/9400253.png\" alt=\"image\"/>收集Operational Unit<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032151.png\" alt=\"Image not found\"/>X1(接任務後才會掉落)後與Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\" alt=\"Image not found\"/>對話回報任務續接任務從Afterroad<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://image.royals.wiki/monster/9400253.png\" alt=\"image\"/>收集Conductive Polymer Gain<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032153.png\" alt=\"Image not found\"/> x 1+Calculating Domino<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032154.png\" alt=\"Image not found\"/> x 1(接任務後才會掉落)從Overlord<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400254.png\" alt=\"Image not found\"/>收集Macromolecule Actualater<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032152.png\" alt=\"Image not found\"/> x 1(接任務後才會掉落)與Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\" alt=\"Image not found\"/>對話回報任務續接任務<\/p>\n<\/div>\n<div><\/div>\n<div> 遠征隊型態：三人以上隊伍擊倒Vergamot<img decoding=\"async\" class=\"\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400263.png\" alt=\"Image not found\" width=\"210\" height=\"213\"/><\/div>\n<div><\/div>\n<div>與Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\" alt=\"Image not found\"/>對話回報任務結束此區任務，與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\" alt=\"Image not found\"/>對話，可前往東京公園地圖(通稱東2)<\/div>\n<\/div>\n<div>\n<hr/>\n<\/div>\n<div id=\"message-content-642035000237359153\">\n<h2><strong>東二任務區：任務等級需求135+<\/strong><\/h2>\n<p>與Dida(幼年型)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400261.png\" alt=\"Image not found\"/>對話，從Protoroad<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://image.royals.wiki/monster/9400255.png\" alt=\"image\"/>收集Twisted Radar<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032158.png\" alt=\"Image not found\"/> x 1(接任務後才會掉落)後與Dida(幼年型)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400261.png\" alt=\"Image not found\"/>對話回報任務<\/p>\n<\/div>\n<p>開啟組隊狀態，與Dida(幼年型)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400261.png\" alt=\"Image not found\"/>接下保護任務，10分鐘內從保護地圖內的<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400259.png\" alt=\"Image not found\"/>由隊長收集Energy Transmitter<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032192.png\" alt=\"Image not found\"/> x 10後回報任務即可通關<\/p>\n<p>註：裡面的怪物可以暈眩/蝸牛/凍結/砸鬼神之擊，<\/p>\n<p>解完任務後與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\" alt=\"Image not found\"/>對話，可前往東京秋葉原地圖(通稱東3)<\/p>\n<hr/>\n<h2><strong>東三任務區-<\/strong><strong>任務等級需求138+<\/strong><\/h2>\n<p>註：論壇<a href=\"https://web.archive.org/web/20260517182956/https://royals.ms/forum/threads/guide-to-neo-tokyo.146864/\">原文<\/a>表示進場135等，打王138等，但是2026年的現在有玩家反饋進場打道具就要LV138了<\/p>\n<p>ㄌ依據與NPC-Ponicher<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120027.png\" alt=\"Image not found\"/>+ Commander Garuda<img decoding=\"async\" class=\"alignnone size-full wp-image-66866\" src=\"https://web.archive.org/web/20260517182956im_/http://mapleroyals.net/wp-content/uploads/2025/03/commander-garuda.png\" alt=\"\" width=\"62\" height=\"98\"/>+Captain Maricias<img loading=\"lazy\" decoding=\"async\" class=\"alignnone size-full wp-image-66867\" src=\"https://web.archive.org/web/20260517182956im_/http://mapleroyals.net/wp-content/uploads/2025/03/captain-maricias.png\" alt=\"\" width=\"74\" height=\"89\"/>接下任務<\/p>\n<p>從<span>Eruwater<\/span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400260.png\" alt=\"Image not found\"/>收集Eruwater Laser Gun<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplelegends.com/static/images/lib/item/04032161.png\" alt=\"Image not found\"/> x300+Eruwater Transmitter<img loading=\"lazy\" decoding=\"async\" class=\"alignnone size-full wp-image-66869\" src=\"https://web.archive.org/web/20260517182956im_/http://mapleroyals.net/wp-content/uploads/2025/03/eruwater-transmitter.png\" alt=\"\" width=\"30\" height=\"31\"/> x 1(接任務後才會掉落)<\/p>\n<\/div>\n<div>\n<div role=\"group\" aria-label=\"訊息操作\">\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div role=\"img\" aria-label=\"\">與Commander Garuda<img decoding=\"async\" class=\"alignnone size-full wp-image-66866\" src=\"https://web.archive.org/web/20260517182956im_/http://mapleroyals.net/wp-content/uploads/2025/03/commander-garuda.png\" alt=\"\" width=\"62\" height=\"98\"/>回報任務，可進入遠征隊特殊地圖，開啟隊伍-保持隊伍3人以上，打敗Dunas<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400270.png\" alt=\"Image not found\"/>後回報任務<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-642037194172661810 uid_1 message-content-642037504761135105 uid_2 message-timestamp-642037504761135105\">\n<div>\n<p>然後與與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\" alt=\"Image not found\"/>對話，續接任務後找Commander Garuda<img decoding=\"async\" class=\"alignnone size-full wp-image-66866\" src=\"https://web.archive.org/web/20260517182956im_/http://mapleroyals.net/wp-content/uploads/2025/03/commander-garuda.png\" alt=\"\" width=\"62\" height=\"98\"/>，可前往2102年東京上空(通稱東4)<\/p>\n<hr/>\n<div id=\"message-content-642037504761135105\">\n<h2><strong>東四任務區-<\/strong><strong>任務等級需求138+<\/strong><\/h2>\n<div>\n<p>與<span>Old Fox Flagship AI<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120035.png\" alt=\"Image not found\"/>對話<\/span>接下任務，打倒Maverick A<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400256.png\" alt=\"Image not found\"/><span>取得Maverick Type S Laser Gun<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://maplestory.io/api/SEA/198/item/4000555/icon?resize=1.0\" alt=\"Image not found\"/>(接任務後才會掉落)<\/span><\/p>\n<p><span>接著與Old Fox Flagship AI<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120035.png\" alt=\"Image not found\"/>對話，可進入遠征隊特殊地圖，<\/span><\/p>\n<p><span>開啟隊伍-保持隊伍3人以上，打敗Nibergen<img loading=\"lazy\" decoding=\"async\" class=\"\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400271.png\" alt=\"Image not found\" width=\"313\" height=\"134\"/>後回報任務<\/span><\/p>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div role=\"group\" aria-label=\"訊息操作\">\n<div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div>\n<div role=\"img\" aria-label=\"\">\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div>\n<h2 role=\"img\"><strong>無名魔獸任務區-<\/strong><strong>任務等級需求143+<\/strong><\/h2>\n<\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-642037194172661810 uid_1 message-content-642037725771464704 uid_2 message-timestamp-642037725771464704\"><time id=\"message-timestamp-642037725771464704\" datetime=\"2019-11-07T16:28:42.308Z\" aria-label=\"十一月 08, 2019 上午 12:28\"><\/time><span>與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\" alt=\"Image not found\"/>對話，可進入遠征隊地圖。<\/span><\/p>\n<div>\n<div id=\"message-content-642037504761135105\">\n<div>\n<p><span>開啟隊伍-保持隊伍3人以上，打敗Nameless Magic Monster<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400266.png\" alt=\"Image not found\"/>後回報任務<\/span><\/p>\n<hr/>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div role=\"group\" aria-label=\"訊息操作\">\n<div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div>\n<h2 role=\"img\"><strong>杜那斯V2任務區-<\/strong><strong>任務等級需求143+<\/strong><\/h2>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-720248585161015349 uid_1 message-content-720248585161015349 uid_2 message-timestamp-720248585161015349\">\n<div>\n<div id=\"message-content-720248585161015349\">\n<div>\n<p><span>與Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\" alt=\"Image not found\"/>對話，<\/span>然後回神木村找四轉教官, 2.再回卡姆那找<span>Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\" alt=\"Image not found\"/><\/span>,任務就完成<\/p>\n<p>接著與<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120047.png\" alt=\"Image not found\"/>接任務，<span>可進入遠征隊地圖<\/span><\/p>\n<p><span>開啟隊伍-保持隊伍3人以上，<\/span>打敗Dunas Unit<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400293.png\" alt=\"Image not found\"/>+Dunas<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400295.png\" alt=\"Image not found\"/><span>後回報任務<\/span><\/p>\n<\/div>\n<\/div>\n<\/div>\n<div>\n<div role=\"group\" aria-label=\"訊息操作\">\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div>\n<div role=\"img\" aria-label=\"\">\n<hr/>\n<h2><strong>Core Blaze任務區-<strong>任務等級需求146+以及LV150+<\/strong><\/strong><\/h2>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div role=\"img\" aria-label=\"\">與<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120047.png\" alt=\"Image not found\"/>接任務，可以進入2102六本木地圖<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<div role=\"img\" aria-label=\"\"><span>開啟隊伍-保持隊伍3人以上，<\/span>打敗Core Blaze<img loading=\"lazy\" decoding=\"async\" class=\"\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400296.png\" alt=\"Image not found\" width=\"374\" height=\"176\"/>後，LV150的狀況下可以續接任務<\/div>\n<div role=\"img\" aria-label=\"\">打敗Auf Haven<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/monsters/9400289.png\" alt=\"Image not found\"/>後會被傳送到任務地圖，與裡面的NPC對話完畢後找<span>Asia<img decoding=\"async\" src=\"https://web.archive.org/web/20260517182956im_/https://royals-library.netlify.app/images/npcs/9120025.png\" alt=\"Image not found\"/>對話<\/span><\/div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<div role=\"img\" aria-label=\"\">會獲得50000000 exp，任務全結束<\/div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-724820880986734665 uid_1 message-content-724820880986734665 uid_2 message-timestamp-724820880986734665\">\n<div role=\"group\" aria-label=\"訊息操作\">\n<div tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div>\n<div role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"wpdevar_comment_1\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-lhc", "cat": "前置任務", "title": "LHC 圖騰交換前置任務", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517181146/https://mapleroyals.net/lhc-%E5%9C%96%E9%A8%B0%E4%BA%A4%E6%8F%9B%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99", "html": "<div role=\"document\">\n<div id=\"chat-messages-867450430015668304\" class=\"message-2qnXI6 cozyMessage-3V1Y8y groupStart-23k01U wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">\n<h6 role=\"document\"><strong>交換任務 (獅子王城轉蛋前置任務)：<\/strong><\/h6>\n<\/div>\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">【任務需求等級LV143】跟第二座塔的NPC穆特(Murt)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260517181146/https://cdn.discordapp.com/attachments/867432352493207572/867450429800185896/murt.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://media.discordapp.net/attachments/867432352493207572/867450429800185896/murt.png\" alt=\"\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://maplestory.io/api/SEA/198/npc/2160000/icon/\" alt=\"Image not found\"/><\/a>對話<\/div>\n<div><\/div>\n<div><\/div>\n<div><\/div>\n<div><\/div>\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">將信件送回冰原雪城找亞凱斯特(Alcaster)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://royals-library.netlify.app/images/npcs/2020005.png\" alt=\"Image not found\"/><\/div>\n<div><\/div>\n<\/div>\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\">\n<div class=\"removeAttachmentButton-2qVPxg\" tabindex=\"0\" role=\"button\" aria-label=\"移除訊息附件\"><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV isHeader-2dII4U\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\">\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"加入反應\" aria-controls=\"popout_971\" aria-expanded=\"false\"><\/div>\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_972\" aria-expanded=\"false\">接著從亞凱斯特身上接取任務：亞凱斯特的水晶(Alcaster’s Crystal)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://maplestory.io/api/SEA/198/item/2430159/icon?resize=1.0\" alt=\"Image not found\"/>，<del>如果遺失要<\/del><s><del>付<\/del>錢買一個跟時間神殿混沌之石長得一模一樣的東西<\/s><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"document\">\n<div id=\"chat-messages-867450996707819540\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\"><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260517181146/https://cdn.discordapp.com/attachments/867432352493207572/867450996534804540/unknown.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://media.discordapp.net/attachments/867432352493207572/867450996534804540/unknown.png?width=400&amp;height=154\" alt=\"\"/><\/a> <\/p>\n<div class=\"removeAttachmentButton-2qVPxg\" tabindex=\"0\" role=\"button\" aria-label=\"移除訊息附件\"><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\">\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"編輯\">此項道具在USE消耗欄位內，回去找NPC穆特(Murt)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://maplestory.io/api/SEA/198/npc/2160000/icon/\" alt=\"Image not found\"/>，然後使用它<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"chat-messages-867451187347324958\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\">\n<div class=\"button-1ZiXG9\" tabindex=\"0\" role=\"button\" aria-label=\"更多\" aria-controls=\"popout_1032\" aria-expanded=\"false\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"chat-messages-867452019941965866\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">\n<div class=\"markup-2BOw-j messageContent-2qWWxC\">接著就可以將在獅子王城內所得到的淨化圖騰<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://maplelegends.com/static/images/lib/item/04000630.png\" alt=\"Image not found\"/> (Purification Totem)跟NPC穆特(Murt)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://maplestory.io/api/SEA/198/npc/2160000/icon/\" alt=\"Image not found\"/>對話做隨機抽獎 一次要25個<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div role=\"document\">\n<div id=\"chat-messages-867452019941965866\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\"><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260517181146/https://cdn.discordapp.com/attachments/867432352493207572/867452020104757278/unknown.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://media.discordapp.net/attachments/867432352493207572/867452020104757278/unknown.png?width=400&amp;height=171\" alt=\"\"/><\/a> <\/p>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"chat-messages-867452185922240542\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">\n<div class=\"markup-2BOw-j messageContent-2qWWxC\"><\/div>\n<\/div>\n<div class=\"container-1ov-mD\">\n<div class=\"messageAttachment-1aDidq\"><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260517181146/https://cdn.discordapp.com/attachments/867432352493207572/867452185716588554/unknown.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260517181146im_/https://media.discordapp.net/attachments/867432352493207572/867452185716588554/unknown.png?width=400&amp;height=187\" alt=\"\"/><\/a><\/div>\n<\/div>\n<\/div>\n<div>主力為：CS, WS, BWG, Taru Totem<\/div>\n<div><\/div>\n<\/div>\n<div role=\"document\">論壇分享獎勵池文章：<a href=\"https://web.archive.org/web/20260517181146/https://royals.ms/forum/lhc-exchange-rewards-cs-ws-bwg-taru-totem-rewards-found.193830/#post-1138891\">https://royals.ms/forum/lhc-exchange-rewards-cs-ws-bwg-taru-totem-rewards-found.193830/#post-1138891<\/a><\/div>\n<div role=\"document\"><\/div>\n<div role=\"document\">玩家分享獎勵機率：<a href=\"https://web.archive.org/web/20260517181146/https://royals.ms/forum/threads/results-from-2575-lhc-totems.195508/\">https://royals.ms/forum/threads/results-from-2575-lhc-totems.195508/<\/a>(其實不準..)<\/div>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-bpq", "cat": "前置任務", "title": "魔王巴洛谷前置任務（BPQ）", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517175129/https://mapleroyals.net/65753/balrog-pq%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99", "html": "<p><span>1）首先到勇士之村找麥吉(Manji )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://royals-library.netlify.app/images/npcs/1022002.png\" alt=\"Image not found\"/>接任務【<\/span>Manji&#8217;s Request<span>】，接好後他會把你傳送到神廟底層<\/span><\/p>\n<p><img decoding=\"async\" class=\"alignnone size-full wp-image-66357\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ1.png\" alt=\"\" width=\"540\" height=\"297\" srcset=\"https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/BPQ1.png 540w, https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/BPQ1-300x165.png 300w\" sizes=\"(max-width: 540px) 100vw, 540px\"/><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ2.png\" alt=\"\"/><\/p>\n<p><span>（2）跟Mu Young<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061018/icon/\" alt=\"Image not found\"/>對話，接任務【<\/span>Stay Away From Strangers<span>】<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ3.png\" alt=\"http://mapleroyals.net/wp-content/uploads/2025/04/BPQ2.png\" width=\"538\" height=\"205\"/><\/p>\n<p><span>（3）從階梯往上爬跟Suspicious man<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061016/icon/\" alt=\"Image not found\"/>對話後，與Mu Young<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061018/icon/\" alt=\"Image not found\"/>回報，此時續接任務【<\/span>A Letter to the Master<span>】<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ4.png\" alt=\"\"/><\/p>\n<p><span>（4）往上爬離開神廟底層(此時最好紀錄一下傳送點：【Another Entrance】，因為筆記本就在前一張地圖而已，不然去撿筆記的時候要走很久)<\/span><\/p>\n<p><span>回到勇士之村找麥吉(Manji )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://royals-library.netlify.app/images/npcs/1022002.png\" alt=\"Image not found\"/> 接任務【<\/span>A Request to His Apprentice<span>】<\/span><\/p>\n<p><span>他會要你幫他找掉落在The tunnel that lost light的筆記<\/span><\/p>\n<p><span>（5）筆記在The tunnel that lost light 2 的左下方<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ5.png\" alt=\"\"/><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ6.png\" alt=\"\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ7.png\" alt=\"\"/><\/p>\n<p><span>（6）撿到筆記後去找Mu Young<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061018/icon/\" alt=\"Image not found\"/>解讀<\/span><\/p>\n<p><span>（7）接下來Mu Young<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061018/icon/\" alt=\"Image not found\"/>會把你傳送到一個小房間 你要打倒一隻巴洛古<\/span><\/p>\n<p><span>（8） 打倒後跟出現的NPC 崔斯坦的靈魂(Tristan&#8217;s Spirit )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061017/icon/\" alt=\"Image not found\"/>對話<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ8.png\" alt=\"\"/><\/p>\n<p><span>（9）對話後離開房間跟Mu Young<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061018/icon/\" alt=\"Image not found\"/>對話接下任務【Restraining Balrog】 接下來就可以挑戰魔王巴洛古了<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ9.png\" alt=\"\"/><\/p>\n<p><span>遠征隊組成需求需3-6人 等級75-99之間，每天可以打兩場<\/span><\/p>\n<hr/>\n<p><span>備註1：跟崔斯坦的靈魂(Tristan&#8217;s Spirit )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://maplestory.io/api/SEA/198/npc/1061017/icon/\" alt=\"Image not found\"/>說完話後會出現“因為不確定的錯導致任務中斷” 不用理他 直接離開房間就好 <\/span><\/p>\n<p><span>備註2:神廟底層在這張地圖的最下方 大門進去<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ10.png\" alt=\"\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ11.png\" alt=\"\"/><\/p>\n<p>備註3：前置解完後，以後可以跟<span>麥吉(Manji )<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175129im_/https://royals-library.netlify.app/images/npcs/1022002.png\" alt=\"Image not found\"/> 用500000傳送到神廟<\/span><\/p>\n<p><img loading=\"lazy\" decoding=\"async\" class=\"alignnone size-full wp-image-66531\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/image-2.png\" alt=\"\" width=\"522\" height=\"205\" srcset=\"https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/image-2.png 522w, https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/image-2-300x118.png 300w\" sizes=\"(max-width: 522px) 100vw, 522px\"/><\/p>\n<hr/>\n<p>頭部HP25M，怕雷<\/p>\n<p>右手HP12.5M，怕冰<\/p>\n<p>左手HP12.5M，怕火<\/p>\n<p><img loading=\"lazy\" decoding=\"async\" class=\"alignnone size-full wp-image-66486\" src=\"https://web.archive.org/web/20260517175129im_/http://mapleroyals.net/wp-content/uploads/2025/04/BPQ.jpg\" alt=\"\" width=\"883\" height=\"567\" srcset=\"https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/BPQ.jpg 883w, https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/BPQ-300x193.jpg 300w, https://web.archive.org/web/20260517175129im_/https://mapleroyals.net/wp-content/uploads/2025/04/BPQ-768x493.jpg 768w\" sizes=\"(max-width: 883px) 100vw, 883px\"/><\/p>\n<div id=\"wpdevar_comment_1\">\n <span><\/span>\n <\/div>"}]</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const ORDER=['規則','前置任務','轉職','技能書'];
const nav=document.getElementById('nav'),content=document.getElementById('content'),q=document.getElementById('q');
function groups(f=''){f=f.trim().toLowerCase();const g={};
 DATA.forEach(d=>{if(f&&!(d.title.toLowerCase().includes(f)||d.cat.toLowerCase().includes(f)))return;
 (g[d.cat]=g[d.cat]||[]).push(d);});return g;}
function renderNav(f=''){const g=groups(f);nav.innerHTML='';
 const cats=ORDER.filter(c=>g[c]).concat(Object.keys(g).filter(c=>!ORDER.includes(c)));
 if(!cats.length){nav.innerHTML='<p class="grp">查無結果</p>';return;}
 cats.forEach(c=>{const h=document.createElement('div');h.className='grp';h.textContent=c;nav.appendChild(h);
  g[c].forEach(d=>{const a=document.createElement('a');a.className='navlink';a.href='#'+d.slug;
   a.innerHTML='<span>'+d.title+'</span><span class="d">'+d.ts+'</span>';
   if(location.hash.slice(1)===d.slug)a.classList.add('active');nav.appendChild(a);});});}
function home(){const g=groups();let h='<div class="home-hero"><h1>MapleRoyals 攻略庫</h1>'+
 '<p>原站 mapleroyals.net 已關站，以下為自網際網路檔案館救回的公開攻略，共 '+DATA.length+' 篇。左側點選或搜尋。</p></div><div class="cards">';
 ORDER.filter(c=>g[c]).forEach(c=>{h+='<div class="card"><h2>'+c+'</h2><ul>'+
  g[c].map(d=>'<li><a href="#'+d.slug+'">'+d.title+'</a></li>').join('')+'</ul></div>';});
 content.innerHTML=h+'</div>';document.title='RMS 攻略庫 · MapleRoyals';}
function show(slug){const d=DATA.find(x=>x.slug===slug);if(!d){home();return;}
 content.innerHTML='<h1 class="t">'+d.title+'</h1><p class="meta">'+d.cat+' · 存檔日期 '+d.ts+
  ' · <a href="'+d.wb+'" target="_blank" rel="noopener">原始 Wayback 存檔 ↗</a></p>'+d.html;
 content.querySelectorAll('img').forEach(im=>{im.loading='lazy';im.onerror=()=>{im.style.display='none';};});
 document.title=d.title+' · RMS 攻略庫';window.scrollTo(0,0);document.body.classList.remove('open');}
function route(){const s=location.hash.slice(1);s?show(s):home();renderNav(q.value);}
addEventListener('hashchange',route);q.addEventListener('input',()=>renderNav(q.value));
document.getElementById('menu').onclick=()=>document.body.classList.toggle('open');
document.getElementById('scrim').onclick=()=>document.body.classList.remove('open');
renderNav();route();
</script>
</body></html>
