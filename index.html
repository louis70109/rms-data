ps://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/8150101.png\"/><\/span><span>(Cold Shark)<\/span><\/p>\n<p><span>或是去自由市場買一本<\/span><\/p>\n<p><span>之後才能觸發任務【The Book of Invisible Ink】<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>到赫麗奧斯塔圖書館與<\/span><span>懷茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2040052.png\"/><\/span><span>(Wiz the Librarian)<\/span><span>對話接下任務【The Book of Invisible Ink】收集以下掉寶：(可事先準備)<\/span>\n<ul>\n<li aria-level=\"2\"><span>墨汁瓶<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04000183.png\"/>(Ink Bottle)X50<\/span><\/li>\n<li aria-level=\"2\"><span>礦泉水<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/02022000.png\"/>(Pure Water)X10<\/span><\/li>\n<li aria-level=\"2\"><span>魔法石<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04006000.png\"/>(The Magic Rock)X30<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04161018.png\"/>[Storybook] Ancient Book X1<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"1\"><span>與<\/span><span>懷茲<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2040052.png\"/><\/span><span>(Wiz the Librarian)<\/span><span>續接任務【The Ancient Book】，獲得破舊的綠皮之書<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04161024.png\"/>(Bowman&#8217;s Way)<\/span><\/li>\n<li aria-level=\"1\"><span>接著前往弓箭手村( Henesys)與赫麗娜<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1012100.png\"/><\/span><span>(Athena Pierce)對話續接任務【The Bowman&#8217;s Ultimate Skill】<\/span><b>e<\/b><\/li>\n<li aria-level=\"1\"><span>赫麗娜<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1012100.png\"/><\/span><span>(Athena Pierce)要求與蕾妮<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2020010.png\"/><\/span><span>(Rene)對話，<\/span><span>蕾妮<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2020010.png\"/><\/span><span>(Rene)<\/span><span>又要求與邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2022003.png\"/><\/span><span>(Shammos)對話，接著是與蕾妮<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2020010.png\"/><\/span><span>(Rene)以及邪魔斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2022003.png\"/><\/span><span>(Shammos)交替對話。<\/span><\/li>\n<li aria-level=\"1\"><span>接著前往奇幻村(Sleepywood)，與記憶者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1061011.png\"/><\/span><span>(The Rememberer)對話後，之後與<\/span><span>無意義存在者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1061012.png\"/><\/span><span>(Insignificant Being)<\/span><span>對話接下任務【Spiritual Stone of Darkness】，收集黑暗靈魂石<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://maplelegends.com/static/images/lib/item/04031466.png\"/><\/span><span>(Dark Soul Rock)50個<\/span>\n<ul>\n<li aria-level=\"2\"><span>由打敗長槍牛魔王<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/7130101.png\"/><\/span><span>(Taurospear)以及<\/span><span>月牙牛魔王<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/7130100.png\"/>(Tauromacis)掉落。<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><span>接著必須找尋同樣是進行此任務的箭神/神射手組隊，接著再與<\/span><span>無意義存在者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/1061012.png\"/><\/span><span>(Insignificant Being)<\/span><span>對話交付黑暗靈魂石<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://maplelegends.com/static/images/lib/item/04031466.png\"/><\/span><span>(Dark Soul Rock)，，進入任務地圖，20分鐘之內打敗300隻巴洛古<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/8130100.png\"/><\/span><span>(Jr. Balrog)<\/span><\/p>\n<p><span>任務完成之後退出任務地圖與無意義存在者<\/span><span>(Insignificant Being)<\/span><span>對話<\/span><\/p>\n<ul>\n<li>\n<ul>\n<li aria-level=\"2\"><span>箭神(BowMaster)習得<\/span><span>念力集中<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121008.png\"/><\/span><span>(Concentrate)<\/span><\/li>\n<li aria-level=\"2\"><span>神射手(Marksman)<\/span><span>習得光速神弩<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221007.png\"/><\/span><span>(Piercing Arrow)<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/details>\n<hr/>\n<p><span>箭神(BowMaster)：<\/span><span>召喚鳳凰<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121006.png\"/><\/span><span>(Phoenix)，需要前置技能-銀鷹召喚LV15<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>與神木村NPC-庫摩<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2081001.png\"/><\/span><span>(Kumo)對話接下任務【Flame Bird】，他要求前往試煉洞窟III(Cave of Trials III)的隱藏地圖-火鳳凰的巢穴，使用普通攻擊敲擊火鳳凰的蛋<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04001113.png\"/><\/span><span>(Phoenix&#8217;s Egg)，之後撿取。<\/span><\/li>\n<li aria-level=\"1\"><span>回到神木村與庫摩<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2081001.png\"/><\/span><span>(Kumo)對話，前往天空之巢I的隱藏地圖：天空之巢頂端，把蛋放在最上方的平台，計時20分鐘打敗火鳳凰<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/9300089.png\"/><\/span><span>(Phoenix)。<\/span><\/li>\n<li aria-level=\"1\"><span>打敗後與庫摩對話即可學會召喚鳳凰<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3121006.png\"/><\/span><span>(Phoenix)<\/span><\/li>\n<\/ol>\n<\/details>\n<hr/>\n<p><span>神射手(Marksman)：<\/span><span>召喚銀隼<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221005.png\"/><\/span><span>(Frostprey)，需要前置技能-金鷹召喚LV15<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>與神木村亞可之家與NPC-亞可<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2081003.png\"/><\/span><span>(Yaku)接下任務【Frostprey】，他要求前往危險的絕壁(Dangerous Cliff)隱藏地圖-冰鳳凰巢穴，使用普通攻擊敲擊冰鳳凰的蛋<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/items/04001114.png\"/><\/span><span>(Freezer&#8217;s Egg)，之後撿取。<\/span><\/li>\n<li aria-level=\"1\"><span>回到神木村與亞可<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/npcs/2081003.png\"/><\/span><span>(Yaku)對話，前往天空之巢I的隱藏地圖：天空之巢頂端，把蛋放在最上方的平台，計時20分鐘打敗冰鳳凰<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/monsters/9300090.png\"/><\/span><span>(Freezer)。<\/span><\/li>\n<li aria-level=\"1\"><span>打敗後與亞可<\/span><span>(Yaku)對話即可學會召喚銀隼<img decoding=\"async\" src=\"https://web.archive.org/web/20260517175019im_/https://royals-library.netlify.app/images/skills/3221005.png\"/><\/span><span>(Frostprey)<\/span><\/li>\n<\/ol>\n<\/details>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-thief", "cat": "前置任務", "title": "技能前置任務－盜賊", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413052218/https://mapleroyals.net/%E8%81%B7%E6%A5%AD%E9%81%B8%E6%93%87/%E6%8A%80%E8%83%BD%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E7%9B%9C%E8%B3%8A", "html": "<p><span>三飛閃<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121007.png\"/><\/span><span>(Triple Throw)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>打炎魔<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/8800000.png\"/>(Zakum)<\/span><span>會掉<\/span><\/p>\n<p><span>(不可交易)<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>忍術風影<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121008.png\"/><\/span><span>(Ninja Storm)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>需先持有來歷不明的信<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04001110.png\"/><\/span><span>([Storybook] Unknown Letter) 才能觸發此任務<\/span><\/p>\n<p><span>可從<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/7140000.png\"/><\/span><span>(Ghost Pirate)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/7160000.png\"/><\/span><span>(Dual Ghost Pirate)獲取，<\/span><\/p>\n<p><span>或是從自由市場買。<\/span><\/p>\n<p><span>任務流程：<\/span><\/p>\n<p><span>從玩具城進露臺中庭(玩具熊地圖)然後一直往左走會到達雲彩陽台(Cloud Balcony)，<\/span><\/p>\n<p><span>此時看不到NPC的，往前走(沒錯，就是一直往左走)進入到一張隐藏地图(Hidden Balcony)<\/span><\/p>\n<p><span>,看到了NPC-盜賊轉職教官。對話後尋找楓葉珠(Maple Leaf Marble)<\/span><\/p>\n<p><span><span><strong>楓葉珠在天空之城公會(建家族的地方)的屋頂上,點房頂上的楓葉標誌,得到楓葉珠<\/strong><\/span><\/span><\/p>\n<p><span>回玩具城進去地圖與<\/span><span>NPC-盜賊轉職教官回報任務後續接任務<\/span><\/p>\n<p><span>接著會被<\/span><span>要求收集：<\/span><\/p>\n<ul>\n<li><span>魔精靈的旋風<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplelegends.com/static/images/lib/item/04031459.png\"/><\/span><span>(Boogie’s Cursed Whirlwind) <img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/6130104.png\"/>(Boogies from Zakum)<\/span><\/li>\n<li><span>達那托斯的黑色旋風<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplelegends.com/static/images/lib/item/04031458.png\"/><\/span><span>(Thanatos&#8217;s Black Tornado) <img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/9300100.png\"/>(Thanatos)<\/span><\/li>\n<li><span>格瑞芬多的天鷹的翅膀<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplelegends.com/static/images/lib/item/04031457.png\"/><\/span><span>(Griffey Wind)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/8180001.png\"/> (Griffey)<\/span><\/li>\n<\/ul>\n<p><span>收集結束之後與四轉盜賊教官海倫<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/2081400.png\"/><\/span><span>(Hellin)對話<\/span><\/p>\n<p><span>習得忍術風影<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121008.png\"/>(Ninja Storm)<\/span><span>。<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>挑釁<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121003.png\"/><\/span><span>(Taunt)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>前往冰原雪域的長老會館，帶一名隊長是四轉戰士，且可以與泰勒斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/9300093.png\"/><\/span><span>(Tylus)接下任務【Protecting Tylus】，組隊之後進入。<\/span><\/li>\n<li aria-level=\"1\"><span>★任務地圖裡有大量巴洛古和白狼人，開始打怪等待技能書掉落，裡面有這三種書<\/span>\n<ul>\n<li aria-level=\"2\"><span>法師系-魔力無限<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/2121004.png\"/><\/span><span>(Infinity)<\/span><\/li>\n<li aria-level=\"2\"><span>弓手系-龍魂箭<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/02280005.png\"/> <\/span><span>(Dragon&#8217;s Breath)<\/span><\/li>\n<li aria-level=\"2\"><span>盜賊系-挑釁<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121003.png\"/><\/span><span>(Taunt)<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/details>\n<hr/>\n<p><span>忍影瞬殺<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4121004.png\"/><\/span><span>(Ninja Ambush)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<p><span>四轉完成後與四轉教官海倫<\/span><span>(<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/2081400.png\"/>Hellin)對話接下任務【Return of the Dark Lord】，然後去找一轉教官達克魯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/1052001.png\"/><\/span><span>(Dark Lord)。<\/span><\/p>\n<p><span>與達克魯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/1052001.png\"/><\/span><span>(Dark Lord)對話，接著繼續對話選擇【The One Hidden in the Shadow】，對話結束後，選擇”我想知道關於盜賊”進入修煉場。<\/span><\/p>\n<p><span>時間限制二十分鐘內擊敗六個三轉教官弟子<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplestory.io/api/SEA/198/mob/9300088/render/stand\"/><\/span><span>(Dark Lord&#8217;s Disciple)，都消滅後任務完成，任務失敗可以不斷重複挑戰直到成功為止，弟子經驗受經驗加倍影響。<\/span><\/p>\n<hr/>\n<p><span>與達克魯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/1052001.png\"/><\/span><span>(Dark Lord)對話就能學會技能。<\/span><\/p>\n<\/details>\n<hr/>\n<p><span>煙霧彈<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4221006.png\"/>(Smokescreen)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務流程：<\/span><\/p>\n<ol>\n<li aria-level=\"1\"><span>從<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/monsters/7130000.png\"/>Lucida<\/span><span>打到<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04161021.png\"/><\/span><span>[Storybook] Formula for Black Cloud<\/span>\n<ol>\n<li aria-level=\"2\"><span>或從FM購買，持有書本才可以開始任務<\/span><\/li>\n<\/ol>\n<\/li>\n<li aria-level=\"1\"><span>與Orbis Tower &lt;Hughe’s Laboratory&gt;中的<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/2012017.png\"/>Hughes the Fuse<\/span><span>交談,人在天空之塔B2,他會要求:<\/span>\n<ol>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04000133.png\"/>Dual Pirate&#8217;s Propeller x 10<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04003000.png\"/>Screw x 50<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04000183.png\"/>Ink Bottle x 100<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04011001.png\"/>Steel Plate x 20<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplelegends.com/static/images/lib/item/04031462.png\"/>Ventilating Fan x 1【去地球防衛總部找Kay<\/span><span>製作】<\/span>\n<ul>\n<li aria-level=\"3\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04000103.png\"/>PropellerX100<\/span><\/li>\n<li aria-level=\"3\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04011001.png\"/>Steel PlateX1<\/span><\/li>\n<\/ul>\n<\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04000115.png\"/>Cog x 50<\/span><\/li>\n<li aria-level=\"2\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://maplelegends.com/static/images/lib/item/04031478.png\"/>Long-lasting Battery x 1【去地球防衛總部找Porter<\/span><span>製作製作】<\/span>\n<ul>\n<li aria-level=\"3\"><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/04001084.png\"/>Papulatus Certificate<\/span><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/li>\n<li aria-level=\"1\"><span>回去找<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/npcs/2012017.png\"/>Hughes the Fuse<\/span><span>,他會給你電腦<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/items/02280001.png\"/><\/span><span>Black Cloud Machine<\/span><\/li>\n<li aria-level=\"1\"><span>把電腦使用掉就學會煙霧彈<img decoding=\"async\" src=\"https://web.archive.org/web/20260413052218im_/https://royals-library.netlify.app/images/skills/4221006.png\"/>(Smokescreen)了<\/span><\/li>\n<\/ol>\n<\/details>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-pirate", "cat": "前置任務", "title": "技能前置任務－海盜", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517184358/https://mapleroyals.net/%E8%81%B7%E6%A5%AD%E9%81%B8%E6%93%87/%E6%8A%80%E8%83%BD%E5%89%8D%E7%BD%AE%E4%BB%BB%E5%8B%99-%E6%B5%B7%E7%9B%9C", "html": "<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5121003.png\"/>鬥神降世(Super Transformation)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\"/><\/span><span>(Kyrin)接任務【How to Improve Your Strength】<\/span><\/p>\n<p><span>進入任務地圖，被<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/9300159.png\"/><\/span><span>打兩分鐘不死從右邊傳點離開就能學會<\/span><\/p>\n<\/details>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5121005.png\"/>閃索命(Snatch)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>任務找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\"/><\/span><span>(Kyrin)接任務【Presence of Mind】<\/span><\/p>\n<ul>\n<li><span>打50顆石之心臟<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplelegends.com/static/images/lib/item/04031872.png\"/><\/span><span>(Heart of Stone)<\/span><\/li>\n<li><span>殺死150隻暗黑三角龍<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/8140701.png\"/><\/span><span>(Red Dragon Turtle)後回報任務<\/span><\/li>\n<\/ul>\n<\/details>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5121004.png\"/>閃爆破<\/span><span>(Demolition)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\"/><\/span><span>(Kyrin)接任務【Body of Steel】<\/span><\/p>\n<ul>\n<li><span>收集50張<\/span><span>堅實皮革<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplelegends.com/static/images/lib/item/04031871.png\"/>(Sturdy Leather)<\/span><\/li>\n<li><span>殺死150隻雙角藍色龍<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/8140700.png\"/><\/span><span>(Blue Dragon Turtle)<\/span><\/li>\n<\/ul>\n<p><span>打完以後回去找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\"/>(Kyrin)回報即可學會<\/span><\/p>\n<\/details>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5121010.png\"/>時間置換(Time Leap)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>找老學者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092012.png\"/><\/span><span>(Rolonay)接任務【Papulatus&#8217; Key】<\/span><\/p>\n<p><span>打倒拉圖斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/8500001.png\"/><\/span><span>(Papulatus)後撿取<\/span><span>銀色鑰匙<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplelegends.com/static/images/lib/item/04031869.png\"/>(Papulatus&#8217; Key)<\/span><\/p>\n<p><span>然後找老學者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092012.png\"/><\/span><span>(Rolonay)回報任務再進去一次找拉圖斯對話(注意身上不要帶D片)<\/span><\/p>\n<p><span>完成所有對話以後就會被傳送出去到鯨魚島內，直接找老學者<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092012.png\"/><\/span><span>(Rolonay)對話便能學會技能<\/span><\/p>\n<\/details>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5221006.png\"/>海盜船(Battleship)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\"/><\/span><span>(Kyrin)接任務【How to Improve Your Strength】<\/span><\/p>\n<p><span>進入任務地圖，被<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/9300158.png\"/><\/span><span>打兩分鐘不死就能學會<\/span><\/p>\n<\/details>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5221007.png\"/>海盜加農砲(Battleship Cannon)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\"/><\/span><span>(Kyrin)接任務【Observe the Spirit Vikings】<\/span><\/p>\n<ul>\n<li><span>收集<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplelegends.com/static/images/lib/item/04031873.png\"/><\/span><span>Spirit Viking Flags<\/span> <span>X50<\/span><\/li>\n<li><span>殺死<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/8141000.png\"/>Spirit Viking <\/span><span>X150隻<\/span><\/li>\n<\/ul>\n<p><span>回報任務即可學會<\/span><\/p>\n<\/details>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5221008.png\"/>海盜魚雷(Battleship Torpedo)【要先解過<\/span><span>海盜加農砲<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5221007.png\"/>(Battleship Cannon)】<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>找卡依琳<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplestory.io/api/SEA/198/npc/10204/icon/\"/><\/span><span>(Kyrin)接任務任務【Observe the Gigantic Spirit Vikings】<\/span><\/p>\n<ul>\n<li><span>收集<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://maplelegends.com/static/images/lib/item/04031874.png\"/><\/span><span>Spirit Viking Token X50<\/span><\/li>\n<li><span>殺死<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/monsters/8141000.png\"/>Spirit Viking <\/span><span>X150隻<\/span><\/li>\n<\/ul>\n<p><span>回報任務即可學會<\/span><\/p>\n<\/details>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5221003.png\"/>(Aerial Strike)海鷗突擊隊<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>找Bart<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1094000.png\"/><\/span><span>接受任務【Jonathan&#8217;s Court】，然後找<\/span><span>Lord Jonathan<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092019.png\"/>回答問題<\/span><\/p>\n<p>第一題答案是72<\/p>\n<p>第二題從九個<span>Bart<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1094000.png\"/>中找到比較像真人的敲下去(可以開著任務欄做比對)<\/span><\/p>\n<p>第三題前往GPQ雕像區，記住雕像發光的順序依序敲下去，第一次四個、第二次五個、第三次六個，通通都敲對了就過關<\/p>\n<p>出去後再與<span>Lord Jonathan<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092019.png\"/>對話即可習得技能<\/span><\/p>\n<\/details>\n<hr/>\n<p><span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/skills/5221009.png\"/>心靈控制(Hypnotize)<\/span><\/p>\n<details class=\"spoiler\"><summary>展開內容<\/summary>\n<p><span>找Shulynch<img decoding=\"async\" src=\"https://web.archive.org/web/20260517184358im_/https://royals-library.netlify.app/images/npcs/1092008.png\"/><\/span><span>接受任務【Mission Free the Monsters】，人在訓練室(Nautilus: Training Room)<\/span><\/p>\n<p><span>跳完忍耐後+保護之後就可以學會<\/span><\/p>\n<\/details>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-zakum", "cat": "前置任務", "title": "殘暴炎魔（Zakum）前置", "ts": "2026-06-10", "wb": "https://web.archive.org/web/20260610115301/https://mapleroyals.net/144/zakum", "html": "<ul>\n<li><strong>前置任務<\/strong><\/li>\n<\/ul>\n<p><a href=\"https://web.archive.org/web/20260610115301/http://forum.gamer.com.tw/Co.php?bsn=07650&amp;sn=3905039\" target=\"_blank\" rel=\"noopener\">如果想看 如何解 第一階段 與 第二階段 請點選我<\/a><\/p>\n<hr/>\n<p><strong>任務名稱 <\/strong><strong>:  <\/strong>阿杜比斯的任務第一階段   <strong>限制等級  <\/strong><strong>:  <\/strong>50        <strong>觸發地點  <\/strong><strong>:  <\/strong>通往殘暴炎魔之門<\/p>\n<p><strong>任務內容<\/strong>:<\/p>\n<p><strong>【1】<\/strong> . 玩家們必須先到冰雪域的長老公館向對應職業的長老點選” 批准進行殘暴炎魔地下城任務。”<\/p>\n<p><strong>【2】 .<\/strong> 前往” 通往殘暴炎魔之門”找NPC阿杜比斯接取第一階段任務(調查廢礦洞窟)。點選第一個選項就可以被傳送到任務地圖，組隊或是單人挑戰都可以進行。<\/p>\n<p><strong>【3】 .<\/strong> 前往各個洞穴裡，透過普攻打開寶箱或打碎岩石可以蒐集鑰匙和捲軸，蒐集7把鑰匙即可完成第一階段任務 ，蒐集所有30張捲軸則是可以增加任務獎勵經驗值，以及獲得廢礦坑捲軸5張。             (寶箱.石頭 沒有分左右邊 需要全部打)<\/p>\n<p><strong>【4】 .<\/strong> 攻擊寶箱時有機率召喚出寶箱怪，或者是將玩家傳送出去。<\/p>\n<p><strong>【5】 .<\/strong> 帶著7把鑰匙由最底層左邊屬來第三個洞窟裡的第二層前往隱藏洞窟，將鑰匙放置在隱藏洞窟第五層裡的大寶箱前，可以得到火石母礦碎片，將火石母礦碎片交給NPC奧拉即可完成任務。<\/p>\n<p align=\"center\"><strong>任務必須蒐集7把鑰匙，而30張捲軸則是非必要的加分道具 (礦捲)<\/strong><\/p>\n<hr/>\n<p><strong>任務名稱  <\/strong><strong>:  <\/strong>阿杜比斯的任務第二階段    <strong>限制等級  <\/strong><strong>:  <\/strong>50    <strong>觸發地點  <\/strong><strong>:  <\/strong>通往殘暴炎魔之門<\/p>\n<p><strong>任務內容<\/strong>:<\/p>\n<p><strong>【1】 .<\/strong> 點選阿杜比斯選擇第二個選項(探查殘暴炎魔地下城)，即可變傳送到任務地圖。<\/p>\n<p><strong>【2】 .<\/strong> 完成兩張忍耐地圖，便完成任務，並取得火山的心臟。<\/p>\n<hr/>\n<p><strong>任務名稱  <\/strong><strong>:  <\/strong>阿杜比斯的任務第三階段   <strong>限制等級 <\/strong><strong>: <\/strong>50    <strong>觸發地點  <\/strong><strong>: <\/strong>通往殘暴炎魔之門<\/p>\n<p><strong>任務內容<\/strong>:<\/p>\n<p><strong>【1】 .<\/strong> 點選阿杜比斯選擇第三個選項(請求提煉)，交出火石母礦碎片，火山的心臟以及金牙30個，就可完成任務，並獲得火焰之眼5個。<\/p>\n<p><strong>【2】 .<\/strong> 完成第三階段任務即可進入殘暴炎魔祭壇挑戰殘暴炎魔。<\/p>\n<hr/>\n<p align=\"center\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610115301im_/http://img.miigii.com.tw/Files/topic/20111121/ec87f02cc25e4e53b5dff534681cbfcf_thumb.jpg\" width=\"305\" height=\"242\"/><\/p>\n<div id=\"wpdevar_comment_1\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-zakjump", "cat": "前置任務", "title": "炎魔忍耐替代任務", "ts": "2026-05-17", "wb": "https://web.archive.org/web/20260517180345/https://mapleroyals.net/62785/%E7%82%8E%E9%AD%94%E5%BF%8D%E8%80%90%E6%9B%BF%E4%BB%A3%E4%BB%BB%E5%8B%99", "html": "<div class=\"message__5126c cozyMessage__5126c groupStart__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551246463494258709 uid_1 message-content-551246463494258709 message-accessories-551246463494258709 uid_2 message-timestamp-551246463494258709\">\n<div class=\"contents_c19a55\">\n<div>原文來自於<a href=\"https://web.archive.org/web/20260517180345/https://royals.ms/forum/threads/guide-to-alternate-zakum-jump-quest.134574/\">https://royals.ms/forum/threads/guide-to-alternate-zakum-jump-quest.134574/<\/a><\/div>\n<div><\/div>\n<div id=\"message-content-551246463494258709\" class=\"markup__75297 messageContent_c19a55\">開始替代任務你必須先達到50等，並且通過第一個礦山任務 (應該沒人不知道前置要照順序解吧，之前有人忍耐跳完，回頭解礦山之後要重跳忍耐的悲劇) 接取替代<\/div>\n<\/div>\n<\/div>\n<div>\n<hr/>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c groupStart__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551246463494258709 uid_1 message-content-551246463494258709 message-accessories-551246463494258709 uid_2 message-timestamp-551246463494258709\">\n<div class=\"contents_c19a55\">\n<div class=\"markup__75297 messageContent_c19a55\">任務: 到達冰原地圖Watch out for Icy Path 1 找NPC Adonis<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/npcs/9201106.png\"/>支付1百萬，接下【The long road 】替代任務<\/div>\n<\/div>\n<div id=\"message-accessories-551246463494258709\" class=\"container_b7e1cb\">\n<div class=\"inlineMediaEmbed__623de embed__623de embedWrapper_b7e1cb justifyAuto__623de\" aria-hidden=\"false\">\n<div class=\"imageContent__0f481 embedWrapper_b7e1cb embedMedia__623de embedImage__623de\">\n<div class=\"imageContainer__0f481\">\n<div class=\"imageWrapper_af017a imageZoom_af017a imageWrapperBackground_af017a clickable_af017a\">\n<div class=\"clickableWrapper_af017a\" tabindex=\"0\" role=\"button\" aria-label=\"圖片\" aria-describedby=\"uid_4\">\n<div class=\"loadingOverlay_af017a\">\n<div class=\"imageErrorWrapper_af017a\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0 isHeader__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"contents_c19a55\">\n<div id=\"message-content-551246813584162816\" class=\"markup__75297 messageContent_c19a55\">接完任務之後請到 Korean Folk Town找NPC-Chumji<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://image.royals.wiki/npc/2071000.png\" alt=\"image\"/><\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551246463494258709 uid_1 message-content-551247474854199316 message-accessories-551247474854199316 uid_2 message-timestamp-551247474854199316\">\n<div id=\"message-accessories-551247474854199316\" class=\"container_b7e1cb\">\n<div class=\"visualMediaItemContainer_f4758a\">\n<div class=\"oneByOneGrid_f4758a oneByOneGridSingle_f4758a\">\n<div class=\"mosaicItem__6c706 mosaicItemNoJustify__6c706 mosaicItemMediaMosaic__6c706 hideOverflow__6c706\">\n<div class=\"imageContent__0f481 embedWrapper_b7e1cb itemContentContainer_f4758a mosaicItemContent__6c706\">\n<div class=\"imageContainer__0f481\">\n<div class=\"hoverButtonGroup__06ab4\">\n<div class=\"hoverButton__06ab4\" tabindex=\"0\" role=\"button\" aria-label=\"以應用程式編輯圖片\">\n<div class=\"lottieIcon__5eb9b\"><\/div>\n<\/div>\n<\/div>\n<div class=\"sizer__06ab4\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551246463494258709 uid_1 message-content-551247660116344862 uid_2 message-timestamp-551247660116344862\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-551247660116344862\" class=\"markup__75297 messageContent_c19a55\">Chumji <img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://image.royals.wiki/npc/2071000.png\" alt=\"image\"/>會要你打Blin(lvl 60)<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://image.royals.wiki/monster/6130201.png\" alt=\"image\"/>蒐集200個Blin&#8217;s flame<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/75/75971-81ff173e07957f18f86a9675ec6d983f.jpg\" alt=\"布林之火\"/> (掉落率當然可想而知的低)<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551246463494258709 uid_1 message-content-551247856909156372 message-accessories-551247856909156372 uid_2 message-timestamp-551247856909156372\">\n<div class=\"contents_c19a55\">\n<ul>\n<li id=\"message-content-551247950429421569\" class=\"markup__75297 messageContent_c19a55\">向Chumji<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://image.royals.wiki/npc/2071000.png\" alt=\"image\"/>回報任務之後，我們回到維多利亞島，到墮落城市，去左邊的第一張地圖找Chun Ji<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/npcs/9000007.png\"/><\/li>\n<li><span>跟Chun Ji講完話後，我們去沉睡森林Sleepywood找記憶者<\/span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/74/74149-06872667e538471eaf1539ce36c32703.jpg\" alt=\"rmber。gif\"/><span>(<\/span><span>The Rememberer)，<\/span>他會說Chun Ji<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/npcs/9000007.png\"/><span>忘掉一些事情，我們要幫忙找回記憶(有病不是要去看醫生嗎)<\/span><\/li>\n<li><span>首先我們要去 Rocky Mountains 打Red Drakes (lvl60)<\/span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/monsters/6130100.png\"/><span>打一個龍的戒指Dragonfire Ring<\/span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/75/75972-89e465432383840ac755a5cd021caa38.jpg\" alt=\"龍火環\"/><span>(掉落率低)<\/span><\/li>\n<\/ul>\n<\/div>\n<div class=\"contents_c19a55\">\n<div><\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551248253589520395 uid_1 message-content-551248998774734848 uid_2 message-timestamp-551248998774734848\">\n<div>\n<div id=\"message-content-551248998774734848\">\n<div><span>Rocky Mountains走法:perion從右下角進入，接著從木門進入隱藏地圖然後繼續嘗試走隱藏地圖&#8230;.找到Dangerous Valley 2.<\/span><\/div>\n<\/div>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div role=\"img\" aria-label=\"\"><\/div>\n<ul>\n<li class=\"emoji emoji__040f0\" role=\"img\">把戒指給Chun Ji <img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/npcs/9000007.png\"/>看，他會想起古老的傳說&#8221;Breath of Lava&#8221; 為了得到Breath of Lava 我們必須得到幾個東西來合成<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551248253589520395 uid_1 message-content-551249351046070273 message-accessories-551249351046070273 uid_2 message-timestamp-551249351046070273\">\n<div class=\"contents_c19a55\">\n<ul>\n<li>\n<ul>\n<li id=\"message-content-551249351046070273\" class=\"markup__75297 messageContent_c19a55\"><strong><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/75/75975-ee21b36a96c9c8626427cf2436df8be9.jpg\" alt=\"硬化水晶瓶\"/>Hardened Crystal Flask<\/strong><\/li>\n<li><strong><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/75/75974-d01d0ad85b0df82ebe70ba94433c015e.jpg\" alt=\"惰性神秘物質\"/>Inert Mysterious Substance<\/strong><\/li>\n<li><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://maplelegends.com/static/images/lib/item/02050099.png\"/><strong>Flaming Feather<\/strong><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\">你必須去地球防衛總部，金博士的實驗室找Porter<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/npcs/2050013.png\"/>需要<\/div>\n<ul>\n<li class=\"emoji emoji__040f0\" role=\"img\">MOON ROCK<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/04011007.png\"/><\/li>\n<li class=\"emoji emoji__040f0\" role=\"img\"><span>STAR ROCK<\/span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/04021009.png\"/><\/li>\n<\/ul>\n<p><span>上述兩個分別需要母礦鍛成礦石或板子，收集完母礦從玩具城的NPC鍛造即可<\/span><\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551253453087834124 uid_1 message-content-551253953669627943 message-accessories-551253953669627943 uid_2 message-timestamp-551253953669627943\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-551253953669627943\" class=\"markup__75297 messageContent_c19a55\">\n<div class=\"codeContainer__75297\">\n<ul>\n<li>500個Plateon&#8217;s helmets<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/74/74155-ff369ef517208797f5824539b5c75c5b.jpg\" alt=\"Helmet。gif\"/>，外星人<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/74/74156-9a49270f8c5a27ca487988f8cae51efc.jpg\" alt=\"Plateon。gif\"/>掉的頭盔<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551253453087834124 uid_1 message-content-551254250035085312 message-accessories-551254250035085312 uid_2 message-timestamp-551254250035085312\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-551254250035085312\" class=\"markup__75297 messageContent_c19a55\">\n<ul>\n<li class=\"codeContainer__75297\">200個Dragonglass Shards<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/75/75973-566e635fa90706d68431dbb9f6c35947.jpg\" alt=\"DragonGlass Shard。png\"/><\/li>\n<\/ul>\n<p><span>從沉睡森林螞蟻洞進去，找到 Drake Area打冰龍<\/span><img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/monsters/6230600.png\"/><span>(Ice Drake)(掉落率極差)<\/span><\/p>\n<div><\/div>\n<div><span>HINT:這裡有一個地圖王黑輪攤位，不小心會一直死(推薦用TP石記錄位置)<\/span><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551253453087834124 uid_1 message-accessories-551254362610204672 uid_2 message-timestamp-551254362610204672\">\n<div id=\"message-accessories-551254362610204672\" class=\"container_b7e1cb\">\n<div class=\"visualMediaItemContainer_f4758a\">\n<div class=\"oneByOneGrid_f4758a oneByOneGridSingle_f4758a\">\n<div class=\"mosaicItem__6c706 mosaicItemNoJustify__6c706 mosaicItemMediaMosaic__6c706 hideOverflow__6c706\">\n<div class=\"imageContent__0f481 embedWrapper_b7e1cb itemContentContainer_f4758a mosaicItemContent__6c706\">\n<div class=\"imageContainer__0f481\">\n<div class=\"sizer__06ab4\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551253453087834124 uid_1 message-content-551254439982399526 message-accessories-551254439982399526 uid_2 message-timestamp-551254439982399526\">\n<div>\n<div id=\"message-content-551254439982399526\">\n<ul>\n<li>600個鋼鐵豬蹄Iron Hog&#8217;s metal hoofs<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/04000039.png\"/>，鋼鐵肥肥<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/monsters/4230103.png\"/>(Iron Hog)掉的<\/li>\n<\/ul>\n<div><span>(弓箭手村進入肥肥公園-這次任務跟外星人頭盔並稱兩個最好掉的蒐集物)<\/span><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551253453087834124 uid_1 message-content-551254901343387649 message-accessories-551254901343387649 uid_2 message-timestamp-551254901343387649\">\n<div class=\"contents_c19a55\">\n<ul>\n<li id=\"message-content-551254901343387649\" class=\"markup__75297 messageContent_c19a55\"><strong>Flaming Feather<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://maplelegends.com/static/images/lib/item/02050099.png\"/><\/strong>打Mysterious Path 3的Selkie Jr<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/monsters/9420511.png\"/><\/li>\n<\/ul>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551253453087834124 uid_1 message-content-551255005298950154 uid_2 message-timestamp-551255005298950154\"><\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551253453087834124 uid_1 message-content-551255062689611787 uid_2 message-timestamp-551255062689611787\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-551255062689611787\" class=\"markup__75297 messageContent_c19a55\"><strong>Inert Mysterious Substance<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/75/75974-d01d0ad85b0df82ebe70ba94433c015e.jpg\" alt=\"惰性神秘物質\"/>任務:<\/strong><\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551253453087834124 uid_1 message-content-551255130641661964 uid_2 message-timestamp-551255130641661964\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-551255130641661964\" class=\"markup__75297 messageContent_c19a55\">搭船到Ariant，去瑪珈提亞城(Magatia)找Carson Carson<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/74/74152-5baa0276d8ace4354f69ca5344f17356.jpg\" alt=\"carson。png\"/>位在入口左邊某棟建築物內<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c groupStart__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551255221104279552 uid_1 message-accessories-551255221104279552 uid_2 message-timestamp-551255221104279552\">\n<div id=\"message-accessories-551255221104279552\" class=\"container_b7e1cb\">\n<div class=\"visualMediaItemContainer_f4758a\">\n<div class=\"oneByOneGrid_f4758a oneByOneGridSingle_f4758a\">\n<div class=\"mosaicItem__6c706 mosaicItemNoJustify__6c706 mosaicItemMediaMosaic__6c706 hideOverflow__6c706\">\n<div class=\"imageContent__0f481 embedWrapper_b7e1cb itemContentContainer_f4758a mosaicItemContent__6c706\">\n<div class=\"imageContainer__0f481\">\n<div class=\"imageWrapper_af017a imageZoom_af017a clickable_af017a lazyImgContainer_f4758a\">\n<div class=\"clickableWrapper_af017a\" tabindex=\"0\" role=\"button\" aria-label=\"圖片\" aria-describedby=\"uid_4\">\n<div class=\"loadingOverlay_af017a\"><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverButtonGroup__06ab4\">\n<div class=\"hoverButton__06ab4\" tabindex=\"0\" role=\"button\" aria-label=\"以應用程式編輯圖片\">\n<div class=\"lottieIcon__5eb9b\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551255221104279552 uid_1 message-content-551255307871977473 uid_2 message-timestamp-551255307871977473\">\n<div class=\"contents_c19a55\"><time id=\"message-timestamp-551255307871977473\" datetime=\"2019-03-02T04:11:47.225Z\" aria-label=\"三月 02, 2019 下午 12:11\"><i class=\"separator_c19a55\" aria-hidden=\"true\"><\/i><\/time><\/p>\n<div id=\"message-content-551255307871977473\" class=\"markup__75297 messageContent_c19a55\">蒐集:<\/div>\n<ul>\n<li>200 Fire Bomb flame<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/04000081.png\"/>(日本昭和村的澡堂不解釋<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/monsters/5100002.png\"/>)<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551255221104279552 uid_1 message-content-551256090080444440 message-accessories-551256090080444440 uid_2 message-timestamp-551256090080444440\">\n<div>\n<div id=\"message-content-551256090080444440\">\n<ul>\n<li>100 Mateon&#8217;s Tentacle<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/04000120.png\"/>地球防衛總部，外星人的觸手<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/74/74158-edae81ddcef20f85d1e1cbc4d4fb728c.jpg\" alt=\"Mateon。gif\"/>)<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551255221104279552 uid_1 message-content-551256510131601408 message-accessories-551256510131601408 uid_2 message-timestamp-551256510131601408\">\n<div>\n<div id=\"message-content-551256510131601408\">\n<ul>\n<li>200 Red essence<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://maplelegends.com/static/images/lib/item/04000383.png\"/>幽靈船內的胖子<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/monsters/9420512.png\"/><\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<div tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551255221104279552 uid_1 message-content-551256595414253588 uid_2 message-timestamp-551256595414253588\">\n<div>\n<div id=\"message-content-551256595414253588\">\n<ul>\n<li>30 bottles of drake&#8217;s blood<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/02012000.png\"/>打冰龍時順便收集<\/li>\n<li>500,000 mesos<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551255221104279552 uid_1 message-content-551256782450720769 uid_2 message-timestamp-551256782450720769\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-551256782450720769\" class=\"markup__75297 messageContent_c19a55\">收集完 <strong>&#8220;Hardened Crystal Flask&#8221; &#8220;Inert Mysterious Substance&#8221; and a Flaming Feather.<\/strong> 回到墮落城市左邊找Chun Ji<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/npcs/9000007.png\"/><\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c groupStart__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551257198538391574 uid_1 message-content-551257198538391574 message-accessories-551257198538391574 uid_2 message-timestamp-551257198538391574\">\n<div class=\"contents_c19a55\"><time id=\"message-timestamp-551257198538391574\" datetime=\"2019-03-02T04:19:17.995Z\" aria-label=\"三月 02, 2019 下午 12:19\"><\/time><\/p>\n<div id=\"message-content-551257198538391574\" class=\"markup__75297 messageContent_c19a55\">他會要我們去Aqua找魔女Carta<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/npcs/2060100.png\"/><\/p>\n<div class=\"codeContainer__75297\"><span>水世界在哪裡不解釋，到水世界後往左走一張地圖，往左下進入海底深淵-從隱藏地圖找Carta<\/span><\/div>\n<div><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551257198538391574 uid_1 message-content-551257409490911242 uid_2 message-timestamp-551257409490911242\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-551257409490911242\" class=\"markup__75297 messageContent_c19a55\">因為下列材料仍需合成，推薦在玩具城蒐集完再去水世界<\/div>\n<ul>\n<li class=\"markup__75297 messageContent_c19a55\"><strong>1 Dark Crystal<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/04005004.png\"/> <\/strong><\/li>\n<li class=\"markup__75297 messageContent_c19a55\"><strong>1 Power Crystal<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/04005000.png\"/><\/strong><\/li>\n<li class=\"markup__75297 messageContent_c19a55\"><strong>1 Wisdom Crystal<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/04005001.png\"/> <\/strong><\/li>\n<li class=\"markup__75297 messageContent_c19a55\"><strong>1 Dex Crystal<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/04005002.png\"/> <\/strong><\/li>\n<li class=\"markup__75297 messageContent_c19a55\"><strong>1 Luk Crystal<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/items/04005003.png\"/> <\/strong><\/li>\n<li class=\"markup__75297 messageContent_c19a55\"><strong>1 million mesos<\/strong><\/li>\n<\/ul>\n<\/div>\n<div class=\"buttonContainer_c19a55\">\n<div class=\"buttons__5126c container__040f0\" role=\"group\" aria-label=\"訊息操作\">\n<div class=\"buttonsInner__5126c popover_f84418 popoverReactionHoverBar_f84418 wrapper_f7ecac\">\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 white_check_mark 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 arrow_upper_left 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<div class=\"hoverBarButton_f84418 button_f7ecac\" tabindex=\"0\" role=\"button\" aria-label=\"點擊 neutral_face 反應\">\n<div class=\"icon_f84418 buttonContent_f84418\">\n<div class=\"emoji emoji__040f0\" role=\"img\" aria-label=\"\"><\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551257198538391574 uid_1 message-content-551257672486486018 message-accessories-551257672486486018 uid_2 message-timestamp-551257672486486018\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-551257672486486018\" class=\"markup__75297 messageContent_c19a55\">跟Carta<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals-library.netlify.app/images/npcs/2060100.png\"/>對話接取任務，蒐集完材料後回報得到 The Breath of Lava<img decoding=\"async\" src=\"https://web.archive.org/web/20260517180345im_/https://royals.ms/forum/data/attachments/75/75976-98f5a3817f4de0c7c6454ee5dfad2715.jpg\" alt=\"熔岩的無能呼吸\"/><\/div>\n<\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551257198538391574 uid_1 message-content-551257775028699137 uid_2 message-timestamp-551257775028699137\">\n<div class=\"contents_c19a55\">\n<div><\/div>\n<div id=\"message-content-551257775028699137\" class=\"markup__75297 messageContent_c19a55\">第二階段前置到此為止結束<\/div>\n<div>\n<hr/>\n<\/div>\n<\/div>\n<div><\/div>\n<\/div>\n<div class=\"message__5126c cozyMessage__5126c wrapper_c19a55 cozy_c19a55 zalgo_c19a55\" tabindex=\"-1\" role=\"article\" aria-setsize=\"-1\" aria-roledescription=\"傳送訊息\" aria-labelledby=\"message-username-551257198538391574 uid_1 message-content-551257900773933066 message-accessories-551257900773933066 uid_2 message-timestamp-551257900773933066\">\n<div class=\"contents_c19a55\">\n<div id=\"message-content-551257900773933066\" class=\"markup__75297 messageContent_c19a55\">攻略來源: <a href=\"https://web.archive.org/web/20260517180345/https://royals.ms/forum/threads/zakum-helm.115397/\">https://royals.ms/forum/threads/zakum-helm.115397/<\/a> 八樓留言<\/div>\n<\/div>\n<div id=\"message-accessories-551257900773933066\" class=\"container_b7e1cb\">\n<article class=\"embedWrapper_b7e1cb embedFlexGrow_b7e1cb embedFull__623de embed__623de markup__75297\" aria-hidden=\"false\">\n<div class=\"gridContainer__623de\">\n<div class=\"grid__623de hasThumbnail__623de\">\n<div class=\"embedSuppressButton__623de\" tabindex=\"0\" role=\"button\" aria-label=\"移除所有嵌入內容\"><\/div>\n<\/div>\n<\/div>\n<\/div><\/div>"}, {"slug": "pre-ht", "cat": "前置任務", "title": "闇黑龍王（Horntail）前置", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413050510/https://mapleroyals.net/146/ht-run", "html": "<ul>\n<li><strong>前置任務<\/strong><\/li>\n<\/ul>\n<hr/>\n<p><strong>任務名稱 : <\/strong>龍的戰爭     <strong>等級限制:<\/strong>  LV.80      <strong>觸發地點:<\/strong>神木村<\/p>\n<ul>\n<li><strong>第一階段.  &lt; <\/strong><strong>摩伊拉<\/strong><strong>的下落 &gt;<\/strong><\/li>\n<\/ul>\n<p>【1】. 和村長塔塔曼<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/npcs/2081000.png\"/>(Chief Tatamo)對話接取任務，前往生命洞窟入口，在地圖右上方可以找到<strong>摩伊拉<\/strong><img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/npcs/2081006.png\"/>(<strong>Moira<\/strong>)。<\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/http://img.miigii.com.tw/Files/Gonglue/20100830/2784acd120664402adec6c37689fe80b.gif\"/><\/p>\n<hr/>\n<ul>\n<li><strong><strong>第二階段 . <\/strong> &lt; <\/strong><strong>變身秘藥 <\/strong><strong>&gt; (<\/strong><strong>可重複接取<\/strong><strong>) <\/strong><\/li>\n<\/ul>\n<p><strong>【1】. 摩伊拉<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/npcs/2081006.png\"/>(Moira)<\/strong>會要求玩家蒐集材料製作變身秘藥，藉此進入龍王洞窟。<\/p>\n<p><strong>【2】.<\/strong> 從三色翼龍<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/monsters/8150300.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/monsters/8150301.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/monsters/8150302.png\"/>蒐集堅韌的龍皮<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04001105.png\"/>(Tough Dragon Skin)10張。<\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/http://gametsg.techbang.com/maplestory/icon_npc/98ab387d00e12a7e49cb49f0122b6467.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/http://gametsg.techbang.com/maplestory/icon_npc/d62169bc53c6e9a9a60f8eaeaf6ec790.png\"/><img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/http://gametsg.techbang.com/maplestory/icon_npc/7c3a54926e9bfc7e270083beec6f4ea4.png\"/><\/p>\n<p><strong>【3】.<\/strong> 打倒短刃龍戰士<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/http://img.miigii.com.tw/Files/Gonglue/20100830/e4cb4350f8914c30816472d4076ced08.gif\"/>，蒐集龍戰士的精隨<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04001103.png\"/>(Cornian&#8217;s Marrow) <strong>1<\/strong> 個。<\/p>\n<p><strong>【4】.<\/strong> 打倒雙刀龍戰士，蒐集骷髏肩帶<strong><img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://maplelegends.com/static/images/lib/item/04000267.png\"/><\/strong><img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/http://img.miigii.com.tw/Files/Gonglue/20100830/b096b5af0eb94dc08c779936844fe315.gif\"/>(Skull Shoulder Pad) <strong>1<\/strong> 個。<\/p>\n<p><strong>【5】.<\/strong> 打倒雙刀龍戰士，蒐<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/http://img.miigii.com.tw/Files/Gonglue/20100830/89af98b331ac45639f9ba1e9449e7418.gif\"/>集損壞的短刀<img decoding=\"async\" title=\"\" src=\"https://web.archive.org/web/20260413050510im_/http://i.imgur.com/RF4B8Ay.png\" width=\"34\" height=\"31\"/>(Busted Dagger)<b> <\/b><strong>1 <\/strong>個，<\/p>\n<p>並準備鋼鐵<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04011001.png\"/>(Steel Plate)以及鋰礦石<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04011002.png\"/>(Mithril Plate)各 <strong>1 <\/strong>個，將三樣物品交給NPC摩斯<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/npcs/2080000.png\"/>(Mos)<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/http://img.miigii.com.tw/Files/Gonglue/20100830/a3492974c04e4d7fb6329554ca2bf2a0.gif\"/><\/p>\n<p>合成製作，得到龍戰士的短刀<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04001078.png\"/>(Cornian&#8217;s Dagger)<b> <\/b><strong>1 <\/strong>個。<\/p>\n<p><strong>【6】.<\/strong> 打倒 噴火龍 <img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/monsters/8180000.png\"/>(Manon) 。(個人必須造成傷害)<\/p>\n<p>※ 可以與其他玩家共享同一隻噴火龍 ,目前版本只需要站在地圖內就能共享殺敵數，不用攻擊，存活就好。<\/p>\n<p><strong>     <\/strong><\/p>\n<p><strong>【7】. <\/strong>將所有材料交給<strong> 摩伊拉<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/npcs/2081006.png\"/>(Moira)<\/strong>，可以得到變身秘藥Dragon Elixir<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/02210003.png\"/>*2。<strong> (記得包包需要有足夠空間)<\/strong><\/p>\n<hr/>\n<ul>\n<li><strong>第三階段 . &lt; 敢死隊的象徵 &gt;    一個組隊只需要一個人擁有<\/strong><\/li>\n<\/ul>\n<p><strong>【1】.<\/strong> 點選生命洞窟入口右下方的NPC洞窟守門人，進入龍王洞穴之後，通過五個關卡 ，打倒小怪獲得三種敢死隊的象徵分別為 <img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04001080.png\"/> <img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04001081.png\"/> <img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04001082.png\"/> 。<\/p>\n<p><strong>【2】. <\/strong>持有拉圖斯的象徵<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04001084.png\"/>，炎魔象徵<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04001083.png\"/>，海怒斯象徵<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04001085.png\"/>，將三個象徵給<strong>摩伊拉<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/npcs/2081006.png\"/>(Moira)。<\/strong><\/p>\n<p>合成得到敢死隊榮譽隊員象徵<img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/https://royals-library.netlify.app/images/items/04001086.png\"/>Certificate of the Dragon Squad)<span>，以後<\/span>只要攜帶榮譽象徵，下次挑戰時就可以直接略過前面的關卡了。<\/p>\n<p align=\"center\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260413050510im_/http://img.miigii.com.tw/Files/topic/20111117/1ffd917523d44288843ea4af0776bbab_thumb.jpg\"/><\/p>\n<div id=\"wpdevar_comment_1\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-toad", "cat": "前置任務", "title": "天皇蟾蜍前置", "ts": "2026-04-13", "wb": "https://web.archive.org/web/20260413044944/https://mapleroyals.net/50197/%E5%A4%A9%E7%9A%87%E8%9F%BE%E8%9C%8D", "html": "<ul>\n<li><strong>前置任務<\/strong><\/li>\n<\/ul>\n<hr/>\n<p>天皇蟾蜍並沒有所謂的前置任務，入場需求是一個鎧甲武士的掉落物<img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://maplelegends.com/static/images/lib/item/04000342.png\"/>。<\/p>\n<p>該地圖24小時可以進入一次。<\/p>\n<hr/>\n<ul>\n<li><strong>前往楓葉古城<\/strong><\/li>\n<\/ul>\n<p>首先與各大地圖的導遊Spinel <img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://royals-library.netlify.app/images/npcs/9000020.png\"/>對話，到達日本神社。<\/p>\n<p>走到地圖中間偏右與抬轎的 Palanquin<img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://royals-library.netlify.app/images/npcs/9110107.png\"/> 對話，<\/p>\n<p>即可抵達楓葉古城。<\/p>\n<hr/>\n<ul>\n<li><strong>天皇地圖走法<\/strong><\/li>\n<\/ul>\n<p>天皇地圖走法，網路上已有許多教學影片就不再贅述，這裡找幾個給大家參考。<\/p>\n<p><span>途中的一張地圖 <\/span><strong>&#8221; Zipangu: Castle Corridor (9) &#8221; <\/strong><span>會出生鎧甲武士。<\/span><\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://i.imgur.com/lyckyfK.png\"/><\/p>\n<p><strong>Kacchuu Musha <\/strong><\/p>\n<p>等級： 120<\/p>\n<p>血量： 78m (78,000,000)<\/p>\n<p>傷害：最高 11500<\/p>\n<p>機率掉落  <img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://maplelegends.com/static/images/lib/item/04000342.png\"/> <strong>Kacchuu Musha Fragment <\/strong>。<\/p>\n<hr/>\n<p><div class=\"jetpack-video-wrapper\"><span class=\"embed-youtube\"><\/span><\/div><\/p>\n<p>忍耐地圖不難跳，也可以解掉任務後，花3M跳過忍耐關<\/p>\n<p>任務道具需要<\/p>\n<p>Kunoichi Dagger<img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://maplelegends.com/static/images/lib/item/04000344.png\"/> * 50<\/p>\n<p>Ninto Scroll <img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://maplelegends.com/static/images/lib/item/04000340.png\"/>* 50<\/p>\n<p>Samurai Knight Armor Piece<img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://maplelegends.com/static/images/lib/item/04000342.png\"/> * 1<\/p>\n<p>任務解法：<\/p>\n<p>1.跟古城村莊內-右邊的akai<img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://royals-library.netlify.app/images/npcs/9110103.png\"/>接任務，然後往右過地圖-後找Nobuo<img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://royals-library.netlify.app/images/npcs/9110114.png\"/>對話<\/p>\n<p><span>帶著Kunoichi Dagger<img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://maplelegends.com/static/images/lib/item/04000344.png\"/> * 50跟古城入口處上方的<\/span><span>Fuji<\/span><img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://royals-library.netlify.app/images/npcs/9110108.png\"/>對話後<\/p>\n<p>帶著Ninto Scroll <img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://maplelegends.com/static/images/lib/item/04000340.png\"/>* 50+Samurai Knight Armor Piece<img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://maplelegends.com/static/images/lib/item/04000342.png\"/> * 1跟古城入口右下方Princess Suzume <img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://royals-library.netlify.app/images/npcs/9110106.png\"/>對話即完成<\/p>\n<p>以後想跳過忍耐任務就在忍耐地圖進入後跟上方的Sai<img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://royals-library.netlify.app/images/npcs/9110109.png\"/>對話支付3M即通關<\/p>\n<p><div class=\"jetpack-video-wrapper\"><span class=\"embed-youtube\"><\/span><\/div><\/p>\n<hr/>\n<p><strong><img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://royals-library.netlify.app/images/monsters/9400408.png\"/>Castellan <\/strong><\/p>\n<p>等級：180<\/p>\n<p>血量：620m (620,000,000)<\/p>\n<p>傷害：最高12500<\/p>\n<p>死後出生蟾蜍<\/p>\n<p><img decoding=\"async\" src=\"https://web.archive.org/web/20260413044944im_/https://royals-library.netlify.app/images/monsters/9400409.png\"/> <strong>Castellan Toad <\/strong><\/p>\n<p>等級：180<\/p>\n<p>血量：450m (450,000,000)<\/p>\n<p>傷害 ：最高 15500<\/p>\n<figure class=\"wp-block-embed is-type-wp-embed is-provider-mapleroyals wp-block-embed-mapleroyals\"><div class=\"wp-block-embed__wrapper\">\n<blockquote class=\"wp-embedded-content\"><a href=\"https://web.archive.org/web/20260413044944/https://mapleroyals.net/63358/%e6%a5%93%e8%91%89%e5%8f%a4%e5%9f%8e-%e5%9f%8e%e5%85%a7%e8%b5%b0%e6%b3%95\">楓葉古城-城內走法<\/a><\/blockquote>\n<\/div><\/figure>\n<figure class=\"wp-block-embed is-type-wp-embed is-provider-mapleroyals wp-block-embed-mapleroyals\"><div class=\"wp-block-embed__wrapper\">\n<blockquote class=\"wp-embedded-content\"><a href=\"https://web.archive.org/web/20260413044944/https://mapleroyals.net/63354/%e6%a5%93%e8%91%89%e5%8f%a4%e5%9f%8e-%e5%a4%a9%e5%ae%88%e9%96%a3%e5%9c%b0%e5%9c%96%e8%b5%b0%e6%b3%95\">楓葉古城-天守閣地圖走法<\/a><\/blockquote>\n<\/div><\/figure>\n<div id=\"wpdevar_comment_2\">\n <span><\/span>\n <\/div>"}, {"slug": "pre-lkc", "cat": "前置任務", "title": "獅子王城前置", "ts": "2026-06-10", "wb": "https://web.archive.org/web/20260610125848/https://mapleroyals.net/62122/62122", "html": "<p>獅子王城的入口在冰原雪域中的狼人領土II(Wolf Territory II)左上傳點<\/p>\n<div id=\"chat-messages-865219953334157322\" class=\"message-2qnXI6 cozyMessage-3V1Y8y groupStart-23k01U wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"buttonContainer-DHceWr\">\n<div class=\"buttons-cl5qTG container-3npvBV isHeader-2dII4U\" aria-label=\"訊息操作\">\n<div class=\"wrapper-2aW0bm\"> <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div id=\"chat-messages-865220015636217906\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">此區域每個角色每天有一小時的進場時間<\/div>\n<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"><del>初期版本：每張生怪的地圖皆會消耗此時數，如果把時間用完就會被回傳到冰原雪域， 非戰鬥區域(塔內)可使用時空門<\/del><\/div>\n<div role=\"document\"><del>目前版本：每張生怪的地圖皆會消耗此時數，時間用完之後不會被送回村，但不再提供淨化圖騰<span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867451739455225866.png?v=1\" alt=\":purificationtotem:\" aria-label=\":purificationtotem:\"/><\/span> (Purification Totem)掉落以及組隊獎勵經驗值(Party Bonus Exp)【但還有時數的同隊伍內玩家仍然可以得到此經驗】，塔內外皆可使用時空門<\/del><\/div>\n<div role=\"document\"><del>目前版本：用越獄方式可以在一小時圖騰時數內從35等練到120等(已修正)<\/del><\/div>\n<div role=\"document\">目前版本：若隊伍內法師輸出超過80%以上的話淨化圖騰<span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867451739455225866.png?v=1\" alt=\":purificationtotem:\" aria-label=\":purificationtotem:\"/><\/span> (Purification Totem)掉落率減半<\/div>\n<div role=\"document\">目前版本：追加Glitch abuse判定，由於怪物是主動型攻擊怪物，如果利用角色進行磁鐵/推怪/隱身技能造成玩家不會受到攻擊的話，屬於違規事項<\/div>\n<div role=\"document\">因此修改攻擊模式為魔法傷害並且看的到隱身角色封鎖賊系角色/將怪物仇恨時間縮短造成拉怪時間要更快<\/div>\n<div role=\"document\"><del>但是這反而造成了新的玩法可以獲得更大的好處 筆者不想提<\/del><\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">但時數用完的角色無法進入有怪物存在的時空門內。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">組隊獎勵經驗值(Party Bonus Exp)：怪物除了給予自身經驗值之外，隊伍內越多人保持攻擊狀態就給予對應的人數以及經驗獎勵<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">以<a href=\"https://web.archive.org/web/20260610125848/https://mapleroyals.com/forum/threads/lhc-grinding-party-exp-hr.193861/\">此文章<\/a>舉例來說<\/div>\n<div role=\"document\">熊狼：<\/div>\n<div role=\"document\">等級：148<br>HP：9,800,000<br>基本經驗：204,800<br>6 人組隊獎勵經驗：512,000<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">單人打可以領到204,800經驗值<\/div>\n<div role=\"document\">六人打每個人可以拿到(204,800/6)+512000經驗值<\/div>\n<div role=\"document\"> <\/div>\n<div id=\"chat-messages-865220015636217906\" class=\"message-2qnXI6 cozyMessage-3V1Y8y wrapper-2a6GCs cozy-3raOZG zalgo-jN1Ica\" tabindex=\"-1\" role=\"listitem\">\n<div class=\"contents-2mQqc9\" role=\"document\">若有人沒有保持攻擊狀態(5秒內保持輸出)則後者變成(204,800/5)+【(512000/6)*5】<\/div>\n<div role=\"document\">所以是盡量出手比較好<\/div>\n<\/div>\n<div role=\"document\"> <\/div>\n<h6 role=\"document\"><strong>第一階段任務線懶人包：<\/strong><\/h6>\n<div role=\"document\">克洛奇的頭盔( Crocky&#8217;s Helmet) <span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867438616594743307.png?v=1\" alt=\":CrockysHelmet:\" aria-label=\":CrockysHelmet:\"/><\/span> X20個【任務需求等級LV135】<\/div>\n<div role=\"document\">雷印迪奧的長槍(Reindeer&#8217;s Spear) <span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867438616997658634.png?v=1\" alt=\":ReindeersSpear:\" aria-label=\":ReindeersSpear:\"/><\/span> X25個【任務需求等級LV138】<\/div>\n<div role=\"document\">熊狼的晨星鎚(Bearwolf&#8217;s Morning Star)<span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867438617047597086.png?v=1\" alt=\":BearwolfsMorningStar:\" aria-label=\":BearwolfsMorningStar:\"/><\/span> X 20 個【任務需求等級LV140】<\/div>\n<div role=\"document\">要塞巨人的石塊(Castle Golem Brick)<span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867442857047228436.png?v=1\" alt=\":CastleGolemBrick:\" aria-label=\":CastleGolemBrick:\"/><\/span> X 25 個【任務需求等級LV143】<\/div>\n<div role=\"document\">除了最一開始的紅鱷魚人(Red Crocky) 必須solo之外 只需要打塔1~4內的中boss4次<\/div>\n<div role=\"document\">就可以直接通關到最後一座塔(可組隊進場)<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"><a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-3Ya1ho embedWrapper-lXpS3L\" tabindex=\"0\" role=\"button\" href=\"https://web.archive.org/web/20260610125848/https://cdn.discordapp.com/attachments/867432352493207572/877336280931913768/unknown.png\" target=\"_blank\" rel=\"noreferrer noopener\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://media.discordapp.net/attachments/867432352493207572/877336280931913768/unknown.png?width=400&amp;height=183\"/><\/a><\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">目前版本的怪物屬性弱點：<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">怕火：紅鱷魚人<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8840002/render/stand\"/>、綠鱷魚人<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210000/render/stand\"/>、熊狼<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210003/render/stand\"/><\/div>\n<div role=\"document\">怕冰：紅鹿<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210002/render/stand\"/><\/div>\n<div role=\"document\">怕雷：禿鷹<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210004/render/stand\"/><\/div>\n<div role=\"document\">怕聖：要塞巨人<img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210005/render/stand\"/><\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"><img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/attachments/867432352493207572/897480328120242196/unknown.png\"/><\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\"> <\/div>\n<h6 role=\"document\"><strong>第一階段任務線說明：<\/strong><\/h6>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務1  (需求等級LV135)】到第一座塔找 NPC 簡 (Jenn) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2161003/icon/\"/>報到，<\/div>\n<div role=\"document\">取得鑰匙進入第一座塔內右上角的傳送點消滅紅鱷魚人 (Red Crocky) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8840002/render/stand\"/>(只能SOLO進場)，接著在同一個地圖內與 NPC 簡的兄弟 (Jenn&#8217;s brother) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2161007/icon/\"/>對話後離開地圖，最後再找 NPC 簡 (Jenn) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/npc/2161003/icon/\"/>回報任務。<\/div>\n<div role=\"document\"> <\/div>\n<div role=\"document\">【任務2 (需求等級LV135)】從守門人克洛奇( Crocky the Gatekeeper) <img decoding=\"async\" src=\"https://web.archive.org/web/20260610125848im_/https://maplestory.io/api/SEA/198/mob/8210000/render/stand\"/>身上獵取克洛奇的頭盔( Crocky&#8217;s Helmet) <span class=\"emojiContainer-3X8SvE\" tabindex=\"0\" role=\"button\"><img decoding=\"async\" class=\"emoji\" draggable=\"false\" src=\"https://web.archive.org/web/20260610125848im_/https://cdn.discordapp.com/emojis/867438616594743307.png?v=1\" alt=\":CrockysHelmet:\" aria-label=\":CrockysHelmet:\"/><\/span> X20個，回報任務之後取得鑰匙。<\/div>\n<div role=\"document\">【任務3 (需求等級LV135)】進入第一座塔內右上角的傳送點挑戰亞尼(Ani)<a class=\"anchor-3Z-8Bb anchorUnderlineOnHover-2ESHQB imageWrapper-2p5ogY imageZoom-1n-ADA clickable-
