name: Release desktop app

# 推一個 desktop-vX.Y.Z 標籤（例如 desktop-v1.1.0）就會用 Tauri 在 Windows 打包，
# 並建立同名 GitHub Release、附上安裝版與免安裝版。也可以在 Actions 頁面手動執行並輸入版本號。
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本號（例如 1.1.0）"
        required: true
        default: "1.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: 決定版本號
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 安裝 Tauri CLI
        working-directory: desktop
        run: npm install

      - name: 寫入版本號、準備網站內容與圖示
        working-directory: desktop
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          node -e "
            const fs=require('fs');
            const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); c.version=process.env.V;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c,null,2)+'\n');
            let t=fs.readFileSync('src-tauri/Cargo.toml','utf8'); t=t.replace(/^version = \".*\"/m,'version = \"'+process.env.V+'\"');
            fs.writeFileSync('src-tauri/Cargo.toml', t);
          "
          node scripts/prepare-app.js
          npx tauri icon ../assets/icons/icon-512.png

      - name: 打包（含更新簽章）
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: 整理安裝檔
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "dist/RMS-Guide-Setup-${V}.exe"
          cp desktop/src-tauri/target/release/rms-guide.exe "dist/RMS-Guide-Portable-${V}.exe"
          # 產生 OTA 更新清單 latest.json（簽章取自 tauri build 產生的 .sig）
          SIG_FILE=$(ls desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig)
          node -e "
            const fs=require('fs');
            const v=process.env.V;
            const sig=fs.readFileSync(process.argv[1],'utf8').trim();
            const j={version:v,notes:'RMS 攻略庫 桌面版 v'+v,pub_date:new Date().toISOString(),
              platforms:{'windows-x86_64':{signature:sig,
                url:'https://github.com/louis70109/rms-data/releases/download/desktop-v'+v+'/RMS-Guide-Setup-'+v+'.exe'}}};
            fs.writeFileSync('dist/latest.json',JSON.stringify(j,null,2));
          " "$SIG_FILE"
          ls -la dist
          cat dist/latest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.ver.outputs.version }}
          name: RMS 攻略庫 桌面版 v${{ steps.ver.outputs.version }}
          files: |
            dist/RMS-Guide-Setup-*.exe
            dist/RMS-Guide-Portable-*.exe
            dist/latest.json
          fail_on_unmatched_files: true
          body: |
            RMS 攻略庫 桌面版（Windows，離線閱讀）。內容與 https://rms-data.fly.dev/ 相同，安裝後不需要網路。
            用 Tauri 打包（Windows 內建的 WebView2 顯示網頁），體積比 Electron 小很多。

            ### 下載
            | 檔案 | 說明 |
            |---|---|
            | `RMS-Guide-Setup-${{ steps.ver.outputs.version }}.exe` | 安裝版（安裝到目前使用者，不需要系統管理員權限；缺少 WebView2 時會自動安裝） |
            | `RMS-Guide-Portable-${{ steps.ver.outputs.version }}.exe` | 免安裝版（直接雙擊；需要系統已有 WebView2，Windows 11 與多數 Windows 10 已內建） |

            ### 注意：安裝檔**沒有程式碼簽章**
            第一次執行時 Windows SmartScreen 可能出現「Windows 已保護你的電腦／未知的發行者」，
            點「其他資訊」→「仍要執行」即可。

            內容版權屬原作者，本程式僅作個人備份存查。
