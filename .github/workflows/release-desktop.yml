name: Release desktop app

# 推一個 desktop-vX.Y.Z 標籤（例如 desktop-v1.0.1）就會在 Windows 打包，
# 並建立同名 GitHub Release、附上安裝檔（安裝版與免安裝版）。
# 也可以在 Actions 頁面手動執行並輸入版本號。
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本號（例如 1.0.1）"
        required: true
        default: "1.0.1"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 決定版本號
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 安裝相依套件並準備 App 內容
        shell: bash
        working-directory: desktop
        run: |
          npm pkg set version="${{ steps.ver.outputs.version }}"
          npm install
          node scripts/prepare-app.js

      - name: 打包
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never

      - name: 列出安裝檔
        shell: bash
        run: ls -la desktop/dist/*.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.ver.outputs.version }}
          name: RMS 攻略庫 桌面版 v${{ steps.ver.outputs.version }}
          files: |
            desktop/dist/RMS-Guide-Setup-*.exe
            desktop/dist/RMS-Guide-Portable-*.exe
          fail_on_unmatched_files: true
          body: |
            RMS 攻略庫 桌面版（Windows，離線閱讀）。內容與 https://rms-data.fly.dev/ 相同，安裝後不需要網路。

            ### 下載
            | 檔案 | 說明 |
            |---|---|
            | `RMS-Guide-Setup-${{ steps.ver.outputs.version }}.exe` | 安裝版（可選安裝位置，建立開始功能表與桌面捷徑） |
            | `RMS-Guide-Portable-${{ steps.ver.outputs.version }}.exe` | 免安裝版（直接雙擊執行，不寫入系統） |

            ### 注意：安裝檔**沒有程式碼簽章**
            第一次執行時 Windows SmartScreen 可能出現「Windows 已保護你的電腦／未知的發行者」，
            點「其他資訊」→「仍要執行」即可。

            內容版權屬原作者，本程式僅作個人備份存查。
