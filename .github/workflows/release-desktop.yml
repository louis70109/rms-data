name: Release desktop app

# 推一個 desktop-vX.Y.Z 標籤（例如 desktop-v1.0.0）就會在 Windows / macOS / Linux 打包，
# 並建立同名 GitHub Release、附上安裝檔。也可以在 Actions 頁面手動執行並輸入版本號。
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本號（例如 1.0.0）"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 決定版本號
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 安裝相依套件並準備 App 內容
        shell: bash
        working-directory: desktop
        run: |
          npm pkg set version="${{ steps.ver.outputs.version }}"
          npm install
          node scripts/prepare-app.js

      - name: 打包
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 決定版本號
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#desktop-v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出安裝檔
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.ver.outputs.version }}
          name: RMS 攻略庫 桌面版 v${{ steps.ver.outputs.version }}
          files: artifacts/*
          body: |
            RMS 攻略庫 桌面版（離線閱讀）。內容與 https://rms-data.fly.dev/ 相同，安裝後不需要網路。

            ### 下載
            | 系統 | 檔案 |
            |---|---|
            | Windows | `RMS-Guide-Setup-*.exe`（安裝版）／`RMS-Guide-Portable-*.exe`（免安裝） |
            | macOS | `RMS-Guide-*-mac-*.dmg`（Apple 晶片選 arm64，Intel 選 x64） |
            | Linux | `RMS-Guide-*.AppImage`／`*.deb` |

            ### 注意：這些安裝檔**沒有程式碼簽章**
            - **Windows**：第一次執行可能出現 SmartScreen「未知的發行者」，點「其他資訊」→「仍要執行」。
            - **macOS**：若顯示「已損毀」或無法開啟，在終端機執行
              `xattr -cr "/Applications/RMS 攻略庫.app"`，或到「系統設定 → 隱私權與安全性」允許。
            - **Linux AppImage**：`chmod +x RMS-Guide-*.AppImage` 後執行。

            內容版權屬原作者，本程式僅作個人備份存查。
